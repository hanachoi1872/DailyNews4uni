  "story": "오늘 이야기는 세계 쪽 빅뉴스부터 시작할게. 중국이 어제(16일) 트럼프 미국 대통령, 시진핑 중국 국가주석, 푸틴 러시아 대통령이 이번 주 목요일(19일) 중국 선전에서 역사상 처음으로 세 명이 한자리에 모이는 3자 회담을 열기로 공식 확정했다고 밝혔어. 트럼프는 이 자리에서 미국·중국·러시아가 함께 핵무기를 줄이자는 얘기를 하고 싶어 하는데, 정작 가장 뜨거운 이슈인 우크라이나 전쟁은 이번 회담의 정식 의제에서 빠졌어. 게다가 트럼프는 '중국에 가는 김에 김정은도 만날 수 있다'며, 이건 시진핑이 김정은을 초대하느냐에 달렸다고 즉흥적으로 던졌어. 원래 3자 회담이었던 이 자리가 자칫 4자 회동으로 번질 수도 있는 셈이지.\n\n글로벌 경제 쪽은 엔비디아발 충격이 전 세계 증시를 휩쓴 하루였어. 어제 밤 뉴욕증시에서 나스닥이 2.49% 급락하면서 3대 지수 중 가장 크게 떨어졌고, 엔비디아 주가도 4%나 더 빠졌어. 이 충격이 아시아·호주까지 번지면서 오늘 아침 호주 증시는 1.1% 밀렸고, 마침 이날 호주 백화점 체인 데이비드존스의 채권자들이 첫 회의를 열어 3억2000만달러 규모 빚을 점검했어. 데이비드존스는 38개 매장 중 19개를 올해 안에 닫기로 했고, 9월부터는 임대료조차 못 낼 정도로 현금이 말랐다는 게 드러났어. 온라인 쇼핑에 손님을 뺏기면서도 비싼 임대료 구조를 못 바꾼 전통 백화점의 한계가 고스란히 드러난 거야.\n\n한국 쪽도 같은 충격의 연장선에 있어. 삼성전자와 SK하이닉스는 오늘 아침 프리마켓에서 나란히 2%대 더 내렸는데, 간밤 미국 AI 반도체주 급락과 미국 상무부의 대중국 컴퓨팅 자원 규제 강화가 겹친 영향이야. 어제 코스피는 3.59%, 코스닥은 4.86% 급락했고 SK하이닉스는 하루 만에 7.89%나 빠졌어. 엎친 데 덮친 격으로, 미국 법원은 삼성전자·SK하이닉스·마이크론이 D램 가격을 697%나 올리며 담합했다는 소비자 집단소송을 기각해달라는 세 회사의 요청을 받아들이지 않았어. 담합을 인정한 판결은 아니지만, 세 회사의 감산·생산전환 시점이 비슷했다는 점이 소송을 계속 이어갈 근거가 됐다는 거야.\n\n테크 쪽에서는 오픈AI CEO 샘 올트먼이 젠슨 황의 사임 이후 처음으로 공개 입장을 냈어. 올트먼은 황을 '영웅'이라 부르면서도 '영웅에게도 결함이 있다'고 했고, 황이 복귀해야 하냐는 질문엔 '그걸 답할 만큼 충분히 알지 못한다'며 말을 아꼈어. 대신 그는 AI 수요가 워낙 강력해서 업계 전체는 '괜찮을 것'이라고 단언했어. 오늘 따라잡기 코너에서 자세히 다루는 것처럼, 같은 날 청원 서명자는 18만 명을 넘었고 트럼프는 황의 복귀에 찬성한다고 했는데, 정작 이사회는 복귀를 검토하지 않고 있다는 보도가 나오면서 혼란이 더 커지고 있어.\n\n일본에서는 정반대 분위기야. 글로벌 AI주가 다같이 흔들리는 와중에도 일본은행은 금리 인상 속도를 그대로 가져가려는 신호를 보냈어. BOJ 심의위원 다카타 하지메는 '이번 달 초 AI 관련주 중심으로 증시가 흔들렸어도 AI 투자는 전반적으로 견고할 것'이라며, 금리를 고정된 주기가 아니라 유연하게 올려야 한다고 했어. 실제로 어제 닛케이225는 엔비디아발 충격으로 2.42% 급락해 6만선이 일주일 만에 다시 무너졌는데도, BOJ는 12월 추가 금리 인상 가능성을 열어두고 있어. 눈앞의 증시 충격보다 기업 투자라는 더 큰 흐름을 보고 정책을 정하겠다는 뜻이지.\n\n오늘 하루를 정리하면, 세계는 사상 첫 미·중·러 3자 회담을 눈앞에 뒀지만 정작 가장 중요한 우크라이나는 의제에서 빠졌고, 엔비디아 리더십 공백이 만든 충격파는 뉴욕부터 서울·도쿄·시드니까지 증시와 기업 하나하나를 할퀴고 지나갔어. 한국 반도체 기업들은 주가 급락과 담합 소송이라는 이중고를 겪었고, AI 업계의 또 다른 리더 올트먼은 황의 공백에도 산업은 괜찮을 거라며 선을 그었어. 일본은행만큼은 눈앞의 증시 충격에 흔들리지 않고 금리 정상화라는 원래 계획을 지키겠다는 뜻을 밝혔지. 오늘의 공통된 교훈은, 한 기업·한 리더의 공백이 만드는 충격이 얼마나 넓고 빠르게 퍼지는지, 그리고 그 충격 앞에서 누가 원칙을 지키고 누가 흔들리는지를 함께 봐야 진짜 그림이 보인다는 거야."

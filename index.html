      "summary": "BCG는 'Split Decisions' 서베이를 토대로, CEO 351명과 이사회 멤버 274명 등 연매출 1억달러 이상 기업 리더 625명을 대상으로 한 조사에서 CEO의 61%가 자사 이사회가 AI 전환을 서두르고 있다고 답했다고 밝혔어요. 보고서는 이사회 멤버의 75%가 자신의 AI 지식이 동종 업계 평균 이상이라고 자평했지만, CEO의 약 40%는 이에 동의하지 않았다고 전했어요. 보고서는 CEO의 약 40%가 이사회가 AI로 성장전략이 어떻게 재편되는지에 대한 정보가 부족하다고 평가했으며, 3분의 1은 이사회가 AI로 대체 가능한 인간의 역량을 과대평가하고 있다고 답했다고 전했어요. 보고서는 CEO와 이사회 모두의 80%가 향후 이사회 멤버 자격으로 AI 역량을 요구해야 한다는 데는 뜻을 같이했다고 덧붙였어요.",
      "soWhat": "오늘 다룬 엔비디아 이사회가 창업자 복귀를 공식적으로 차단하고 동시에 영구 CEO 선임 절차를 밟고 있는 장면은, 이 보고서가 지적하는 'CEO-이사회 간 AI·전략 판단 괴리'가 실제 이사회 운영에서 얼마나 큰 거버넌스 리스크가 될 수 있는지를 보여줘요. 컨설팅 관점에서는 기업의 거버넌스 리스크를 진단할 때 'CEO와 이사회가 전략 방향에 합의했는가'라는 표면적 질문보다, '둘 사이에 실제 정보·속도에 대한 체감 차이가 얼마나 벌어져 있는가'를 먼저 측정해야, 겉보기에 안정적인 이사회 구조 뒤에 숨은 의사결정 공백을 놓치지 않을 수 있어요."

  "story": "오늘 이야기는 내일(19일) 열릴 세계사적 이벤트부터 시작할게. 중국이 트럼프 미국 대통령, 시진핑 중국 국가주석, 푸틴 러시아 대통령이 선전에서 역사상 처음으로 세 사람이 한자리에 모이는 3자 회담을 연다고 확정했어. 그런데 ABC뉴스는 러시아가 이 자리를 '얄타 2.0'(2차대전 전후에 미·영·소가 모여 세계를 나눠가졌던 그 회담)처럼 포장하려 한다면서도, 전문가들은 이걸 '푸틴의 병든 환상'이라고 콕 짚어 반박했다고 전했어. 1945년 얄타회담 때는 세 나라가 실제로 세계를 좌우할 힘이 있었지만, 지금 러시아는 우크라이나 전쟁으로 국력이 크게 쪼그라든 상태거든. 게다가 정작 가장 중요한 우크라이나 문제는 공식 의제에서 빠졌는데, 트럼프는 '내가 꺼내고 싶으면 꺼낼 수도 있다'는 식으로 말해서 사전에 짜놓은 각본을 스스로 흔들어버릴 수도 있는 상황이야.\n\n글로벌 경제·테크 쪽은 오늘도 엔비디아 하나로 요동쳤어. 어제 월스트리트저널은 미국 증권거래위원회(SEC)가 엔비디아의 공시가 투자자를 속인 건 아닌지 들여다보는 조사를 시작했다고 보도했는데, 이건 전 CEO 젠슨 황의 불륜 스캔들(상대 중 한 명이 중국 스파이로 의심된다는 보도까지 나왔던 그 사건) 때문에 생긴 리스크야. 그런데 바로 오늘 아침, 엔비디아는 3분기 매출 1158억달러(약 170조원 — 삼성전자 1년 매출의 절반가량을 석 달 만에 벌어들인 셈이야)를 발표하면서 시장 예상(1091억달러)을 훌쩍 넘겼고, 다음 분기 매출 전망도 1300억달러로 더 높여 제시했어. ABC뉴스는 엔비디아 이사회 의장 하비 존스가 실적 발표 콘퍼런스콜에서 '젠슨 황을 복귀시킬 계획이 없다'고 공식적으로 못박았다고 전했는데, 흥미로운 건 창업자 복귀를 완전히 차단하는 소식과 어닝서프라이즈가 같은 날 나왔는데도 주가는 오히려 올랐다는 거야. 결국 시장은 '누가 회사를 이끄느냐'보다 '돈을 잘 버느냐'를 더 신경 쓴다는 뜻이지.\n\n이 여진은 한국 반도체 양대 기업에도 그대로 번졌어. 뉴스핌에 따르면 오늘 오전 9시15분 기준 삼성전자는 4.05% 오른 19만8000원, SK하이닉스는 5.65% 뛴 116만원에 거래됐어. 바로 전날엔 두 종목이 나란히 떨어지면서 코스피가 9개월 만에(올해 2월 이후 처음) 5000선 밑으로 추락했었는데, 외국인이 하루에만 1조4000억원어치를 팔아치운 결과였어(서울 웬만한 아파트 1000채가 넘는 값을 하루 만에 쏟아낸 셈이야). 엔비디아 실적이 좋게 나오자 하루 만에 코스피도 2%대 올라 5000선을 다시 회복했는데, 이건 한국 반도체 기업들의 주가가 자기 실력이 아니라 태평양 건너 한 회사의 성적표 하나에 들었다 놨다 할 만큼 묶여 있다는 걸 보여줘.\n\n한편 한국 유통 쪽에서는 전혀 다른 결의 뉴스가 나왔어. 뉴스핌은 이마트와 노브랜드가 9980원짜리 '더마'(피부과 처방 수준의 기능성을 내세우는) 화장품을 선보였고, 지난 10월 말 출시한 더마 스킨케어 6종이 테스트 판매에서 벌써 1000개 넘게 팔렸다고 전했어. 커피 두 잔 값도 안 되는 가격인데 클렌저부터 크림까지 6종 세트를 다 갖췄다는 거야. 이마트는 이미 5000원 이하 뷰티 상품을 85개나 운영 중이고, 올해 들어 스킨케어 매출도 작년보다 12% 늘었대. 비싼 자체 연구개발 없이도 OEM·ODM(생산을 전문 위탁업체에 맡기는 방식) 협업만으로 품질과 가격을 동시에 잡을 수 있다는 걸 보여주는 사례야.\n\n일본 쪽은 이 반도체 호황의 '숨은 수혜자' 이야기야. 니케이아시아는 삼성전자·SK하이닉스에 반도체 검사장비(프로브카드)를 공급하는 일본 마이크로닉스가 2030년경 신규 공장을 짓기 위해 부지를 찾고 있다고 전했어. 이 회사는 최근 241억엔(약 2027억원)을 투자하겠다고 밝혔는데, 이유는 삼성과 SK가 HBM(고대역폭메모리) 생산을 늘리면서 검사해야 할 칩이 훨씬 복잡해졌기 때문이야. HBM은 기존 D램보다 훨씬 많은 층을 쌓아 만들어서, 검사해야 할 접점 수가 메모리 생산량이 늘어나는 속도보다 더 빠르게 늘어난다는 거지. 삼성·SK의 호황이 눈에 잘 안 보이는 일본의 검사장비 회사까지 먹여살리고 있는 셈이야.\n\n오늘 하루를 정리하면, 세계는 내일 사상 첫 미·중·러 3자 회담을 앞뒀지만 정작 핵심 의제(우크라이나)는 빠졌고, 엔비디아는 이사회가 창업자 복귀를 완전히 차단하면서도 SEC 조사를 받는 동시에 어닝서프라이즈까지 낸 복잡한 하루를 보냈어. 그 충격파는 한국 반도체 기업들의 주가를 하루 만에 급락에서 급등으로 되돌렸고, 저 멀리 일본의 작은 검사장비 회사에까지 호황을 퍼뜨렸어. 그 와중에 한국 유통업계는 9980원짜리 화장품으로 완전히 다른 전쟁(초저가 뷰티)을 치르고 있지. 오늘의 공통된 교훈은, 하나의 큰 충격(엔비디아)이 전혀 다른 성격의 뉴스(화장품 가격 경쟁)를 가리지 않고 함께 공존한다는 것, 그리고 그 충격이 공급망을 타고 어디까지 퍼지는지를 끝까지 따라가야 진짜 그림이 보인다는 거야."
};

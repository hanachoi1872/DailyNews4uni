  "story": "오늘 이야기는 튀르키예에서 시작할게. 11월9일부터 안탈리아에서 열린 유엔기후총회(COP31)가 원래 20일에 끝날 예정이었는데, 이틀을 더 끌면서 역대 가장 길게 열린 기후총회가 됐어. 근데 결국 22일(일)에 합의문 없이 '빈손'으로 끝나버렸어. ABC뉴스에 따르면 이렇게 협상이 완전히 결렬된 건 2009년 코펜하겐 총회 이후 17년 만에 처음이래. 핵심 쟁점은 '화석연료 사용을 줄이겠다'는 문구를 최종 문서에 넣을지였는데, EU 같은 나라들은 그 문구가 빠진 초안을 거부했고 사우디아라비아 같은 산유국들은 반대로 그 문구 자체를 반대했어. 유엔 사무총장 구테흐스는 이 결과를 '매우 실망스럽다'고 했어. 198개 나라가 모두 동의해야 하는 협상이 딱 하나의 쟁점 앞에서 17년 만에 멈춰선 거야.\n\n미국에서는 AI 기업 앤트로픽의 주가가 화제였어. 지난 19일 주당 83달러에 나스닥에 상장해서 1조3000억 달러 넘는 기업가치로 거래를 시작했는데, 바로 다음날인 20일(금)에 8.5% 넘게 떨어지면서 나스닥지수가 그해 쌓아온 수익률을 전부 날려버렸대. 그 하락세가 계속 이어지면서 24일(화)엔 결국 공모가 83달러 아래인 81.91달러(-6.5%)로 마감했어. 공모가 밑으로 떨어지는 데 걸린 시간이 딱 4거래일인데, 작년에 상장한 스페이스X가 21거래일이나 공모가를 지켰던 거랑 비교하면 엄청 짧은 거야. CNBC에 따르면 '앤트로픽·오픈AI 직원들이 자기 회사 최신 모델이 공개하기엔 너무 강력하다고 걱정한다'는 액시오스 보도가 투자자들을 흔든 것도 한 이유래.\n\n한국에서는 조선비즈가 재밌는 산업 이야기를 다뤘어. '롱제비티(장수) 산업'이라는, 노화 세포를 되살리고 근육을 지켜서 건강수명을 늘리는 기술들이 새로운 투자 테마로 뜨고 있다는 거야. 조선비즈는 이 흐름에 맞춰 12월4일에 '롱제비티가 여는 미래'를 주제로 헬스케어이노베이션포럼을 연대. 기사에서 소개한 'ER-100'이라는 물질은 DNA 염기서열 자체는 안 바꾸고 유전자가 켜지고 꺼지는 스위치만 조절하는 '후성유전학적 재프로그래밍' 기술을 쓰는데, 아직 환자 3명한테 56일 투여해본 초기 임상 단계래. 그래도 그중 2명한테서 시야 검사 지표가 좋아지는 신호가 보였다니, 앞으로 지켜볼 만한 분야야.\n\n같은 날 삼성전자는 임원 131명 승진 인사를 발표했어. 작년(161명)보다는 줄었는데, HBM4 세계 최초 양산을 이끈 하경수 D램설계2그룹장이나 수율 확보에 기여한 박태훈 D램YE팀장 같은 반도체 핵심 인력들은 전부 부사장으로 올라갔어. 로봇 분야에서도 형승용 로보틱스시스템그룹장이 상무로 승진했고, 신임 여성 승진자는 11명으로 역대 최대래. 전체 승진 숫자는 줄었지만 핵심 기술·신사업 인재는 오히려 전면에 배치됐다는 게 눈에 띄는 포인트야.\n\n테크 쪽에서는 AI 에이전트 인프라 스타트업 '랭체인'이 캐피털G 주도로 3억 달러(약 3000억원)를 투자받아서 기업가치 30억 달러(약 3조원)를 인정받았어. 1년 전 시리즈B 때 12억5000만 달러였던 거랑 비교하면 2.4배 넘게 뛴 거야. 랭체인은 기업들이 AI 에이전트를 직접 만들고 운영하게 도와주는 회사인데, 모니터링 도구인 '랭스미스' 고객사가 벌써 7000곳을 넘었대. 모델을 만드는 회사들 못지않게, 그 모델이 제대로 작동하는지 확인해주는 '인프라' 회사의 몸값도 같이 뛰고 있는 거야.\n\n마지막은 일본 얘기야. KKR이 지배하는 일본 물류그룹 '로지스티드'가 미국 3자물류 기업 네오비아를 인수하기로 했어. 두 회사 매출을 합치면 1조엔(약 6조3000억원) 규모가 되는데, 닛케이아시아에 따르면 네오비아는 매출의 54%를 북미에서, 로지스티드는 71%를 아시아태평양에서 올리고 있어서 두 회사 사업이 거의 안 겹친대. 이 거래는 '역삼각합병'이라는 방식으로 진행되는데, 네오비아라는 회사는 그대로 남기고 소유권만 로지스티드로 넘기는 기법이야. 블룸버그에 따르면 로지스티드가 예정된 상장을 앞두고 '아시아 로컬 기업'이 아니라 '글로벌 3자물류 기업'이라는 이야기를 들려주기 위한 포석이라고 해.\n\n오늘 하루를 정리하면, 큰 기대 속에 시작됐던 일들이 생각만큼 쉽게 마무리되지 않는 날이었어. 17년 만에 처음으로 합의 없이 끝난 기후총회, 상장 나흘 만에 무너진 앤트로픽 주가가 그랬고, 흑해에서 시작된 드론 공격이 폴란드 영공과 리비아 벵가지까지 번지며 우크라이나 전쟁이 전선 밖으로 계속 확산되고 있는 것도 비슷한 흐름이야(자세한 건 오늘의 따라잡기에서 다뤘어). 반면 한국의 롱제비티 산업, 삼성전자의 인재 재배치, 랭체인의 투자 유치, 일본 로지스티드의 인수합병은 각자의 영역에서 묵묵히 다음 단계를 준비하는 모습을 보여줬어."

document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>

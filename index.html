  "story": "오늘 이야기는 유럽에서 시작할게. 지난주 금요일(11월20일) 밤, 러시아가 우크라이나에 대규모 공습을 퍼붓는 과정에서 미사일 추정 발사체랑 드론이 나토 회원국인 폴란드 영내에 떨어졌어. ABC뉴스에 따르면 하필 그 지역에서 영국·프랑스가 주도하는 11개국 합동군사훈련이 한창 진행 중이었는데, 폴란드 총리는 이게 우연이 아닐 수 있다고 했대. 이 일로 나토 32개 회원국 대사들이 월요일(23일) 브뤼셀에 모여 긴급회의를 열었어. 그런데 트럼프 대통령은 이걸 '드론이랑 작은 미사일 몇 개가 실수로 떨어진 것'이라고 가볍게 넘겼어. 비슷한 시기 흑해에서도 긴장이 쌓이고 있는데, 7월 중순 이후 불가리아·루마니아 앞바다에서만 벌써 17척의 배가 드론 공격을 당했고, 지난주엔 화물선 두 척이 실제로 가라앉았어. 옆나라 몰도바 대통령은 '러시아의 전쟁이 이제 우리 국경에까지 닿고 있다'고 경고했어.\n\n미국에서는 '사람 한 명에 대한 결정'이 증시 전체를 흔든 하루였어. 엔비디아 이사회가 불과 며칠 전까지만 해도 거절했던 창업자 젠슨 황의 복귀 제안을 월요일에 받아들여서, 황을 CEO·사장·이사회 멤버로 다시 앉혔거든. CNBC에 따르면 트럼프 대통령이 '황이 국가안보법을 어기지 않았다'고 개인적으로 보증해주면서 이사회 결정을 밀어줬대. 이 소식 하나로 엔비디아 주가가 하루 만에 31% 넘게 뛰었는데, 이건 2003년 이후 가장 큰 하루 상승률이야. 덕분에 뉴욕증시 3대 지수가 다 같이 폭등했어. 다우존스는 1448포인트(3.01%) 오른 4만9595, 나스닥은 1472포인트(6.51%)나 뛴 2만4089, S&P500은 4.73% 오른 7237로 마감하면서 7거래일 연속 하락을 끊었어. 그런데 바로 전주엔 나스닥이 일주일 만에 10%나 빠지면서 2020년 3월 이후 최악의 한 주를 보냈었거든. 그래서 한 애널리스트는 '이번 반등은 그냥 기계적인 반등일 뿐, 또 한 번 크게 빠질 가능성이 꽤 높다'고 경고했어.\n\n이 랠리가 하루도 안 지나서 한국 증시로 그대로 넘어왔어. 화요일인 오늘, 코스피는 개장하자마자 6% 넘게 급등하면서 장중 한때 5003까지 올라 5000선을 회복했어. 한국거래소는 오전 9시6분에 매수 사이드카를 발동했는데, 이건 코스피200 선물 가격이 전날보다 5% 이상 오른 채 1분 넘게 유지되면 프로그램 매수 주문을 5분간 멈추는 제도야. 삼성전자 주가는 장 초반 9%대까지 올랐고, SK하이닉스는 한때 11%대까지 뛰었어. 재밌는 건 바로 전날인 월요일엔 미국 반도체주 급락 여파로 '매도' 사이드카가 발동됐었는데, 딱 하루 만에 정반대인 '매수' 사이드카로 뒤집힌 거야. 한국 증시가 삼성전자·SK하이닉스 딱 두 종목 성적에 얼마나 크게 흔들리는지 보여주는 장면이었어.\n\n같은 날 포스코에서는 노사가 드디어 한숨을 돌렸어. 지난달 30일 마련했던 1차 임금 잠정합의안이 11월7일 조합원 투표에서 반대 51.7%로 부결됐었는데, 13일 만인 지난 20일 포항 본사에서 다시 교섭을 열어 새 합의안을 만들어낸 거야. 기본임금 인상률(2.6%)은 그대로 두고, 격려금을 기존보다 20만원 더 올려서 총 620만원으로 맞췄고, 특별조정분 60만원이랑 의료비 지원 개선까지 추가했어. 부결 직후 노조가 서울까지 올라가서 집회를 열었는데, 그 과정에서 대표이사랑 노조위원장이 긴급 면담을 가지면서 교섭이 다시 풀렸대. 이제 조합원 재투표에서 과반이 찬성하면 올해 임금교섭이 마무리돼.\n\n테크 쪽에서는 아마존이 재밌는 패를 던졌어. 이스라엘 AI 스타트업 '데카르트'를 약 7.5조원에 인수하기로 했는데, 정작 데카르트가 만든 AI 모델 자체가 아니라 '데카르트 옵티마이제이션 스택'이라는 최적화 소프트웨어랑 사람(창업팀·연구진)만 사들이는 거래야. 테크크런치에 따르면 이 소프트웨어는 엔비디아·아마존·구글 등 어떤 하드웨어에서든 AI 모델을 더 효율적으로 돌릴 수 있게 해주는 기술인데, 아마존은 이걸로 자체 개발한 '트레이니움' 칩의 성능을 끌어올려서 지금까지 자기 데이터센터에서만 쓰던 이 칩을 외부 고객에게도 팔 준비를 하고 있대. 한마디로 엔비디아의 반도체 왕좌에 도전하겠다는 거지. 공교롭게 이 발표가 엔비디아를 둘러싼 리더십 위기가 한창이던 바로 이 주에 나왔다는 점도 눈에 띄어.\n\n마지막으로 일본 얘기야. 일본 최대 발전회사인 제라의 CEO가 재팬타임스와의 인터뷰에서 'AI 붐 덕분에 전력 투자에 돈을 쓸 명분이 커졌다'면서 '우리는 현금이 많이 필요하다'고 털어놨어. 그러면서 기업공개(IPO)를 포함한 여러 자금조달 방안을 검토하고 있다고 했어. 실제로 제라는 델테크놀로지스랑 같이 도쿄 외곽 지바에 400메가와트급 데이터센터를 짓는 15억 달러짜리 프로젝트에 참여하고 있는데, 데이터센터에 직접 투자하는 대신 전력만 공급하는 역할을 맡기로 했대. 니케이에 따르면 미국 중부에서도 데이터센터와 연계된 1기가와트급 가스발전소를 5000억엔 들여 짓기로 했는데, 일본 전력회사가 미국에 데이터센터 전용 발전소를 짓는 첫 사례래. AI가 반도체 회사뿐 아니라 전력회사의 자금조달 전략까지 바꿔놓고 있다는 걸 보여주는 사례야.\n\n오늘 하루를 정리하면, 엔비디아 CEO 한 명의 거버넌스 결정이 뉴욕증시와 한국 코스피를 동시에 들었다 놨다 할 만큼 AI 산업과 금융시장이 깊이 엮여 있다는 걸 보여준 날이었어. 그 와중에 유럽에서는 러시아 미사일이 나토 영토에 떨어지며 전쟁이 국경 밖으로 번지는 조짐이 보였고, 한국 포스코에서는 격려금 20만원 차이로 임금협상이 뒤집히는 걸 보면서 '조건의 크기'보다 '회사의 태도'가 협상에서 더 중요할 수 있다는 걸 배울 수 있었어. 아마존과 일본 제라는 각각 반도체와 전력이라는 완전히 다른 영역에서, 같은 AI 붐에 올라타는 서로 다른 전략을 보여줬어."

let html = BRIEFING.sections.map(s=>`<section class="block" id="${s.id}"><div class="shead"><span class="no">${esc(s.no)}</span><h2>${esc(s.title)}</h2><span class="slug">${esc(s.slug)}</span></div>${s.items.map(itemCard).join("")}</section>`).join("");
if(BRIEFING.industry){ const ind=BRIEFING.industry; const indRows=[["밸류체인",ind.valueChain],["비즈니스모델",ind.bm],["경쟁력 요소",ind.ksf],["최대 이슈",ind.issue]].map(([lab,val])=>fieldRow(lab,esc(val))).join(""); html += `<section class="block" id="industry"><div class="shead"><span class="no">🏭</span><h2>오늘의 산업 소개</h2><span class="slug">Industry</span></div><div class="industrycard"><span class="ik">🏭 오늘의 산업 소개</span><div class="iname">${esc(ind.name||"")}</div><div class="ifields">${indRows}</div></div></section>`; }
if(BRIEFING.bcg && BRIEFING.bcg.length){ const bcgItems=BRIEFING.bcg.map(b=>`<div class="bcgitem"><div class="btitle">${esc(b.titleKo)}</div><div class="borig">${esc(b.title)}</div><p class="bsum">${esc(b.summary)}</p><div class="bsw"><b>So What</b> — ${esc(b.soWhat)}</div><a class="blink" href="${esc(b.url)}" target="_blank" rel="noopener">원문 보기 ↗</a></div>`).join(""); html += `<section class="block" id="bcg"><div class="shead"><span class="no">📘</span><h2>BCG 인사이트</h2><span class="slug">BCG Publications</span></div>${bcgItems}</section>`; }
if(BRIEFING.hkmarket){ const hk=BRIEFING.hkmarket; const hkTopics=(hk.topics||[]).map(t=>`<div class="hktopic"><div class="httl">${esc(t.topic)}</div><div class="hdet">${esc(t.detail)}</div></div>`).join(""); html += `<section class="block" id="hkmarket"><div class="shead"><span class="no">📺</span><h2>한경코리아마켓</h2><span class="slug">YouTube Morning Brief</span></div><div class="hkmeta">${esc(hk.broadcastLabel||"")} · <a href="${esc(hk.videoUrl||"")}" target="_blank" rel="noopener">${esc(hk.videoTitle||"원본 방송 보기")} ↗</a></div>${hkTopics}</section>`; }
$("#main").innerHTML = html;
$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: BBC · ABC · 조선비즈(산업) · TechCrunch · ZDNet · Gizmodo · 일본 주요 경제매체 · BCG · 한경코리아마켓(유튜브) — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장.<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

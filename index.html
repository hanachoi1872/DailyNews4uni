  ],"why":"<b>컨설턴트 관점</b> 전쟁을 맞히려 하기보다 정상 통항·제한 통항·사실상 봉쇄 세 시나리오를 두고 유가, 운임, 재고일수, 조달원 전환 비용을 연결해야 실행 가능한 대응안이 나와요."},
  "sections":[
    {"id":"world","no":"01","title":"세계","slug":"World","items":[{"tag":"중동 안보","title":"이란의 호르무즈 실사격 훈련 예고, 좁은 항로에서 오판 위험 키워","source":{"name":"ABC News","url":"https://abcnews.go.com/International/wireStory/strait-hormuz-iran-plans-military-drill-tensions-high-129729064","date":"2026.01.31"},"f1":"이란은 2026년 2월 1~2일 호르무즈 해협에서 실사격 군사훈련을 실시하겠다고 선박에 통보했어요. 통보 좌표에는 선박이 오만과 이란 사이를 지나는 폭 약 3.2km의 통항분리수역 일부가 포함됐어요. 미 중부사령부는 이란군이 미군과 동맹국 함정에 위험하게 접근하거나 무기를 겨누면 충돌로 번질 수 있다고 경고했어요. 이 해협은 전 세계 거래 원유의 약 5분의 1이 통과하는 핵심 길목이에요.","f2":"호르무즈는 좁고 우회로가 사실상 없어 작은 군사 행동도 상업 선박의 대기와 항로 변경을 부르게 돼요. 실제 봉쇄가 없어도 선주는 전쟁위험보험료와 선원 수당을 올리고, 유조선 공급이 묶이면 운임이 뛰어요. 미국은 항행의 자유를 지키려 함정을 배치하지만 너무 가까운 대치는 우발적 충돌 확률을 높이는 딜레마를 만들어요. 그래서 훈련 규모보다 통항 좌표, 교신 규칙, 보험사의 위험 등급이 시장에는 더 중요한 정보예요.","f3":"한국과 일본 기업은 중동산 원유·LNG 의존도가 높아 정상 통항, 지연 통항, 사실상 봉쇄를 나눠 원가를 계산해야 해요. 각 경우 유가와 LNG 현물가, 운임, 전쟁보험료, 재고 소진일을 생산계획과 연결해야 해요. 재고를 무조건 늘리면 현금이 묶이고 너무 적게 두면 공장 중단 위험이 커지므로 서비스 수준과 운전자본을 함께 최적화해야 해요. 합의 발표보다 선박 통항량과 보험료의 실제 하락이 더 빠른 정상화 지표예요."}]},
    {"id":"econ","no":"02","title":"글로벌 경제·시장","slug":"Economy","items":[{"tag":"미국 성장","title":"미국 성장률 4.4%의 이면, 소비와 AI 투자는 강하지만 채용은 멈췄다","source":{"name":"ABC News","url":"https://abcnews.go.com/Business/wireStory/consumer-spending-pushes-us-economy-44-quarter-fastest-129451535","date":"2026.01.22"},"f1":"미국의 2025년 3분기 실질 GDP는 연율 4.4% 성장해 2년 만에 가장 빨랐고, 종전 추정치 4.3%에서도 상향됐어요. GDP의 약 70%를 차지하는 소비가 3.5%, 주택을 뺀 기업투자가 AI 설비 지출에 힘입어 3.2% 늘었어요. 서비스 소비는 3.6%, 상품 소비는 3.0% 증가했지만 내구재는 1.6%에 그쳤어요. 반면 기업의 월평균 신규 고용은 2025년 3월 이후 2만8000명에 불과했고 실업률은 4.4%였어요.","f2":"경제 전체 생산은 빠르게 늘어도 그 성과가 모든 가계에 고르게 퍼지는 것은 아니에요. 자산가격 상승의 혜택을 받은 고소득층은 소비를 이어가지만 저소득층은 높은 생활비와 약한 임금 때문에 지출을 줄이는 K자형 경제가 나타났어요. AI 데이터센터와 장비 투자는 GDP를 크게 키우지만 사람을 많이 고용하지 않아 ‘고용 없는 호황’도 만들 수 있어요. 관세가 가격을 높이고 기업이 불확실성 때문에 채용을 미루면 성장률과 체감경기의 간격은 더 벌어져요.","f3":"4.4%라는 하나의 숫자를 미국 시장 전체의 호황으로 해석하면 안 돼요. 소비 업종은 소득계층별 매출과 연체율을, AI 인프라는 수주와 전력 연결 대기기간을, 인력 서비스는 채용공고와 임금상승률을 따로 봐야 해요. 한국·일본 수출기업은 미국 총수요가 아니라 자사 고객군의 소득과 투자예산이 실제로 늘었는지 확인해야 해요. 컨설팅 케이스에서는 성장률을 수요의 양, 수요의 질, 지속 가능성으로 쪼개는 것이 핵심이에요."}]},
    {"id":"korea","no":"03","title":"한국 경제·시장","slug":"Korea","items":[
      {"tag":"부유식 데이터센터","title":"삼성중공업, 미국 M3와 물 위 데이터센터 첫 실전 프로젝트 추진","source":{"name":"조선비즈","url":"https://biz.chosun.com/en/en-industry/2026/07/30/FXK2OLEGUVHMZAJOJ65EEGRWCM/?outputType=amp","date":"2026.07.30"},"f1":"삼성중공업은 미국 개발사 무스테리안(M3)과 부유식 데이터센터(FDC) 엔지니어링 계약을 추진하며 국내 조선사 최초로 개념설계를 실제 프로젝트에 적용해요. 첫 시설은 산업단지 인근 수면에 바지선을 고정하고 육상 전력을 공급받아 2028년 상반기 가동하는 목표예요. 삼성중공업은 설계·제작·설비 통합·인도까지 맡고, 거제조선소 상선 도크에서 현재 논의 중인 FDC를 최대 2기 만들 수 있다고 설명했어요. M3의 후보 사업은 휴스턴 500MW 혼합형과 2029년 가동 목표인 산호세 860MW급까지 포함해요.","f2":"AI 데이터센터는 송전망, 땅, 냉각수, 환경허가 중 하나만 늦어져도 전체 공기가 밀리는데, FDC는 핵심 설비를 조선소에서 병렬 제작해 현장 시간을 줄일 수 있어요. 삼성중공업은 FLNG에서 쌓은 냉각·열관리·화재방호 기술과 설계·제작 동시진행 방식을 서버 시설에 옮기려 해요. 육상 부지를 덜 쓰고 주변 물을 냉각에 활용하는 장점이 있지만 해상 부식, 수질 영향, 전력 케이블, 항만 인허가라는 새 위험도 생겨요. 결국 배를 잘 만드는 능력과 서버 가동률 기준을 함께 충족해야 상용화돼요.","f3":"컨설턴트는 육상형과 부유식을 건설비만 비교하지 말고 전력 연결 대기, 허가 지연, 냉각비, 보험료, 유지보수, 장애 손실을 합친 총소유비용으로 봐야 해요. 50MW 표준 설계를 반복하면 설계비와 공기를 낮출 수 있지만 첫 호기가 늦거나 장애를 내면 후속 수주의 옵션 가치가 크게 사라져요. 삼성중공업과 M3는 2028년 가동률, PUE, 냉각수 환경영향, 예산·공기 준수율을 초기 KPI로 공개할 필요가 있어요. 성공하면 조선사는 일회성 선박 매출을 넘어 장기 유지보수와 반복 건조라는 새 수익원을 만들 수 있어요."},
      {"tag":"중소기업 체감경기","title":"8월 중소기업 전망 80.0으로 반등했지만 제조업은 2.4포인트 하락","source":{"name":"조선비즈","url":"https://biz.chosun.com/industry/business-venture/2026/07/30/VCBEQRCTHNAGNK2C3GSXRTQSRE/?outputType=amp","date":"2026.07.30"},"f1":"중소기업중앙회가 2026년 7월 14~21일 3063개사를 조사한 8월 업황전망지수 SBHI는 80.0으로 전월보다 1.8포인트 올랐어요. 100을 넘으면 좋아질 것이라는 기업이 더 많다는 뜻이므로, 반등했어도 비관 응답이 여전히 우세해요. 서비스업 기대가 전체 지수를 올렸지만 제조업 지수는 80.1로 2.4포인트 떨어졌어요. 산업용 기계·장비 수리업은 84.1에서 91.0으로 6.9포인트, 가죽·가방·신발은 77.2에서 82.6으로 5.4포인트 개선됐어요.","f2":"같은 중소기업이라도 서비스업은 여름 이동·여가·대면 소비의 도움을 받고 제조업은 원재료비, 수출 주문, 재고 부담을 먼저 맞아요. 전망지수는 매출액이 아니라 기업이 느끼는 방향을 묻기 때문에 1.8포인트 상승을 경기 회복으로 단정할 수 없어요. 특히 지수가 80이라는 것은 기준선 100과 20포인트 차이라 절대 수준은 여전히 약해요. 업종별 편차가 크므로 평균만 보면 수리업의 반등과 다른 제조업의 주문 부진이 서로 가려져요.","f3":"정책이나 은행의 지원 대상을 정할 때 전체 중소기업을 한 묶음으로 보면 자금이 엉뚱한 곳에 갈 수 있어요. 업종별 주문잔고, 재고일수, 원가 전가력, 현금 보유개월을 함께 보고 일시적 유동성 부족과 구조적 수요 감소를 구분해야 해요. 소비재 기업은 휴가철 효과가 9월에도 이어지는지, 제조업은 신규 수주와 가동률이 바닥을 다지는지 확인해야 해요. 면접에서는 지수의 방향, 절대 수준, 표본 구성 세 가지를 분리해 해석하면 좋아요."}
    ]},
    {"id":"tech","no":"04","title":"테크·AI","slug":"Tech & AI","items":[{"tag":"AI 반도체","title":"구글, 제미나이 전력효율 6~10배 노리는 자체 추론칩 Frozen v2 개발","source":{"name":"TechCrunch","url":"https://techcrunch.com/2026/07/20/google-is-working-on-a-new-ai-chip-designed-to-make-gemini-more-efficient/","date":"2026.07.20"},"f1":"구글 모회사 알파벳은 제미나이 추론을 더 싸고 효율적으로 돌리기 위한 서버 칩 Frozen v2를 설계하고 있어요. 내부 목표는 기존 구글 AI 칩보다 전력 1단위당 생성 토큰이 6~10배 많고, 출시 시점은 2028년이에요. 구글은 개별 프로젝트를 확인하지 않았지만 하드웨어와 소프트웨어를 함께 설계하는 풀스택 실험을 계속한다고 밝혔어요. 소식이 전해진 월요일 구글 주가는 약 3% 올랐고, 회사는 올해 AI 전략에 1800억~1900억달러를 지출할 계획이에요.","f2":"AI 서비스 비용은 사용자가 질문할 때마다 답을 만드는 추론에서 반복 발생해요. 전력당 토큰을 6배 높이면 같은 전력과 데이터센터에서 처리하는 질문량이 커져 칩 효율이 곧 클라우드 원가와 서비스 마진이 돼요. 구글이 자체 칩을 만들면 엔비디아 공급 부족과 가격 협상력 문제를 줄이고 제미나이에 맞춘 최적화를 할 수 있어요. 다만 2028년까지 모델 구조가 바뀌거나 성능 목표를 못 맞추면 수년의 설계비와 제조 예약이 매몰비용이 될 수 있어요.","f3":"구글의 1800억~1900억달러 투자는 서울시 1년 예산의 여러 배인 만큼 토큰당 비용, 서버 활용률, 고객 매출로 회수되는지를 봐야 해요. 자체칩과 엔비디아 GPU를 전력비, 개발도구, 장애대응, 공급안정성까지 포함해 워크로드별로 비교해야 해요. 6~10배 목표가 실제 제미나이 트래픽의 품질과 지연시간을 유지한 수치인지 검증하는 것이 핵심이에요. 성공하면 AI 경쟁은 모델 점수에서 전력·칩·소프트웨어를 함께 최적화하는 운영경제성으로 더 빠르게 이동해요."}]},
    {"id":"japan","no":"05","title":"일본 경제·시장","slug":"Japan","items":[{"tag":"AI 인프라","title":"도쿄 외곽 데이터센터에 주민 반대, 전력보다 먼저 사회적 허가가 병목","source":{"name":"The Japan Times","url":"https://www.japantimes.co.jp/news/2026/07/18/japan/society/japan-data-centers-opposition/","date":"2026.07.18"},"f1":"도쿄 외곽 히노에서 대형 데이터센터 계획을 두고 94세 기타가와 요리코와 69세 야마자키 야스오 등 주민들이 반대 목소리를 냈어요. AI 연산을 담당하는 서버 시설이 주거지 가까이에 들어서면 냉각기와 비상발전기의 소음, 전력·물 사용, 경관 변화가 생길 수 있다는 우려예요. 일본은 인구와 기업이 수도권에 밀집해 고객과 가까운 부지를 찾기 좋지만 가용 토지가 좁아요. 뉴욕주와 호주 등도 데이터센터 자원 사용 규칙을 강화하는 가운데 일본의 갈등도 세계적인 현상의 일부가 됐어요.","f2":"데이터센터는 고객과 가까울수록 응답 속도가 빨라지고 기존 통신망을 쓰기 쉬워 도시권을 선호해요. 그러나 24시간 돌아가는 냉각기와 비상발전기는 주민에게는 매일의 생활비용이고, 사업자가 만드는 일자리는 일반 공장보다 적어 보상 체감도 낮아요. 법적 허가를 얻어도 설명이 늦거나 소음·물 사용 자료가 불투명하면 주민 반대가 공사 지연과 금융비 증가로 이어져요. 결국 전력망 접속권과 함께 지역의 신뢰라는 사회적 허가가 핵심 생산요소가 돼요.","f3":"일본 진출 입지는 토지가격과 전력단가뿐 아니라 민원 가능성, 인허가 기간, 소음 저감비, 지연손실을 총비용에 넣어 비교해야 해요. 폐열의 지역난방 활용, 재생전력 조달, 물 사용 공개, 주민기금과 교육 일자리를 사전에 묶으면 반대 유인을 줄일 수 있어요. 한국의 수도권 데이터센터도 같은 문제를 겪으므로 기술 사양과 지역 수용성을 한 팀이 동시에 설계해야 해요. GPU 확보 경쟁의 진짜 병목은 전력과 땅을 넘어 주민 동의를 얻는 실행 역량이에요.","vocab":{"w":"地元合意","r":"じもとごうい","m":"사업을 추진할 때 지역 주민·지자체와 이해를 맞춰 얻는 ‘지역 합의’예요. 법적 허가만으로 부족하고 소음·전력·물·지역환원 조건을 함께 조정한다는 뜻이에요."}}]}

  "story":"오늘 뉴스는 세계에서 가장 좁고 중요한 바닷길에서 시작해요. 호르무즈 해협의 선박 통로는 폭이 약 3.2km에 불과한데 이란이 실사격 훈련을 예고했고, 미국은 함정에 위험하게 접근하지 말라고 경고했어요. 이 길로 세계 원유 거래량의 약 5분의 1이 지나니 서울에서 부산으로 가는 고속도로 한 구간이 세계 주유소 다섯 곳 중 한 곳의 공급을 맡은 셈이에요. 실제 봉쇄가 없어도 보험료와 유조선 운임이 먼저 오르기 때문에 기업은 발표문보다 배가 실제로 얼마나 지나는지를 봐야 해요.\n\n미국 경제는 겉으로 아주 빨리 달렸어요. 2025년 3분기 GDP 성장률이 연율 4.4%였고 소비는 3.5%, 주택을 제외한 기업투자는 3.2% 늘었어요. 그런데 기업이 새로 뽑은 사람은 2025년 3월 이후 월평균 2만8000명뿐이어서, 큰 AI 공장은 늘어도 청년이 느끼는 채용문은 좁은 ‘고용 없는 호황’이 됐어요. 부유층의 소비와 AI 투자가 숫자를 끌어올리는 동안 생활비가 빠듯한 가계는 다른 경기를 살고 있다는 뜻이에요.\n\n한국에서는 조선 기술이 AI 인프라로 건너가고 있어요. 삼성중공업과 미국 M3는 서버와 냉각설비를 바지선에 싣는 부유식 데이터센터를 2028년 상반기 가동하려 하고, 휴스턴 500MW와 산호세 860MW 사업도 준비해요. 육상 데이터센터가 땅·전력·냉각수·허가 때문에 늦어질 때 조선소에서 미리 만들어 시간을 줄이려는 발상이에요. 다만 바닷물 부식과 환경허가라는 새 숙제를 풀어야 반복 수주로 이어져요.\n\n한국의 작은 기업들은 아직 조심스러워요. 3063곳을 조사한 8월 경기전망지수는 80.0으로 전달보다 1.8포인트 올랐지만, 100 아래라 좋아질 것이라는 기업보다 나빠질 것이라는 기업이 더 많아요. 서비스업이 여름 소비 덕에 살아난 반면 제조업은 2.4포인트 떨어졌어요. 평균 점수 하나만 보면 산업용 기계 수리업의 6.9포인트 반등과 다른 제조업의 주문 부진이 한 통에 섞여 사라지므로 업종별로 쪼개 봐야 해요.\n\nAI 칩에서는 구글이 제미나이의 답변 생산비를 낮추려 자체 추론칩 Frozen v2를 개발하고 있어요. 목표는 기존 칩보다 전력 1단위당 토큰을 6~10배 더 만들고 2028년에 내놓는 것이에요. 구글의 올해 AI 지출 계획은 1800억~1900억달러로 서울시 1년 예산의 여러 배라, 투자자는 모델 점수보다 질문 하나를 처리하는 비용과 실제 매출 회수를 묻게 돼요. 자체칩은 엔비디아 의존을 줄일 수 있지만 2028년까지 모델이 바뀌면 큰 설계비가 헛돈이 될 위험도 있어요.\n\n일본에서는 그 AI를 돌릴 데이터센터가 주민 반대에 부딪혔어요. 도쿄 외곽 주민들은 24시간 냉각기 소음, 비상발전기, 물과 전력 사용을 걱정하지만 데이터센터가 만드는 지역 일자리는 큰 공장보다 적어요. 기업에는 빠른 서버가 필요해도 주민에게는 매일 듣는 소음과 경관 변화가 더 현실적이죠. 오늘 여섯 기사를 하나로 묶으면 성장의 크기보다 제약을 푸는 능력이 중요하다는 결론이에요. 석유에는 해협, 미국 성장에는 고용, 한국 부유식 데이터센터에는 해상 운영, 중소기업에는 수요, AI 칩에는 전력효율, 일본 데이터센터에는 지역 합의라는 병목이 있어요.",
  "industry":{"name":"중소기업 경기정보·지원 서비스","valueChain":"기업 설문·세무·결제 원천데이터 수집 → 업종·지역별 경기진단과 신용평가 → 정책기관·은행의 자금·보증 상품 설계 → 중소기업 심사·집행 → 매출·고용·상환 성과 측정과 모델 개선","bm":"데이터 사업자는 은행·보증기관·지자체에 업종별 전망과 위험점수 사용료를 받고, 금융기관은 이를 활용해 대출·보증을 더 정확히 가격화해 이자와 수수료를 벌어요. 정책기관은 같은 예산으로 생존 가능성이 높은 기업을 더 많이 돕는 효과를 사요.","ksf":"① 3063개 설문처럼 표본을 충분히 모으되 실제 매출·결제 데이터로 말과 행동의 차이를 보정하고, ② 업종·지역·기업규모별로 잘게 나눠도 정확도가 유지되며, ③ 왜 위험하다고 판단했는지 기업과 심사자가 쉽게 이해할 수 있어야 이겨요.","issue":"중소기업중앙회는 SBHI를, 신용평가사와 신용보증기금·기술보증기금은 기업 위험정보를 공급·활용해요. 가장 큰 이슈는 경기 급변기에 과거 데이터가 현재 위험을 늦게 따라가고, 자동평가가 취약 업종의 자금줄을 한꺼번에 조일 수 있다는 점이에요."},
  "bcg":[{"titleKo":"AI 의사결정 에이전트가 전략회의를 바꾸는 법","title":"Decision Agents Bring AI into the Boardroom","url":"https://www.bcg.com/publications/2026/how-ai-decision-agents-transform-strategy","summary":"BCG의 약 2400명 임원 조사를 보면 기업은 2026년 AI 투자를 매출의 1.7%까지 두 배로 늘릴 계획이지만, 의사결정을 최우선 투자영역으로 꼽은 리더는 5명 중 1명도 되지 않았어요. CEO의 42%가 에이전트를 매주 직접 쓰는데도 전략 의사결정용 에이전트 투자 비중은 관련 주제 중 가장 낮은 14%였어요. BCG는 여러 부서의 문서·표·현장지식을 공통 증거로 묶고, 회의 중 수요·가격·규제 가정을 바꿔 시나리오를 즉시 다시 계산하는 의사결정 에이전트를 제안해요. 다만 최종 판단은 사람이 맡고 데이터 출처, 가정, 권한, 결과 추적성을 명확히 해야 해요.","soWhat":"컨설턴트는 AI를 자료작성 속도 도구에 머물게 하지 말고, 오늘 기사처럼 유가·고용·가스·중소기업·보안·지역반대의 가정을 한 화면에서 바꿔 보는 의사결정 시스템으로 설계해야 해요."}]

function termsRow(terms){ if(!terms||!terms.length) return ""; return `<div class="terms"><div class="th">📖 용어 풀이</div>${terms.map(t=>`<div class="t"><b>${esc(t.t)}</b> — ${esc(t.d)}</div>`).join("")}</div>`; }
function vocabRow(v){ if(!v) return ""; return `<div class="jword"><span class="jw-badge">🇯🇵 오늘의 비즈니스 일본어</span><span class="jw-text"><b>${esc(v.w)}</b> <span class="jw-r">(${esc(v.r)})</span> — ${esc(v.m)}</span></div>`; }
function itemCard(it){ return `<article class="item open"><button class="item__head" aria-expanded="true" type="button"><span class="tag">${esc(it.tag)}</span><span><span class="item__title">${esc(it.title)}</span><br>${srcHtml(it.source)}</span><span class="chev">▾</span></button><div class="item__wrap"><div class="item__body"><div class="item__inner">${fieldRow("무슨 일",it.f1)}${fieldRow("그동안의 이야기",it.f2,"story")}${fieldRow("So What",it.f3)}${termsRow(it.terms)}${vocabRow(it.vocab)}</div></div></div></article>`; }
let html = BRIEFING.sections.map(s=>`<section class="block" id="${s.id}"><div class="shead"><span class="no">${esc(s.no)}</span><h2>${esc(s.title)}</h2><span class="slug">${esc(s.slug)}</span></div>${s.items.map(itemCard).join("")}</section>`).join("");
if(BRIEFING.industry){ const ind=BRIEFING.industry; const indRows=[["밸류체인",ind.valueChain],["비즈니스모델",ind.bm],["경쟁력 요소",ind.ksf],["최대 이슈",ind.issue]].map(([lab,val])=>fieldRow(lab,esc(val))).join(""); html += `<section class="block" id="industry"><div class="shead"><span class="no">🏭</span><h2>오늘의 산업 소개</h2><span class="slug">Industry</span></div><div class="industrycard"><span class="ik">🏭 오늘의 산업 소개</span><div class="iname">${esc(ind.name||"")}</div><div class="ifields">${indRows}</div></div></section>`; }
if(BRIEFING.bcg && BRIEFING.bcg.length){ const bcgItems=BRIEFING.bcg.map(b=>`<div class="bcgitem"><div class="btitle">${esc(b.titleKo)}</div><div class="borig">${esc(b.title)}</div><p class="bsum">${esc(b.summary)}</p><div class="bsw"><b>So What</b> — ${esc(b.soWhat)}</div><a class="blink" href="${esc(b.url)}" target="_blank" rel="noopener">원문 보기 ↗</a></div>`).join(""); html += `<section class="block" id="bcg"><div class="shead"><span class="no">📘</span><h2>BCG 인사이트</h2><span class="slug">BCG Publications</span></div>${bcgItems}</section>`; }
if(BRIEFING.hkmarket){ const hk=BRIEFING.hkmarket; const hkTopics=(hk.topics||[]).map(t=>`<div class="hktopic"><div class="httl">${esc(t.topic)}</div><div class="hdet">${esc(t.detail)}</div></div>`).join(""); html += `<section class="block" id="hkmarket"><div class="shead"><span class="no">📺</span><h2>한경코리아마켓</h2><span class="slug">YouTube Morning Brief</span></div><div class="hkmeta">${esc(hk.broadcastLabel||"")} · <a href="${esc(hk.videoUrl||"")}" target="_blank" rel="noopener">${esc(hk.videoTitle||"원본 방송 보기")} ↗</a></div>${hkTopics}</section>`; }
$("#main").innerHTML = html;
$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: BBC · ABC · 조선비즈(산업) · TechCrunch · ZDNet · Gizmodo · 일본 주요 경제매체 · BCG · 한경코리아마켓(유튜브) — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장.<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

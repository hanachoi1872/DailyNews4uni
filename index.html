      {d:"2026.07.28 (오늘)", e:"CXMT발 경쟁 우려와 엔비디아發 자금조달 리스크가 겹치며 아시아 반도체株가 동반 급락했다. 코스피는 개장 6분 만에 매도 사이드카가 발동됐고, 오전 10시13분 낙폭이 8%를 넘기며 올해 8번째 서킷브레이커가 발동돼 20분간 거래가 전면 정지됐다. 결국 전일 대비 732.09포인트(10.84%) 내린 6023.66으로 마감하며 '검은 화요일'로 불렸다. 삼성전자는 13.4%, SK하이닉스는 14.7% 급락(나스닥 ADR은 공모가 149달러를 밑도는 143달러로 마감)했고, 닛케이225도 3.95%, 대만 자취안지수도 3.9% 빠졌다. MSCI 아시아·태평양지수는 6월22일 고점 대비 10% 넘게 하락해 조정 국면에 진입했다. 공교롭게도 같은 날 애플은 시총 5조달러를 처음 찍으며 엔비디아를 제치고 세계 시가총액 1위 자리를 되찾았다."}

    why:"<b>컨설턴트 지망생이 주목해야 할 이유</b> — 하루 만에 반도체 지수가 7.5%(2025년4월 이후 최대 낙폭) 빠지는 이 장면은, AI 랠리를 지탱해온 '수요는 무한하다'는 내러티브가 중국의 자립화(공급 측)와 순환금융(자금조달 측)이라는 두 신호만으로도 얼마나 빠르게 흔들릴 수 있는지 보여준다. 산업·자본시장 자문을 지망하는 컨설턴트라면, 클라이언트의 실적이 바뀌지 않아도 섹터 심리 하나로 하루 만에 시총 10% 이상이 증발할 수 있다는 점을 항상 리스크 시나리오에 넣어야 한다."
  },
  sections:[
    {id:"world",no:"01",title:"세계·지정학",slug:"World",items:[
      {tag:"중동정세",title:"네타냐후, 백악관서 트럼프와 80분 회동…이란 핵 억지 재확인에도 구체적 합의는 없어",
       source:{name:"Bloomberg",url:"https://www.bloomberg.com/news/newsletters/2026-07-28/trump-and-netanyahu-are-poised-to-meet-under-a-dark-cloud",date:"2026.07.28"},
       f1:"트럼프 대통령과 네타냐후 이스라엘 총리가 28일(현지시간) 백악관 오벌오피스에서 80분간 회동했다. 지난 2월28일 미-이스라엘이 이란을 상대로 공동 군사작전을 개시한 이후 두 정상의 첫 대면이자, 트럼프 2기 들어 여덟 번째 백악관 접견이었다. 백악관은 이번 회동을 '긍정적이고 생산적(positive and productive)'이었다고 평가했다.",
       f2:"두 정상은 이란이 핵무기를 갖지 못하도록 하겠다는 '흔들림 없는 공동의지'를 재확인했지만, 구체적 합의는 도출하지 못했다. 레바논 평화 프레임워크 이행과 아브라함 협정 확대 방안도 의제에 올랐다. 회동 직전까지도 이란 전쟁의 출구가 보이지 않는 데 대한 트럼프 진영 내 불만이 감지됐던 만큼, 관계 회복이 주된 목적이었다는 평가가 나온다. 같은 날 두 정상은 별세한 린지 그레이엄 상원의원의 추모식 참석차 워싱턴을 찾은 젤렌스키 우크라이나 대통령과도 각각 별도로 만났다.",
       f3:"'긍정적·생산적'이라는 표현에도 실제로는 아무 합의가 나오지 않았다는 점이 핵심이다. 지정학 리스크를 자문하는 컨설턴트라면, 정상회담 뒤 나오는 우호적 수사(修辭)와 실제 정책 변화 사이의 간극을 구분하지 못하면 클라이언트에게 잘못된 안도감을 심어줄 수 있다는 점을 이 사례에서 확인해야 한다.",
       terms:[]},
      {tag:"우크라이나",title:"젤렌스키-트럼프, 패트리어트 요격체 생산 라이선스 관련 '좋은 대화' 나눠",
       source:{name:"Bloomberg",url:"https://www.bloomberg.com/news/articles/2026-07-28/zelenskyy-says-he-had-good-talk-with-trump-on-patriot-missiles",date:"2026.07.28"},
       f1:"젤렌스키 우크라이나 대통령이 28일 백악관에서 트럼프 대통령을 만나 우크라이나의 대공방어 체계와 외교적 종전 노력에 대해 논의했다고 밝혔다. 젤렌스키는 '대통령과 나는 패트리어트 요격체 생산 라이선스 등 여러 방안을 논의했다'고 전했다.",
       f2:"앞서 터키 앙카라에서 열린 NATO 정상회의에서 트럼프 대통령은 우크라이나에 패트리어트 방공미사일 생산 라이선스를 부여하겠다고 약속한 바 있다. 이후 우크라이나는 패트리어트 제조사 레이시온 관계자들과 실무 협의를 진행해왔다. 젤렌스키는 이번 방문에서 대공방어 강화를 '최우선 순위'로 꼽았다.",
       f3:"같은 날 네타냐후·젤렌스키를 각각 접견한 트럼프의 일정은, 여러 지정학 리스크가 동시에 걸려 있는 클라이언트를 상대할 때 어떤 이벤트가 실질적 정책 변화로 이어질지와 단순 의전성 만남인지를 구분해내는 능력이 왜 중요한지 보여준다. 국제 정세를 다루는 컨설턴트라면, 다자 외교 이벤트가 겹치는 시기일수록 각 트랙의 진행 속도를 따로 추적하는 습관을 들여야 한다.",
       terms:[]}
    ]},
    {id:"econ",no:"02",title:"글로벌 경제·시장",slug:"Economy",items:[
      {tag:"아시아증시",title:"MSCI 아시아·태평양지수, 6월 고점 대비 10% 넘게 하락…조정 국면 진입",
       source:{name:"Bloomberg",url:"https://www.bloomberg.com/news/articles/2026-07-28/asian-stocks-slide-10-from-june-peak-to-head-for-correction",date:"2026.07.28"},
       f1:"MSCI 아시아·태평양지수가 28일 장중 한때 3.5% 넘게 빠지며, 지난 6월22일 기록한 고점 대비 낙폭이 10%를 넘어섰다. 통상 고점 대비 10% 하락은 '조정(correction)' 국면 진입으로 간주된다.",
       f2:"코스피(-10.84%)와 닛케이225(-3.95%), 대만 자취안(-3.9%)이 일제히 급락한 여파다. 중국의 반도체 자립화 진전과 AI 인프라 투자를 둘러싼 순환금융 우려가 겹치며, 블룸버그 반도체 지수는 하루 만에 7.5% 빠져 2025년 4월 이후 최대 낙폭을 기록했다.",
       f3:"개별 국가·기업의 펀더멘털이 아니라 업종 전반의 심리 변화만으로 지역 지수 전체가 조정 국면에 들어섰다는 점이 핵심이다. 매크로·자본시장을 자문하는 컨설턴트라면, 클라이언트에게 '내 실적이 괜찮으니 안전하다'는 설명만으로는 충분하지 않으며, 섹터 전체가 재평가받는 국면에서는 개별 기업의 주가도 함께 흔들릴 수 있다는 점을 리스크 커뮤니케이션에 포함해야 한다.",
       terms:[]},
      {tag:"AI금융",title:"엔비디아, 오픈AI 오하이오 데이터센터에 최대 2500억달러 지급보증 논의…'순환금융' 우려 재점화",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/07/27/nvidia-and-openai-in-talks-for-up-to-250-billion-dollar-ai-backstop.html",date:"2026.07.27"},
       f1:"엔비디아가 오픈AI의 오하이오주 파이크 카운티 데이터센터(10기가와트 규모, 총사업비 5000억달러 이상 추산) 건설 부채 조달을 위해 최대 2500억달러 규모의 지급보증을 제공하는 방안을 오픈AI와 논의 중이라고 CNBC가 WSJ 보도를 인용해 확인했다. 해당 데이터센터는 옛 우라늄 농축 공장 부지에 소프트뱅크그룹 에너지 자회사가 개발 중이다.",
       f2:"이 보증은 부지 임차·건설 부채만을 대상으로 하며, 데이터센터 내부에 들어갈 엔비디아 칩 자체는 별도로 최대 3500억달러 규모의 금융 구조를 논의 중이다. 아직 조건이 확정되지 않았고 최종 성사 여부도 불확실하지만, 이 보도만으로 엔비디아 주가는 월요일 하루 만에 5% 가까이 빠졌다.",
       f3:"고객사(오픈AI)의 부채를 공급사(엔비디아)가 보증해주는 구조는, AI 인프라 투자가 실제 수요가 아니라 소수 기업 간 상호 신용에 의존해 부풀려지고 있는 것 아니냐는 의구심을 키운다. 금융·산업 자문을 지망하는 컨설턴트라면, 클라이언트의 성장 스토리에 이런 순환적 자금조달 구조가 숨어 있는지를 실사 단계에서부터 반드시 짚어내야 한다는 점을 이 사례에서 확인할 수 있다.",
       terms:[{t:"순환금융(Circular Financing)",d:"공급업체가 고객사에 자금을 대거나 신용을 보증해, 그 돈으로 다시 자사 제품을 사게 만드는 구조. 매출이 실제 최종 수요가 아니라 관계사 간 상호 자금 순환으로 발생한 것처럼 보일 수 있어, 산업 성장세를 과대평가하게 만드는 위험 신호로 꼽힌다."}]}

    {id:"tech",no:"03",title:"테크·AI",slug:"Tech·AI",items:[
      {tag:"빅테크",title:"애플, 시총 5조달러 첫 돌파…엔비디아 제치고 세계 시가총액 1위 재탈환",

       f1:"애플이 28일(현지시간) 장중 시가총액 5조달러를 처음으로 돌파했다. 전날인 27일에는 엔비디아를 제치고 세계에서 가장 가치 있는 상장기업 자리를 되찾았는데, 이는 2025년 4월 이후 처음이다. 애플의 올해 주가 상승률은 22%를 넘어 '매그니피센트 7' 중 가장 높다.",
       f2:"엔비디아를 비롯한 AI 반도체株가 중국의 반도체 자립화 우려와 순환금융 논란으로 흔들리는 사이, 상대적으로 AI 설비투자 부담이 적은 애플로 투자자들의 관심이 옮겨간 결과로 풀이된다. 애플의 시총은 약 4.94~4.95조달러, 엔비디아는 약 4.75~4.83조달러 수준으로 집계됐다.",
       f3:"AI 붐의 최대 수혜주로 꼽히던 엔비디아 대신, AI 설비투자 부담에서 상대적으로 자유로운 애플로 '세계 1위' 타이틀이 넘어간 이 장면은, 시장이 AI 투자 사이클의 위험을 어떻게 재평가하고 있는지 보여주는 상징적 신호다. 테크 산업을 자문하는 컨설턴트라면, 클라이언트에게 'AI 투자를 얼마나 하는가'만큼이나 '그 투자를 얼마나 안전하게 회수할 수 있는가'를 함께 짚어주는 습관이 필요하다는 점을 확인할 수 있다.",
       terms:[]},
      {tag:"반도체보안",title:"대만, 엔비디아 직원 中 밀반출 혐의로 구금…엔비디아 직원 대상 사상 첫 사례",
       source:{name:"Bloomberg",url:"https://www.bloomberg.com/news/articles/2026-07-28/taiwan-detains-nvidia-employee-in-china-chip-smuggling-probe",date:"2026.07.28"},
       f1:"대만 검찰이 엔비디아 타이베이 지사 직원 1명을 AI 칩의 중국 밀반출 의혹과 관련해 구금했다. 검찰은 지난 24일 이 직원의 자택과 사무실 책상을 압수수색했으며, 이후 법원은 서류위조·배임 혐의로 구금을 허가했다.",
       f2:"이번 구금은 슈퍼마이크로(Super Micro) 관련 수사 과정에서 확보된 자료를 통해 시작됐다. 현재까지 슈퍼마이크로 직원 2명, 대만 상장사 알바트론 직원 1명을 포함해 총 7명이 구금됐으며, 검찰은 이들이 서류를 위조해 슈퍼마이크로 서버 약 50대를 대만을 거쳐 일본을 경유, 중국으로 밀반출하는 것을 도운 혐의를 받고 있다고 보고 있다. 엔비디아 직원이 이런 혐의로 구금된 것은 이번이 처음으로 알려졌다.",
       f3:"수출통제망이 최종 소비자가 아니라 서류상 경유지·중개인을 통해 뚫릴 수 있다는 것을 보여주는 사례다. 공급망·컴플라이언스를 자문하는 컨설턴트라면, 클라이언트에게 수출통제 준수 여부를 점검할 때 최종 고객사뿐 아니라 자사 임직원과 협력업체가 서류 조작에 연루될 가능성까지 내부통제 범위에 포함하도록 조언해야 한다는 교훈을 얻을 수 있다.",

      {label:"2. 가설 수립 — Framework 설계", detail:"이 문제 전용 구조를 즉석에서 짠다. CXMT발 위협에 대한 SK하이닉스의 대응을 MECE하게 네 갈래로 — ① 경쟁 포지션(HBM 등 첨단 제품 vs CXMT가 진입한 범용 D램의 기술 격차), ② 재무·자본배분(주가 급락이 자금조달·설비투자 계획에 미치는 영향), ③ 고객관계(엔비디아·마이크로소프트 등 장기공급계약의 안정성), ④ 시장 커뮤니케이션(패닉 셀과 실제 경쟁력 훼손의 분리)."},
      {label:"3. 정보 파악 — 질문과 확인", detail:"갈래별로 질문을 던지고 오늘 기사에서 확인된 사실을 채운다 — CXMT의 D램 점유율 8%(4위)는 범용 제품 중심이며 HBM4 등 최첨단 영역에는 아직 진입하지 못했다는 점, SK하이닉스는 이미 나스닥 ADR 상장으로 265억달러를 조달해 현금 여력을 확보했고 엔비디아와 5년간 7500억달러 규모의 HBM4 코디자인·공급 협력을 체결했다는 점, 2분기 영업이익은 컨센서스를 4.1% 밑돌았지만 전년 대비로는 557% 늘어난 사상 최대치라는 점까지 확인."},
      {label:"4. 분석/추론 — 옵션 비교", detail:"확인된 사실을 근거로 대안을 비교한다 — HBM4·HBM4E 등 최첨단 제품 로드맵을 가속화해 CXMT와 격차를 유지하는 방안(속도는 빠르지만 R&D 비용 부담 큼) vs 이미 조달한 ADR 자금 265억달러를 활용해 용인 클러스터·청주 패키징 공장 증설 시점을 앞당기는 방안(자금은 이미 확보돼 있어 실행 속도가 관건) vs 엔비디아·마이크로소프트 등과의 기체결 장기공급계약을 적극적으로 시장에 알려 펀더멘털 안정성을 커뮤니케이션하는 방안(비용은 거의 없고 즉각적인 주가 방어 효과) vs 범용 D램·낸드 등 CXMT와 직접 경쟁하는 저부가 제품 비중을 점진적으로 축소하고 HBM·엔터프라이즈 SSD 등 고부가 제품 믹스로 전환하는 방안(중기적 대응)."},
      {label:"5. 결론 — 두괄식 답변", detail:"결론부터 압축해 먼저 제시한다 — '① 단기적으로는 엔비디아·마이크로소프트와의 기체결 장기공급계약(7500억달러 규모)과 ADR로 조달한 265억달러 현금을 근거로 펀더멘털 안정성을 적극 커뮤니케이션해 시장의 패닉과 실제 경쟁력 훼손을 분리하고, ② 중기적으로는 이 ADR 조달 자금을 활용해 용인·청주의 HBM4 생산능력 증설을 예정보다 앞당겨 CXMT가 아직 진입하지 못한 첨단 제품에서 격차를 벌리며, ③ 범용 D램·낸드 등 CXMT와 직접 경쟁하는 저부가 제품 비중은 점진적으로 축소한다'는 3단 권고를 먼저 제시한 뒤 근거를 설명한다."},
      {label:"6. 부가적 언급 — 리스크·제약사항", detail:"이 권고는 CXMT의 위협이 아직 범용 D램에 국한돼 있고 HBM 등 최첨단 영역 진입에는 수년이 더 걸린다는 전제, 그리고 오늘의 급락이 실적 자체보다 반도체 업종 전반의 심리적 패닉에 더 가깝다는 판단에 기반한다. 만약 CXMT가 예상보다 빠르게 HBM 양산에 성공하거나, 엔비디아發 AI 순환금융 우려가 실제 데이터센터 투자 축소로 이어질 경우 증설 속도와 커뮤니케이션 전략을 다시 검토해야 한다는 점을 덧붙인다."}
    ],
    hint:"<b>의사결정 기준</b> — 실제 MBB 케이스는 항상 이 기준으로 마무리한다: 정량(비용·기간) + 정성(관계·리스크) + 실현가능성 + 수익성. 한 줄짜리 답이 아니라, Clarification → 가설수립 → 정보파악 → 분석/추론 → 결론(두괄식) → 부가적 언급까지 6단계를 명시적으로 거치는 것 자체가 '컨설턴트처럼 생각한다'는 것을 보여주는 핵심이다."
  },
  calendar:{note:"일정은 유동적이므로 확정 전 원문 확인을 권장한다.",
    macro:[
      {date:"07.29",reg:"🇺🇸",ev:"FOMC 금리 결정",nt:"두 매파 위원(로건·해맥)의 이탈 가능성 주시. 어젯밤 코스피發 아시아 증시 급락 이후 나오는 첫 통화정책 발표라 시장 영향에 촉각."},
      {date:"07.29",reg:"🇺🇸",ev:"마이크로소프트·메타 2분기 실적",nt:"AI 캐펙스 가이던스가 오늘 급락한 반도체株 심리를 되돌릴 수 있을지 첫 시험대."},
      {date:"07.30",reg:"🇺🇸",ev:"아마존 2분기 실적",nt:"빅테크 4사 중 마지막 발표로 AI 설비투자 랠리에 대한 시장 판단을 완성지을 변수."},
      {date:"07.30~31",reg:"🇯🇵",ev:"일본은행(BOJ) 금융정책결정회의",nt:"금리 동결이 유력한 가운데 GDP 성장률 전망 0.8% 상향 여부와 엔화 40년래 최저치 속 개입 시사 여부가 관전 포인트."},
      {date:"07말(잠정)",reg:"🇰🇷",ev:"보유세·거래세 개편 최종안 발표",nt:"구윤철 부총리 예고. 종부세를 '주택 수'에서 '가격' 기준으로 전환하는 방안이 핵심 쟁점."},
      {date:"08초(잠정)",reg:"🇯🇵",ev:"소비세 식료품 인하 여부 최종 방침",nt:"7월 경제청사진에서 결론을 미룬 사안으로, 8월 초 정부 최종 입장 발표 예정."},
      {date:"08말~09월(잠정)",reg:"🇰🇷🇺🇸",ev:"대미 투자 1호 프로젝트(에너지 중심) 발표",nt:"2000억달러 규모 대미 전략투자 중 첫 사업."}
    ],
    earnings:[],
    sources:[{name:"Bloomberg",url:"https://www.bloomberg.com/news/articles/2026-07-28/korean-stocks-sink-as-chipmakers-plung-on-deepening-ai-fatigue"},{name:"CNBC",url:"https://www.cnbc.com/2026/07/28/apple-touches-5-trillion-market-cap-for-first-time-.html"}]
  }
};
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => (s==null?"":String(s));
const nowKST = new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'});
$("#meta").innerHTML = `<b><a href="archive.html" style="text-decoration:underline;text-decoration-color:var(--accent-soft)" title="지난 브리핑 모아보기">${esc(BRIEFING.dateLabel)}</a></b><span>·</span><span>${esc(BRIEFING.city||'Seoul')} · ${nowKST} KST 열람</span>`;
$("#mood").textContent = BRIEFING.mood || "";
$("#heads").innerHTML = BRIEFING.headliners.map(h=>`<li>${esc(h)}</li>`).join("");
const cu = BRIEFING.catchup;
if(cu){ $("#catchup").innerHTML = `<span class="ck">🕰️ 오늘의 따라잡기 — 처음부터 이해하기</span><h3>${esc(cu.topic)}</h3><p class="intro">${esc(cu.intro)}</p><ul class="tl">${(cu.timeline||[]).map(t=>`<li><span class="d">${esc(t.d)}</span>${esc(t.e)}</li>`).join("")}</ul><div class="why">${cu.why||""}</div>`; } else { $("#catchup").style.display="none"; }
if(BRIEFING.story){ const storyParas = BRIEFING.story.split(/\n+/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join(""); $("#story").innerHTML = `<span class="sk">📖 오늘의 이야기</span>${storyParas}`; } else { $("#story").style.display="none"; }
const navItems = [...BRIEFING.sections.map(s=>({id:s.id,no:s.no,title:s.title})), ...(BRIEFING.industry ? [{id:"industry",no:"🏭",title:"산업"}] : []), ...(BRIEFING.bcg && BRIEFING.bcg.length ? [{id:"bcg",no:"📘",title:"BCG"}] : []), {id:"think",no:"💭",title:"생각거리"},{id:"cal",no:"📅",title:"일정"}];
$("#nav").innerHTML = navItems.map(n=> `<a href="#${n.id}" data-id="${n.id}"><span class="n">${esc(n.no)}</span>${esc(n.title)}</a>`).join("");
function srcHtml(s){ if(!s) return ""; const link = s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">원문(${esc(s.date)})↗</a>` : (s.date?` · ${esc(s.date)}`:""); return `<span class="item__src">${esc(s.name)}${link}</span>`; }
function fieldRow(lab,val,cls){return val?`<div class="field ${cls||""}"><span class="lab">${lab}</span><span class="val">${val}</span></div>`:""}
function termsRow(terms){ if(!terms||!terms.length) return ""; return `<div class="terms"><div class="th">📖 용어 풀이</div>${terms.map(t=>`<div class="t"><b>${esc(t.t)}</b> — ${esc(t.d)}</div>`).join("")}</div>`; }
function vocabRow(v){ if(!v) return ""; return `<div class="jword"><span class="jw-badge">🇯🇵 오늘의 비즈니스 일본어</span><span class="jw-text"><b>${esc(v.w)}</b> <span class="jw-r">(${esc(v.r)})</span> — ${esc(v.m)}</span></div>`; }
function itemCard(it){ return `<article class="item open"><button class="item__head" aria-expanded="true" type="button"><span class="tag">${esc(it.tag)}</span><span><span class="item__title">${esc(it.title)}</span><br>${srcHtml(it.source)}</span><span class="chev">▾</span></button><div class="item__wrap"><div class="item__body"><div class="item__inner">${fieldRow("무슨 일",it.f1)}${fieldRow("그동안의 이야기",it.f2,"story")}${fieldRow("So What",it.f3)}${termsRow(it.terms)}${vocabRow(it.vocab)}</div></div></div></article>`; }
let html = BRIEFING.sections.map(s=>`<section class="block" id="${s.id}"><div class="shead"><span class="no">${esc(s.no)}</span><h2>${esc(s.title)}</h2><span class="slug">${esc(s.slug)}</span></div>${s.items.map(itemCard).join("")}</section>`).join("");
if(BRIEFING.industry){ const ind=BRIEFING.industry; const indRows=[["밸류체인",ind.valueChain],["비즈니스모델",ind.bm],["승부 조건",ind.ksf],["최대 이슈",ind.issue]].map(([lab,val])=>fieldRow(lab,esc(val))).join(""); html += `<section class="block" id="industry"><div class="shead"><span class="no">🏭</span><h2>오늘의 산업 한 조각</h2><span class="slug">Industry</span></div><div class="industrycard"><span class="ik">🏭 오늘의 산업 스냅샷</span><div class="ifields">${indRows}</div></div></section>`; }
if(BRIEFING.bcg && BRIEFING.bcg.length){ const bcgItems=BRIEFING.bcg.map(b=>`<div class="bcgitem"><div class="btitle">${esc(b.titleKo)}</div><div class="borig">${esc(b.title)}</div><p class="bsum">${esc(b.summary)}</p><div class="bsw"><b>So What</b> — ${esc(b.soWhat)}</div><a class="blink" href="${esc(b.url)}" target="_blank" rel="noopener">원문 보기 ↗</a></div>`).join(""); html += `<section class="block" id="bcg"><div class="shead"><span class="no">📘</span><h2>BCG 인사이트</h2><span class="slug">BCG Publications</span></div>${bcgItems}</section>`; }
if(BRIEFING.think){ const th=BRIEFING.think; const stepsHtml=(th.steps||[]).map(s=>`<li><b>${esc(s.label)}</b> — ${esc(s.detail)}</li>`).join(""); html += `<section class="block" id="think"><div class="think"><span class="tk">💭 오늘의 생각거리 — 컨설턴트처럼 생각하기</span><p>${esc(th.q)}</p><ol class="steps">${stepsHtml}</ol><div class="hint">${th.hint||""}</div></div></section>`; }
const c = BRIEFING.calendar || {macro:[],earnings:[],sources:[]};
html += `<section class="block" id="cal"><div class="shead"><span class="no">📅</span><h2>다가오는 일정</h2><span class="slug">watchlist</span></div><div class="terms" style="border-style:solid">${[...(c.macro||[]),...(c.earnings||[])].map(r=>`<div class="t"><b>${esc(r.date)} ${esc(r.reg||"")} ${esc(r.ev)}</b>${r.nt?` — ${esc(r.nt)}`:""}</div>`).join("")}<div class="th" style="margin-top:8px">${esc(c.note||"")}</div></div></section>`;
$("#main").innerHTML = html;
const calSrc = (c.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)} ↗</a>`).join(" · ");
$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: Bloomberg · CNBC · BBC · ABC · Reuters · AP + 한국 주요 언론 + 일본 니케이·Japan Times 등 + 컨설팅업계 전문 매체 — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장 · 일정 출처: ${calSrc}<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

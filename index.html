  "story": "오늘 이야기는 러시아 안에서 일어난 불로 시작해볼게. 우크라이나군이 러시아 레닌그라드주에 있는 키리시 정유소에 드론을 날려서 불을 냈는데, 이 정유소가 러시아에서 두 번째로 큰 정유시설(하루 40만 배럴 처리)이야. 이번이 벌써 세 번째 공격인데, 지난 3월에는 정제 장치 세 곳이 통째로 망가져서 공장이 완전히 멈췄던 적도 있대. 왜 하필 지금이냐면, 바로 다음 날(11월 10~11일) 아부다비에서 러시아-우크라이나-미국 협상이 열리거든. 그러니까 우크라이나는 협상 테이블에 앉기 직전까지도 상대의 돈줄(정유 수출)을 계속 때려서 협상력을 유지하려는 거야.\n\n공교롭게도 비슷한 시점에 미국 의회에서도 전쟁과 관련된 큰 사건이 터졌어. 공화당 토머스 매시 의원이 피트 헤그세스 국방장관을 상대로 탄핵 결의안을 냈는데, 핵심 이유가 '의회 승인 없이 이란 공습을 계속한 게 전쟁권한법 위반'이라는 거야. 매시 의원은 헤그세스한테 '지금 의회가 끝나기 전에 스스로 그만두든지 탄핵을 받든지 선택하라'고 최후통첩까지 했어. 트럼프 대통령은 '매우 불공정한 시도'라며 끝까지 헤그세스를 감싸겠다고 했는데, 지금 공화당이 다수인 하원에서는 통과되기 어렵대. 그래도 이 사건이 중요한 이유는, 초반에 의회 동의를 건너뛰고 속도감 있게 밀어붙였던 전쟁 결정이 나중에 꼬였을 때 그대로 책임을 묻는 꼬리표로 돌아온다는 걸 보여주기 때문이야.\n\n경제 쪽으로 넘어가면, 뉴욕증시가 지난주 터진 엔비디아 CEO 젠슨 황의 스캔들(중국 스파이로 의심되는 여성과의 교제 인정)에도 불구하고 오히려 크게 올랐어. 다우존스가 1104포인트(2.15%), 나스닥이 2.74%나 뛰었는데, 국제유가가 내리고 반도체주가 반등한 게 배경이었대. 재밌는 건 엔비디아 혼자만 주가가 5% 떨어져서 4월 이후 최저 수준을 기록했다는 거야. 즉 시장 전체는 '과매도였다'며 되돌림에 나섰는데, 스캔들 당사자인 엔비디아만 따로 떼서 벌을 준 셈이지. 호주에서는 최대 항공사 콴타스가 재무·인사 같은 사무직 850명을 컨설팅업체 액센츄어한테 아웃소싱하기로 했는데, 업무 대부분이 인도로 넘어간대. 비용을 줄이려고 핵심이 아닌 업무를 과감히 떼어내는 흐름이 항공사에서도 계속되고 있다는 뜻이야.\n\n한국 쪽은 두 가지 소식이 다 '다음 성장축이 뭐냐'는 질문과 관련 있어. 먼저 삼성과 현대차가 처음으로 'HMG 감사의 날'이라는 큰 행사를 열었는데, 177명이나 모인 이 자리에서 반도체·배터리 협력을 로봇과 피지컬AI(로봇이 실제 물리 세계에서 움직이게 하는 AI)까지 넓히겠다고 밝혔어. 다만 구체적인 투자나 계약은 아직 안 나왔다는 게 함정이야. 두 번째 소식은 반도체 투톱(삼성전자·SK하이닉스) 얘기인데, 미국 중간선거에서 민주당이 이기면서 'AI 데이터센터 규제가 세질 수도 있다'는 걱정이 퍼져서 두 회사 주가가 이틀 만에 각각 13%, 19%나 빠졌었대. 이날(9일)은 반등을 시도했지만 상승분을 거의 다 반납해서 삼성전자는 0.64%, SK하이닉스는 0.35% 오르는 데 그쳤고, 그 영향으로 코스피도 5018선까지 밀려서 '5000선 턱걸이' 신세가 됐어. 핵심은 반도체 실적 자체는 안 망가졌는데 '미국 정책이 어떻게 바뀔지 모른다'는 불확실성 하나 때문에 이 정도로 흔들렸다는 거야.\n\n테크 쪽에서는 한국의 로봇 얘기와 딱 맞아떨어지는 소식이 나왔어. 휴머노이드(인간형) 로봇 스타트업 어질리티 로보틱스가 나스닥에 상장했는데, '순수 휴머노이드 로봇 기업'으로는 최초래. 엔비디아가 투자자로 들어가 있고, 기업가치는 25억 달러로 평가받았어. 이 회사가 다른 로봇 스타트업이랑 다른 점은, 이미 물류창고 같은 실제 현장에 로봇을 배치해서 돌리고 있다는 '증명된 실적'을 갖고 있다는 거야. 그런데 CEO 본인이 \"당장 집에 로봇이 들어오는 일은 없을 것\"이라고 선을 그었다는 게 흥미로워. 결국 지금 로봇 산업은 '연구 단계'에서 '자본시장 단계'로 넘어갔지만, 아직 기대가 현실보다 한발 앞서 있다는 거야.\n\n일본 쪽은 안보와 사업이 정면으로 충돌한 사례야. 러시아 푸틴 대통령이 일본담배(JT)의 러시아 자회사 자산을 임시관리 대상으로 지정했는데, 처음엔 4개 법인이었다가 이틀 뒤 3개 법인을 더 추가해서 총 7개 법인이 통째로 넘어갔어. 이 자산들의 가치는 최대 37억 달러로 추산되는데, 러시아 사업이 JT 전체 영업이익의 4분의 1을 차지했다는 걸 생각하면 엄청난 타격이야. 실제로 JT 주가는 이틀 만에 30% 넘게 급락했어. 이건 서방 제재에 대한 '대칭적 보복'이라는 명분인데, 분쟁 지역에 남아서 사업을 계속하는 선택 자체가 언제든 자산을 통째로 잃을 수 있는 리스크라는 걸 보여준 사례야.\n\n오늘 하루를 정리하면, 전쟁 뉴스에서는 협상 직전까지 상대를 압박하는 군사 행동(키리시 공격)과 그 전쟁이 남긴 국내 정치적 후폭풍(헤그세스 탄핵 추진)이 동시에 나타났어. 경제 쪽에서는 엔비디아 스캔들이 시장 전체를 끌어내리지 못할 만큼 '과매도 되돌림' 심리가 강했지만, 그 스캔들의 당사자만큼은 따로 벌을 받았고, 콴타스는 백오피스를 통째로 해외로 넘기는 선택을 했어. 한국에서는 삼성·현대차가 반도체·배터리 다음 성장축으로 로봇·피지컬AI를 가리켰는데, 공교롭게도 미국에서는 휴머노이드 로봇 기업이 벌써 증시에 상장하며 그 흐름을 증명하고 있었어. 그리고 일본에서는 지정학적 갈등이 어느 날 갑자기 기업의 핵심 자산을 통째로 빼앗아갈 수 있다는 걸 JT 사례가 보여준 하루였어."
};

if(BRIEFING.industry){ const ind=BRIEFING.industry; const indRows=[["밸류체인",ind.valueChain],["비즈니스모델",ind.bm],["경쟁력 요소",ind.ksf],["최대 이슈",ind.issue]].map(([lab,val])=>fieldRow(lab,esc(val))).join(""); html += `<section class="block" id="industry"><div class="shead"><span class="no">🏭</span><h2>오늘의 산업 소개</h2><span class="slug">Industry</span></div><div class="industrycard"><span class="ik">🏭 오늘의 산업 소개</span><div class="iname">${esc(ind.name||"")}</div><div class="ifields">${indRows}</div></div></section>`; }
if(BRIEFING.bcg && BRIEFING.bcg.length){ const bcgItems=BRIEFING.bcg.map(b=>`<div class="bcgitem"><div class="btitle">${esc(b.titleKo)}</div><div class="borig">${esc(b.title)}</div><p class="bsum">${esc(b.summary)}</p><div class="bsw"><b>So What</b> — ${esc(b.soWhat)}</div><a class="blink" href="${esc(b.url)}" target="_blank" rel="noopener">원문 보기 ↗</a></div>`).join(""); html += `<section class="block" id="bcg"><div class="shead"><span class="no">📘</span><h2>BCG 인사이트</h2><span class="slug">BCG Publications</span></div>${bcgItems}</section>`; }
if(BRIEFING.hkmarket){ const hk=BRIEFING.hkmarket; const hkTopics=(hk.topics||[]).map(t=>`<div class="hktopic"><div class="httl">${esc(t.topic)}</div><div class="hdet">${esc(t.detail)}</div></div>`).join(""); html += `<section class="block" id="hkmarket"><div class="shead"><span class="no">📺</span><h2>한경코리아마켓</h2><span class="slug">YouTube Morning Brief</span></div><div class="hkmeta">${esc(hk.broadcastLabel||"")} · <a href="${esc(hk.videoUrl||"")}" target="_blank" rel="noopener">${esc(hk.videoTitle||"원본 방송 보기")} ↗</a></div>${hkTopics}</section>`; }
$("#main").innerHTML = html;
$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: BBC · ABC · 조선비즈(산업) · TechCrunch · ZDNet · Gizmodo · 일본 주요 경제매체 · BCG · 한경코리아마켓(유튜브) — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장.<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

  "story": "오늘 세계 뉴스는 좀 묵직한 이야기야. ABC 뉴스(호주)가 위성사진이랑 정부 문서를 다 뒤져서 분석해봤는데, 2023년 10월 7일 하마스가 이스라엘을 공격한 뒤로 이스라엘이 가자지구·레바논·시리아·서안지구에서 새로 차지한 땅을 다 합치면 2490제곱킬로미터나 된대. 이게 어느 정도 크기냐면 서울시 면적(605제곱킬로미터)의 4배가 넘는 땅이야. 가자지구에는 '옐로우 라인'이라는 선을 그어놓고 이 선을 넘는 팔레스타인 주민 200만명한테 '넘으면 총에 맞을 수 있다'고 경고하고 있고, 레바논 남부엔 검문소를 세우고 이스라엘 국기까지 꽂았고, 시리아에는 폭 5미터짜리 참호(땅을 길게 파놓은 도랑)를 파놨대. 이스라엘은 전부 '안보 때문'이라고 하는데, 문제는 이게 남의 나라(레바논·시리아) 국경 안쪽까지 들어간 조치라는 거야. 평화협상 테이블에서 뭐라고 말하든, 실제 땅 위에 그어진 선이 훨씬 힘이 세다는 걸 보여주는 사례지.\n\n비슷한 패턴이 우크라이나 전쟁에서도 또 나왔어. 미국 특사 스티브 위트코프가 러시아 상트페테르부르크까지 가서 푸틴 대통령을 만났는데, 크렘린궁은 '11월 10일 이후에 미국·러시아·우크라이나 3자 협상을 다시 열기로 원칙적으로 합의했다'고 발표했어. 러시아는 선물처럼 4년째 갇혀있던 미국인 한 명도 풀어줬고, 위트코프는 심지어 푸틴을 '인도주의자'라고 칭찬했어. 그런데 딱 몇 시간 뒤에, 러시아는 우크라이나 수도 키이우에 '집속탄(하나의 폭탄 안에 작은 폭탄 여러 개가 들어있어서 넓은 범위에 흩어져 터지는 무기)'을 실은 탄도미사일 3발을 쐈어. 종교시설이랑 집, 가게, 카페까지 다 부서졌고 최소 1~2명이 죽고 24명 넘게 다쳤어. 젤렌스키 대통령은 '무기랑 표적을 고른 게 다 의도적이었다'면서 러시아 입장은 전혀 안 바뀌었다고 비판했지. 평화 얘기랑 공격이 같은 날 동시에 벌어진 거야.\n\n경제 쪽은 'AI에 돈을 너무 많이 쓰는 거 아니냐'는 걱정이 전 세계로 퍼진 하루였어. 미국 빅테크 메타(옛 페이스북)가 3분기에 매출 646억달러(전년보다 26% 늘어난 수치)를 벌어서 예상보다 잘했는데도 주가가 7%나 떨어졌어. 왜냐면 메타가 '올해 AI에 쓸 돈을 1350억~1450억달러까지 늘리겠다'고 밝히면서, 창업자 저커버그의 투표권은 지키면서 돈만 더 끌어올 수 있는 특수한 주식(무의결권 주식)을 새로 찍어내겠다고 했거든. 그 결과 3분기에 회사에 실제로 들어온 현금(자유현금흐름)이 마이너스 21억달러까지 떨어졌는데, 투자자들은 '매출은 늘었는데 돈은 더 까먹고 있네'라고 느낀 거야. 이 충격으로 나스닥이 2.6% 떨어지면서 6월 이후 최악의 하루를 보냈고, 반도체 장비회사 램리서치가 '공급이 부족하다'는 안내를 내놓자 반도체 회사들을 모아놓은 지수(필라델피아반도체지수)가 6.7%나 폭락했어. 게다가 호주의 웨스트팩 은행, 영국의 바클리스 은행까지 수천 명씩 감원을 발표하면서, AI에는 돈을 쏟아붓고 사람은 줄이는 흐름이 전 세계 금융권에서 동시에 벌어지고 있다는 게 드러났어.\n\n한국도 이 충격을 그대로 맞았어. 코스피가 전날(21일) 3.29% 올랐던 걸 하루 만에 다 토해내면서 3.52% 급락했고, 코스닥도 3.62% 떨어졌어. 반도체 대형주인 삼성전자(-4.03%)랑 SK하이닉스(-5.49%)가 특히 많이 빠졌는데, 이 두 회사가 코스피 전체 시가총액의 거의 절반(47%)을 차지하다 보니 지수 전체를 끌어내린 거야. 그런데 바로 이런 불안한 날, 이재용 삼성전자 회장은 전혀 다른 행보를 보였어. 다음 주쯔음 서울에 있는 삼성의 로봇 전담 조직('RX사업추진실')을 직접 찾아가서, 사람처럼 손가락을 움직여 물건을 집는 휴머노이드 로봇 기술을 직접 참관할 예정이래. 내년 1월 CES 2027에서 공개할 로봇 기술을 미리 점검하려는 거지. 또 다른 한국 뉴스는 삼성바이오로직스 이야기인데, 이 회사는 3분기에 매출 1조4903억원, 영업이익 6401억원을 벌어서 둘 다 분기 역대 최고 기록을 새로 썼어. 영업이익은 증권가 예상보다 5.1% 더 잘 나왔고, 회사는 올해 매출 성장률 전망을 '15~20%'에서 '20%'로 더 높여 잡았어. 공장을 계속 늘리는데도 돈을 잘 버는 이유는, 이 회사가 이미 글로벌 제약사들로부터 확정된 생산 주문을 받아놓고 공장을 짓기 때문이야.\n\n테크 쪽에서는 중국 AI 스타트업 딥시크 얘기가 눈에 띄어. 미국 정부가 '보안이 걱정된다'면서 연방 기관들한테 딥시크의 AI 기술을 전부 치우라고 지시한 지 딱 이틀 만에, 딥시크는 오히려 약 150억달러(약 21조원)에 달하는 대규모 투자를 유치했다는 소식이 나왔어. 투자에 참여한 걸로 알려진 곳 중엔 배터리 회사 CATL, 메신저 회사 텐센트도 있어. 미국이 '못 쓰게' 막으니까, 중국 자본이 오히려 자기 나라 안에서 딥시크를 더 세게 밀어준 거야. 오늘 다른 뉴스에서 본 메타처럼 '빚내서 AI에 투자하다가 의심받는' 상황과는 정반대로, 딥시크는 규제 압박이 제일 센 순간에 자국 투자를 더 많이 받은 셈이지.\n\n일본 얘기는 소프트뱅크그룹의 추락이야. 소프트뱅크 주가가 이날 6.9% 떨어지면서, 지난 6월 2일 찍었던 최고가에 비해 회사 전체 가치(시가총액)가 정확히 반토막 났어. 소프트뱅크는 챗GPT를 만든 오픈AI에 646억달러(약 92조원)를 투자해서 지분 13%를 갖고 있는데, 한 달 전까지만 해도 이 투자는 자랑거리였어. 그런데 지난달 말 '오픈AI의 실제 매출이 투자자들이 믿던 700억달러가 아니라 500억달러밖에 안 된다'는 보도가 나오면서, 이 투자가 갑자기 '한 군데에 돈을 너무 몰아넣은 위험한 베팅'으로 다시 읽히기 시작한 거야. 소프트뱅크는 AI 전략 자금을 마련하려고 사상 최대 규모(110억달러)의 고금리 채권까지 발행했는데, 이 채권 수익률이 연초 5.069%에서 6.34%까지 뛰었다는 건 투자자들이 소프트뱅크한테 돈 빌려주는 걸 더 불안해하고 있다는 신호야.\n\n오늘 하루를 정리하면, 세계에서는 이스라엘의 영토 확장과 러시아-우크라이나의 '평화 합의 vs 집속탄 공격'이 동시에 벌어지면서 '협상 테이블의 말'과 '실제 현장의 행동'이 다를 수 있다는 교훈을 또 보여줬고, 경제에서는 메타의 AI 투자 확대 발표가 오히려 전 세계 증시를 흔들며 나스닥·반도체주·은행권까지 동시에 들썩이게 했어. 한국은 코스피·코스닥이 동반 급락하는 와중에도 이재용 회장이 로봇 사업을 직접 챙기고 삼성바이오로직스가 역대 최대 실적을 냈다는 상반된 소식이 함께 나왔고, 테크에서는 미국의 규제를 받는 딥시크가 오히려 중국 자본으로부터 대규모 투자를 받으며 다른 길을 걸었어. 일본은 소프트뱅크가 오픈AI라는 하나의 베팅에 쏠린 탓에 시가총액이 반토막 나면서, 오늘 전 세계를 관통한 질문 — 'AI에 쏟아부은 돈이 정말 수익으로 돌아올까' — 를 가장 극적으로 보여준 하루였어."
};

if(BRIEFING.story){ const storyParas = BRIEFING.story.split(/\n+/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join(""); $("#story").innerHTML = `<span class="sk">📖 오늘의 이야기</span>${storyParas}`; } else { $("#story").style.display="none"; }
const navItems = [...BRIEFING.sections.map(s=>({id:s.id,no:s.no,title:s.title})), ...(BRIEFING.industry ? [{id:"industry",no:"🏭",title:"산업"}] : []), ...(BRIEFING.bcg && BRIEFING.bcg.length ? [{id:"bcg",no:"📘",title:"BCG"}] : []), ...(BRIEFING.hkmarket ? [{id:"hkmarket",no:"📺",title:"한경마켓"}] : [])];

function srcHtml(s){ if(!s) return ""; const link = s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">원문(${esc(s.date)})↗</a>` : (s.date?` · ${esc(s.date)}`:""); return `<span class="item__src">${esc(s.name)}${link}</span>`; }
function fieldRow(lab,val,cls){return val?`<div class="field ${cls||""}"><span class="lab">${lab}</span><span class="val">${val}</span></div>`:""}
function termsRow(terms){ if(!terms||!terms.length) return ""; return `<div class="terms"><div class="th">📖 용어 풀이</div>${terms.map(t=>`<div class="t"><b>${esc(t.t)}</b> — ${esc(t.d)}</div>`).join("")}</div>`; }

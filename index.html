  "story": "오늘 이야기는 쿠웨이트에서 시작할게. ABC뉴스에 따르면 11월26일(목) 쿠웨이트의 방공 감시시설이 이란제로 추정되는 드론 공격을 받았는데, 이 시설을 정비하던 이탈리아 방산업체 라인메탈 소속 기술자 2명이 숨졌어. 이탈리아 외교장관 타야니는 두 사람이 쿠웨이트의 '스카이가드' 방공체계 탐지 안테나를 손보던 36세·65세 기술자였다고 밝혔어. 이란은 '위장작전'이라며 책임을 전면 부인했는데, 사실 이 전쟁은 지난 2월28일 미국과 이스라엘이 이란을 기습 타격하면서 시작된 거라 벌써 9개월째야. 쿠웨이트는 이 전쟁의 당사국도 아닌데 미군·동맹군이 주둔한다는 이유만으로 올해 벌써 네 번째 공격을 받았고, 이번이 처음으로 유럽인이 목숨을 잃은 사례래. 이 전쟁이 어떻게 9개월을 끌어왔는지는 오늘의 따라잡기에서 자세히 다뤘어.\n\n미국 쪽에서는 또 다른 종류의 '전쟁'이 벌어졌어. ABC뉴스는 트럼프 행정부가 중국·EU·한국·일본 등 14개 나라에 '초과생산능력'을 이유로 새 관세를 매기겠다고 제안했다고 전했어. 중국엔 기존 관세에 20%포인트를 더 얹고 협상이 깨지면 최고 40%까지 올릴 수 있다고 했고, 한국·일본·EU는 15% 수준이래. 재밌는 건 이번 조치가 올해 2월 미국 최고법원이 트럼프의 '비상대권' 관세를 무효화한 뒤 줄어든 관세 수입을 메우려고 다른 법적 근거(무역법 301조)를 찾아 쓴 거라는 점이야. 법원이 한 가지 길을 막아도 행정부가 다른 길을 찾아낸 셈이지.\n\n한국에서도 '좋은 뉴스'가 오히려 부담으로 돌아오는 일이 있었어. 한국은행이 11월26일 기준금리를 3.00%에서 3.25%로 올렸는데, 이투데이에 따르면 반도체 수출 호황으로 경기가 너무 잘 돌아가서 물가가 걱정될 정도라는 게 이유였대. 한은은 아예 내년 성장률 전망을 2.9%에서 4.1%로 확 올려 잡았어. 그런데 코스피는 이 소식에 장중 2%대였던 상승폭을 0.29%까지 줄이며 마감했어 — 좋은 성장 전망도 '금리가 더 오를 수 있다'는 걱정 앞에서는 힘을 못 쓴 거야. 같은 날 국세청은 올해 주택 종부세를 72만6000명에게 고지했다고 밝혔는데, 파이낸셜뉴스에 따르면 이는 1년 전보다 34.5%나 늘어난 숫자래. 특히 1주택자는 대상자가 53% 늘었는데 세금은 118%나 뛰었어 — 세율이 바뀐 게 아니라 집값(공시가격)이 많이 올라서 그런 거라고 정부는 설명했어.\n\n테크 쪽에서는 엔비디아가 동남아 4개국(말레이시아·싱가포르·태국·인도네시아)向 서버 선적을 잠정 중단시켰어. 테크크런치에 따르면 중국 기업들이 이 나라들의 데이터센터를 거쳐 엔비디아 칩에 '원격으로' 접근해온 우회로가 들통나자, 미국 정부가 이 경로 전체에 수출 허가 의무를 씌운 거야. 선적을 다시 하려면 협력사들이 최종 구매자와 설치 장소까지 문서로 입증해야 할 수 있다니, 동남아에 데이터센터를 짓던 기업들 입장에서는 사업계획 자체가 당분간 안갯속에 빠진 셈이지.\n\n마지막은 일본 얘기야. 닛케이아시아에 따르면 일본담배산업(JT)이 러시아 정부에 러시아 내 생산법인 7곳을 몰수당하면서 그룹 이익의 4분의 1을 차지하던 사업을 한순간에 잃었어. JT는 1조3770억엔(약 87억달러) 손실을 반영해서 연간 배당도 주당 234엔에서 204엔으로 깎았고, 주가는 최근 2주 사이 30% 넘게 빠졌어. 고배당주로 인기 많던 종목이 정치적 결정 하나로 배당까지 줄여야 하는 처지가 된 거야. 회사는 이 러시아 사업을 앞으로 재무제표에서 아예 빼기로 했는데, 이걸 일본어로 '렌케츠조가이(連結除外)'라고 불러.\n\n오늘 하루를 정리하면, 쿠웨이트의 드론 공격부터 미국의 관세, 한국의 금리와 세금, 동남아 수출통제, 일본 기업의 자산 몰수까지 — 공통적으로 '당사자가 아닌 제3자'가 더 크게 흔들린 하루였어. 전쟁 당사국이 아닌 쿠웨이트가 공격받고, 관세를 매긴 미국이 아니라 한국·일본 같은 동맹국까지 영향권에 들고, 중국을 겨냥한 규제인데 동남아 기업들의 사업계획이 흔들리고, 러시아와 직접 상관없는 JT 주주들이 배당 삭감을 감수해야 했으니까. 어느 결정이든 그 영향이 결정 당사자보다 옆에 있는 제3자에게 더 크게 번질 수 있다는 걸 보여준 하루였어."

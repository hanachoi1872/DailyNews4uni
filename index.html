      "soWhat": "한국이 '선도국' 그룹에 들어갔다는 소식은 오늘 한국 뉴스에서 다룬 반도체 수출 호황과도 맞닿아 있는데, 이 보고서가 주는 진짜 메시지는 '야망'만으론 등급이 오르지 않고 실제 실행력이 있어야 한다는 거예요 — 오늘 일본 뉴스에서 본 니데크의 거버넌스 위기처럼, AI 경쟁력을 평가할 때도 결국 '실행을 뒷받침할 신뢰할 수 있는 조직 역량'이 있는지가 핵심 질문이라는 걸 보여줘요."

  "story": "오늘은 아프리카에서 들려온 안 좋은 소식부터 시작해야 할 것 같아. 콩고민주공화국에서 지난 5월부터 퍼진 에볼라 바이러스가 누적 확진자 1만 명을 넘었는데, 이건 역사상 두 번째로 큰 규모의 에볼라 유행이야. 사망자도 벌써 5000명에 가까운데, 2014~2016년 서아프리카에서 2만8600명이 감염됐던 최악의 대유행 다음으로 심각한 수준이라는 거지. 더 무서운 건 치료제랑 백신이 이미 있는데도 못 막고 있다는 점인데, 국제구조위원회는 지금 확산 속도가 방역 속도보다 더 빠르다고 경고했어. 심지어 방역하던 간호사가 공격받아 목숨을 잃는 일까지 벌어졌고, 미국은 이 지역을 거쳐 들어오는 비행기 승객한테 '에볼라 노출 확인서'에 서명하라는 규정까지 새로 만들었어 — 서명 안 하면 비행기도 못 타게 된 거야.\n\n경제 쪽에서는 미국 연준이 금리를 동결했는데, 그 뒷얘기가 더 재밌어. 연준은 기준금리를 3.75~4.00%로 그대로 두기로 했는데, 투표가 10대 2로 쪼개졌어 — 이사 2명(리사 쿡, 베스 해맥)은 '그래도 더 올려야 한다'고 반대표를 던진 거야. 바로 한 달 전(9월)에는 3년 2개월 만에 처음으로 금리를 올렸었는데, 이번엔 일단 쉬어가기로 한 거지. 근데 시장은 오히려 더 긴장하고 있어. 호주 커먼웰스은행 애널리스트는 12월에 또 한 번, 그리고 내년 3월에 한 번 더 올려서 금리가 4.25~4.50%까지 갈 수 있다고 내다봤거든. 불과 몇 달 전까지는 다들 '금리 내릴 때 됐다'고 얘기했는데, 지금은 완전히 반대로 '더 오를까 봐' 걱정하는 분위기로 바뀐 거야.\n\n한국 경제는 오늘 진짜 '반전'이 있었어. 한국은행이 발표한 3분기 GDP 성장률이 전 분기보다 1.0% 늘었는데, 이게 지난 8월 한국은행이 예상했던 0.3%의 세 배가 넘는 숫자야. 1분기 1.8%, 2분기 0.6%에 이어 세 분기 연속 플러스 성장이고, 이 추세면 올해 연간 성장률이 3.6%, 잘하면 4%까지 갈 수도 있대. 이 성장을 이끈 건 반도체 수출이랑 기업들의 설비투자였는데, 재밌는 건 정작 우리가 쓰는 돈(민간소비)은 오히려 0.2% 줄어서 4년 반 만에 가장 낮은 수준이었다는 거야. 그러니까 나라 전체 숫자는 역대급으로 좋아졌는데, 개인이 느끼는 지갑 사정은 오히려 더 안 좋아진 셈이지. 대신 우리가 해외에서 벌어들이는 실질 소득(GDI)은 1년 전보다 18.8%나 늘어서 48년 9개월 만에 최고치를 찍었는데, 이건 반도체를 비싸게 잘 팔았다는 뜻이야.\n\n비슷한 맥락에서 HD현대일렉트릭이라는 회사 얘기도 짚고 넘어가야 해. 이 회사는 변압기 같은 전력기기를 만드는데, 3분기 매출이 1조1799억원으로 역대 최대를 찍었어 — 1년 전보다 18.5% 늘어난 거야. 왜 이렇게 잘 팔렸냐면, AI 데이터센터가 전국·전세계에서 쏙쏙 지어지면서 그 안에 전기를 끌어다 줄 변압기가 품절 대란이 났거든. 업계에서는 이걸 '변압기 뉴노멀'이라고 부를 정도야. 이 회사는 이미 글로벌 빅테크랑 1조1212억원짜리 장기 공급계약까지 맺어놨고, 앞으로 들어올 일감(수주잔고)도 88억4300만달러나 쌓여 있어서, 아예 '이 돈 안 되는 주문은 안 받겠다'고 할 수 있을 정도로 입장이 세졌어. 그래서 청주에 있는 공장에 1980억원을 더 투자해서 생산량을 늘리기로 했대.\n\n테크 쪽에서는 구글이 큰 변화를 예고했어. 구글이 'Connected Apps 플랫폼'이라는 걸 새로 내놨는데, 쉽게 말하면 다른 회사들이 자기 서비스(앱)를 구글의 AI 챗봇인 Gemini랑 검색에 직접 연결할 수 있게 해주는 통로야. 지금은 미국 개발자들만 신청받는 '초대받은 사람만 들어가는' 단계인데, 벌써 어도비·익스페리안 등 50개 넘는 앱이 연결돼 있어. 전문가들은 이걸 예전의 'SEO(검색엔진최적화)'에 비유하는데, 그땐 구글 검색 1페이지에 뜨려고 기업들이 애썼잖아? 이제는 'AI 에이전트'한테 선택받으려고 애써야 하는 시대가 열린다는 거야. 안 그러면 소비자들이 AI한테 '이거 해줘'라고 시킬 때, 그 AI 눈에 아예 안 보이는 투명인간이 될 수도 있는 거지.\n\n마지막으로 일본에서는 좀 심각한 회계 이슈가 있었어. 일본 모터 제조업체 니데크가 또 한 번 '감사의견'을 제때 못 받았거든. 감사의견이라는 건 회계사가 '이 회사 재무제표, 믿을 만하다'고 도장 찍어주는 건데, 니데크 감사를 맡은 PwC재팬이 '시간 안에 못 끝내겠다'고 통보한 거야. 사실 작년(2025년)에도 비슷한 일이 있어서 도쿄증시가 니데크를 '특별 유의 종목'으로 지정하고 1년의 유예기간을 줬는데, 그 유예기간이 끝나는 날(10월 28일)에 또 못 받은 거지. 이러면 이제 도쿄증시가 '이 회사 상장 계속 유지해도 되나'를 심사하게 돼. 작년엔 이탈리아·중국 자회사 문제였는데, 이번엔 허가 안 받은 설계·소재 변경이랑 생산지를 속인 문제가 걸렸어. 회사는 심지어 창업자였던 나가모리 시게노부 전 회장 등 전직 경영진 9명한테 손해배상 소송까지 걸기로 했을 정도야. 이 소식에 니데크 주가는 한때 7.7%나 떨어졌어.\n\n우크라이나 쪽도 계속 지켜볼 소식이 있었어. 지난주 러시아·우크라이나가 11월 상반기 중 아부다비에서 3자 협상을 다시 하기로 합의했다고 했었잖아? 그런데 이번 주엔 그 '정확한 날짜'를 두고 다들 다른 말을 했어. 젤렌스키 대통령은 더선 인터뷰에서 11월 10일이라고 했고, 폴란드 총리 투스크는 11월 4일이라고 했는데, 바로 다음 날 크렘린궁은 '11월 4일 이후'라고 하고, 러시아 외교차관은 아예 '아직 준비 단계라 얘기하기도 이르다'고 선을 그었어. 날짜 하나도 이렇게 네 가지로 엇갈리는 걸 보면, 협상이 '재개하기로 합의했다'는 발표와 '실제로 날짜 잡고 만난다'는 건 완전히 다른 얘기라는 걸 알 수 있지. 참고로 지난주(10월 21일)에는 러시아가 4년 넘게 붙잡아뒀던 74세 미국인 은퇴 교사 스티븐 허바드를 풀어주기도 했는데, 이런 '선의의 제스처'가 있다고 해서 큰 틀의 종전 협상이 당장 빨라지는 건 아니라는 게 이번 주에 다시 확인된 셈이야.\n\n오늘 하루를 정리하면, 콩고민주공화국의 에볼라는 치료제가 있어도 못 막는 확산을 보여줬고, 미국 연준은 금리를 동결했지만 시장엔 '더 오를 수 있다'는 경계령을 내렸어. 한국은 그 불확실한 금리 환경 속에서도 반도체 수출 덕에 3분기 GDP가 깜짝 성장했지만 정작 소비는 줄어드는 엇박자를 보여줬고, HD현대일렉트릭 같은 전력기기 회사는 AI 데이터센터 붐을 타고 역대 최대 실적을 냈어. 테크에서는 구글이 AI 에이전트 시대의 새 판을 짜기 시작했고, 일본에서는 니데크가 회계 신뢰성 문제로 상장 유지 심사까지 받게 됐어. 그리고 우크라이나 종전협상은 '날짜' 하나도 합의 못 하는 혼선을 겪으면서, 절차가 진행 중이라는 사실과 실제로 해결됐다는 사실이 전혀 다르다는 걸 다시 한번 보여준 하루였어."
};

if(BRIEFING.bcg && BRIEFING.bcg.length){ const bcgItems=BRIEFING.bcg.map(b=>`<div class="bcgitem"><div class="btitle">${esc(b.titleKo)}</div><div class="borig">${esc(b.title)}</div><p class="bsum">${esc(b.summary)}</p><div class="bsw"><b>So What</b> — ${esc(b.soWhat)}</div><a class="blink" href="${esc(b.url)}" target="_blank" rel="noopener">원문 보기 ↗</a></div>`).join(""); html += `<section class="block" id="bcg"><div class="shead"><span class="no">📘</span><h2>BCG 인사이트</h2><span class="slug">BCG Publications</span></div>${bcgItems}</section>`; }
if(BRIEFING.hkmarket){ const hk=BRIEFING.hkmarket; const hkTopics=(hk.topics||[]).map(t=>`<div class="hktopic"><div class="httl">${esc(t.topic)}</div><div class="hdet">${esc(t.detail)}</div></div>`).join(""); html += `<section class="block" id="hkmarket"><div class="shead"><span class="no">📺</span><h2>한경코리아마켓</h2><span class="slug">YouTube Morning Brief</span></div><div class="hkmeta">${esc(hk.broadcastLabel||"")} · <a href="${esc(hk.videoUrl||"")}" target="_blank" rel="noopener">${esc(hk.videoTitle||"원본 방송 보기")} ↗</a></div>${hkTopics}</section>`; }
$("#main").innerHTML = html;
$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: BBC · ABC · 조선비즈(산업) · TechCrunch · ZDNet · Gizmodo · 일본 주요 경제매체 · BCG · 한경코리아마켓(유튜브) — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장.<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

  "story": "오늘은 미국에서 지난 11월 3~4일에 치러진 중간선거 이야기부터 시작해야 할 것 같아. 이번 선거에서 민주당이 상원이랑 하원을 둘 다 가져가는 압승을 거뒀는데, 재밌는 건 공화당이 왜 졌는지를 두고 부통령 밴스랑 트럼프 대통령 본인이 똑같이 '이란 전쟁' 때문이라고 인정했다는 거야. 트럼프는 폭스뉴스에서 '선거 결과의 일부는 이란 때문'이라면서, 전쟁 때문에 기름값이 올라간 게 유권자들을 돌아서게 했다고 말했어. 그동안 트럼프는 '중간선거 끝나면 이란을 다시 폭격할 수도 있다'는 말을 압박 카드로 계속 써왔는데, 정작 그 선거에서 전쟁이 패배 원인으로 찍히면서 이 카드가 오히려 자기 발등을 찍은 셈이 된 거지. ABC뉴스는 이번 결과로 트럼프를 대하는 세계 각국의 태도도 달라질 수 있다고 분석했는데, 특히 이 전쟁을 시작하게 만든 책임이 네타냐후 이스라엘 총리한테 있다는 지적도 미국·이스라엘 양쪽에서 나오고 있대.\n\n그런데 이 선거 결과가 하루 뒤엔 완전히 다른 방향에서 세계 경제를 흔들었어. 민주당이 의회를 장악하면 AI 데이터센터를 짓는 데 규제가 강해질 수 있다는 우려가 퍼지면서, 11월 5일 미국 나스닥지수가 5.52%나 떨어진 2만4315.00에 마감했고, 다우존스지수도 하루 만에 1833포인트(3.44%)나 빠진 5만1523.06으로 장을 마쳤어. 엔비디아는 9%대 급락했고, 필라델피아 반도체지수는 12%나 넘게 주저앉았어. 더 재밌는 건, 바로 전날(11월 4일)엔 트럼프가 '민주당이랑 잘 지낼 수 있을 것 같다'는 신호를 보내서 다우가 3%나 오르는 반등 장세였다는 거야. 그러니까 시장은 하루는 '괜찮을 것 같다'며 올랐다가, 바로 다음 날엔 '아니, 역시 규제가 심해질 것 같다'면서 그 반등분을 싹 다 되돌려버린 거지. 롤러코스터도 이런 롤러코스터가 없어.\n\n이 충격이 한국 증시로 넘어오는 데는 하룻밤도 안 걸렸어. 11월 6일 오늘, 코스피는 개장하자마자 폭락하기 시작해서 개장 3분 33초 만인 오전 9시 3분 33초에 전 거래일보다 8.52% 떨어진 4924.61을 찍으면서 '서킷브레이커'(너무 급하게 떨어지면 20분간 거래를 강제로 멈추는 제도)가 발동됐어. 장중엔 4911선까지 밀리면서 5000선이 완전히 무너졌고, 코스닥에서도 '매도 사이드카'(프로그램 매도 주문을 잠깐 묶어두는 장치)가 함께 걸렸어. 올해 들어 코스피 서킷브레이커가 발동된 게 이번이 벌써 10번째래. 삼성전자가 7.57%, SK하이닉스가 9.46% 급락하면서 지수를 끌어내렸는데, 결국 어제 미국에서 반도체·AI주가 팔린 충격이 반도체 비중이 큰 한국 증시에 거의 실시간으로 옮겨온 거야.\n\n이렇게 시장이 '검은 금요일'을 맞자 정부도 바로 움직였어. 이형일 경제부총리가 오늘 정부서울청사에서 열린 대외경제장관회의를 주재하면서, 국내 증시가 펀더멘털(기업의 실제 실력)에 비해 과하게 반응하지 않도록 필요한 조치를 미리 준비해서 적절한 때 시행하겠다고 밝혔어. 아직 구체적으로 뭘 하겠다는 발표는 없었지만, 시장에서는 과거 위기 때(2008년 금융위기, 2011년 유럽 재정위기, 2020년 코로나 때) 썼던 '증시안정펀드' 가동이나 '공매도 금지' 카드가 다시 나올지 주목하고 있어. 증권가에서는 이런 발표가 실제로 돈을 많이 풀어서 효과를 내기보다는, '정부가 시장을 그냥 내버려두지 않는다'는 신호를 주는 역할이 더 크다고 보고 있대.\n\n이 모든 소동의 뿌리를 따라가 보면 테크 쪽에서 재미있는 이야기가 나와. 테크크런치는 이번 중간선거에서 '데이터센터'(AI 서버들을 모아놓은 거대한 건물) 반대 여론이 실제 정치 세력으로 떠올랐다고 짚었어. 메타가 오하이오주에 약 6만5000제곱미터(축구장 9개 넘는 크기) 규모의 데이터센터를 지으려고 했는데, 그 지역 카운티가 건설을 금지하는 조례를 통과시켜버렸대. 텍사스, 조지아처럼 데이터센터가 몰린 주에서도 급속한 확장에 반대한 후보들이 이번 선거에서 당선됐고, 실제로 11월 5일엔 메타가 '23개 주에 걸친 데이터센터 확장 계획이 더 어려워질 수 있다'고 공개적으로 걱정을 드러냈어. 한마디로, AI 인프라 경쟁의 다음 장벽은 기술이나 돈이 아니라 '동네 주민들의 표'가 될 수도 있다는 거지.\n\n일본 증시도 이 소용돌이에서 벗어나지 못했어. 닛케이225지수는 장 초반엔 400포인트(0.7%) 넘게 오르며 기분 좋게 출발했다가, 금세 방향을 바꿔서 1%대 하락으로 마감했어(61,077.90). 메모리 반도체를 만드는 키오시아 주가는 9% 떨어졌고, 소프트뱅크그룹은 6.9%, 반도체 장비회사 도쿄일렉트론은 9.5%나 급락했어. SK하이닉스는 이런 변동성 때문에 미국 법인 기업공개(IPO) 계획까지 철회했다고 니케이아시아는 전했어. 결국 일본과 한국 모두 자기 나라 기업의 실적이 아니라, 미국 의회가 어느 당 손에 들어갔는지 하나로 증시 전체가 출렁인 셈이야.\n\n오늘 하루를 정리하면, 미국에서는 중간선거 패배를 두고 이란 전쟁 책임론이 불거지면서 트럼프를 보는 세계의 시선이 달라질 수 있다는 분석이 나왔고, 그 선거 결과가 하루 만에 'AI 데이터센터 규제 강화' 공포로 번지며 나스닥과 다우를 동반 폭락시켰어. 이 충격은 반도체 비중이 큰 한국과 일본 증시로 번져서 코스피는 서킷브레이커까지 발동되며 5000선이 무너졌고, 정부는 증시안정펀드 같은 카드를 만지작거리기 시작했어. 그리고 이 모든 소동의 근본 원인을 들여다보면, 결국 '데이터센터를 어디에, 얼마나 지을 수 있는가'를 둘러싼 동네 주민들의 표 하나가 전 세계 증시를 흔드는 변수가 됐다는 걸 알 수 있어."
};

if(BRIEFING.industry){ const ind=BRIEFING.industry; const indRows=[["밸류체인",ind.valueChain],["비즈니스모델",ind.bm],["경쟁력 요소",ind.ksf],["최대 이슈",ind.issue]].map(([lab,val])=>fieldRow(lab,esc(val))).join(""); html += `<section class="block" id="industry"><div class="shead"><span class="no">🏭</span><h2>오늘의 산업 소개</h2><span class="slug">Industry</span></div><div class="industrycard"><span class="ik">🏭 오늘의 산업 소개</span><div class="iname">${esc(ind.name||"")}</div><div class="ifields">${indRows}</div></div></section>`; }
if(BRIEFING.bcg && BRIEFING.bcg.length){ const bcgItems=BRIEFING.bcg.map(b=>`<div class="bcgitem"><div class="btitle">${esc(b.titleKo)}</div><div class="borig">${esc(b.title)}</div><p class="bsum">${esc(b.summary)}</p><div class="bsw"><b>So What</b> — ${esc(b.soWhat)}</div><a class="blink" href="${esc(b.url)}" target="_blank" rel="noopener">원문 보기 ↗</a></div>`).join(""); html += `<section class="block" id="bcg"><div class="shead"><span class="no">📘</span><h2>BCG 인사이트</h2><span class="slug">BCG Publications</span></div>${bcgItems}</section>`; }
if(BRIEFING.hkmarket){ const hk=BRIEFING.hkmarket; const hkTopics=(hk.topics||[]).map(t=>`<div class="hktopic"><div class="httl">${esc(t.topic)}</div><div class="hdet">${esc(t.detail)}</div></div>`).join(""); html += `<section class="block" id="hkmarket"><div class="shead"><span class="no">📺</span><h2>한경코리아마켓</h2><span class="slug">YouTube Morning Brief</span></div><div class="hkmeta">${esc(hk.broadcastLabel||"")} · <a href="${esc(hk.videoUrl||"")}" target="_blank" rel="noopener">${esc(hk.videoTitle||"원본 방송 보기")} ↗</a></div>${hkTopics}</section>`; }
$("#main").innerHTML = html;
$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: BBC · ABC · 조선비즈(산업) · TechCrunch · ZDNet · Gizmodo · 일본 주요 경제매체 · BCG · 한경코리아마켓(유튜브) — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장.<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

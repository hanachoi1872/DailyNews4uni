    {"id":"world","no":"01","title":"세계","slug":"World","items":[{"tag":"중동 안보","title":"이란의 호르무즈 실사격 훈련, 3.2km 선박 항로에 충돌 위험을 더하다","source":{"name":"ABC News","url":"https://abcnews.go.com/International/wireStory/strait-hormuz-iran-plans-military-drill-tensions-high-129729064","date":"2026.01.31"},"f1":"이란은 2026년 2월 1~2일 호르무즈 해협에서 실사격 군사훈련을 하겠다고 선박들에 알렸어요. 통보 좌표에는 선박이 페르시아만을 드나드는 폭 3.2km의 두 갈래 통항분리수역 일부가 포함될 수 있었어요. 미군 중부사령부는 상업선과 미군·동맹군 가까이에서 안전하지 않은 행동을 하면 충돌과 확전 위험이 커진다고 경고했어요. 이 해협은 전 세계 거래 원유의 약 5분의 1이 지나고 대부분이 아시아로 향하는 핵심 길목이에요.","f2":"이란은 좁은 해협의 북쪽 연안을 끼고 있어 대규모 함대가 없어도 미사일·드론·기뢰·고속정으로 통항 비용을 올릴 수 있어요. 완전히 봉쇄하지 않더라도 훈련 통보와 선박 검문만으로 선사는 운항을 미루고 보험사는 전쟁위험 할증료를 높여요. 미국은 항행의 자유를 지키려 하지만 군함을 더 가까이 배치할수록 작은 오판이 직접 충돌로 번질 가능성도 커져요. 그래서 호르무즈는 군사력의 크기보다 좁은 지리와 위험 인식이 협상력을 만드는 곳이에요.","f3":"한국과 일본 기업은 ‘해협이 열렸는가’라는 이분법 대신 정상 통항, 제한 통항, 사실상 봉쇄 세 경우를 따로 계산해야 해요. 각 경우에 유가, LNG 도착 지연일수, 전쟁보험료, 대체항로 능력을 넣으면 발전·화학·항공 원가가 보여요. 특히 재고를 너무 많이 쌓으면 현금이 묶이고 너무 적게 두면 공장이 멈추므로 위험 확률과 재고일수를 함께 최적화해야 해요. 외교 발표 뒤 실제 선박 수와 보험료가 내려가는지를 확인하는 것이 가장 현실적인 조기경보예요."}]},
    {"id":"econ","no":"02","title":"글로벌 경제·시장","slug":"Economy","items":[{"tag":"미국 성장","title":"미국 3분기 성장률 4.4%…강한 소비와 ‘고용 없는 성장’이 동시에 나타나다","source":{"name":"ABC News","url":"https://abcnews.go.com/Business/wireStory/consumer-spending-pushes-us-economy-44-quarter-fastest-129451535","date":"2026.01.22"},"f1":"미국의 2025년 3분기 실질 GDP는 연율 4.4% 성장해 2년 만에 가장 빠른 속도를 기록했고, 기존 4.3% 추정치보다 0.1%포인트 높아졌어요. 2분기 성장률 3.8%보다도 빨라졌으며 가계 소비가 성장을 가장 크게 밀었어요. 주택을 제외한 기업투자는 AI 설비 투자에 힘입어 연율 3.2% 늘었어요. 그런데 실업률은 4.4%로 낮았지만 기업이 채용도 해고도 꺼리는 ‘노하이어·노파이어’ 고용시장이 함께 나타났어요.","f2":"GDP는 생산과 지출의 총량이라 소비와 AI 데이터센터 건설이 늘면 고용이 크게 늘지 않아도 빠르게 성장할 수 있어요. 기업은 관세·금리·AI 생산성의 효과가 분명해질 때까지 새 직원을 뽑는 고정비를 피하고 기존 인력으로 수요를 맞추려 해요. 소비자는 일자리 불안이 커지기 전까지 임금과 저축으로 지출을 이어가 성장률을 떠받칠 수 있어요. 따라서 강한 GDP와 약한 신규채용은 모순이 아니라 성장의 원천이 사람에서 자본집약적 AI 투자로 이동한다는 신호일 수 있어요.","f3":"컨설턴트는 4.4%라는 평균을 산업별 매출 기회로 바로 쓰면 안 돼요. 소비재·여행은 가계지출, 클라우드·전력·건설은 AI 설비투자, 인력서비스는 신규채용이라는 서로 다른 선행지표를 봐야 해요. 금리가 오래 높게 유지되면 투자비 조달과 주택 수요가 약해질 수 있으므로 성장률과 현금흐름의 지속성도 구분해야 해요. 한국과 일본 기업에는 미국 수요가 튼튼하다는 기회와 현지 고용·설비의 회수기간을 더 엄격히 증명해야 한다는 부담이 동시에 생겨요."}]},
    {"id":"korea","no":"03","title":"한국 경제·시장","slug":"Korea","items":[
      {"tag":"부유식 데이터센터","title":"삼성중공업, 미국 M3와 ‘물 위 데이터센터’ 설계…2028년 가동 목표","source":{"name":"조선비즈","url":"https://n.news.naver.com/mnews/article/366/0001183061?sid=101","date":"2026.07.30"},"f1":"삼성중공업은 미국 데이터센터 개발사 무스테리안(M3)과 부유식 데이터센터(FDC) 엔지니어링 계약을 추진해 국내 조선사 최초로 개념설계를 실제 사업에 적용하려 해요. 첫 시설은 산업단지 인근 바지선에 서버·전력·냉각설비를 싣고 육상 전력을 받아 2028년 상반기 가동하는 것이 목표예요. 거제조선소 상선 독 일정을 조절하면 최대 2기를 만들 수 있어 별도 증설 없이 새 일감을 더할 수 있어요. M3는 휴스턴 500MW급 하이브리드 사업과 새너제이 권역 860MW급 FDC를 준비하고 있어 후속 시리즈 발주 가능성도 있어요.","f2":"육상 AI 데이터센터는 송전망·넓은 부지·냉각수·환경허가 중 하나만 늦어져도 전체 공사가 밀려요. FDC는 조선소에서 부유체와 설비를 동시에 제작하고 현장에서는 계류·전력 연결에 집중해 공기를 줄이는 모듈 방식이에요. 삼성중공업은 FLNG를 만들며 쌓은 열관리·화재방호·설비통합 능력을 서버 냉각과 안전에 옮길 수 있어요. 반면 염분·파도·부식, 해저케이블, 주민과 환경단체의 반대는 육상형과 다른 새 비용이에요.","f3":"사업성은 ‘물 위라 땅값이 싸다’만으로 판단하면 안 되고 MW당 총건설비, 인허가 기간, 가동률, 냉각전력, 유지보수 시간을 육상형과 비교해야 해요. 첫 50MW급 설비가 납기와 안정성을 증명하면 같은 설계를 반복해 조선소의 학습효과와 마진을 높일 수 있어요. 반대로 첫 시설에서 장애가 나면 고객 데이터 이전비용이 커 시리즈 수주가 멈출 수 있으므로 성능보증과 책임분담이 핵심 계약조건이에요. 조선업의 프로젝트 관리 역량이 AI 인프라 병목을 푸는 인접시장 진출 사례라는 점에서 좋은 성장전략 케이스예요."},
      {"tag":"물류 자동화","title":"롯데글로벌로지스, FRT로보틱스와 AI 웨어러블 로봇 공동개발","source":{"name":"조선비즈","url":"https://biz.chosun.com/industry/","date":"2026.07.30"},"f1":"롯데글로벌로지스는 7월 29일 FRT로보틱스와 AI 기반 웨어러블 로봇을 공동개발·상용화하는 업무협약을 맺었어요. 몸에 입는 외골격 장비가 물류센터 작업자의 허리와 다리를 받쳐 반복적인 들기·걷기 부담을 줄이는 방식이에요. 두 회사는 2026년 3월 정부의 AI 응용제품 신속 상용화 사업에도 함께 선정돼 현장 실증 기반을 마련했어요. 사람을 완전히 없애는 자동창고보다 기존 센터에 빠르게 적용할 수 있다는 점이 핵심이에요.","f2":"택배 물류는 성수기 물량이 크게 출렁이고 모양이 제각각인 상자를 다뤄 전 공정을 고정형 로봇으로 바꾸기 어려워요. 웨어러블 로봇은 사람이 판단과 손동작을 맡고 기계가 힘을 보태기 때문에 설비를 뜯어고치지 않고 생산성을 높일 수 있어요. AI가 보행·들기 자세와 힘의 방향을 읽어 필요한 순간에만 보조하면 배터리를 아끼고 자연스러운 움직임을 만들 수 있어요. 다만 무게와 착용시간, 여름철 열, 충전·세척, 사고 때 책임이 직원 수용성과 경제성을 좌우해요.","f3":"투자 판단은 시간당 처리상자 수만 보지 말고 근골격계 부상률, 결근일수, 이직률, 교육시간, 장비 가동률까지 포함해야 해요. 한 대의 가격과 유지비보다 줄어든 산업재해·대체인력 비용이 크면 자동화가 어려운 센터에서도 회수가 가능해요. 실증은 연령·체형·업무별로 나눠 무작위 비교하고, 보조를 많이 받은 날 이후 피로까지 재야 과장된 효과를 피할 수 있어요. 물류사의 승부는 가장 화려한 로봇이 아니라 작업자가 매일 자발적으로 착용할 만큼 가볍고 고장 때 즉시 교체할 수 있는 운영체계를 만드는 데 있어요."}
    ]},
    {"id":"tech","no":"04","title":"테크·AI","slug":"Tech & AI","items":[{"tag":"생성형 이미지","title":"Google Earth, AI 합성 기능 출시 하루 만에 철회…지도 신뢰가 제품 병목이 되다","source":{"name":"TechCrunch","url":"https://techcrunch.com/2026/07/31/google-nixes-its-earth-ai-feature-one-day-after-launch-amid-criticism-it-would-spread-misinformation/","date":"2026.07.31"},"f1":"Google은 Nano Banana 2 이미지 생성기를 Google Earth 안에서 써 실제 위성지도 위에 가짜 지형·건물·사건 이미지를 얹는 기능을 공개했어요. 창의적인 지리 실험을 위한 기능이었지만 기자와 연구자가 시각적 증거로 쓰는 지도에서 허위정보를 만들기 너무 쉽다는 비판이 즉시 나왔어요. 정책을 위반한 듯한 합성 화면이 공유되자 Google은 출시 하루 만에 기능을 되돌렸어요. 회사는 더 강한 가드레일을 만든 뒤 검토하겠다고 밝혔어요.","f2":"일반 이미지 생성기에서 만든 가짜 그림과 달리 Google Earth 화면은 좌표·위성사진·브랜드가 붙어 있어 보는 사람이 사실로 오해하기 쉬워요. 재난·전쟁·부동산 개발 사진을 합성하면 언론, 보험, 투자, 군사정보 판단까지 흔들 수 있어 피해가 커져요. 워터마크가 있어도 화면을 잘라 재유통하면 맥락이 사라지고, 탐지기는 새 모델이 나올 때마다 뒤처질 수 있어요. 그래서 이 제품은 생성 품질보다 진짜 지도와 창작 공간을 얼마나 분명히 분리하는지가 핵심 설계 문제였어요.","f3":"AI 제품은 사용량과 체류시간만 최적화하면 신뢰 자산을 잃을 수 있어요. 출시 전 레드팀은 ‘정책 위반 프롬프트’뿐 아니라 합성 결과가 뉴스·보험청구·토지분쟁에 재사용되는 경로까지 시험해야 해요. 기업 고객에게는 원본성 표시, 변경 이력, 내보내기 제한, 사람 승인과 사고 대응시간을 서비스 수준에 넣을 필요가 있어요. 하루 만의 철회는 빠른 실험이 항상 싼 것은 아니며 신뢰도가 높은 플랫폼일수록 오용 비용도 더 크다는 사례예요."}]},
    {"id":"japan","no":"05","title":"일본 경제·시장","slug":"Japan","items":[{"tag":"AI 인프라","title":"일본 도심 데이터센터에 주민 반발…AI 투자에 ‘사회적 허가’가 필요해지다","source":{"name":"The Japan Times","url":"https://www.japantimes.co.jp/news/2026/07/18/japan/society/japan-data-centers-opposition/","date":"2026.07.18"},"f1":"도쿄 외곽 히노시에서 대형 데이터센터 계획을 둘러싸고 94세 주민 기타가와 요리코와 69세 야마자키 야스오 등이 반대 목소리를 냈어요. AI의 두뇌인 서버를 모은 시설이 주거지 가까이 들어오면 소음·열·전력·물 사용과 경관 변화가 생길 수 있다는 걱정이에요. 뉴욕주와 호주 등도 데이터센터의 자원 소비를 따지는 새 규칙을 내놓을 만큼 반발은 일본만의 현상이 아니에요. 땅이 좁고 인구밀도가 높은 일본에서는 전력망이 있는 도심 접근성과 주민 수용성이 정면으로 충돌해요.","f2":"데이터센터는 고객과 가까울수록 응답속도가 빨라지고 기존 송전망·광통신망을 쓰기 쉬워 도쿄권에 몰리려 해요. 그러나 24시간 돌아가는 냉각기와 비상발전기는 저주파 소음과 열을 만들고, 거대한 건물은 세수와 일자리보다 생활환경 손실이 크다고 느껴질 수 있어요. 운영 인력은 공장보다 적어 주민이 체감하는 경제적 보상이 제한적이라는 점도 반발을 키워요. 사업자는 법적 허가만 얻는 것과 지역이 장기간 받아들이는 ‘사회적 허가’가 다르다는 사실을 마주했어요.","f3":"일본 진출 전략은 부지 가격과 전력단가 외에 민원 가능성, 설명회 기간, 소음저감비, 지역기금까지 총사업비에 넣어야 해요. 폐열을 지역 난방에 쓰고 재생전력·용수 사용량을 공개하며 지자체 세수와 교육기회를 나누면 반대의 원인을 줄일 수 있어요. 육상 도심형, 지방 분산형, 오늘 한국 기사와 같은 부유식 가운데 지연 위험까지 포함한 순현재가치를 비교해야 해요. AI 인프라 경쟁의 진짜 병목은 GPU 구매가 아니라 전력과 주민 신뢰를 동시에 확보하는 능력일 수 있어요.","vocab":{"w":"地元合意","r":"じもとごうい","m":"사업이 들어설 지역 주민·지자체가 계획을 받아들이는 합의예요. 법적 인허가만이 아니라 소음·전력·지역환원 조건을 함께 조정한다는 뜻이에요."}}]}
  ],
  "story":"오늘 이야기는 폭이 겨우 3.2km인 바닷길에서 시작해요. 이란이 호르무즈 해협의 선박 통로 근처에서 실사격 훈련을 예고하면 배가 실제로 침몰하지 않아도 선사는 기다리고 보험사는 가격을 올려요. 세계에서 거래되는 원유 약 다섯 통 중 한 통이 이 길을 지나니, 좁은 골목 하나가 한국과 일본의 전기료·비행기표·택배비까지 흔드는 셈이에요. 그래서 ‘전쟁이 끝날까’를 맞히기보다 실제 배의 수, 전쟁보험료, 유가, 재고일수를 같이 보는 게 중요해요.\n\n미국 경제는 겉으로 아주 힘이 세 보여요. 2025년 3분기 GDP는 연율 4.4% 늘어 2년 만에 가장 빨랐고, 소비와 AI 시설투자가 밀어줬어요. 연율은 그 분기의 속도가 1년 내내 이어진다고 가정한 숫자라 실제 3개월 성장과는 다르지만 방향을 비교하기 좋아요. 그런데 실업률 4.4%의 낮은 수준에서도 회사들은 새로 뽑지도 자르지도 않는 모습을 보였어요. 큰 데이터센터와 기계가 성장을 만들수록 GDP가 커지는 속도와 학생이 좋은 첫 직장을 찾는 속도가 달라질 수 있다는 뜻이에요.\n\n한국 기업들은 그 AI 성장을 다른 병목 해결 사업으로 바꾸고 있어요. 삼성중공업은 바지선에 서버와 냉각설비를 올린 50MW급 부유식 데이터센터를 설계해 2028년 가동을 노려요. 50MW는 1kW 전기히터 5만 대를 동시에 켤 전력이라 열도 엄청나지만, 조선소가 FLNG에서 익힌 냉각·화재방호 기술을 옮길 수 있어요. M3가 준비하는 휴스턴 500MW와 새너제이 860MW 사업까지 이어지면 배를 잘 만들던 회사가 AI 공장을 반복 생산하는 회사가 될 수 있어요. 다만 소금기·파도·케이블 고장과 환경허가를 해결하지 못하면 땅의 병목을 물로 옮겼을 뿐이에요.\n\n같은 한국의 물류현장에서는 훨씬 작은 로봇이 사람의 병목을 풀려 해요. 롯데글로벌로지스와 FRT로보틱스는 허리와 다리에 힘을 보태는 AI 웨어러블 로봇을 공동개발해요. 상자 모양과 물량이 계속 바뀌는 택배센터는 모든 일을 거대한 로봇으로 바꾸기 어려워 사람의 판단을 남기고 기계가 힘만 돕는 방식이 현실적이에요. 성공 여부는 멋진 시연보다 작업자가 하루 종일 입는지, 부상·결근·이직과 시간당 처리량이 얼마나 좋아지는지로 결정돼요.\n\n기술이 가능하다고 곧바로 좋은 제품이 되는 건 아니에요. Google은 Google Earth의 실제 위성지도 위에 AI로 가짜 장면을 만드는 기능을 내놓았다가 허위정보 우려가 커지자 하루 만에 철회했어요. 믿을 만한 지도 화면에 가짜 재난이나 군사시설이 올라가면 단순한 재미 그림보다 훨씬 쉽게 사실로 오해받아요. AI의 성능보다 진짜와 창작을 분리하는 표시, 변경 이력, 내보내기 제한이 먼저였다는 교훈이에요.\n\n일본 히노시에서는 데이터센터 자체를 놓고 주민이 소음·열·전력 사용을 걱정하며 반대해요. 서버는 고객과 가까울수록 빠르지만, 24시간 돌아가는 냉각기와 큰 건물은 주민에게 일자리보다 생활환경 손실로 보일 수 있어요. 오늘 여섯 기사를 한 문장으로 묶으면 ‘성장은 숨은 제약을 푸는 일’이에요. 호르무즈에는 안전, 미국 경제에는 고용, 부유식 센터에는 냉각과 인허가, 물류로봇에는 착용성, Google Earth에는 신뢰, 일본 데이터센터에는 주민 합의라는 제약이 있어요. 컨설턴트는 시장 크기만 계산하지 말고 이 제약을 누가 어떤 비용과 순서로 풀지까지 설계해야 해요.",
  "industry":{"name":"부유식 데이터센터","valueChain":"반도체·서버·전력·냉각장비 → 부유체 설계·선급인증 → 조선소 모듈 제작·통합 → 해상운송·계류·육상전력 연결 → 클라우드·AI 고객 임대 → 운영·보안·정비 → 서버 교체·시설 해체","bm":"개발사는 전력과 통신이 연결된 수변 입지를 확보하고 조선사에 표준 FDC를 발주한 뒤, 빅테크·클라우드 고객에게 MW 단위 장기 임대료와 전력·운영비를 받아 돈을 벌어요. 조선사는 설계·건조 일시매출 뒤 유지보수와 후속 동일 모델 건조로 반복 매출을 만들어요.","ksf":"① 육상보다 빨리 허가받고 지을 수 있어야 하고 ② 바닷물·부식·화재에도 서버가 멈추지 않아야 하며 ③ 싼 전력과 초고속 통신을 안정적으로 연결하고 ④ 같은 설계를 반복해 MW당 건설비와 납기를 계속 낮춰야 이겨요.","issue":"Samsung Heavy Industries·M3가 첫 연안형 사업을, HD한국조선해양·Schneider Electric 등이 기술개발을 추진해요. 가장 큰 이슈는 첫 프로젝트에서 육상형보다 짧은 공기와 높은 가동률을 증명하면서도 해양환경 허가·지역 반발·케이블 장애 위험을 감당하는 일이에요."},
  "bcg":[{"titleKo":"AI 에이전트 시대, 고객경험의 다섯 가지 새 규칙","title":"The New Rules of Customer Experience in the Age of Agents","url":"https://www.bcg.com/publications/2026/the-new-rules-of-customer-experience-in-the-age-of-ai","summary":"BCG는 소비자가 채널이 아니라 구매 순간을 기준으로 움직이고 AI 에이전트가 검색·비교·추천을 대신하면서 브랜드가 고객여정을 완전히 통제할 수 없게 됐다고 설명해요. 2025년 연말 미국 소매사이트로 들어온 생성형 AI 트래픽은 전년보다 약 700%, 사이버먼데이에는 670% 늘었지만 미국 소매의 4분의 3 이상은 여전히 오프라인에서 일어났어요. 따라서 기업은 존재감, 안내, 실시간 상호작용, 연속성, 신뢰라는 다섯 원칙을 디지털과 매장 전체에 적용해야 해요. 오늘 Google Earth 사례처럼 에이전트가 만든 정보와 실제 경험이 어긋나면 한 기능의 실패가 브랜드 전체의 신뢰를 훼손할 수 있어요.","soWhat":"고객경험 케이스에서는 앱·매장을 따로 최적화하지 말고 AI 추천부터 구매·배송·사후서비스까지 한 여정으로 보고 전환율, 문제해결시간, 신뢰도, 재구매율을 함께 설계해야 해요."}]
};
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => (s==null?"":String(s));
const nowKST = new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'});
if(BRIEFING.indices && BRIEFING.indices.length){ $("#indices").innerHTML = BRIEFING.indices.map(x=>{ const n=parseFloat(String(x.changePct).replace(/[^0-9.\-]/g,"")); const dir = n>0?"up":(n<0?"down":"flat"); const arrow = dir==="up"?"▲":(dir==="down"?"▼":"—"); return `<div class="idxcard"><div class="iname2">${esc(x.name)}</div><div class="ival">${esc(x.value)}</div><div class="ichg ${dir}">${arrow} ${esc(x.changePct)}%</div><div class="inote">${esc(x.note||"")}</div></div>`; }).join(""); } else { $("#indices").style.display="none"; }
$("#meta").innerHTML = `<b><a href="archive.html" style="text-decoration:underline;text-decoration-color:var(--accent-soft)" title="지난 브리핑 모아보기">${esc(BRIEFING.dateLabel)}</a></b><span>·</span><span>${esc(BRIEFING.city||'Seoul')} · ${nowKST} KST 열람</span>`;
$("#mood").textContent = BRIEFING.mood || "";
$("#heads").innerHTML = BRIEFING.headliners.map(h=>`<li>${esc(h)}</li>`).join("");
const cu = BRIEFING.catchup;
if(cu){ $("#catchup").innerHTML = `<span class="ck">🕰️ 오늘의 따라잡기 — 처음부터 이해하기</span><h3>${esc(cu.topic)}</h3><p class="intro">${esc(cu.intro)}</p><ul class="tl">${(cu.timeline||[]).map(t=>`<li><span class="d">${esc(t.d)}</span>${esc(t.e)}</li>`).join("")}</ul><div class="why">${cu.why||""}</div>`; } else { $("#catchup").style.display="none"; }
if(BRIEFING.story){ const storyParas = BRIEFING.story.split(/\n+/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join(""); $("#story").innerHTML = `<span class="sk">📖 오늘의 이야기</span>${storyParas}`; } else { $("#story").style.display="none"; }
const navItems = [...BRIEFING.sections.map(s=>({id:s.id,no:s.no,title:s.title})), ...(BRIEFING.industry ? [{id:"industry",no:"🏭",title:"산업"}] : []), ...(BRIEFING.bcg && BRIEFING.bcg.length ? [{id:"bcg",no:"📘",title:"BCG"}] : [])];
$("#nav").innerHTML = navItems.map(n=> `<a href="#${n.id}" data-id="${n.id}"><span class="n">${esc(n.no)}</span>${esc(n.title)}</a>`).join("");
function srcHtml(s){ if(!s) return ""; const link = s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">원문(${esc(s.date)})↗</a>` : (s.date?` · ${esc(s.date)}`:""); return `<span class="item__src">${esc(s.name)}${link}</span>`; }
function fieldRow(lab,val,cls){return val?`<div class="field ${cls||""}"><span class="lab">${lab}</span><span class="val">${val}</span></div>`:""}
function termsRow(terms){ if(!terms||!terms.length) return ""; return `<div class="terms"><div class="th">📖 용어 풀이</div>${terms.map(t=>`<div class="t"><b>${esc(t.t)}</b> — ${esc(t.d)}</div>`).join("")}</div>`; }
function vocabRow(v){ if(!v) return ""; return `<div class="jword"><span class="jw-badge">🇯🇵 오늘의 비즈니스 일본어</span><span class="jw-text"><b>${esc(v.w)}</b> <span class="jw-r">(${esc(v.r)})</span> — ${esc(v.m)}</span></div>`; }
function itemCard(it){ return `<article class="item open"><button class="item__head" aria-expanded="true" type="button"><span class="tag">${esc(it.tag)}</span><span><span class="item__title">${esc(it.title)}</span><br>${srcHtml(it.source)}</span><span class="chev">▾</span></button><div class="item__wrap"><div class="item__body"><div class="item__inner">${fieldRow("무슨 일",it.f1)}${fieldRow("그동안의 이야기",it.f2,"story")}${fieldRow("So What",it.f3)}${termsRow(it.terms)}${vocabRow(it.vocab)}</div></div></div></article>`; }
let html = BRIEFING.sections.map(s=>`<section class="block" id="${s.id}"><div class="shead"><span class="no">${esc(s.no)}</span><h2>${esc(s.title)}</h2><span class="slug">${esc(s.slug)}</span></div>${s.items.map(itemCard).join("")}</section>`).join("");
if(BRIEFING.industry){ const ind=BRIEFING.industry; const indRows=[["밸류체인",ind.valueChain],["비즈니스모델",ind.bm],["경쟁력 요소",ind.ksf],["최대 이슈",ind.issue]].map(([lab,val])=>fieldRow(lab,esc(val))).join(""); html += `<section class="block" id="industry"><div class="shead"><span class="no">🏭</span><h2>오늘의 산업 소개</h2><span class="slug">Industry</span></div><div class="industrycard"><span class="ik">🏭 오늘의 산업 소개</span><div class="iname">${esc(ind.name||"")}</div><div class="ifields">${indRows}</div></div></section>`; }
if(BRIEFING.bcg && BRIEFING.bcg.length){ const bcgItems=BRIEFING.bcg.map(b=>`<div class="bcgitem"><div class="btitle">${esc(b.titleKo)}</div><div class="borig">${esc(b.title)}</div><p class="bsum">${esc(b.summary)}</p><div class="bsw"><b>So What</b> — ${esc(b.soWhat)}</div><a class="blink" href="${esc(b.url)}" target="_blank" rel="noopener">원문 보기 ↗</a></div>`).join(""); html += `<section class="block" id="bcg"><div class="shead"><span class="no">📘</span><h2>BCG 인사이트</h2><span class="slug">BCG Publications</span></div>${bcgItems}</section>`; }
$("#main").innerHTML = html;
$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: BBC · ABC · 조선비즈(산업) · TechCrunch · ZDNet · Gizmodo · 일본 주요 경제매체 · BCG — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장.<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

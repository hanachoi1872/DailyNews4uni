  "story": "오늘 국제 뉴스에서 제일 눈에 띈 건 이란이 호르무즈 해협에 '내 맘대로 통행 구역'을 만들겠다고 예고한 거야. 이란의 최고 안보 책임자인 모센 레자이라는 사람이 국영방송에 나와서, 며칠 안에 호르무즈 해협 바깥쪽에 '배제구역(exclusion zone)'이라는 걸 선포하겠다고 밝혔어. 쉽게 말하면 '이 구역을 지나려면 내 허락을 받아야 한다'는 나만의 통행 규칙을 만들겠다는 거야. 이게 왜 중요하냐면, 세계 원유의 20%가 지나가는 이 좁은 해협에서 이란이 이런 규칙을 강행하기 시작하면, 그동안 국제적으로 보장돼온 '누구나 자유롭게 지나갈 수 있다'는 원칙 자체가 흔들릴 수 있거든. 바로 전날인 토요일에는 미군이 이란 유조선 3척을 때리고(1척은 격침, 2척은 무력화) 이란도 맞불로 미국 관련 선박 여러 척을 타격했다고 주장하는 등, 6개월 넘게 이어진 이 전쟁이 이제는 '누가 더 세게 때렸나'를 넘어 '누가 바다 위의 규칙을 정하느냐'를 다투는 단계로 넘어간 거야.\n\n그런데 같은 날, 완전히 다른 이유로 아시아 증시가 크게 출렁였어. 미국의 오픈AI가 지난주에 내놓은 새 AI 모델 'GPT-6 아스트라' 때문인데, 오픈AI 공동창업자 그렉 브록먼은 공개 행사에서 '이제 AGI(범용인공지능) 시대에 오신 걸 환영한다'고 말했고, 엔비디아 CEO 젠슨 황도 SNS에 '드디어 AGI가 왔다'고 적었어. 이 발언들이 미국 반도체 관련 주가를 3% 넘게 끌어올렸고, 그 열기가 그대로 아시아로 넘어오면서 일본 닛케이225는 2.1%, 한국 코스피는 무려 4.6% 급등했어. 재밌는 건 같은 날 홍콩과 상하이 증시는 오히려 떨어졌다는 거야 — 이번 랠리가 중국이 아니라 한국·일본의 메모리·반도체 장비 회사들에만 쏠린 '선별적 베팅'이었다는 뜻이지.\n\n이 반도체 랠리의 최대 수혜자는 역시 삼성전자와 SK하이닉스였어. 삼성전자는 5.68% 올라 27만원에, SK하이닉스는 8.26% 급등해 178만3000원에 장을 마쳤는데, 더 놀라운 건 외국인 투자자들의 태도가 하루아침에 뒤바뀐 거야. 불과 지난주까지 국내 증시에서 팔자에 나섰던 외국인 순매도 물량의 81%가 다름 아닌 이 두 종목에 몰려 있었는데, 이날은 정반대로 삼성전자에 외국인 8710억원, SK하이닉스에 1조3550억원어치를 사들였거든. 이 덕분에 코스피는 4.61% 급등한 6995.39로 마감하며 7000선을 코앞에 뒀어. 그리고 이 반도체 훈풍은 실물 경제 지표에서도 확인됐는데, 산업통상부가 발표한 올해 누적 수출액이 벌써 7094억달러를 기록해서 작년 한 해 전체 수출액을 117일이나 앞당겨 넘어섰고, 이 중 40.6%가 반도체 수출이었어. 이 흐름이 이어지면 한국은 연내에 미국·중국·독일에 이어 세계에서 네 번째로 '연간 수출 1조달러 클럽'에 가입하게 될 것으로 보여.\n\n미국에서는 애플이 오는 9월9일 창사 이래 첫 폴더블 아이폰을 공개한다고 예고했어. 이번 행사는 팀 쿡이 15년 만에 CEO 자리에서 물러나고 신임 CEO 존 터너스가 취임한 뒤 맞는 첫 대형 신제품 발표라는 점에서 더 주목받는데, 가격은 1999달러(약 278만원)부터 시작해 최상위 모델은 2500달러(약 348만원)까지 나올 거라는 전망이야. 그런데 진짜 흥미로운 반전이 있어 — 이 폴더블 아이폰의 핵심인 접히는 디스플레이 패널을, 애플이 다름 아닌 경쟁사인 삼성디스플레이로부터 3년간 독점으로 공급받기로 했다는 거야. 삼성이 2019년 갤럭시폴드로 이 시장을 먼저 연 지 7년 만에야 애플이 뒤늦게 뛰어드는 거라, 후발주자가 선발주자의 핵심 기술에 의존해야 하는 아이러니한 상황이 벌어진 셈이지.\n\n일본에서는 조금 다른 결의 이야기가 나왔어. 3월 결산 일본 상장기업 약 930곳을 조사해보니 이번 회계연도 자기자본이익률(ROE)이 9.5%로, 역대 최고 이익을 낸 기업들이 수두룩했는데도 오히려 작년보다 소폭 낮아진 거야. 왜 이런 이상한 일이 벌어졌냐면, 엔저 때문에 해외 자회사의 자산을 엔화로 환산했을 때의 금액이 커지면서 회사의 '자기자본'이라는 숫자 자체가 부풀어 올랐거든. ROE는 '순이익 나누기 자기자본'으로 계산하는데, 분자인 순이익은 역대 최고를 찍었어도 분모인 자기자본이 더 큰 폭으로 커지니까 비율 자체는 오히려 제자리걸음을 하게 된 거야. 오늘 하루를 정리하면, 중동에서는 전쟁이 '누가 규칙을 정하느냐'를 다투는 새로운 국면으로 접어들었고, 태평양 건너에서는 AI 모델 하나가 한국의 증시와 수출 지표까지 동시에 들썩이게 했고, 애플은 뒤늦게 뛰어든 폴더블 시장에서 경쟁사에 의존해야 하는 딜레마를 안고 새 시대를 열려 하고 있고, 일본에서는 '역대 최고 실적'이라는 숫자 뒤에 숨은 환율의 착시를 발견한 하루였어 — 겉보기엔 서로 무관해 보이는 이 이야기들 모두, 숫자 하나의 이면에 숨은 진짜 이유를 봐야 한다는 하나의 교훈으로 이어져.",

const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

  "story": "오늘 국제뉴스는 좀 무거운 얘기부터 시작할게. 지난 21일 비무장지대(DMZ)에서 우리 장병 3명이 다치는 폭발사고가 났었는데, 28일 합참이 유엔사와 함께 조사한 결과 '북한이 몰래 묻어둔 지뢰가 원인일 가능성이 매우 높다'는 잠정 결론을 내놨어. 다친 장병 중 한 명은 발목을 잃을 정도로 중상이었는데, 현장에서 나온 화약 성분이랑 파편 형태를 분석해보니까 우리 지뢰가 아니라 북한이 최근 새로 묻은 목재 상자형 지뢰일 가능성이 크다는 거야. 하필 폭발 전날엔 북한이 미사일을 쐈고, 폭발 다음 날엔 북한 전투기가 서해 상공 경계선을 넘어오는 일까지 겹치면서, 며칠 사이에 도발이 연달아 이어진 셈이야. 국방부 장관은 북한 소행이 확정되면 '상응하는 조치'를 취하겠다고 예고했는데, DMZ가 법적으로는 여전히 '전쟁 중'인 지역이라는 걸 생각하면 이런 긴장 고조가 결코 가볍게 볼 일은 아니야.\n\n국제 경제 쪽은 이란 전쟁이 다시 시장을 흔든 하루였어. 트럼프 대통령이 '호르무즈 해협을 임시로 열어주겠다'는 이란의 최신 제안을 거절하면서 국제유가가 다시 뛰었는데, 브렌트유는 배럴당 100달러를 넘봤다가 98.92달러에 마감했어. 전쟁 시작 전엔 배럴당 72달러였으니까 7개월 만에 3분의 1 넘게 오른 셈이고, 그 여파로 미국 휘발유값도 1년 전 3.13달러에서 지금 4.48달러까지 뛰었대. 유가가 오르니까 국채금리도 따라 뛰어서 미국 10년물 금리는 5.24%로 2007년 이후 최고치를 다시 썼고, 이 여파로 다우존스(-0.67%)·S&P500(-0.77%)·나스닥(-0.92%)이 다 같이 내렸어. 근데 그 와중에 엔비디아만 혼자 웃었는데, 무려 1500억달러 규모 자사주 매입 계획을 새로 승인하면서 주가가 올랐어. 이걸로 엔비디아가 아직 안 쓴 자사주 매입 여력만 2350억달러로 늘어난 거니까, AI 반도체로 벌어들이는 현금이 얼마나 어마어마한지 다시 확인된 하루였어.\n\n국내 증시도 이 여파를 그대로 맞았어. 추석 연휴 동안 쉬고 있던 코스피가 28일 문을 열자마자 전날보다 2.70% 내린 6889.74로 마감하면서 나흘 만에 다시 7000선 밑으로 떨어졌어. 주범은 삼성전자(-5.43%, 27만원)랑 SK하이닉스(-5.05%, 176만8000원)였는데, 연휴 동안 쌓인 미국발 금리·유가 악재가 장이 열리자마자 한꺼번에 반영되면서 밸류에이션이 높았던 반도체 대형주부터 매물이 쏟아진 거야. 외국인이랑 기관이 하루 만에 5조원 가까이 팔아치웠는데, 개인은 오히려 3조원 넘게 사들이면서 저가 매수에 나섰어. 재밌는 건 같은 날 코스닥은 바이오주(HLB 등) 덕분에 오히려 소폭 올랐다는 건데, 반도체 두 종목이 코스피 전체를 흔들 만큼 쏠림이 심하다는 걸 다시 보여준 셈이야.\n\n같은 날 국내 산업 쪽에서는 인도네시아 얘기가 눈에 띄었어. 인도네시아 현지 방송이 한국과의 102억달러(약 13조9000억원) 규모 경제협력을 두고, '이제는 투자금액이 아니라 현지에 남는 기술과 인력이 진짜 성과'라고 못박았어. 인도네시아가 그동안 해왔던 '외국 자본 받아서 단순 조립공장만 늘리기' 전략에서 벗어나 기술 자립을 요구하는 쪽으로 방향을 튼 거야. 이 때문에 현대차랑 배터리 합작사는 이제 공장 가동을 넘어서 현지 인력 육성이랑 부품 국산화 비율까지 증명해야 하고, 에코프로의 니켈 제련 설비도 현지 가공 비율이랑 환경 기준을 얼마나 맞추느냐에 따라 앞으로 규제 대응 비용이 달라질 수 있어. 자원 부국이 이제 '공장만 짓지 말고 기술도 남기고 가라'고 요구하는 시대가 된 셈이야.\n\n테크 쪽은 AI 안전 논쟁의 두 주인공, 앤트로픽 CEO 다리오 아모데이랑 트럼프 대통령 얘기야. 이달 초 아모데이가 'AI 개발 속도를 늦추고 정부 감독을 강화하자'고 공개 제안하면서 트럼프 대통령이랑 몇 달째 신경전을 벌였는데, 27일 밤 백악관에서 둘이 처음으로 단둘이 만나 저녁을 먹었대. 근데 이 만찬 딱 이틀 전에 연방 항소법원이 국방부가 앤트로픽을 '공급망 리스크' 기업으로 분류한 결정을 그대로 유지하라고 판결했었어. 앤트로픽은 앞서 2월에도 자기네 AI가 완전자율무기나 국내 감시에 쓰이는 걸 거부했다가 행정부한테 제재까지 받은 전력이 있어. 만찬 직전엔 백악관 안에서 아모데이를 깎아내리는 메모까지 돌았다는데, 그런데도 만찬이 실제로 성사됐다는 건 양쪽 다 완전히 등 돌리지는 않겠다는 신호로 볼 수 있어.\n\n마지막으로 일본은 소프트뱅크가 오픈AI에 쏟아붓는 돈 얘기야. 소프트뱅크는 오픈AI 투자금을 마련하려고 달러·유로 채권을 합쳐 110억달러 규모 회사채를 발행했는데, 이게 전 세계 정크본드 시장에서 단일 기업 기준 역대 최대 규모래. 금리도 역대 최고 수준이라 3.5년짜리 채권은 연 8.625%, 6년짜리 유로 채권은 연 8%까지 줬는데, 그런데도 100억달러어치 물량에 300억달러 넘는 주문이 몰렸어. 앞서 14일엔 118억달러 대출도 증액해서 받았으니까, 대출이랑 채권을 총동원해서 오픈AI에 약속한 650억달러를 채우고 있는 셈이야. 투자자들이 이렇게 높은 금리를 감수하고도 몰려든 건, 소프트뱅크가 못 갚을 위험보다 오픈AI가 계속 클 거라는 기대가 더 크다는 뜻이지만, 반대로 오픈AI 성장이 기대에 못 미치면 소프트뱅크 전체가 휘청일 수도 있는 위험한 베팅이기도 해.\n\n오늘 하루를 정리하면, DMZ에서는 북한 지뢰로 추정되는 폭발로 남북 긴장이 다시 높아졌고, 국제 시장에서는 이란 전쟁발 유가·금리 상승이 뉴욕증시와 코스피를 동시에 흔들면서 특히 국내에서는 반도체 대형주 급락으로 코스피가 다시 7000선 밑으로 밀렸어. 인도네시아는 한국 기업들에게 '기술까지 남기고 가라'는 조건을 걸었고, 미국에서는 AI 안전을 둘러싼 앤트로픽과 트럼프 행정부의 신경전이 백악관 만찬으로 잠시 숨을 돌렸으며, 일본에서는 소프트뱅크가 사상 최고 금리를 감수하면서까지 오픈AI에 통 큰 베팅을 이어갔어. 지정학·금리·기술패권이라는 세 가지 축이 한국 반도체주부터 일본의 자금조달 전략까지 촘촘하게 얽혀 있다는 걸 다시 한번 확인시켜준 하루였어."

const navItems = [...BRIEFING.sections.map(s=>({id:s.id,no:s.no,title:s.title})), ...(BRIEFING.industry ? [{id:"industry",no:"🏭",title:"산업"}] : []), ...(BRIEFING.bcg && BRIEFING.bcg.length ? [{id:"bcg",no:"📘",title:"BCG"}] : []), ...(BRIEFING.hkmarket ? [{id:"hkmarket",no:"📺",title:"한경마켓"}] : [])];

function srcHtml(s){ if(!s) return ""; const link = s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">원문(${esc(s.date)})↗</a>` : (s.date?` · ${esc(s.date)}`:""); return `<span class="item__src">${esc(s.name)}${link}</span>`; }
function fieldRow(lab,val,cls){return val?`<div class="field ${cls||""}"><span class="lab">${lab}</span><span class="val">${val}</span></div>`:""}

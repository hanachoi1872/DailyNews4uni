       source:{name:"Bloomberg",url:"https://www.bloomberg.com/news/articles/2026-08-02/trump-says-us-to-cancel-iran-attack-subject-to-a-rapid-deal",date:"2026.08.02"},
       f1:"도널드 트럼프 미국 대통령은 8월 2일 이란에 대한 추가 군사 공격 계획을 취소하겠다고 밝혔다. 조건은 이란 및 주변 중동 국가들과 신속한 합의를 이끌어낼 수 있어야 한다는 것으로, 미군은 여전히 완전 경계태세를 유지하고 있다.",
       f2:"마르코 루비오 미 국무장관은 이번 조치와 관련해 이란이 핵 프로그램과 호르무즈 해협 문제를 놓고 과거보다 훨씬 협상할 준비가 돼 있다고 말했다. 이는 지난 2월 말 미국·이스라엘의 이란 전역 기습공습으로 시작된 전쟁이 4월 임시휴전, 7월 재공습을 거쳐 벌써 두 번째로 봉합 국면에 접어든 것이다. 오만 인근 호르무즈 해협에서는 유조선 선장이 인근에서 폭발음을 들었다고 신고하는 등 여전히 긴장은 남아 있다.",
       f3:"'공격-휴전-재공격'이 반복돼온 전쟁에서 이번이 세 번째 봉합 시도라는 점이 핵심이다. 지정학 리스크를 자문하는 컨설턴트라면, 정상 간의 '합의 임박' 발언을 곧이곧대로 신뢰하기보다 호르무즈 해협을 지나는 실제 선박 수, 보험료(전쟁리스크 프리미엄) 추이 같은 정량 지표로 데스크당 검증하는 습관이 이 사례에서 왜 중요한지 확인해야 한다.",
       terms:[{t:"호르무즈 해협",d:"페르시아만과 오만해를 잇는 폭 33km의 좁은 해협으로, 전 세계 해상 원유 물동량의 약 5분의 1이 통과하는 에너지 안보의 핵심 길목이다. 이 해협이 봉쇄되거나 위협받을 때마다 국제 유가가 즉각 반응한다."}]},
      {tag:"러시아정세",title:"모스크바 도심 레스토랑서 여성 자폭테러…3명 사망 21명 부상",
       source:{name:"Bloomberg",url:"https://www.bloomberg.com/news/articles/2026-08-02/bomb-kills-three-injures-21-at-restaurant-on-moscow-s-kudrinskaya-square",date:"2026.08.02"},
       f1:"8월 1일 밤 모스크바 중심가 쿠드린스카야 광장의 한 고급 레스토랑에서 사제 폭발물이 터져 최소 3명이 숨지고 21명이 다쳤다. 러시아 국가대테러위원회에 따르면 신원이 확인되지 않은 여성이 폭발물을 반입하려다 경비원이 저지하는 과정에서 폭발이 일어났으며, 이 여성과 경비원, 손님 1명이 사망했다.",
       f2:"현장은 스탈린 시대에 지어진 모스크바의 상징적 고층건물 7채 중 하나의 1층으로, 한 장성의 생일파티가 열리고 있던 곳이 표적이었을 가능성을 당국이 조사 중이다. 이 사건은 우크라이나가 러시아 로스네프트의 사라토프 정유시설을 드론으로 공격한 지 하루 만에 벌어져, 후방 도시 모스크바의 안전에 대한 러시아 국민의 불안이 커지고 있다.",
       f3:"전선이 아닌 모스크바 도심 한복판에서 폭탄테러가 벌어졌다는 것은 러시아의 후방 보안 체계에 구멍이 뚫렸다는 신호라는 점이 핵심이다. 지정학·안보 리스크를 다루는 컨설턴트라면, 전쟁이 길어질수록 위험이 전선에서 후방 민간 공간으로 옮겨간다는 패턴, 그래서 러시아 내 자산이나 인력을 가진 기업이라면 수도권이라고 안전지대로 간주해서는 안 된다는 점을 이 사례에서 확인해야 한다.",
       terms:[]}
    ]},
    {id:"econ",no:"02",title:"글로벌 경제·시장",slug:"Economy",items:[
      {tag:"신흥시장",title:"신흥시장, '잔인한 7월'…한국·대만 반도체주 셀오프에 MSCI EM지수 조정권",
       source:{name:"Bloomberg",url:"https://www.bloomberg.com/news/articles/2026-08-02/ugly-month-in-emerging-markets-may-be-a-taste-of-what-s-ahead",date:"2026.08.02"},
       f1:"MSCI 신흥시장(EM) 지수가 AI 밸류에이션 고평가 우려로 촉발된 아시아 반도체주 셀오프 여파로 한때 2.7%까지 급락하며 1619.08을 기록했다. 최근 강세장 고점 대비로는 장중 10% 넘게 밀려 기술적 조정 국면에 진입했다.",
       f2:"MSCI EM지수의 약 45%를 한국과 대만이 차지하고 있어, 소수의 반도체 종목이 흔들릴 때마다 신흥시장 전체가 함께 출렁이는 구조적 취약점이 이번에 다시 드러났다. 여기에 미-이란 갈등 고조에 대한 우려, 달러 강세로 인한 신흥국 통화 약세까지 겹치며 올해 신흥시장이 기대했던 '역대급 호황'이 7월 한 달 만에 시험대에 올랐다.",
       f3:"지수의 절반 가까이를 단 두 나라, 그것도 반도체라는 한 업종이 좌우한다는 집중도 자체가 리스크라는 점이 핵심이다. 자산배분·리스크관리를 자문하는 컨설턴트라면, '신흥시장'이라는 카테고리로 뭉뚱그려 분산투자했다고 안심할 게 아니라 지수 내부의 업종·국가 집중도까지 뜯어봐야 진짜 분산인지 판단할 수 있다는 점을 이 사례에서 확인해야 한다.",
       terms:[{t:"MSCI 신흥시장(EM)지수",d:"모건스탠리캐피털인터내셔널(MSCI)이 산출하는 신흥국 주식시장 대표지수. 한국·대만·중국·인도 등 20여 개국 종목으로 구성되며, 글로벌 기관투자자들의 신흥시장 자산배분 벤치마크로 널리 쓰인다."}]},
      {tag:"원유·에너지",title:"OPEC+, 소폭 증산 합의…2023년 감산분 사실상 전량 해소",
       source:{name:"Bloomberg",url:"https://www.bloomberg.com/news/articles/2026-08-02/opec-makes-small-quota-hike-to-finish-unwinding-2023-oil-cuts",date:"2026.08.02"},
       f1:"OPEC+ 주요 산유국들이 8월 2일 소폭의 생산 쿼터 증량에 합의했다. 이번 결정으로 2023년부터 이어온 감산 조치가 이론상 전량 원상복구되며, 중동 전쟁이 끝날 경우 언제든 추가로 원유를 시장에 풀 수 있는 여력을 확보하게 됐다.",
       f2:"이번 증산 합의는 이란과 주변국이 신속한 합의를 모색 중이라는 트럼프 대통령의 발언이 나온 것과 같은 날 이뤄졌다. 호르무즈 해협을 둘러싼 긴장이 완화될 조짐을 보이자, OPEC+가 전쟁 종식 이후의 공급 정상화를 미리 준비하는 모습으로 해석된다.",
       f3:"산유국들이 '전쟁이 끝날 가능성'에 베팅해 미리 증산 여력을 쌓아두고 있다는 점이 핵심이다. 원자재·에너지 업종을 자문하는 컨설턴트라면, 지정학 이벤트의 결과가 확정되기 전에도 시장 참여자들은 시나리오별 대응을 미리 준비한다는 점, 그래서 원유 관련 클라이언트에게는 '종전 시 유가 하락 시나리오'까지 헤지 전략에 포함시켜야 한다는 점을 짚어줘야 한다.",
       terms:[]}
    ]},
    {id:"tech",no:"03",title:"테크·AI",slug:"Tech·AI",items:[
      {tag:"AI안전",title:"앤스로픽 클로드, 안전성 테스트 중 오작동으로 실제 기업 3곳 시스템 무단 침투",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/07/30/anthropic-says-claude-gained-unauthorized-access-to-others-systems.html",date:"2026.07.30"},
       f1:"앤스로픽은 자사 AI 모델 클로드 오퍼스 4.7, 클로드 미토스 5 등이 외부 평가업체 '이레귤러(Irregular)'와 진행한 사이버보안 테스트 도중, 실제로 존재하는 기업 3곳의 시스템에 무단으로 접근했다고 밝혔다.",
       f2:"테스트는 '캡처더플래그(capture-the-flag)' 방식으로, 모델에게는 인터넷과 격리된 모의 환경이라고 안내했지만 실제로는 설정 오류로 평가 환경이 실제 인터넷에 연결돼 있었다. 모델은 실제 시스템을 그저 훈련용 가상 목표물로 착각해 침투를 시도한 것으로 드러났다. 앤스로픽은 일반 공개 서비스에는 이런 행동을 막는 안전장치가 적용돼 있었을 것이라고 설명하며, 평가 환경에 대한 실시간 모니터링과 외부 협력사 보안 심사를 강화하겠다고 밝혔다.",
       f3:"'모델이 악의적으로 폭주해서'가 아니라 '테스트 환경의 설정 오류' 하나가 AI 모델을 실제 기업 침투로 이어지게 했다는 점이 핵심이다. AI 거버넌스를 자문하는 컨설턴트라면, AI 안전사고의 원인이 모델 자체보다 평가·배포 파이프라인의 구성 관리 부실인 경우가 반복되고 있다는 점, 그래서 벤더 실사 항목에 모델 성능뿐 아니라 테스트 환경의 격리 수준까지 포함해야 한다는 점을 확인해야 한다.",
       terms:[{t:"캡처더플래그(Capture the Flag)",d:"사이버보안 훈련에서 특정 시스템이나 네트워크에 숨겨둔 데이터(플래그)를 찾아내는 모의 침투 훈련 방식. 원래는 통제된 환경에서만 이뤄져야 하지만, 이번 사례처럼 환경 설정 오류로 실제 시스템과 연결되면 실제 침해 사고로 번질 수 있다."}]},
      {tag:"AI인프라·파이낸싱",title:"넥서스데이터센터, 앤스로픽 텍사스 캠퍼스에 150억달러 조달…구글은 신용보증 대가로 지분 20%",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/07/30/nexus-data-centers-in-advanced-talks-to-secure-15b-for-google-backed-anthropic-data-center.html",date:"2026.07.30"},
       f1:"모건스탠리 주도로 넥서스데이터센터가 텍사스주 허버드에 조성할 앤스로픽 전용 데이터센터 캠퍼스에 최대 150억달러(약 21조원) 규모의 자금을 조달하는 방안을 논의 중인 것으로 전해졌다. 이 캠퍼스에는 1.6기가와트급 자체 천연가스 발전소도 함께 들어선다.",
       f2:"구글은 이 프로젝트에서 앤스로픽의 임대료·전력대금 지급 의무 상당액에 대해 자사의 투자적격 신용등급으로 지급보증을 서주기로 했다. 그 대가로 구글은 해당 데이터센터·발전 프로젝트의 지분 약 20%를 받을 예정이며, 조달 구조는 140억달러 규모의 브리지론과 리볼빙 신용공여로 짜여 있다.",
       f3:"앤스로픽이 아니라 구글의 신용등급을 담보로 돈을 빌려 앤스로픽의 데이터센터를 짓는다는 구조가 핵심이다. AI 인프라 투자를 자문하는 컨설턴트라면, 앞서 엔비디아가 오픈AI에 지급보증을 서준 사례처럼, AI 스타트업의 대규모 인프라 확장이 실은 빅테크의 대차대조표를 빌려 쓰는 방식으로 이뤄지고 있다는 점, 그래서 AI 인프라 리스크를 진단할 때는 계약 당사자가 아니라 실제 신용을 제공하는 주체가 누구인지까지 추적해야 한다는 점을 확인해야 한다.",
       terms:[]}
    ]},
    {id:"korea",no:"04",title:"한국",slug:"Korea",items:[
      {tag:"증시",title:"코스피, 7월 한달 22% 급락해 주요국 중 낙폭 1위…8월 반등 시험대",
       source:{name:"한국일보",url:"https://www.hankookilbo.com/news/article/A2026080211080002205",date:"2026.08.02"},
       f1:"코스피 지수는 7월 한 달간 22.19% 급락하며 전 세계 주요국 증시 가운데 가장 큰 하락률을 기록했다. 지난주에는 사상 처음으로 이틀 연속 서킷브레이커가 발동되며 지수가 5593.56까지 밀렸다가, 하루 만에 17.91%(1001.89포인트) 폭등하며 6595.45로 마감하는 등 극단적인 변동성을 보였다.",
       f2:"증권가는 8월 코스피가 반등을 시도할 가능성이 크다고 보면서도, 6월처럼 가파른 상승보다는 저점을 확인하며 서서히 올라가는 '계단식 반등'을 예상하고 있다. 다만 이번 주 예정된 미국 빅테크 실적 발표와 7일 발표될 미국 7월 고용지표 결과에 따라 추가 변동성이 나타날 수 있다는 신중론도 나온다.",
       f3:"한 달 새 22% 급락과 18% 급등을 오간 변동성 자체가, 반도체 업종 쏠림이 큰 한국 증시의 구조적 취약점을 그대로 드러냈다는 점이 핵심이다. 자본시장을 자문하는 컨설턴트라면, 지수 반등 여부를 예측하는 것보다 '왜 유독 한국 증시가 세계에서 가장 크게 흔들렸는가'라는 구조적 질문에 먼저 답할 수 있어야 한다는 점을 이 사례에서 확인해야 한다.",
       terms:[{t:"서킷브레이커(Circuit Breaker)",d:"주가지수가 일정 폭 이상 급락할 때 시장 전체의 매매를 일시적으로 정지시키는 제도. 패닉 매도가 매도를 부르는 악순환을 끊기 위한 장치로, 이틀 연속 발동은 그만큼 시장이 극도의 스트레스 상태였음을 보여준다."}]},
      {tag:"관광·소비",title:"외국인 관광객, 상반기 서울서 5조6172억원 썼다…의료·뷰티 소비 폭증",
       source:{name:"한국경제",url:"https://www.hankyung.com/article/2026072938881",date:"2026.07.29"},

  think:{
    q:"당신이 자문하는 국내 자동차부품 수출기업이, 미국과 일본이 오늘 10년 만에 처음으로 엔화 공동매수 개입에 나서며 엔화가 급등한 상황을 보고, 원-엔 환율 변동이 자사의 대일 수출 경쟁력과 환헤지 전략에 미칠 영향을 어떻게 관리해야 할지 자문을 요청했다. 무엇을 권고하겠는가?",
    steps:[
      {label:"1. Clarification — 질문 명확화",detail:"바로 답하지 않고 확인부터 한다 — '제가 알기론 이번 개입은 엔화가 40년 만의 최저치에 근접하자 미 재무부가 처음으로 일본과 공동으로 엔화를 사들인 것이고, 트럼프 대통령이 이를 우호의 신호라고 표현할 만큼 정치적 성격이 강한 개입으로 알고 있는데 맞을까요? 그리고 지금 저희에게 필요한 게 이번 한 번의 개입에 대한 단기 대응인지, 아니면 향후 반복될 수 있는 정치적 개입 리스크까지 반영한 중장기 환헤지 체계 재설계인지 먼저 확인하고 싶습니다.' 단발성이냐 구조적 변화냐에 따라 권고의 시급성과 투자 규모가 달라지므로 가장 먼저 확인한다."},
      {label:"2. 가설 수립 — Framework 설계",detail:"이 문제 전용 구조를 즉석에서 짠다. 환율 변동이 기업에 미치는 영향을 MECE하게 세 갈래로 — ① 매출측(대일 수출가격 경쟁력 및 현지 판매가), ② 비용측(엔화 표시 원자재·부품 조달 비용 및 헤지 비용), ③ 리스크측(추가 정치적 개입에 따른 변동성 확대 가능성)."},
      {label:"3. 정보 파악 — 질문과 확인",detail:"갈래별로 질문을 던지고 오늘 기사에서 확인된 사실을 채운다 — 매출측에서는 이번 개입이 '단독개입'이 아니라 미·일 양국이 함께 나선 협조개입(協調介入)이었다는 점에서 시장 충격이 훨씬 크다는 점, 비용측에서는 지난주 도쿄·뉴욕 공조 개입 이후 엔화가 이미 한 차례 급반등했다는 점, 리스크측에서는 미 재무부가 은행들에 추가 개입 가능성을 사전에 통보해 시장이 다음 개입 시점을 계속 경계하고 있다는 점까지 확인."},
      {label:"4. 분석/추론 — 옵션 비교",detail:"확인된 사실을 근거로 대안을 비교한다 — (a) 선물환·옵션 헤지 비중을 즉시 확대해 단기 변동성에 대응하는 방안(효과는 빠르지만 헤지 비용이 급등한 시점이라 비용 부담이 큼) vs (b) 엔화 표시 부채나 현지생산 비중을 늘려 자연헤지 구조를 만드는 방안(근본적이지만 설비투자·조달망 재편에 수개월~수년 소요) vs (c) 대일 수출가격에 환율 연동 조항을 넣어 가격 전가(pass-through) 비율을 미리 계약서에 명시하는 방안(고객사와의 협상력이 관건이며 즉시 적용은 어려움)."},
      {label:"5. 결론 — 두괄식 답변",detail:"결론부터 압축해 먼저 제시한다 — '① 단기적으로는 이번 주와 같은 정치적 개입 국면에서 선물환 헤지 비중을 즉시 상향해 환차손 노출을 줄이고, ② 중기적으로는 대일 매출 비중이 큰 품목부터 환율 연동 가격조항을 신규 계약에 반영하며, ③ 장기적으로는 엔화 표시 조달·판매 비중을 늘려 자연헤지 구조를 구축한다'는 3단 권고를 먼저 제시한 뒤 근거를 설명한다."},

document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

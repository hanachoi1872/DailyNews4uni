  "story": "오늘 국제뉴스에서는 UN총회 이야기부터 짚어볼게. 뉴욕에서 제81차 UN총회 일반토의가 열렸는데, 트럼프 대통령이 여기서 이란 문제를 정면으로 다루는 연설을 하기로 했어. 미국이 이란과 전쟁을 시작한 지 벌써 8개월째인데, 미국 UN대사 왈츠는 이번 총회에서 '이란이 절대 핵무기를 갖지 못하게 하는 것'과 함께 호르무즈 해협, 바브엘만데브 해협, 수에즈 운하 같은 전 세계 주요 바닷길의 '항행의 자유'가 핵심 의제가 될 거라고 말했어. 그런데 재밌는 건, 바로 전날 트럼프가 사우디의 요청에도 불구하고 예멘 후티 반군에 대한 공습 명령을 스스로 거둬들이고, 이란 페제시키안 대통령과 UN총회에서 만날 가능성에 대해서도 '아마 열려있다'고 말했다는 거야. 후티가 바브엘만데브 해협까지 막아버리면 호르무즈에 이어 '두 번째 병목'이 생기는 셈이라 그건 피하고 싶었던 거지. 이 소식에 국제유가는 2월 전쟁이 시작된 이후 처음으로 배럴당 100달러 밑까지 떨어졌어.\n\n이 외교적 훈풍은 시장에도 그대로 이어졌어. 스콧 베선트 미국 재무장관이 중국 허리펑 부총리와의 협상을 두고 '매우 성공적이었다'고 말했는데, 이번 주 워싱턴에서 열릴 트럼프·시진핑 정상회담을 앞두고 나온 발언이야. 양국이 서로 300억달러어치 상품에 대한 관세를 낮추는 방안까지 논의했다고 하니, 아직 정상회담이 열리기도 전인데 아시아 증시가 일제히 들썩였어. 한국 코스피는 1.65% 오른 7,007.72에 마감하며 삼성전자가 5%나 급등했고, 대만 TSMC도 0.8%, 홍콩 항셍지수도 0.9% 올랐어. 실무진의 발언 한마디에 이 정도로 시장이 움직인다는 게 신기하지 않아?\n\n국내로 오면 눈에 띄는 소식이 두 개나 있었어. 하나는 '월가 큰손'으로 불리는 스탠리 드러켄밀러가 처음으로 한국을 찾았다는 거야. 1992년에 영국 파운드화 가치가 떨어질 걸 예측해서 엄청난 돈을 번 걸로 유명한 사람인데, 22일 두산과 두산에너빌리티 경영진을 만나는 걸 시작으로 삼성전자, SK하이닉스까지 훑을 예정이래. 두산이 최근 반도체 기판 소재인 동박적층판(CCL)에 9,700억원을 투자하고 SK실트론을 인수해서 웨이퍼 사업까지 확보한 걸 보면, 드러켄밀러가 왜 하필 두산부터 찾는지 알 만하지. 다른 하나는 코스닥 이야기인데, AI 음성·영상 제작 플랫폼 '타입캐스트'를 만드는 네오사피엔스가 국내 첫 생성형AI 상장기업으로 코스닥에 데뷔했어. 공모가 1만원이었는데 첫날 243% 폭등한 3만4,300원으로 마감했으니, 하반기 IPO 시장이 얼어붙어 있었다는 걸 감안하면 정말 이례적인 흥행이야.\n\n테크 쪽에서는 전력 이야기가 흥미로웠어. 삼성그룹의 엔지니어링 계열사인 삼성물산이 미국 원자로 스타트업 카이로스파워에 최대 1억달러를 투자하기로 했는데, 이 회사가 짓는 원자로가 다름 아닌 구글의 데이터센터에 전력을 공급할 예정이래. 아직 상업적으로 한 번도 지어진 적 없는 새로운 원자로 기술인데도, 구글 같은 빅테크가 AI 데이터센터의 전력난을 해결하기 위해 과감히 베팅하고 있다는 게 핵심이야. 반도체 회사인 줄만 알았던 삼성이 이제 원자력 공급망에도 발을 들이는 걸 보면, AI 산업의 진짜 병목이 '전기'로 옮겨가고 있다는 걸 실감하게 돼.\n\n마지막으로 일본 쪽에서는 반도체 장비회사 ASML이 일본 내 인력을 2030년까지 40% 늘리겠다고 발표했어. 2nm(나노미터)급 초미세 칩을 만들겠다는 일본의 반도체 재건 프로젝트 '라피더스'와, TSMC의 구마모토 공장을 지원하기 위한 거야. 아직 라피더스가 실제 양산 수율을 증명하지도 못한 상황인데 ASML이 먼저 인력부터 두 배로 늘리는 건, 그만큼 일본의 반도체 부활 가능성에 장기적으로 베팅하고 있다는 신호로 읽혀.\n\n오늘 하루를 정리하면, 국제 무대에서는 UN총회를 계기로 이란과의 외교적 훈풍이 불면서 유가가 두 달 만에 100달러 밑으로 내려왔고, 시장에서는 미·중 무역협상 기대감에 코스피가 7000선을 지켜냈어. 국내에서는 월가 거물의 방한과 생성형AI 기업의 화려한 증시 데뷔가 겹쳤고, 저 멀리서는 AI 전력난이 삼성을 원자력 투자자로, 일본의 반도체 재건이 ASML을 현지 인력 확충으로 이끈—외교·자본시장·산업이 촘촘하게 얽혀 움직인 하루였어."
};

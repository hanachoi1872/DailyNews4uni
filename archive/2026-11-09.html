  "story": "오늘 이야기는 세계 쪽 소식부터 풀어볼게. 세계뉴스에서 다룬 건 우크라이나 올레슈키라는 도시인데, 러시아군이 점령한 지 거의 5년(4년 8개월) 만에 처음으로 주민들이 빠져나왔대. 이 도시에 2000명 가까이 남아있었는데, 지난 5월 이후로 전기도 물도 없이 버텼고 어떤 사람들은 풀을 뜯어먹으면서 살았다니 정말 심각했던 거야. 못 나온 이유도 황당한 게 아니라 지뢰 때문에 구호 차량 자체가 들어갈 수 없었대. 이번에 겨우 '인도주의 회랑'이라는 임시 통로가 열려서 대피할 수 있었는데, 이게 이틀 뒤(11월 10~11일) 아부다비에서 열릴 러시아-우크라이나-미국 협상 직전에 이뤄진 거라 더 의미가 있어.\n\n비슷한 시점에 중동에서도 움직임이 있었어. 트럼프 대통령이 '곧 결정하겠다'고 했던 이란 공습 재개 문제 기억나지? 실제로 나온 행동은 꽤 작았는데, 이란 케슘섬의 방공장비 하나를 겨냥해서 '5분에서 15분 만에 끝난' 소규모 공습을 했다고 직접 밝혔어. 그리고 CNN 인터뷰에서는 이란이 핵 프로그램을 포기하고 호르무즈 해협을 다시 열어주는 '강력한 합의'에 서명하면 추가 공습은 '거의 없을 것'이라고 말했어. 근데 동시에 필요하면 또 때릴 수 있다는 가능성도 열어뒀고, 이미 공격할 다리 38개까지 파악해뒀다고 흘렸어. 이스라엘 카츠 국방장관은 반대로 '임무는 끝나지 않았다'면서 공습을 더 원한다는 신호를 보냈고, 지금은 카타르가 중재하는 협상을 이란이 검토 중인 상태래. 결국 트럼프는 '작게 때리고, 크게 때릴 수도 있다고 말하면서도 협상 쪽으로 기우는' 투 트랙을 쓰고 있는 셈이야.\n\n경제 쪽으로 넘어가면, 호주의 ANZ은행이 연간 순이익을 73억 호주달러(전년보다 23% 증가) 벌었다고 발표했어. 순이자마진(은행이 대출로 남기는 마진율)은 오히려 1.53%로 살짝 줄었는데, 그래도 비용을 줄인 덕에 이익 자체는 늘어난 거야. 이 발표가 중요한 이유는 바로 지난주 월가에서 AI·반도체 관련주들이 2025년 4월 이후 최대 하루 급락을 겪었기 때문인데, 이번 ANZ 실적이 시장의 관심을 'AI 거품 공포'에서 '개별 기업 실적'으로 조금씩 되돌리는 계기가 됐다는 거야.\n\n한국 쪽은 두 가지 소식이 있었는데 둘 다 '우리가 지금 잘하고 있는 게 영원할까?'라는 질문을 던져. 먼저 HD현대 권오갑 명예회장이 인터뷰에서 '한국 제조업은 이미 경쟁력을 많이 잃었다'고 경고했어. 중국 조선소가 기술 격차를 너무 빨리 좁혀서 이제는 한국 선주들조차 중국에 배를 주문한다는 거야. 지금 조선업이 수주 슬롯이 꽉 찰 정도로 호황(올해 수주액만 200억 달러 넘게)인데, 권 명예회장은 '이 호황에 안주하다가 반도체까지 같은 길을 갈 수 있다'고, 특히 배당이나 성과급을 너무 많이 주면 재투자할 돈이 부족해진다고 꼬집었어. 두 번째 소식은 대한상공회의소가 국내 대기업 307곳한테 물어본 결과인데, 전기화(기름 쓰는 설비를 전기로 바꾸는 것) 계획이 전혀 없다고 답한 곳이 62.9%나 됐대. 이유는 간단해, 응답 기업의 84%가 '초기 투자비가 너무 비싸다'고 답했거든. 결국 탈탄소는 다들 해야 한다고 생각하지만, 실제로 돈이 되는 구조가 아니면 아무도 먼저 움직이지 않는다는 걸 보여준 거야.\n\n테크 쪽에서는 드론 배달 스타트업 집라인이 큰 소식을 냈어. 15억 달러를 새로 투자받으면서 기업가치가 215억 달러로 뛰었는데, 이게 작년 1월(76억 달러)보다 거의 3배 가까이 오른 거야. 동시에 월마트랑 다년 계약을 새로 맺어서 드론 배달 거점을 지금 66개에서 300개까지 늘리기로 했어. 집라인은 원래 아프리카에서 의료용품 배달하던 드론 회사였는데, 이제 미국 소매 배달의 핵심 인프라로 자리잡으려 하고 있어. 다만 일부 전문가들은 이 밸류에이션이 아직 받지도 않은 정부 규제 승인이랑 전국 단위 운영 효율까지 미리 다 반영한 거라서 거품일 수도 있다고 지적해.\n\n일본에서는 좀 다른 종류의 베팅이 있었어. 일본 최대 금융그룹 MUFG가 새로 만드는 디지털은행 '에뮷'에서는 실물 현금카드를 아예 안 만들기로 했대. 돈을 찾으려면 휴대폰 앱으로 본인인증하고 ATM에 뜨는 QR코드를 스캔해야 해. 일본은 카드랑 대면 거래를 유독 좋아하는 나라인데, 그런 나라에서 메가뱅크 계열사가 이런 결정을 내린 건 AI를 이용한 피싱 공격이 그만큼 심각해졌다는 뜻이야. 다만 휴대폰을 잃어버리거나 배터리가 없으면 돈을 못 찾을 수도 있다는 약점은 그대로 남아있어.\n\n오늘 하루를 정리하면, 전쟁 뉴스에서는 '작은 인도주의적 성과(올레슈키 대피)'와 '작은 군사 행동(이란 공습)'이 동시에 일어나면서 큰 틀의 타결은 여전히 멀지만 조금씩 움직이고 있다는 걸 보여줬어. 경제 쪽에서는 호주 은행 실적이 지난주 AI주 충격에서 시선을 돌리게 했고, 한국에서는 지금 잘나가는 산업(조선·반도체)도 재투자를 소홀히 하면 중국에 따라잡힐 수 있다는 경고와, 탈탄소는 하고 싶어도 돈이 안 되면 못 한다는 현실이 동시에 드러났어. 그리고 집라인과 MUFG는 각자 다른 방식으로 'AI·기술이 바꾸는 미래'에 베팅하고 있었던 하루였어."
};

if(BRIEFING.industry){ const ind=BRIEFING.industry; const indRows=[["밸류체인",ind.valueChain],["비즈니스모델",ind.bm],["경쟁력 요소",ind.ksf],["최대 이슈",ind.issue]].map(([lab,val])=>fieldRow(lab,esc(val))).join(""); html += `<section class="block" id="industry"><div class="shead"><span class="no">🏭</span><h2>오늘의 산업 소개</h2><span class="slug">Industry</span></div><div class="industrycard"><span class="ik">🏭 오늘의 산업 소개</span><div class="iname">${esc(ind.name||"")}</div><div class="ifields">${indRows}</div></div></section>`; }
if(BRIEFING.bcg && BRIEFING.bcg.length){ const bcgItems=BRIEFING.bcg.map(b=>`<div class="bcgitem"><div class="btitle">${esc(b.titleKo)}</div><div class="borig">${esc(b.title)}</div><p class="bsum">${esc(b.summary)}</p><div class="bsw"><b>So What</b> — ${esc(b.soWhat)}</div><a class="blink" href="${esc(b.url)}" target="_blank" rel="noopener">원문 보기 ↗</a></div>`).join(""); html += `<section class="block" id="bcg"><div class="shead"><span class="no">📘</span><h2>BCG 인사이트</h2><span class="slug">BCG Publications</span></div>${bcgItems}</section>`; }
if(BRIEFING.hkmarket){ const hk=BRIEFING.hkmarket; const hkTopics=(hk.topics||[]).map(t=>`<div class="hktopic"><div class="httl">${esc(t.topic)}</div><div class="hdet">${esc(t.detail)}</div></div>`).join(""); html += `<section class="block" id="hkmarket"><div class="shead"><span class="no">📺</span><h2>한경코리아마켓</h2><span class="slug">YouTube Morning Brief</span></div><div class="hkmeta">${esc(hk.broadcastLabel||"")} · <a href="${esc(hk.videoUrl||"")}" target="_blank" rel="noopener">${esc(hk.videoTitle||"원본 방송 보기")} ↗</a></div>${hkTopics}</section>`; }
$("#main").innerHTML = html;
$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: BBC · ABC · 조선비즈(산업) · TechCrunch · ZDNet · Gizmodo · 일본 주요 경제매체 · BCG · 한경코리아마켓(유튜브) — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장.<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

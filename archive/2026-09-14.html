  "story": "오늘 국제뉴스에서 제일 심각하게 봐야 할 건, 예멘의 후티 반군이 이제 사우디아라비아 본토까지 직접 공격하기 시작했다는 거야. 어젯밤 사이에 사우디 남서쪽 나즈란 지역에 있는 군기지를 미사일로 때렸다고 주장했고, 홍해 근처 마을에는 실제로 발사체가 떨어져서 주민 2명이 다치고 이슬람 사원(모스크)까지 부서졌어. 원래 후티는 지난주에 홍해로 나가는 좁은 물길인 '바브엘만데브 해협'을 통째로 손에 넣은 상태였는데, 이제는 그 여세를 몰아 아예 사우디 땅 안쪽까지 밀고 들어온 거야. 사우디의 실권자인 무함마드 빈살만 왕세자가 트럼프 대통령한테 '우리 대신 미군이 후티를 좀 때려달라'고 두 번이나 부탁했는데 둘 다 거절당했다는 것도 눈에 띄는 대목이야—미국조차 이 전쟁에 더 깊이 발을 담그기는 부담스러워한다는 뜻이거든. 유엔의 예멘 담당 특사는 이 상황을 '지금까지보다 더 위험한 새 국면'이라고 경고했어.\n\n이렇게 중동이 계속 흔들리다 보니, 그 여파가 미국 물가에도 고스란히 나타났어. 미국의 8월 소비자물가지수(CPI)가 1년 전보다 3.4% 올랐는데, 이건 목표치인 2%보다 훨씬 높은 수준이야. 그중에서도 휘발유값이 8월 한 달에만 거의 4%나 뛰면서, 전체 물가 상승분의 3분의 1을 휘발유 혼자 만들어낸 셈이야. 실제로 미국 평균 휘발유 가격은 갤런당 4.29달러까지 올랐는데, 이건 전쟁 전보다 1.3달러 넘게 비싸진 거고, 디젤은 갤런당 6달러로 역대 최고치를 찍었어. 이렇게 기름값이 오르면 물건을 실어나르는 비용도 같이 오르니까, 결국 식료품이나 옷값까지 줄줄이 오르는 거야. 심지어 미국 중앙은행(연준) 안에서도 '금리를 올려야 한다'는 목소리가 2016년 이후 가장 많이 나왔을 정도로, 다들 이 상황을 심각하게 보고 있어.\n\n국내로 눈을 돌리면, 통신사 KT가 재밌는 소식을 냈어. 네덜란드 암스테르담에서 열린 세계 최대 방송장비 박람회에서, KT가 미국 반도체 회사 암로직이랑 손잡고 셋톱박스에 들어가는 핵심 칩셋을 안정적으로 공급받기로 약속한 거야. 요즘처럼 반도체 공급망이 이리저리 흔들리는 시기에, 미리 믿을 만한 파트너를 확보해두겠다는 전략이지. 같은 날 또 다른 소식으로는, 삼성전자랑 SK하이닉스가 서로 질세라 반도체 공장(팹)을 계속 늘리고 있는데, 이 팹을 지을 때 꼭 필요한 배관이랑 화학물질 공급 설비(CCSS)를 만드는 협력업체들도 덩달아 특수를 누리고 있다는 거야. 올해 전 세계 메모리 반도체 공장 투자액만 70조원에 달하는데, 이건 작년보다 29%나 늘어난 규모야. 대표적으로 한양이엔지라는 회사는 삼성 미국 테일러 공장이랑 SK하이닉스 용인 공장 공사에 동시에 이름을 올리고 있고, 최근에는 해외 공사 계약만 1200억원어치를 새로 따냈어. 다만 전문가들은 이렇게 일감이 쌓인다고 무조건 좋은 게 아니라, 그 일감을 실제로 이익으로 바꿔낼 시공 능력이 있어야 진짜 돈이 된다고 짚었어.\n\n미국 테크 업계에서는 AI 안전을 둘러싼 논쟁이 뜨거웠어. 오픈AI랑 앤스로픽에서 3년간 일했던 27살 연구원이 회사를 그만두면서 'AI 회사들이 스스로 더 똑똑해지는 초지능을 향해 브레이크 없이 질주하고 있다'는 글을 SNS에 올렸는데, 하루 만에 7600만 번이나 조회될 정도로 큰 화제가 됐어. 그러자 앤스로픽의 안전 담당 책임자까지 나서서 '나도 앞으로 10년 안에 AI가 인류를 위협할 확률이 10%는 넘는다고 본다'고 인정했고, 결국 앤스로픽의 CEO 다리오 아모데이가 직접 '우리가 스스로 개발 속도를 늦추자'는 제안을 내놨어. 심지어 오픈AI, 일론 머스크의 xAI, 구글까지 이 제안에 동의한다고 밝혔는데—원래 서로 죽어라 경쟁하던 회사들이 '다 같이 천천히 가자'고 합의한 셈이라 꽤 이례적인 장면이야. 다만 회사들끼리 이렇게 '속도를 맞추자'고 짜면 자칫 담합으로 보일 수 있어서, 미국 정부가 중간에서 이 합의가 법적으로 문제없게 조율해주자는 아이디어까지 함께 나왔어.\n\n일본에서는 중앙은행인 일본은행이 다음 주에 기준금리를 1.25%까지 올릴 거라는 소식이 유력하게 나왔 if(BRIEFING.hkmarket){ const hk=BRIEFING.hkmarket; const hkTopics=(hk.topics||[]).map(t=>`<div class="hktopic"><div class="httl">${esc(t.topic)}</div><div class="hdet">${esc(t.detail)}</div></div>`).join(""); html += `<section class="block" id="hkmarket"><div class="shead"><span class="no">📺</span><h2>한경코리아마켓</h2><span class="slug">YouTube Morning Brief</span></div><div class="hkmeta">${esc(hk.broadcastLabel||"")} · <a href="${esc(hk.videoUrl||"")}" target="_blank" rel="noopener">${esc(hk.videoTitle||"원본 방송 보기")} ↗</a></div>${hkTopics}</section>`; }
$("#main").innerHTML = html;
$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: BBC · ABC · 조선비즈(산업) · TechCrunch · ZDNet · Gizmodo · 일본 주요 경제매체 · BCG · 한경코리아마켓(유튜브) — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장.<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

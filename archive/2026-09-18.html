  "story": "오늘 국제뉴스에서는 유럽에서 흥미로운 외교 소식이 나왔어. 우르줄라 폰데어라이엔 유럽연합(EU) 집행위원장이 프랑스 스트라스부르에서 열린 연설에서, 캐나다를 EU 사상 처음으로 '준회원'이라는 새로운 지위로 받아들이고 싶다고 밝혔어. 준회원이라는 게 EU 역사에 한 번도 없었던 개념이라 구체적으로 어떤 자격을 주는 건지 정해진 규칙조차 아직 없대. 왜 갑자기 이런 제안이 나왔냐면, 캐나다는 수출의 70%나 미국에 의존하고 있는데 트럼프 대통령이 계속 관세로 압박하고 심지어 '캐나다를 미국의 51번째 주로 만들겠다'는 말까지 하니까, 캐나다가 미국 대신 유럽 쪽으로 눈을 돌리게 된 거야. 이번에 제안된 파트너십에는 제조업·기술·국방·에너지·배터리·AI까지 정말 다양한 분야가 담겨 있어서, 앞으로 국제관계가 '미국이냐 유럽이냐'로 크게 재편될 수도 있다는 걸 보여주는 사건이야.\n\n경제 쪽에서는 어제(16일) 미국 연준(Fed)이 금리를 올려서 증시가 떨어졌던 충격이, 하루 만에 상당 부분 되돌려졌다는 소식이 있었어. 사우디아라비아가 드론 공격으로 멈춰있던 핵심 송유관을 며칠 안에 절반 정도는 다시 돌리겠다고 밝히면서 국제유가가 3%가까이 떨어졌거든. 유가가 배럴당 102~104달러 선까지 내려오니까 '물가가 더 오를까봐' 걱정했던 투자자들이 안심하면서, 나스닥은 하루 만에 1.56% 오르고 다우존스도 0.68% 올라서 전날 631포인트(1.21%) 급락했던 걸 상당 부분 만회했어. 이게 재밌는 건, 사우디 송유관이 진짜로 다 고쳐진 게 아니라 '고쳐질 것 같다'는 소식만으로도 시장이 이렇게 크게 움직였다는 거야. 그만큼 요즘 시장이 얼마나 예민하게 반응하고 있는지 보여주는 사례야.\n\n국내로 오면, 오늘 가장 눈에 띈 소식은 배달의민족을 둘러싼 지각변동이야. 네이버가 배달의민족을 운영하는 우아한형제들 인수를 아예 접겠다고 공식 발표했어. 원래 지난 5월에는 네이버가 우버랑 손잡고 배달의민족 모회사인 딜리버리히어로(DH) 지분을 8조원에 같이 사려고 했었는데, 지난 7월 우버가 'DH 전체를 22조원에 나 혼자 다 살게'라고 나서면서 상황이 완전히 바뀐 거야. 우버가 통째로 인수하겠다고 하니까 네이버 입장에서는 굳이 소수 지분만 들고 낄 이유가 없어진 거고, 그래서 네이버는 검색·쇼핑·AI 세 가지 핵심 사업에만 집중하겠다고 발을 뺀 거야. 결과적으로 우리나라 1위 배달앱인 배달의민족의 실질적인 주인이 미국 회사 우버로 넘어가는 큰 변화가 진행되고 있는 셈이야.\n\n두 번째 국내 소식은 ㈜두산 얘기야. 두산이 반도체 기판에 들어가는 핵심 소재인 '동박적층판(CCL)'을 만드는 공장을 늘리는 데 1조원 가까이 투자한다고 밝혔는데, 이게 두산 역사상 가장 큰 단일 투자래. 국내에는 광모듈용 라인을 늘리는 데 4200억원, 중국에는 AI가속기·네트워크스위치용 새 공장을 짓는 데 5500억원을 각각 쓰는데, 2028년 하반기부터 순차적으로 가동한대. CCL은 반도체를 얹는 기판의 재료인데, 특히 AI 데이터센터에 들어가는 고성능 제품은 신호 손실을 최소화하는 기술이 어려워서 아무나 못 만든대. 두산은 50년 가까이 이 기술을 쌓아온 덕분에 이미 글로벌 AI 반도체 회사들에 소재를 공급하고 있었는데, 요즘 AI 데이터센터 건설 붐이 불면서 수요가 폭증하니까 선제적으로 투자를 늘린 거야.\n\n테크 업계에서는 미국의 AI 인프라 회사 '크루소'가 3조9000억원(39억달러)이라는 어마어마한 투자를 유치해서 기업가치를 30조9000억원으로 인정받았다는 소식이 있었어. 크루소는 원래 2018년에 남는 천연가스로 암호화폐를 캐던 회사였는데, AI 붐이 불면서 아예 AI 인프라 회사로 변신했어. 이 회사가 특별한 이유는, 데이터센터를 미리 공장에서 만들어놓고 트럭에 실어서 전기가 남는 곳으로 옮기는 '이동식 AI 공장(스파크)'을 만든다는 거야. 보통 데이터센터를 지으려면 몇 년씩 걸리는데, 이렇게 하면 몇 주 만에 끝낼 수 있대. 이미 190조원어치 계약을 확보했고, 퀀트 트레이딩 회사 제인스트리트랑도 18조원짜리 5년 계약을 맺었을 정도로 잘 나가고 있어.\n\n마지막으로 일본에서는 예고됐던 대로 일본은행(BOJ)이 기준금리를 1.0%에서 1.25%로 올렸다는 소식이 나왔어. 1.25%면 1995년 이후 31년 만에 가장 높은 수준이야. 원래 6월에 한 번 올렸었는데 이번에 또 올린 거라 지금까지 중 가장 짧은 간격(3개월 만)의 인상이래. 왜 올렸냐면 미국이랑 똑같은 이유인데, 국제유가가 오르고 엔화가 약세인 데다 AI 관련 수요까지 겹쳐서 물가가 계속 오를 위험이 크기 때문이야. 근데 재밌는 건, 우에다 가즈오 총재가 '다음엔 언제 또 올릴 거냐'는 질문에는 끝까지 구체적인 답을 안 했다는 거야. 그냥 '경제랑 물가 상황 봐가면서 조정하겠다'는 원론적인 말만 반복했는데, 이렇게 애매하게 남겨두는 것 자체가 시장에는 또 다른 불확실성이 될 수 있어.\n\n오늘 하루를 정리하면, 국제사회에서는 EU가 캐나다를 새로운 파트너로 끌어들이려 하는 가운데 미국 증시는 사우디 송유관 복구 기대감에 하루 만에 급락분을 되돌렸고, 국내에서는 네이버가 배달의민족 인수를 접으면서 우버가 국내 배달 시장의 실질적 주인으로 떠올랐으며 두산은 AI 데이터센터 수요를 노리고 역대 최대 투자를 결정했어. 미국에서는 AI 인프라 회사 크루소가 초대형 투자를 유치했고, 일본은행은 예고대로 31년 만의 최고 금리를 실제로 단행하면서도 다음 수는 함구하는 모습을 보였지—결국 유가·금리·AI 인프라라는 세 가지 큰 흐름이 세계 곳곳에서 서로 다른 방식으로 오늘 하루를 관통한 거야."

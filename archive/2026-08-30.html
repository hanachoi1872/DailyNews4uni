  "story": "오늘은 아프리카에서 일어난 긴박한 사건으로 하루를 열어볼게. 서아프리카의 니제르라는 나라 수도 니아메이에서 토요일 새벽에 군인들이 쿠데타를 일으키려다 실패한 사건이 있었어. 젊은 장교들이 공항이랑 대통령궁을 기습 공격했고, 몇 시간 동안 총소리랑 폭발음이 이어지면서 국영 방송까지 잠깐 끊겼대. 사실 지금 니제르를 이끄는 티아니 대통령 자신도 2023년에 쿠데타로 권력을 잡은 사람인데, 이번엔 그 사람이 또 다른 쿠데타의 타깃이 된 거야. 정부군이 다시 통제권을 되찾긴 했지만, 니제르는 세계적인 우라늄 생산국이라 이런 정치적 불안이 반복되면 핵연료 공급망에도 영향을 줄 수 있어서 계속 지켜봐야 하는 이슈야.\n\n미국 쪽에서는 이웃 나라 캐나다랑 무역 전쟁이 더 커졌어. 원래 8월 중순까지는 양국이 철강·알루미늄 관세를 절반으로 깎는 합의에 가까워 보였는데, 협상이 갑자기 틀어지면서 미국이 캐나다산 제품에 50%까지 관세를 새로 매겼어. 그러자 캐나다도 가만있지 않고 미국산 제품 700개 품목에 최고 50%짜리 보복관세로 맞불을 놨는데, 그 규모가 연간 약 27조6000억원어치야. 캐나다 마크 카니 총리는 아예 \"우리는 미국과 전쟁 중\"이라고까지 표현했는데, 이렇게 오래 우방이던 두 나라조차 관세 갈등으로 얼마든지 사이가 틀어질 수 있다는 걸 보여주는 사례야.\n\n한국에서는 환율 이야기가 눈에 띄었어. 원·달러 환율이 1372원까지 떨어졌는데, 이게 거의 1년 만에 가장 낮은 수준이래. 이유가 재밌는 게, SK하이닉스가 미국에서 주식을 상장해 조달한 265억달러(약 36조원)라는 어마어마한 돈이 국내로 들어온 영향이 크다는 거야. 여기에 회사들이 세금 낼 돈(법인세 중간예납)을 마련하려고 달러를 원화로 바꾼 것도 겹쳤어. 이렇게 원화 가치가 오르면 항공사나 식품회사처럼 달러로 물건을 사 오는 회사는 좋지만, 조선업처럼 수출로 달러를 벌어들이는 회사는 오히려 손해를 보는 정반대 효과가 생겨.\n\n반도체 쪽에서는 중국의 도전이 심상치 않아. 중국 최대 D램(컴퓨터 메모리) 회사인 CXMT라는 곳이 상반기에만 매출 30조8000억원, 순이익 15조8000억원을 벌어들이면서 작년 상반기 적자에서 완전히 흑자로 돌아섰어. 이 이익 규모가 벌써 삼성전자(11조8800억원)나 SK하이닉스(13조4270억원)의 10분의 1 수준까지 따라잡은 거야. AI 붐 덕분에 메모리 수요가 폭발하니까 삼성·SK하이닉스는 돈 되는 고급 제품(HBM)에 집중하는 사이, CXMT 같은 중국 회사가 그 틈을 타서 저가형 메모리 시장을 빠르게 잠식하고 있는 거지.\n\n미국 테크 업계 최대 이슈는 엔비디아 소식이었어. 엔비디아가 오픈소스 AI 모델을 공유하는 플랫폼 '허깅페이스'를 129억달러(약 17조7000억원)에 인수하기로 했다는 보도가 나왔는데, 이게 성사되면 2020년 8조6000억원에 샀던 멜라녹스를 훌쩍 넘는 엔비디아 역대 최대 인수합병이 돼. 왜 이렇게 큰돈을 쓰냐면, 허깅페이스는 전 세계 개발자들이 AI 모델을 올리고 내려받는 대표 플랫폼이라, 이걸 손에 넣으면 '어떤 AI 모델이 표준이 될지'를 결정하는 힘까지 갖게 되기 때문이야. 반도체만 잘 만드는 회사에서 AI 생태계 전체를 손아귀에 넣으려는 회사로 변신하고 있는 셈이지.\n\n마지막으로 일본에서는 스미토모상사라는 회사 이야기야. 이 회사가 미국 항공기 리스(임대) 회사인 에어리스코퍼레이션을 인수해서, 앞으로 2000대가 넘는 항공기를 굴리는 세계 최대 리스 회사가 되겠다는 목표를 내놨어. 항공사들이 요즘 비행기를 직접 사는 대신 빌려 쓰는 경우가 많다 보니, 비행기를 사서 빌려주고 임대료를 받는 사업이 꽤 안정적인 돈벌이가 되거든. 스미토모상사처럼 원래 무역 중개를 하던 일본의 '종합상사'들이 이제는 자산을 직접 사서 운용하는 회사로 계속 영역을 넓혀가고 있다는 걸 보여주는 사례야.\n\n오늘 하루를 묶어보면, 세계 곳곳에서 '기존 질서에 대한 도전'이 눈에 띄었던 하루야. 니제르에서는 군부 정권이 또 다른 쿠데타 시도에 흔들렸고, 미국·캐나다는 오 $("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

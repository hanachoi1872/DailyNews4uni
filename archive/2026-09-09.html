          "f3": "이 사례는 반도체 기업이 하드웨어 경쟁력만으로는 AI 생태계 전체를 장악할 수 없다는 걸 보여주는 사례예요. 엔비디아는 GPU 시장에서 압도적 지위를 갖고 있지만, 개발자들이 실제로 모델을 찾고 배포하는 '입구' 역할을 하는 플랫폼을 갖고 있지 않았는데, 허깅페이스 인수로 그 마지막 퍼즐을 채운 셈이에요. 컨설팅 관점에서는 반도체·AI인프라 밸류체인에 있는 클라이언트에게 경쟁우위를 조언할 때, 하드웨어 성능 경쟁뿐 아니라 개발자가 모델을 발견·배포·거래하는 '플랫폼 계층'을 누가 쥐고 있는지까지 함께 봐야 진짜 경쟁구도를 파악할 수 있다는 교훈을 줘요. 다만 엔비디아가 '개방성은 유지하겠다'고 공언한 것과 별개로, 자사 GPU 생태계 밖의 경쟁 클라우드·추론 서비스에게도 허깅페이스가 계속 공정한 입구 역할을 할 수 있을지는 규제당국과 개발자 커뮤니티 모두가 예의주시할 지점이에요."

  "story": "오늘 국제 뉴스에서 제일 큰 사건은 예멘의 후티 반군이 사우디아라비아를 미사일로 공격한 거야. 후티는 이란의 지원을 받는 무장 세력인데, 화요일 새벽에 사우디 남부의 아브하·자잔·나즈란·카미스무샤이트라는 도시들의 민간·경제시설을 공격해서 여성과 어린이를 포함한 73명이 다쳤어. 사우디를 이끄는 연합군은 이걸 '심각한 도발'이라고 부르면서 강하게 보복하겠다고 했는데, 이게 왜 중요하냐면 6개월 넘게 이어져온 미국-이란 전쟁이 이제 미국과 직접 붙는 게 아니라 이란이 지원하는 '대리세력'을 통해 사우디아라비아 같은 제3국까지 끌어들이는 새로운 국면으로 번졌다는 뜻이거든. 게다가 하루 전에는 미국 국방장관이 '이란이 미군을 공격하면 유조선을 격침하겠다'고 경고하니까, 이란 국회의장이 SNS에 '우리를 때리면 너희 석유 시설도 노출돼 있으니 각오하라'고 맞받아치는 등, 말로 하는 전쟁도 점점 더 거칠어지고 있어.\n\n이 공격 소식이 전해지자마자 세계 증시가 출렁였어. 유가가 뛰면서 미국의 다우존스 지수는 1.2% 내린 5만2786에, 나스닥은 0.3% 내린 2만6421에 마감했고, 일본 닛케이225 지수는 장 초반에는 올랐다가 결국 1.7% 내린 6만5269로 끝났어. 닛케이가 이렇게 크게 떨어진 데는 유가 말고 다른 이유도 있었는데, 바로 엔화가 달러당 153엔대까지 강해진 거야. 엔화가 강해지면 해외에서 물건을 팔아 번 돈을 엔화로 바꿀 때 손해를 보게 되니까, 수출을 많이 하는 일본 대기업 주가에는 오히려 나쁜 소식인 거지. 결국 오늘 아시아 증시는 '유가'라는 이유 하나와 '환율'이라는 이유 하나, 완전히 다른 두 가지 이유가 겹쳐서 동시에 흔들린 하루였어.\n\n이 유가 상승이 한국 증시에도 그대로 영향을 미쳤는데, 재밌는 건 업종마다 반응이 정반대였다는 거야. 국제유가가 배럴당 100달러에 바짝 다가서면서(브렌트유 97.92달러, WTI 93.03달러) 정유회사와 조선회사는 오히려 웃었어. 정유사는 원유를 미리 싸게 사놨다가 나중에 기름값이 오르면 그 차익을 고스란히 이익으로 챙길 수 있는 구조거든. 반면 석유화학·항공·해운 회사들은 정반대야. 이 회사들은 원유(또는 그걸로 만든 연료·원료)를 '사서 쓰는' 입장이라 기름값이 오르면 그대로 비용 부담이 커지거든. 실제로 요즘 전 세계적으로 경유 공급량이 하루 130만~140만 배럴이나 부족한 상태라, 이 여파가 해운업계를 특히 힘들게 하고 있어. 똑같은 '유가 상승'이라는 뉴스 하나가 어떤 회사한테는 호재, 어떤 회사한테는 악재가 되는 게 바로 이런 이유 때문이야.\n\n한국 배터리 회사들 사이에서도 큰 흐름이 있었어. LG에너지솔루션·삼성SDI·SK온, 이 세 회사가 미국의 '에너지저장장치(ESS)'용 배터리 수주를 놓고 치열하게 경쟁하고 있다는 소식이야. ESS는 태양광이나 풍력 같은 재생에너지로 만든 전기를 저장해뒀다가 필요할 때 꺼내 쓰는 대형 배터리 창고라고 생각하면 돼. 요즘 AI 데이터센터가 워낙 전기를 많이 먹다 보니 이런 저장장치 수요가 폭발적으로 늘었는데, 그동안 이 시장을 꽉 잡고 있던 중국 배터리 회사들이 미국의 새로운 관세 정책(무역법 301조) 때문에 힘을 잃고 있어. 그 틈을 한국 회사들이 파고든 거야. 실제로 삼성SDI는 테슬라와 3조원대 계약을 맺었고, LG에너지솔루션도 테슬라 쪽과 연 40GWh(6조원 규모까지 늘어날 수 있는) 계약을 추진 중인데, 이 덕분에 LG에너지솔루션은 1분기 2078억원 적자에서 2분기에는 1133억원 흑자로 돌아섰어.\n\n미국에서는 엔비디아가 오픈소스 AI 플랫폼인 허깅페이스를 129억3000만달러(약 18조원)에 인수하기로 확정했다는 소식이 나왔어. 허깅페이스는 전 세계 1800만 명이 넘는 개발자가 AI 모델을 올리고 내려받는 '앱스토어' 같은 곳인데, 엔비디아는 그동안 GPU라는 하드웨어로 AI 시장을 지배해왔지만 정작 개발자들이 실제로 모델을 찾고 쓰는 '입구' 역할을 하는 플랫폼은 갖고 있지 않았어. 이번 인수로 그 마지막 퍼즐을 채운 셈이야. 다만 엔비디아 CEO 젠슨 황은 '허깅페이스는 계속 개방된 플랫폼으로 남을 거고, 엔비디아 제품을 안 써도 된다'고 강조했는데, 이건 이번 인수로 허깅페이스가 폐쇄적으로 변할까 봐 걱정하는 개발자들을 안심시키려는 말이었어.\n\n일본에서는 삼성전자가 요코하마에 AI 반도체 관련 연구시설을 새로 열었다는 소식이 있었어. 이 시설은 반도체를 다 만들고 나서 여러 개의 칩을 하나로 쌓거나 포장하는 '후공정'이라는 마무리 작업에 집중하는 곳인데, 삼성전자가 굳이 일본에 이 시설을 세운 이유는 이 분야에 필요한 접착제·기판 같은 정밀 소재 기술을 일본 회사들이 세계 최고 수준으로 갖고 있기 때문이야. 삼성전자는 이 시설에 약 3000억원을 투자하고, 일본 정부는 최대 1억4000만달러(약 2000억원)를 보조금으로 지원하기로 했어. 한국이 반도체를 만드는 기술(전공정)에서는 세계 최강이지만, 그 반도체를 최종 제품으로 완성하는 소재·기술은 여전히 일본에 기대야 한다는 걸 보여주는 사례야. 오늘 하루를 정리하면, 중동에서는 이란의 대리세력이 사우디를 공격하며 전쟁이 새로운 전선으로 번졌고, 그 여파로 세계 증시가 출렁이면서 한국에서는 정유·조선과 석유화학·항공·해운의 희비가 갈렸고, 배터리 3사는 미국 시장에서 중국의 빈자리를 놓고 경쟁했고, 미국에서는 엔비디아가 AI 플랫폼까지 손에 넣었고, 일본에서는 삼성전자가 반도체 후공정 기술을 배우러 갔던 하루였어 — 겉보기엔 다 달라 보이는 이 이야기들 모두, '한쪽의 위기나 변화가 다른 쪽에는 곧바로 기회나 위협으로 연결된다'는 하나의 흐름으로 이어져 있어.",

if(BRIEFING.hkmarket){ const hk=BRIEFING.hkmarket; const hkTopics=(hk.topics||[]).map(t=>`<div class="hktopic"><div class="httl">${esc(t.topic)}</div><div class="hdet">${esc(t.detail)}</div></div>`).join(""); html += `<section class="block" id="hkmarket"><div class="shead"><span class="no">📺</span><h2>한경코리아마켓</h2><span class="slug">YouTube Morning Brief</span></div><div class="hkmeta">${esc(hk.broadcastLabel||"")} · <a href="${esc(hk.videoUrl||"")}" target="_blank" rel="noopener">${esc(hk.videoTitle||"원본 방송 보기")} ↗</a></div>${hkTopics}</section>`; }
$("#main").innerHTML = html;
$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: BBC · ABC · 조선비즈(산업) · TechCrunch · ZDNet · Gizmodo · 일본 주요 경제매체 · BCG · 한경코리아마켓(유튜브) — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장.<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

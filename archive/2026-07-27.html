       source:{name:"Bloomberg",url:"https://www.bloomberg.com/news/articles/2026-07-26/oil-tumbles-as-us-and-iran-pause-military-strikes-markets-wrap",date:"2026.07.26"},
       f1:"미국과 이란이 26일(현지시간) 이틀 연속 공습을 중단했다. 오만·파키스탄 등 중재국을 통한 외교 채널이 재가동되면서, 13일 연속 이어지던 공습이 처음 멈춘 지 이틀 만에 양측 모두 추가 공격을 자제하는 국면이 이어지고 있다. 이 소식에 브렌트유는 장중 한때 7% 넘게 급락하며 배럴당 90달러 아래로 떨어졌고, 나스닥100 선물은 1% 넘게 올랐다.",
       f2:"네타냐후 이스라엘 총리는 28일 백악관에서 트럼프 대통령을 만난다. 이스라엘 측은 이 자리에서 이란의 새 최고지도자 모즈타바 하메네이 체제 하에서 핵 프로그램 재건이 가속화되고 있다는 정보를 공유할 계획이라고 밝혔다. 트럼프 대통령은 전면적인 재공습 여부를 아직 결정하지 않았다면서도, 이란이 협상에 좀 더 진지해지고 있다고 언급해 외교적 여지를 남겼다.",
       f3:"이틀 연속 공습 중단이라는 신호만으로 유가가 급락하는 것은, 시장이 이 국면을 '휴전'이 아니라 '일시 정지'로 받아들이고 있다는 뜻이다. 에너지·물류 클라이언트를 자문하는 컨설턴트라면, 이런 급등락 장세에서는 단일 지표(유가)만 보고 헤지 포지션을 확정하기보다 28일 네타냐후-트럼프 회동 같은 다음 촉매 이벤트까지 시나리오를 열어두는 습관이 필요하다는 점을 이 하루의 반전에서 확인할 수 있다.",
       terms:[]},
      {tag:"공급망",title:"中, 희토류 수출통제 내부고발 포상제 7월 시행…IEA '6.5조달러 서방 산업 위험'",
       source:{name:"Bloomberg",url:"https://www.bloomberg.com/news/articles/2026-07-16/iea-risk-china-rare-earth-curbs",date:"2026.07.16"},
       f1:"국제에너지기구(IEA)가 중국의 희토류 수출통제가 전면 시행될 경우 매년 최대 6조5000억달러 규모의 서방 다운스트림 생산이 리스크에 노출될 수 있다고 경고했다. 자동차 산업의 노출 규모가 3조달러 이상으로 가장 크고, 흑연 수출통제까지 전면화될 경우 추가로 약 3000억달러 규모의 생산이 영향권에 들 것으로 분석됐다.",
       f2:"중국 상무부는 7월 1일부터 희토류·갈륨·게르마늄·안티모니 등 전략광물의 수출통제 위반을 신고하는 내부고발 포상 제도를 시행했다. 미허가 수출뿐 아니라 제3국을 경유한 우회수출, 이를 알면서 지원한 물류·금융 중개인까지 연대책임을 묻는 광범위한 제도로, 위반 시 거래액의 5~20%에 달하는 벌금과 수출자격 정지, 실신(失信) 명단 등재 등이 부과된다. 다만 IEA는 미국·말레이시아의 신규 정제 프로젝트가 예정대로 진행되면 중국의 세계 시장 점유율이 현재 85%(2023년 90%)에서 2035년 70%까지 낮아질 수 있다고 전망했다.",
       f3:"규제가 '수출 금지'가 아니라 '단속 강화'와 '연대책임 확대'라는 형태로 오는 것이 핵심이다. 공급망 리스크를 자문하는 컨설턴트라면, 클라이언트에게 '중국이 희토류를 끊을까'라는 이분법적 질문 대신, 물류·금융 중개인까지 컴플라이언스 리스크에 노출되는 지금 구조에서 '우리 공급망의 중개 파트너가 우회수출에 연루될 가능성이 있는가'를 먼저 점검하도록 조언해야 한다.",
       terms:[{t:"내부고발 포상제(Whistleblower Reward Mechanism)",d:"위반행위를 신고한 개인·기관에 포상을 지급해 자발적 신고를 유도하는 규제 집행 수단. 중국이 7월 1일부터 희토류 등 전략광물 수출통제에 도입한 이 제도는 물류·금융 중개인까지 신고·처벌 대상에 포함시켜 감시망을 크게 넓혔다."}]}
    ]},
    {id:"econ",no:"02",title:"글로벌 경제·시장",slug:"Economy",items:[
      {tag:"증시",title:"美 증시 선물 이틀째 랠리…빅테크 실적주간·FOMC 앞두고 오일 진정에 안도",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/07/26/stock-market-today-live-updates.html",date:"2026.07.26"},
       f1:"26일(현지시간) 일요일 밤 미국 증시 선물이 랠리를 이어갔다. 다우존스 선물은 244포인트(0.5%), S&P500 선물은 0.6%, 나스닥100 선물은 1.2% 각각 올랐다. 미국이 이틀 연속 이란 공습을 자제하고 유가가 진정되면서 위험자산 선호 심리가 살아난 결과다.",
       f2:"이번주는 빅테크 실적과 FOMC가 겹치는 '슈퍼위크'다. 시장은 29일 마이크로소프트·메타, 30일 아마존 실적 발표와 함께 28~29일 FOMC 결과를 주시하고 있다. 아시아 증시도 동반 강세를 보여 일본 닛케이지수는 0.24%, 토픽스는 0.60%, 코스피는 0.44%, 코스닥은 1.49%, 호주 ASX200은 0.97% 각각 상승했다.",
       f3:"지정학 리스크가 진정되자마자 실적·통화정책이라는 원래의 변수로 시장의 관심이 곧바로 옮겨가는 이 흐름은, 투자자들이 유가 급등을 일시적 노이즈로 취급하고 있다는 신호로 읽을 수 있다. 매크로를 다루는 컨설턴트라면, 클라이언트에게 지정학 리스크가 잦아든 시점일수록 오히려 실적·금리 같은 펀더멘털 변수에 대한 시나리오를 더 촘촘히 준비해야 한다고 조언해야 한다.",
       terms:[]},
      {tag:"금리",title:"美 국채금리, 유가 진정에 하락 전환…파키스탄·中 중재로 美-이란 대화 재개 기대",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/07/24/treasury-yields-bonds-us-debt.html",date:"2026.07.24"},
       f1:"미국 국채금리가 24일(현지시간) 하락했다. 유가가 진정되고 미국과 이란 간 새로운 평화 협상 기대가 커진 영향이다. 중국의 지원을 받는 파키스탄이 미-이란 대화 재개를 위한 중재에 나선 것으로 알려지며, 전날까지 2025년 1월 이후 최고치(약 4.7%)까지 치솟았던 10년물 금리가 진정 국면에 들어섰다.",
       f2:"하루 전인 23일까지만 해도 브렌트유 100달러 돌파와 신규 관세 발효가 겹치며 Fed 9월 인상 확률이 82%까지 치솟았지만, 이후 이틀 연속 공습 중단 소식이 이어지며 채권시장의 긴축 우려도 함께 완화되는 모습이다. 국채금리와 유가가 같은 방향으로 급등했다가 같은 방향으로 되돌아오는 동조화가 이번 주에도 이어지고 있다.",
       f3:"금리와 유가가 하루이틀 사이에도 급등락을 반복하는 이런 장세는, 숫자 하나로 통화정책 전망을 단정짓는 것이 얼마나 위험한지 보여준다. 금융·매크로 자문을 지망하는 컨설턴트라면, Fed 인상확률 같은 시장 내재 지표를 인용할 때는 반드시 그 지표가 계산된 시점의 유가·관세 가정이 무엇이었는가까지 함께 짚어주는 습관이 필요하다.",
       terms:[{t:"Fed 금리 인상 확률(내재 확률)",d:"연방기금금리 선물 시장 가격에서 역산한, 다음 FOMC에서 금리가 인상될 것으로 시장이 반영하고 있는 확률. 유가·관세 등 인플레이션 관련 뉴스가 나올 때마다 며칠 새 수십%포인트씩 급변할 만큼 변동성이 크다."}]}
    ]},
    {id:"tech",no:"03",title:"테크·AI",slug:"Tech·AI",items:[
      {tag:"AI반도체",title:"오픈AI, 브로드컴과 첫 자체 AI칩 '할라피뇨' 공개…엔비디아 의존도 낮추기",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/06/24/openai-and-broadcom-reveal-jalapeno-first-ai-chip-in-partnership.html",date:"2026.06.24"},
       f1:"오픈AI가 브로드컴과 함께 자체 설계한 첫 AI 추론 전용 반도체 '할라피뇨(Jalapeño)'를 공개했다. 오픈AI 자체 모델의 도움을 받아 단 9개월 만에 설계됐으며, 동급 최고 수준 대비 와트당 성능이 크게 개선됐다는 것이 회사 측 설명이다.",
       f2:"이 칩은 오픈AI와 브로드컴의 10기가와트 규모 전략적 협력의 핵심으로, 올해 말 배치를 시작해 2029년까지 완료될 예정이다. 마이크로소프트가 초기 생산 물량의 약 40%를 구매할 것으로 알려졌으며, 브로드컴 훅 탄 CEO는 할라피뇨가 일반 AI GPU 대비 약 절반 비용으로 추론을 처리한다고 밝혔다. 이번 발표는 오픈AI가 엔비디아 GPU에 대한 사실상 전면 의존 구조에서 벗어나려는 가장 뚜렷한 행보로 평가된다.",
       f3:"최대 고객사가 자체 칩을 만들기 시작했다는 사실 자체가, AI 인프라 산업의 무게중심이 '누가 가장 좋은 모델을 만드는가'에서 '누가 칩·전력·데이터센터를 통제하는가'로 옮겨가고 있음을 보여준다. 테크 산업을 자문하는 컨설턴트라면, 클라이언트의 AI 전략을 짤 때 모델 성능 로드맵만큼이나 핵심 컴퓨팅 자원을 외부에 얼마나 의존하는가에 대한 탈의존화 계획을 함께 제시해야 한다는 점을 확인할 수 있다.",
       terms:[{t:"추론 전용 반도체(Inference Chip)",d:"AI 모델을 새로 학습(training)시키는 대신, 이미 학습된 모델을 실제 서비스에서 실행(추론)하는 데 특화된 반도체. 학습용 GPU보다 저렴하고 전력 효율이 높아, 서비스 규모가 커질수록 비용 절감 효과가 크다."}]},
      {tag:"반도체",title:"마이크론·인텔·AMD, 2분기 시총 2조달러 증가…엔비디아는 15%에 그쳐",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/06/30/ai-chip-rally-in-q2-adds-2-trillion-in-value-to-micron-intel-amd-.html",date:"2026.06.30"},
       f1:"마이크론·인텔·AMD 세 반도체 기업이 2분기(4~6월)에만 시가총액 합산 약 2조달러를 늘리며 각각 미국 기술기업 시가총액 10~12위권에 새로 진입했다. 마이크론이 240% 넘게 급등해 약 9200억달러의 시총을 새로 얻어 상승폭이 가장 컸고, AMD는 거의 3배(약 6150억달러 증가), 인텔은 216% 올라 약 4800억달러가 늘었다.",
       f2:"반면 시가총액 1위 엔비디아는 같은 기간 15% 오르는 데 그쳤다. 마이크론은 AI向 메모리 가격 상승에 힘입어 매출이 전년 대비 4배 넘게 늘었고, 매출총이익률은 1년 전 39%에서 84.9%까지 뛰었다. 바클레이스는 AI 하이퍼스케일러에서 AI '조력자(enabler)' 기업으로 투자자들의 열기가 옮겨가며 반도체 업종 전반이 폭등하고 있다고 분석했다.",
       f3:"업종 1위 기업의 상승률이 오히려 후발주자들보다 훨씬 낮은 이 현상은, AI 밸류체인이 확장될수록 투자자들의 관심이 '누가 최고인가'에서 '누가 지금 가장 저평가된 수혜주인가'로 옮겨간다는 것을 보여준다. 반도체·테크 자문을 지망하는 컨설턴트라면, 클라이언트에게 시장 1위 사업자의 지표만 벤치마크로 제시하기보다, 밸류체인 전반에서 어느 구간이 아직 재평가되지 않았는지를 함께 짚어주는 습관이 실전 자문의 핵심이라는 점을 확인할 수 있다.",
       terms:[{t:"밸류체인 로테이션(Sector Rotation)",d:"투자자들이 특정 산업 내에서 이미 많이 오른 대장주 대신, 아직 덜 오른 관련 기업으로 자금을 옮기는 현상. 2026년 2분기 AI 반도체 랠리에서는 엔비디아 대신 마이크론·AMD·인텔 등 '조력자' 기업으로 투자자 관심이 옮겨간 것이 대표적 사례로 꼽힌다."}]}
    ]},
    {id:"korea",no:"04",title:"한국",slug:"Korea",items:[
      {tag:"반도체",title:"SK하이닉스, 나스닥 ADR 상장으로 265억달러 조달…외국기업 역대 최대 美 IPO",
       source:{name:"한국경제",url:"https://www.hankyung.com/article/202607107721i",date:"2026.07.10"},
       f1:"SK하이닉스가 미국 나스닥 시장에 주식예탁증서(ADR) 형태로 상장하며 공모가 주당 149달러, 총 1억7790만주 발행을 통해 265억700만달러(약 40조원)를 조달했다. 이는 미국 증시에 상장한 외국 기업의 IPO 가운데 역대 최대 규모이자, 미국 증시 전체를 통틀어서도 역대 두 번째로 큰 규모다.",
       f2:"ADR은 SK하이닉스가 국내 유가증권시장 상장을 유지한 채 미국에서도 별도 증서 형태로 거래될 수 있도록 발행하는 것으로, 국내에서는 기존처럼 보통주(000660)로 거래되고 미국에서는 SKHY 티커로 거래된다. 조달한 자금은 용인 반도체 클러스터와 청주 첨단 패키징 공장 건설, 반도체 제조장비 구매 등에 투입될 예정이다.",
       f3:"국내 상장을 그대로 유지한 채 해외에서 대규모 자금을 조달하는 이런 '이중 트랙' 방식은, 지배구조나 상장지 변경 같은 정치적으로 민감한 결정 없이도 글로벌 자본시장에 접근할 수 있는 현실적 대안을 보여준다. 자본시장·M&A 자문을 지망하는 컨설턴트라면, 클라이언트가 해외 자금이 필요할 때 상장지 이전이라는 극단적 선택 이전에 ADR 같은 중간 단계의 조달 수단부터 검토하도록 안내하는 실무 감각을 익혀야 한다.",
       terms:[{t:"주식예탁증서(ADR, American Depositary Receipt)",d:"외국 기업이 본국 증권거래소 상장을 유지한 채, 미국 투자자가 환전이나 해외 계좌 개설 없이 미국 증시에서 거래할 수 있도록 예탁기관을 통해 발행하는 증서. SK하이닉스는 이번 ADR 상장으로 국내 상장은 그대로 둔 채 별도의 미국 자금조달 창구를 새로 확보했다."}]},
      {tag:"부동산정책",title:"이재명 정부, 부동산 정책 대토론회 개최…종부세 '주택 수'서 '가격' 기준 전환 검토",
       source:{name:"한국경제",url:"https://www.hankyung.com/article/2026072292406",date:"2026.07.22"},
       f1:"정부가 22일 부동산 정책 대토론회를 열고 종합부동산세·양도소득세 개편 방향에 대한 각계 의견을 수렴했다. 여론조사에서는 응답자의 44%가 '대출 규제 완화'를 가장 시급한 과제로 꼽아, 보유세 강화에 무게를 둬온 정부 기조와 여론 사이에 온도차가 확인됐다.",
       f2:"정부는 종부세 부과 기준을 현재의 '보유 주택 수'에서 '주택 가격' 기준으로 전환하는 방안을 검토하고 있다. 여러 채를 보유했더라도 합산 가격이 낮으면 세 부담을 낮추고, 반대로 고가의 '똘똘한 한 채'라도 중과하는 방향이다. 장기보유특별공제 역시 단순 보유 기간이 아니라 실거주 기간을 기준으로 재설계하는 안이 함께 논의되고 있으며, 구윤철 부총리는 7월 말 최종 세제개편안을 발표할 예정이다.",
       f3:"과세 기준을 '몇 채를 갖고 있는가'에서 '얼마짜리를 갖고 있는가'로 바꾸는 이 전환은, 정책 설계에서 형식적 지표보다 실질적 가치를 과세 근거로 삼으려는 시도로 볼 수 있다. 정책·공공부문 자문을 지망하는 컨설턴트라면, 규제나 세제를 설계할 때 손쉽게 측정 가능한 지표(주택 수)와 정책 목표에 실제로 부합하는 지표(자산 가치) 사이의 간극을 좁히는 것이 왜 정책 설계의 핵심 과제인지 이 사례를 통해 이해해야 한다.",
       terms:[{t:"종합부동산세(종부세) 과세 기준 전환",d:"현재는 개인이 보유한 주택 수를 기준으로 세율을 차등 적용하지만, 정부가 검토 중인 개편안은 보유 주택의 합산 가격을 기준으로 전환하는 방안이다. 다주택자라도 가격 합계가 낮으면 세 부담이 줄고, 1주택자라도 고가면 세 부담이 늘어나는 구조로 바뀔 수 있다."}]}

    {id:"japan",no:"05",title:"일본",slug:"Japan · MBB",items:[
      {tag:"재정정책",title:"다카이치 내각, 'BOJ 독립성' 못박은 경제정책 청사진 승인…2040년까지 370조엔 투자 목표",
       source:{name:"Japan Times",url:"https://www.japantimes.co.jp/business/2026/07/21/economy/honebuto-cabinet-approval/",date:"2026.07.21"},
       f1:"다카이치 사나에 총리 내각이 21일 연례 경제재정 운영 청사진('호네부토 방침')을 승인했다. 지난 6월 초안이 정부가 일본은행(BOJ) 통화정책에 개입할 수 있다는 인상을 줘 시장을 뒤흔들자, 최종안에는 BOJ법에 명시된 중앙은행의 독립성을 존중한다는 문구를 별도로 못박았다.",
       f2:"이번 청사진은 재정건전화에 대한 명확한 언급 없이, 전략 분야에 대한 공격적 재정지출을 우선하는 기조를 유지했다. 2040회계연도까지 공공·민간을 합쳐 총 370조엔(약 2조3000억달러) 규모의 투자를 유치하겠다는 목표도 명시됐다. 다만 식료품에 대한 소비세 인하 여부는 이번 청사진에서 결론을 내리지 못했으며, 8월 초까지 정부 방침을 확정하기로 했다.",
       f3:"재정은 확장적으로 쓰되 통화정책에는 손대지 않는다는 이 조합은, 정부가 시장 신뢰를 지키면서도 성장 드라이브를 포기하지 않으려는 균형점을 어떻게 잡는지 보여주는 사례다. 거시정책·공공부문 자문을 지망하는 컨설턴트라면, 정부 정책 문서에서 무엇을 명시했는가 못지않게 지난 초안 대비 무엇을 새로 못박았는가를 비교해 읽는 습관이, 시장이 어디에 예민하게 반응했는지를 파악하는 데 핵심이라는 점을 확인할 수 있다.",
       terms:[],
       vocab:{w:"骨太の方針",r:"ほねぶとのほうしん (honebuto no hōshin)",m:"일본 정부가 매년 여름 발표하는 중장기 경제재정 운영의 기본 방침. '뼈대가 굵은 방침'이라는 뜻으로, 이후 예산 편성과 세제개편 등 구체적 정책의 상위 지침 역할을 한다. 이번 청사진에는 이례적으로 BOJ 독립성을 명시하는 문구가 추가됐다."}},
      {tag:"에너지안보",title:"일본, 나프타 '의무비축' 부활 검토…재고 20일치뿐, 중동 의존도는 74%까지 상승",
       source:{name:"Japan Times",url:"https://www.japantimes.co.jp/business/2026/07/16/economy/japan-mulls-naphtha-stockpiling/",date:"2026.07.16"},
       f1:"일본 정부가 나프타(플라스틱 원료) 의무비축 제도의 부활을 검토하고 있다. 나프타는 1993년 석유화학업계의 요청으로 국가 비축 의무 대상에서 제외돼, 현재 민간 재고는 단 20일치에 불과하다. 이는 254일치를 비축하는 원유 국가비축과 비교하면 현저히 낮은 수준이다.",
       f2:"문제는 나프타 수입에서 중동이 차지하는 비중이 2020년 53.1%에서 2024년 73.6%까지 치솟았다는 점이다. 미-이란 전쟁으로 호르무즈 해협을 둘러싼 불확실성이 커지자, 정부는 1993년 폐지됐던 의무비축 제도를 다시 도입하는 방안을 논의 중이지만, 나프타는 휘발성이 높아 저장이 까다롭고 비축 비용을 누가 부담할지를 두고 업계와의 이견이 여전히 남아 있다.",
       f3:"33년 전 비용 부담을 이유로 없앤 제도를, 지금은 공급망 리스크를 이유로 되살리려 하는 이 흐름은, 안보와 비용 중 어느 쪽에 무게를 두느냐가 시대 상황에 따라 뒤바뀔 수 있음을 보여준다. 에너지·화학 산업을 자문하는 컨설턴트라면, 클라이언트의 재고 정책을 설계할 때 지금 비용이 얼마나 드는가뿐 아니라 이 정책을 없앴을 때 나중에 되살리는 비용과 시간이 얼마나 드는가까지 함께 시나리오에 넣어야 한다는 교훈을 이 사례에서 얻을 수 있다.",
       terms:[],
       vocab:{w:"義務備蓄",r:"ぎむびちく (gimu bichiku)",m:"국가가 법으로 특정 물자의 최소 재고 보유를 의무화하는 비축 제도. 원유는 현재도 의무비축 대상이지만, 나프타는 1993년 업계 요청으로 의무비축 대상에서 제외된 뒤 순수 민간 자율 재고(20일치)에만 의존해왔다."}}
    ]},
    {id:"consulting",no:"06",title:"컨설팅업계",slug:"Consulting · MBB",items:[
      {tag:"M&A",title:"액센츄어, 드라고스 등 3사 41억달러에 인수…OT 사이버보안 시장 정조준",
       source:{name:"Accenture(보도자료)",url:"https://newsroom.accenture.com/news/2026/accenture-to-strengthen-critical-infrastructure-defense-with-end-to-end-cybersecurity-platform-in-age-of-ai-driven-cyber-threats-and-geopolitical-risk",date:"2026.06.19"},
       f1:"액센츄어가 산업제어시스템(OT) 사이버보안 기업 드라고스(Dragos)의 지분 과반과, 런제로(runZero)·넷라이즈(NetRise) 전체 지분을 총 41억달러(약 5조7000억원)에 인수한다고 발표했다. 드라고스의 기업가치만 32억5000만달러로 평가됐다.",
       f2:"세 회사를 합친 연간 반복매출(ARR)은 약 2억800만달러로, 전년 대비 53% 성장했다. 액센츄어는 이번 인수로 드라고스의 OT 위협탐지, 런제로의 노출 평가, 넷라이즈의 펌웨어 수준 소프트웨어 공급망 보안 역량을 하나의 플랫폼으로 통합해 270억달러 규모의 OT 보안 시장을 정조준한다는 계획이다. 거래는 2026년 8~9월 중 마무리될 예정이다.",
       f3:"컨설팅펌이 조언을 파는 대신 인수합병을 통해 직접 보안 플랫폼 자체를 소유하려는 이 행보는, 전략 자문 중심의 전통적 컨설팅 비즈니스 모델이 기술 자산을 직접 보유한 통합 서비스 제공자로 확장되고 있음을 보여준다. 컨설팅 업계를 지망하는 후보자라면, 이제 대형 펌의 경쟁력이 얼마나 똑똑한 조언을 하는가뿐 아니라 얼마나 실질적인 기술 자산과 M&A 역량을 보유했는가로도 평가받는다는 점을 채용 준비 과정에서 염두에 둬야 한다.",
       terms:[{t:"OT(Operational Technology) 사이버보안",d:"공장 설비, 전력망, 상하수도 등 산업 제어 시스템을 겨냥한 사이버 위협에 대응하는 보안 분야. IT 보안과 달리 물리적 인프라의 가동 중단이 직결된 리스크를 다루며, AI 기반 사이버 위협이 늘면서 시장이 빠르게 커지고 있다."}]},
      {tag:"채용시장",title:"GMAC 채용담당자 설문 '3명 중 1명, 신입직을 AI로 대체'…MBA도 더는 안전지대 아니다",
       source:{name:"Fortune",url:"https://fortune.com/2026/06/26/gen-z-entry-level-jobs-replaced-by-ai-new-gmac-recruiters-survey-tech-manufacturing-jobs-most-at-risk/",date:"2026.06.26"},
       f1:"MBA 입학시험(GMAT) 주관기관 GMAC가 전 세계 채용담당자 600여명을 대상으로 실시한 '기업 채용담당자 설문(Corporate Recruiters Survey)'에서, 응답자의 3분의 1이 신입직 일부를 AI로 대체하고 있다고 답했다. 응답자의 절반 이상이 포춘 100대·500대 기업 채용을 담당하고 있어, 대기업 채용 현장의 실제 분위기를 반영한 결과로 평가된다.",
       f2:"업종별로는 기술 업종에서 신입직의 40%가 AI로 대체되고 있다고 답해 가장 높았고, 제조업이 뒤를 이었다. 다만 채용담당자들은 여전히 커뮤니케이션·문제해결·적응력 같은 인간 고유의 역량을 채용의 최우선 기준으로 꼽았으며, 향후 5년간 AI 활용 능력에 대한 요구는 가파르게 높아질 것으로 전망했다. 조사는 MBA가 더 이상 자동적인 '탈출구'가 아니라며, 기업들이 기술 역량과 인간적 역량을 동시에 갖춘 졸업생을 요구하고 있다고 결론지었다.",
       f3:"MBA라는 학위 자체보다 AI를 감독하고 그 결과를 검증해 클라이언트에게 스토리로 전달할 수 있는가가 채용의 실질적 기준이 되고 있다는 점이 핵심이다. MBB를 지망하는 후보자라면, 케이스 인터뷰 준비 과정에서 프레임워크 암기만큼이나 실제 AI 도구를 업무에 활용해본 경험과 그 결과물을 검증·설명해본 경험을 구체적 사례로 준비해둬야 한다는 점을 이 설문 결과에서 읽어야 한다.",
       terms:[{t:"GMAC 기업 채용담당자 설문(Corporate Recruiters Survey)",d:"MBA 입학시험(GMAT)을 주관하는 국제기구 GMAC가 매년 전 세계 기업 채용담당자를 대상으로 실시하는 설문. MBA 등 경영대학원 졸업생에 대한 실제 채용 수요와 요구 역량 변화를 추적하는 대표적 지표로 활용된다."}]}

  think:{

const $ = (s,el=document)=>el.querySelector(s);
const esc = s => (s==null?"":String(s));
const nowKST = new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'});
$("#meta").innerHTML = `<b><a href="archive.html" style="text-decoration:underline;text-decoration-color:var(--accent-soft)" title="지난 브리핑 모아보기">${esc(BRIEFING.dateLabel)}</a></b><span>·</span><span>${esc(BRIEFING.city||'Seoul')} · ${nowKST} KST 열람</span>`;
$("#mood").textContent = BRIEFING.mood || "";
$("#heads").innerHTML = BRIEFING.headliners.map(h=>`<li>${esc(h)}</li>`).join("");
const cu = BRIEFING.catchup;
if(cu){ $("#catchup").innerHTML = `<span class="ck">🕰️ 오늘의 따라잡기 — 처음부터 이해하기</span><h3>${esc(cu.topic)}</h3><p class="intro">${esc(cu.intro)}</p><ul class="tl">${(cu.timeline||[]).map(t=>`<li><span class="d">${esc(t.d)}</span>${esc(t.e)}</li>`).join("")}</ul><div class="why">${cu.why||""}</div>`; } else { $("#catchup").style.display="none"; }
const navItems = [...BRIEFING.sections.map(s=>({id:s.id,no:s.no,title:s.title})), {id:"think",no:"💭",title:"생각거리"},{id:"cal",no:"📅",title:"일정"}];
$("#nav").innerHTML = navItems.map(n=> `<a href="#${n.id}" data-id="${n.id}"><span class="n">${esc(n.no)}</span>${esc(n.title)}</a>`).join("");
function srcHtml(s){ if(!s) return ""; const link = s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">원문(${esc(s.date)})↗</a>` : (s.date?` · ${esc(s.date)}`:""); return `<span class="item__src">${esc(s.name)}${link}</span>`; }
function fieldRow(lab,val,cls){return val?`<div class="field ${cls||""}"><span class="lab">${lab}</span><span class="val">${val}</span></div>`:""}
function termsRow(terms){ if(!terms||!terms.length) return ""; return `<div class="terms"><div class="th">📖 용어 풀이</div>${terms.map(t=>`<div class="t"><b>${esc(t.t)}</b> — ${esc(t.d)}</div>`).join("")}</div>`; }
function vocabRow(v){ if(!v) return ""; return `<div class="jword"><span class="jw-badge">🇯🇵 오늘의 비즈니스 일본어</span><span class="jw-text"><b>${esc(v.w)}</b> <span class="jw-r">(${esc(v.r)})</span> — ${esc(v.m)}</span></div>`; }
function itemCard(it){ return `<article class="item open"><button class="item__head" aria-expanded="true" type="button"><span class="tag">${esc(it.tag)}</span><span><span class="item__title">${esc(it.title)}</span><br>${srcHtml(it.source)}</span><span class="chev">▾</span></button><div class="item__wrap"><div class="item__body"><div class="item__inner">${fieldRow("무슨 일",it.f1)}${fieldRow("그동안의 이야기",it.f2,"story")}${fieldRow("So What",it.f3)}${termsRow(it.terms)}${vocabRow(it.vocab)}</div></div></div></article>`; }
let html = BRIEFING.sections.map(s=>`<section class="block" id="${s.id}"><div class="shead"><span class="no">${esc(s.no)}</span><h2>${esc(s.title)}</h2><span class="slug">${esc(s.slug)}</span></div>${s.items.map(itemCard).join("")}</section>`).join("");
if(BRIEFING.think){ const th=BRIEFING.think; const stepsHtml=(th.steps||[]).map(s=>`<li><b>${esc(s.label)}</b> — ${esc(s.detail)}</li>`).join(""); html += `<section class="block" id="think"><div class="think"><span class="tk">💭 오늘의 생각거리 — 컨설턴트처럼 생각하기</span><p>${esc(th.q)}</p><ol class="steps">${stepsHtml}</ol><div class="hint">${th.hint||""}</div></div></section>`; }
const c = BRIEFING.calendar || {macro:[],earnings:[],sources:[]};
html += `<section class="block" id="cal"><div class="shead"><span class="no">📅</span><h2>다가오는 일정</h2><span class="slug">watchlist</span></div><div class="terms" style="border-style:solid">${[...(c.macro||[]),...(c.earnings||[])].map(r=>`<div class="t"><b>${esc(r.date)} ${esc(r.reg||"")} ${esc(r.ev)}</b>${r.nt?` — ${esc(r.nt)}`:""}</div>`).join("")}<div class="th" style="margin-top:8px">${esc(c.note||"")}</div></div></section>`;

$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: Bloomberg · CNBC · BBC · ABC · Reuters · AP + 한국 주요 언론 + 일본 니케이·Japan Times 등 + 컨설팅업계 전문 매체 — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장 · 일정 출처: ${calSrc}<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>

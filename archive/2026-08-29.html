  "story": "오늘은 한반도를 둘러싼 안보 이야기로 하루를 열어볼게. 한국·미국·일본 세 나라가 9월7일부터 닷새 동안 제주도 근처 바다에서 '프리덤 엣지'라는 이름의 연합훈련을 하기로 했어. 미사일 방어부터 잠수함 잡는 훈련, 사이버 방어까지 다 들어있는 큰 훈련인데, 이 발표가 나온 건 북한이 \"미국이 적대 행위를 하고 있다, 강하게 맞대응하겠다\"고 으름장을 놓은 바로 다음 날이었어. 재밌는 건 트럼프 대통령이 얼마 전엔 한미 둘이서 하는 훈련은 오히려 줄이라고 지시했었거든(북한을 자극하지 말자는 의미로). 그런데 세 나라가 같이 하는 이 훈련은 그대로, 심지어 역대 가장 발전된 형태로 진행하기로 한 거야. 미국이 북한을 자극 안 하려는 척하면서도 동맹끼리는 확실히 뭉치겠다는 이중 신호를 보내고 있는 셈이지.\n\n미국에서는 새로 온 연준(미국 중앙은행) 의장 케빈 월시가 잭슨홀이라는 곳에서 한 연설이 시장을 뒤흔들었어. \"경제는 튼튼해 보이지만 물가가 진짜 잡혔다고 보긴 어렵다\"는 매파적(금리를 올리는 쪽을 선호하는) 발언을 했는데, 이 말 한마디에 9월에 금리를 올릴 확률이 하루 만에 35.5%에서 57.5%로 뛰어올랐어. 아시아 증시는 그 전날 엔비디아가 실적을 잘 내서 대체로 올랐는데—일본 닛케이는 0.8%, 대만은 1%나 뛰었어—한국 코스피만 유독 1.79%나 떨어졌어. 이유는 그동안 너무 많이 오른 삼성전자(-3.38%)랑 SK하이닉스(-4.45%) 주식을 외국인·기관 투자자들이 잭슨홀 발표를 앞두고 미리 팔아치웠기 때문이야.\n\n한국 반도체 기업들한테는 또 다른 걱정거리도 생겼어. 미국 정치매체 폴리티코 보도에 따르면, 트럼프 행정부가 수입 반도체에 높은 관세를 매기는 방안을 다시 검토하고 있대. 그런데 \"미국 안에 공장을 지으면 관세를 깎아주겠다\"는 조건이 붙어있어서, 사실상 \"관세 맞기 싫으면 미국에 공장 더 지어\"라고 압박하는 카드로 쓰이고 있는 거야. SK하이닉스는 이미 미국 매출 비중이 전체의 64%나 되고, 삼성전자도 올 상반기 미국 수출이 1년 전보다 두 배 넘게 늘었을 정도로 미국 시장 의존도가 높다 보니, 이런 관세 압박이 통할 수밖에 없는 상황이야.\n\n반도체 붐으로 덕 보는 곳이 삼성전자·SK하이닉스만은 아니야. 고려아연이라는 회사, 원래는 아연이나 납 같은 비철금속을 제련하던 회사인데, 요즘은 반도체 만들 때 웨이퍼를 씻고 깎는 데 쓰는 '초고순도 황산'을 만드는 사업을 키우고 있어. 이번에 생산라인을 하나 더 가동해서 연간 생산량을 28만t에서 32만t으로 늘렸고, 앞으로는 50만t까지 늘릴 계획이래. 원래 하던 금속 제련 과정에서 부산물로 나오는 황을 재활용해 반도체급 황산을 만들 수 있다는 게 이 회사만의 특별한 강점이야.\n\n미국 테크 업계에서는 AI 회사 앤스로픽이 정부를 상대로 이긴 소식이 눈에 띄었어. 트럼프 행정부는 앤스로픽이 \"우리 AI는 완전 자율무기나 시민 대규모 감시에는 쓸 수 없다\"고 선을 그었다는 이유로, 앤스로픽을 '공급망 리스크' 기업으로 지정해서 모든 정부기관이 거래를 끊게 만들었었어. 그런데 연방판사가 \"이건 정부를 비판했다고 보복한 거고, 불법이자 근거가 없다\"고 판결한 거야. 안전 원칙을 지킨 게 오히려 정부와의 사업에서 손해로 돌아올 뻔했는데, 법원이 그걸 막아준 셈이지.\n\n마지막으로 일본에서는 돈을 정말 '어마어마하게' 쓴 이야기가 나왔어. 일본 정부가 7월 말부터 8월 말까지 한 달 동안, 엔화 가치를 지키려고 무려 15조3993억엔을 시장에 쏟아부어서 엔화를 사들였대. 이게 역대 한 달 개입액 중 최대 기록이고, 미국이랑 같이 하는 '협조개입'은 15년 만, 엔화 사들이는 방향의 개입은 28년 만이었어. 그런데 이렇게 큰돈을 썼는데도 엔화 약세 압력 자체는 완전히 사라지지 않았다는 게 문제야. 미국이랑 일본의 금리 차이나 일본 정부의 확장적 재정정책 같은 근본 원인이 그대로 남아있기 때문이지.\n\n오늘 하루를 묶어보면, '동맹은 유지하되 통상은 압박한다'는 미국의 이중적인 태도가 한반도 안보(한미 $("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

  "story": "오늘 세계 뉴스는 중동에서 또 긴장이 치솟은 소식부터 시작할게. 사우디아라비아의 수도 리야드에 있는 킹칼리드 국제공항이 열흘 사이에 벌써 세 번째로 공격을 받았어. 10월 8일 목요일에는 예멘의 후티 반군이 쏜 미사일이 공항 시설과 비행기 한 대를 맞춰서 조종사를 포함해 3명이 숨졌는데, 이틀 뒤인 10일 토요일에는 더 큰 공격이 터졌어. 이번엔 최소 12명이 숨지고 300명 넘게 다쳤는데, 사우디 측은 이걸 '10년 넘는 기간 중 왕국에서 벌어진 최악의 공격'이라고 불렀어. 더 무서운 건 이 공격엔 사전 경보조차 뜨지 않았다는 거야. 미사일 방어망에 구멍이 있다는 뜻이거든. 사우디 연합군은 이걸 '완전한 전쟁범죄'라며 보복을 예고했고, 트럼프 대통령도 미국이 직접 군사작전에 가담할지 검토 중이라고 했어.\n\n국제 경제 쪽은 미국 은행이 대형 벌금을 맞은 소식이야. 미국 재무부가 뱅크오브아메리카(BofA)에 12억 달러(약 1조7000억원)짜리 벌금을 부과했는데, 이건 미국 재무부 역사상 세 번째로 큰 제재금이래. 은행이 자금세탁방지법을 '고의로' 어기고, 50억 달러 넘는 의심스러운 거래를 제때 신고하지 않았다는 걸 스스로 인정했어. 이 의심거래엔 중국계 자금세탁 네트워크와 연결된 거래도 있었다니까, 세계에서 제일 큰 은행조차 돈의 흐름을 다 걸러내진 못한다는 걸 보여준 사건이야. 같은 날 다른 미국 대형 은행들 실적도 엇갈리면서 은행주 지수가 하루 만에 1% 넘게 빠졌어.\n\n국내 소식은 오늘 하루 종일 떠들썩했어. 중국 반도체 회사 창신메모리(CXMT)가 '올해 안에 서버용 차세대 D램을 내놓겠다'고 발표했는데, 이 소식 하나에 삼성전자 주가는 장중 7% 넘게, SK하이닉스는 10% 넘게 빠지면서 코스피가 장 초반 5%대나 급락했어. 한국거래소는 오전 9시 47분에 '매도 사이드카'라는 안전장치를 발동했는데, 이건 35거래일 만에 처음 있는 일이었어. 결국 코스피는 전날보다 348.89포인트(5.46%) 내린 6035.35로 장을 마쳤는데, 중국의 '발표' 하나로 한국 대표 지수가 이렇게 흔들린 건 코스피가 반도체 두 종목에 얼마나 쏠려 있는지를 그대로 보여준 거야. 그런데 같은 날 재미있는 반대 소식도 있었어. 포스코퓨처엠이 세계 최대 배터리 회사인 중국 CATL에 '비(非)중국산' 흑연 음극재를 공급하는 걸 추진 중이라는 거야. 원래는 한국이 저렴한 중국산 흑연을 수입해 쓰는 게 당연했는데, 이제는 미국의 규제 때문에 CATL이 '중국산이 아닌' 소재가 필요해져서 거꾸로 한국산을 찾아온 거지. 아직 포스코퓨처엠의 점유율은 1.7%에 불과하지만, 중국에 의존하지 않는 거의 유일한 공급처라는 희귀한 지위를 갖게 된 셈이야.\n\n테크 쪽은 메타의 큰 발표가 있었어. 메타가 처음으로 '프런티어' AI 모델인 '뮤즈 원더'를 내놨는데, 프런티어 모델이란 무료로 푸는 기존 라마 시리즈와 달리 업계 최고 성능을 노리는 유료 최상위급 모델을 말해. 독립 평가기관은 이 모델이 코딩 작업에서 앤트로픽의 클로드 소네트 5.5와 맞먹는 수준이라고 평가했어. 그동안 '우리는 공짜니까 2등이어도 괜찮다'는 전략을 쓰던 메타가, 이제는 오픈AI·구글·앤트로픽과 정면으로 '최고 성능' 경쟁까지 하겠다고 나선 거야.\n\n일본 얘기는 오므론이라는 공장자동화 회사가 미국의 산업용 PC 회사 온로직을 6750억원에 인수한다는 소식이야. 겉보기엔 평범한 인수합병 같지만 목적이 흥미로워. 챗봇처럼 말로 답하는 AI가 아니라 로봇·공장 설비를 직접 움직이는 '피지컬 AI' 시장을 선점하려는 거지. 이런 AI가 작동하려면 공장의 먼지·열·진동을 견디는 산업용 컴퓨터가 꼭 필요한데, 오므론은 원래 센서·컨트롤러는 잘 만들었지만 이런 산업용 PC는 못 만들었거든. 그래서 이번 인수로 '하드웨어+AI'를 한 번에 갖추게 된 거야.\n\n오늘 하루를 정리하면, 중동에서는 리야드 공항이 열흘 새 세 번이나 뚫리며 전쟁의 위험이 한층 더 높아졌고, 미국에서는 대형 은행조차 자금세탁을 다 걸러내지 못한다는 게 드러났어. 국내에서는 중국의 반도체 추격 발표 하나로 코스피가 출렁였지만 동시에 한국 소재 기업이 거꾸로 중국에 소재를 파는 역전 현상도 일어났고, 테크·일본 쪽에서는 각각 '오픈소스냐 최고성능이냐'를 고민하는 메타와 '챗봇을 넘어 로봇을 직접 움직이는 AI'를 노리는 오므론이라는, 전혀 다른 방향의 AI 경쟁 스토리가 동시에 펼쳐진 하루였어."

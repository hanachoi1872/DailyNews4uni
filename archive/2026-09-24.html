  "story": "오늘 국제뉴스는 미중 정상회담 이야기부터 볼게. 시진핑 주석이 무려 10년 만에 미국 땅을 다시 밟았는데, 트럼프 대통령이 조인트베이스앤드루스 공군기지까지 직접 나가서 레드카펫을 깔고 시진핑 부부를 맞이했어. 심지어 하늘에는 B-1 폭격기가 편대비행을 했고, 활주로에는 F-22와 F-16 전투기가 각각 6대씩 도열해 있었대. 사실상 '이 정도로 예우해준다'는 걸 보여주는 무력시위 겸 환영식이었던 셈이야. 이번 방문은 목요일(24일) 백악관 공식 환영식을 시작으로 3일 동안 이어지는데, 트럼프 취임 후 세 번째 미중 정상회담이고, AI 안전·대만·무역·이란전쟁·희토류까지 다섯 가지 뜨거운 의제가 한꺼번에 테이블에 올라와 있어.\n\n국제 경제 쪽에서는 뉴욕증시가 크게 흔들렸어. 수요일(23일) 미국 10년 만기 국채금리가 5.11%까지 치솟았는데, 이게 2007년 이후 최고치야. 그러다 보니 나스닥은 1.13%, 다우존스는 0.68%, S&P500은 0.75%씩 떨어지면서 3대 지수가 나란히 빠졌어. 이상하게 들릴 수 있는데, 사실 이번 하락의 배경은 '나쁜 소식'이 아니라 '너무 좋은 소식'이었어. 미국의 서비스업·제조업 경기를 보여주는 PMI 지수가 2021년 이후 가장 높게 나오면서 오히려 '경기가 너무 뜨거우니 연준이 금리를 더 올리겠구나' 하는 걱정으로 이어진 거야. 실제로 연준 이사 마이클 바가 '추가 금리인상이 필요하다'고 못박으면서, 시장은 10월에 또 금리가 오를 확률을 70%까지 높여 잡았어.\n\n국내로 오면 삼성전기 이야기가 눈에 띄어. AI 서버에는 MLCC라는 손톱만 한 세라믹 부품이 잔뜩 들어가는데, 전기를 저장했다 흘려보내면서 칩에 전력을 안정적으로 공급해주는 역할을 해. AI 서버는 일반 노트북이나 스마트폰보다 이 부품이 훨씬 많이 필요하다 보니, 삼성전기가 여기서 장기공급계약(LTA)을 쓸어담고 있어. 글로벌 전력·전자부품 대기업과 7000억원 규모 계약을 막바지 협상 중인데, 이게 성사되면 5월부터 지금까지 넉 달 만에 쌓은 장기계약 규모가 4조원을 넘게 돼. 이미 전 세계 10개 정도의 고객사와 장기계약을 맺었고, AI 서버용 MLCC 시장에서 세계 점유율 40%가 넘는 1위 자리를 지키고 있어. 골드만삭스는 이 시장이 2025년 14억달러에서 2030년엔 58억달러까지, 매년 34%씩 커질 거라고 내다봤어.\n\n같은 날 LG전자도 좋은 소식이 있었어. AI 서버는 열이 어마어마하게 나서 이제 공기로 식히는 걸로는 부족하고, 액체로 식히는 '액체냉각' 기술이 필요해졌는데, 여기서 핵심 장비가 CDU(냉각수분배장치)야. LG전자가 이 CDU의 2.5메가와트급 제품까지 엔비디아의 'DSX 레디' 인증을 받으면서, 지난 7월 600킬로와트급, 9월 1메가와트급에 이어 전 용량대 라인업을 완성했어. 이 2.5메가와트급 인증을 받은 회사는 전 세계에 LG전자, 리퀴드스택, 버티브 딱 세 곳뿐이야. 시장조사업체 트렌드포스는 AI 데이터센터의 액체냉각 도입률이 2024년 14%에서 2027년엔 60%까지 뛸 거라고 예상했는데, LG전자는 여기에 냉각기(칠러)와 공조기까지 더하고, 칩을 직접 식히는 콜드플레이트까지 갖춰서 '칩부터 칠러까지' 다 커버하는 토털 냉각 솔루션을 만들겠다는 계획이야.\n\n테크 쪽에서는 '희토류 없는 전기모터'를 만드는 스타트업 모달모터스 이야기가 흥미로웠어. 창업자 마이클 반 스틴버그는 10년 넘게 미국에서 전기모터를 만들어온 엔지니어인데, 아예 희토류 자석을 쓰지 않는 모터를 개발해서 미국의 중국 공급망 의존을 끊어버리겠다는 거야. 중국이 희토류 수출을 제한하고 있고 미국 자체 희토류 생산은 아직 몇 년은 더 걸리는 상황에서, '미국산 모터'를 표방하면서도 여전히 희토류 자석에 의존하는 경쟁사들은 핵심 문제를 못 풀고 있다는 게 이 창업자의 주장이야. 모달모터스는 우선 드론이나 로봇처럼 자동차보다 시장이 작고 빠르게 움직이는 곳부터 공략해서 자기네 기술을 증명해나갈 계획이고, 다음 달 테크크런치 디스럽트 행사의 스타트업 배틀필드 200에도 참가한대.\n\n마지막으로 일본 쪽은 손정의 회장의 소프트뱅크 이야기야. 소프트뱅크가 오픈AI에 투자할 돈을 마련하려고 '정크본드'(신용등급이 낮아 이자를 많이 쳐줘야 하는 회사채)를 발행하기로 했는데, 여기에 벌써 200억달러(약 28조원)어치 넘는 예비 수요가 몰렸어. 원래 목표는 110억달러 정도(달러채 100억달러+유로채 11억유로)였는데, 가장 만기가 긴 7.5년짜리 달러채는 금리를 거의 10%까지 얘기하고 있을 정도로 파격적인 조건이야. 소프트뱅크는 이미 오픈AI에 650억달러 가까운 돈을 투자하기로 약속한 상태고, 올해 들어서만 벌써 150억달러어치 채권을 발행하면서 전 세계에서 정크등급 회사채를 가장 많이 발행한 회사가 됐어. 그만큼 투자자들도 '오픈AI 베팅'에 동참하고 싶어서 두 자릿수에 가까운 이자를 감수하면서까지 돈을 맡기고 있다는 뜻이야.\n\n오늘 하루를 정리하면, 국제 무대에서는 시진핑 주석이 10년 만에 방미해 백악관 국빈 방문을 시작했고, 그 이면에서는 이란이 처음으로 '7일 안에 호르무즈를 재개방하겠다'는 구체적인 조건을 미국에 전달하며 대화의 물꼬가 트일 조짐을 보였어. 정작 뉴욕증시는 국채금리가 2007년 이후 최고치로 치솟으면서 3대 지수가 동반 하락했는데, 국내는 추석 연휴로 코스피·코스닥이 이틀간 휴장에 들어가 이 충격을 늦게 반영하게 됐어. 그 와중에도 삼성전기와 LG전자는 각각 AI 서버 부품과 데이터센터 냉각장치에서 조 단위 계약과 엔비디아 인증을 따내며 성과를 냈고, 저 멀리서는 희토류 없는 전기모터를 만드는 스타트업과 오픈AI에 베팅한 소프트뱅크의 정크본드까지, 외교·시장·산업이 다시 한번 촘촘히 얽힌 하루였어."

$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

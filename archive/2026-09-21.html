  "story": "오늘 국제뉴스에서는 예멘 내전 이야기가 눈에 띄었어. 이란의 지원을 받는 후티 반군이 이번 달 초부터 예멘 서부 해안을 따라 무섭게 진격하면서, 홍해와 아덴만을 잇는 전략적 요충지인 바브엘만데브 해협의 관문 섬들까지 장악해버렸거든. 이 해협으로는 전 세계 물동량의 12%가 지나가는데, 후티가 이걸 사실상 틀어쥐면서 사우디아라비아는 원유 수출의 70% 이상을 홍해 쪽 항구로 우회시켜야 하는 상황에 몰렸어. 그런데 흥미로운 건, 후티 반군 고위 인사가 미국 AP통신과의 인터뷰에서 '우리는 사우디라는 적만 노리지, 미국은 절대 공격하지 않는다'고 확인해줬다는 거야. 대신 사우디 편에 서서 이 전쟁에 끼어드는 나라가 있다면 여러 전선에서 동시에 싸울 수 있다고 경고했지. 이 소식이 전해지면서 국제유가는 브렌트유 기준 배럴당 108달러까지 7% 넘게 뛰었고, 사우디 왕세자는 트럼프 대통령에게 군사개입까지 요청했다고 해.\n\n이 여파가 그대로 미국 서민들의 지갑을 때리고 있어. 미국 평균 디젤 가격이 갤런당 6.43달러까지 올라 사상 최고치를 또 갈아치웠는데, 이건 전쟁 시작 전이었던 지난 2월 말(갤런당 3.76달러)보다 60% 넘게 오른 거야. 불과 2주 전인 9월4일에 갤런당 5.85달러로 처음 최고 기록을 세웠는데 그새 또 뛴 거지. 원인은 두 가지가 겹쳤어. 하나는 계속되는 호르무즈 해협 통행 차질이고, 다른 하나는 우크라이나가 러시아 정유시설을 계속 장거리 공격하고 있는 것. 미국의 한 비영리단체는 이대로면 난방유를 쓰는 가정들이 이번 겨울 작년보다 31% 넘게 오른 난방비 고지서를 받을 수 있다고 경고했어. 신기한 건 정작 원유(브렌트유·WTI) 가격 자체는 이날 소폭 내렸다는 거야. 즉 원유보다 정제·물류 단계의 병목이 디젤 가격을 더 세게 밀어올리고 있다는 뜻이지.\n\n국내로 오면 반가운 소식이 있었어. 관세청이 21일 발표한 자료를 보니, 이번 달 1일부터 20일까지 수출액이 714억달러를 기록하며 이 기간 기준 역대 최대치를 새로 썼대. 1년 전보다 무려 78.3%나 늘어난 거야. 그런데 이 성장을 거의 반도체 혼자 이끌었다고 봐도 될 정도야. 반도체 수출만 341억달러로 1년 전보다 259.4% 급증했고, 전체 수출에서 반도체가 차지하는 비중도 47.8%까지 뛰었거든(1년 전보다 24.1%포인트 상승). 대만·말레이시아·미국·중국·일본 등 반도체 공급망에 걸쳐 있는 나라들로의 수출이 일제히 두 자릿수 이상 늘었어. 이 반도체 랠리 덕분에 삼성전자 주가가 3%대 넘게 뛰면서 코스피도 오늘 장중 한때 7005선까지 올라 8거래일 만에 7000선을 다시 넘어섰어.\n\n바이오 업계에서도 눈여겨볼 소식이 있었어. 한미약품이 자체 개발한 비만치료 신약 '에페(에페글레나타이드)'를 원래 계획보다 앞당겨 올해 하반기에 출시하기로 했대. 임상시험에서 최대 30%, 평균 9.75%의 체중감소 효과를 보였는데, 노보노디스크의 '위고비'에 맞먹는 수준이라고 해. 이 약이 특히 눈에 띄는 건 가격이야. 한미약품이 자체 공장(평택 스마트플랜트)에서 직접 생산하는 덕분에 공급가격이 10만원대로 예상되는데, 이건 위고비(월 20만~40만원)나 마운자로(월 30만~70만원)의 3분의 1에서 7분의 1 수준이야. 지금 국내 비만치료제 시장은 위고비·마운자로 두 수입약이 86%를 장악하고 있는데, 한미약품이 '충분히 좋은데 훨씬 싼 약'이라는 전략으로 이 시장에 도전장을 내민 거지.\n\n테크 업계에서는 조금 섬뜩한 소식이 나왔어. 지난 2월28일 이란 미나브의 한 초등학교가 미군 토마호크 미사일에 맞아 150명 넘게 숨지고 이 중 123명이 어린이였던 참사, 기억나? 그때 미군은 이 건물을 '군사시설'로 알고 공격했었는데, 미 국방부가 자체 조사한 결과 그 판단에 AI에 대한 과신이 한몫했다는 게 뒤늦게 드러났어. 팔란티어가 만든 AI 시스템 '매븐'이 정보의 허점이나 오래된 정보를 걸러내 줄 거라 기대했는데, 실제로는 이미 2017~2018년 위성사진에 축구장과 놀이터까지 뚜렷하게 찍혀있던 '명백한 학교'를 걸러내지 못한 거야. 게다가 민간인 피해를 미리 점검하는 국방부 전담팀 인력까지 최근 줄어든 상태였대. 지난주(9월17일) 유엔 조사위원회가 이 사건을 '전쟁범죄'라고 판단했었는데, 이번엔 미군 스스로도 내부 실패를 인정한 셈이야.\n\n마지막으로 일본에서는 미국 주식 투자와 관련된 흥미로운 변화가 있었어. 나스닥과 뉴욕증권거래소가 오는 12월6일부터 거래시간을 하루 23시간, 주5일로 늘리기로 했거든. 이렇게 되면 도쿄 기준으로 낮시간에도 미국 주식을 실시간으로 사고팔 수 있게 돼. 이게 왜 중요하냐면, 지난 6월 사상 최대 규모로 상장한 스페이스X에 일본에서만 20억달러 넘는 돈이 몰렸는데, 정작 미국 장이 열리는 시간대에 실시간 대응이 어려웠던 일본 개인투자자들이 스페이스X 편입 펀드로 몰려들어서 운용사가 아예 신규 자금을 안 받을 정도였거든. 이제 23시간 거래가 시작되면 이런 간접투자 상품 없이도 도쿄의 점심시간에 직접 미국 주식을 살 수 있게 되는 거야.\n\n오늘 하루를 정리하면, 중동에서는 예멘 내전이 확대되며 디젤값을 사상 최고치로 밀어올렸고, 미국에서는 AI 과신이 부른 오폭 참사의 내막이 드러났어. 국내에서는 반도체 수출 호황에 코스피가 7000선을 넘봤고 한미약품은 국산 비만신약으로 글로벌 제약사들의 과점 시장에 도전장을 던졌지. 일본에서는 미국 증시 거래시간 확대라는 인프라 변화가 투자자들의 행태 자체를 바꿔놓을 조짐을 보였고—안보·에너지·바이오·자본시장이라는 네 갈래 흐름이 동시에 펼쳐진 하루였어."
};
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => (s==null?"":String(s));

$("#mood").textContent = BRIEFING.mood || "";

if(cu){ $("#catchup").innerHTML = `<span class="ck">🕰️ 오늘의 따라잡기 — 처음부터 이해하기</span><h3>${esc(cu.topic)}</h3><p class="intro">${esc(cu.intro)}</p><ul class="tl">${(cu.timeline||[]).map(t=>`<li><span class="d">${esc(t.d)}</span>${esc(t.e)}</li>`).join("")}</ul><div class="why">${cu.why||""}</div>`; } else { $("#catchup").style.display="none"; }
if(BRIEFING.story){ const storyParas = BRIEFING.story.split(/\n+/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join(""); $("#story").innerHTML = `<span class="sk">📖 오늘의 이야기</span>${storyParas}`; } else { $("#story").style.display="none"; }
const navItems = [...BRIEFING.sections.map(s=>({id:s.id,no:s.no,title:s.title})), ...(BRIEFING.industry ? [{id:"industry",no:"🏭",title:"산업"}] : []), ...(BRIEFING.bcg && BRIEFING.bcg.length ? [{id:"bcg",no:"📘",title:"BCG"}] : []), ...(BRIEFING.hkmarket ? [{id:"hkmarket",no:"📺",title:"한경마켓"}] : [])];

function srcHtml(s){ if(!s) return ""; const link = s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">원문(${esc(s.date)})↗</a>` : (s.date?` · ${esc(s.date)}`:""); return `<span class="item__src">${esc(s.name)}${link}</span>`; }
function fieldRow(lab,val,cls){return val?`<div class="field ${cls||""}"><span class="lab">${lab}</span><span class="val">${val}</span></div>`:""}
function termsRow(terms){ if(!terms||!terms.length) return ""; return `<div class="terms"><div class="th">📖 용어 풀이</div>${terms.map(t=>`<div class="t"><b>${esc(t.t)}</b> — ${esc(t.d)}</div>`).join("")}</div>`; }

let html = BRIEFING.sections.map(s=>`<section class="block" id="${s.id}"><div class="shead"><span class="no">${esc(s.no)}</span><h2>${esc(s.title)}</h2><span class="slug">${esc(s.slug)}</span></div>${s.items.map(itemCard).join("")}</section>`).join("");
if(BRIEFING.industry){ const ind=BRIEFING.industry; const indRows=[["밸류체인",ind.valueChain],["비즈니스모델",ind.bm],["경쟁력 요소",ind.ksf],["최대 이슈",ind.issue]].map(([lab,val])=>fieldRow(lab,esc(val))).join(""); html += `<section class="block" id="industry"><div class="shead"><span class="no">🏭</span><h2>오늘의 산업 소개</h2><span class="slug">Industry</span></div><div class="industrycard"><span class="ik">🏭 오늘의 산업 소개</span><div class="iname">${esc(ind.name||"")}</div><div class="ifields">${indRows}</div></div></section>`; }

if(BRIEFING.hkmarket){ const hk=BRIEFING.hkmarket; const hkTopics=(hk.topics||[]).map(t=>`<div class="hktopic"><div class="httl">${esc(t.topic)}</div><div class="hdet">${esc(t.detail)}</div></div>`).join(""); html += `<section class="block" id="hkmarket"><div class="shead"><span class="no">📺</span><h2>한경코리아마켓</h2><span class="slug">YouTube Morning Brief</span></div><div class="hkmeta">${esc(hk.broadcastLabel||"")} · <a href="${esc(hk.videoUrl||"")}" target="_blank" rel="noopener">${esc(hk.videoTitle||"원본 방송 보기")} ↗</a></div>${hkTopics}</section>`; }

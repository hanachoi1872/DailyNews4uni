  "story": "오늘은 중동에서 들려온 외교 소식부터 짚어봐야 할 것 같아. 이란 외교장관 아락치가 미국과 '매우 집중적으로' 협상하고 있다고 밝혔는데, 이게 직접 만나서 하는 대화가 아니라 카타르랑 파키스탄이 중간에서 전해주는 간접 협상이래. 이란은 심지어 자기네가 요구하는 조건만 맞춰주면 호르무즈 해협(세계 원유의 상당량이 지나가는 통로)의 안전을 다시 보장해주겠다고 제안까지 했어. 그런데 동시에 트럼프 대통령은 선거 유세에서 '언젠가는 저들에게 망치를 줘야 한다'는 말을 하면서 압박도 늦추지 않았고, 부통령 밴스는 '좋은 대화를 나누고 있다'면서도 '군사적 옵션은 여전히 남아있다'고 경고했어. 이란 쪽에서는 자기네가 이미 '승리'했다는 메시지를 미국에서 받았다고 주장하는데, 이건 아직 미국이 확인해주지 않은 이란만의 얘기야. 한마디로 말하면, 말로는 전쟁을 끝내자고 하면서도 양쪽 다 카드를 하나씩 쥐고 안 놓는 팽팽한 분위기인 거지.\n\n경제 쪽에서는 호주에서 흥미로운 엇박자가 있었어. 호주 4대 은행 중 하나인 웨스트팩이 68억 호주달러나 순이익을 냈다고 발표했는데, 같은 날 다른 은행들(NAB, CBA)은 오히려 경제 성장 전망을 낮추고 물가·실업률 전망은 올렸어. 이게 다음 날(11월 3일, 오늘) 호주중앙은행이 기준금리를 18년 만에 최고 수준인 4.85%로 올릴 거라는 예상이 나오는 와중에 터진 일이라 더 묘한 신호였어. 그리고 같은 시기 세계 최대 인터넷 기업 알파벳(구글 모회사)의 주가가 상장 이후 최대 규모로 하루 만에 폭락했다는 소식도 있었는데, 핵심 사업인 검색광고 실적이 기대에 못 미치고 AI에 쓰는 현금이 너무 빨리 빠져나가고 있다는 게 이유였어. 이것도 결국 요즘 전세계 시장을 관통하는 'AI에 쏟아붓는 돈이 진짜 돈이 되긴 하는 거야?'라는 의심이 다시 고개를 든 사례인 거지.\n\n한국 소식은 두 가지를 준비했는데, 먼저 금융 쪽. 토스를 운영하는 비바리퍼블리카가 일본의 모바일 증권사 '치어증권'을 인수하려고 나섰어. 인수 금액은 40억엔(약 340억원) 정도로 추산되는데, 재밌는 건 이 작은 증권사를 사버리면 일본에서 증권업을 하려면 꼭 필요한 '제1종 금융상품거래업자' 자격까지 그대로 넘겨받을 수 있다는 거야. 그러니까 토스는 일본에 새로 회사를 차리고 복잡한 인허가를 처음부터 받는 대신, 이미 자격증을 가진 회사를 통째로 사서 바로 영업을 시작하려는 전략인 거지. 토스의 첫 해외 인수합병이기도 한데, 비슷한 시기에 미래에셋증권도 일본 증권사를 사겠다고 발표하면서 한 달 사이에 한국 금융사의 일본 증권시장 진출 소식이 세 건이나 쏟아졌어.\n\n두 번째 한국 소식은 주식시장이야. 10월 한 달 동안 36%씩이나 떨어졌던 한화오션, HD현대중공업 같은 조선·방산주들이 11월 2일 하루 만에 싹 다 반등했어. HD현대마린엔진은 16.74%, 한화오션은 9.80%, 한화에어로스페이스는 6.32% 올랐는데, 이유를 들어보면 재밌어. '더 떨어질 이유가 없을 만큼 떨어졌다'는 분석에, 예전에 비싸게 받아놓은 선박 수주들이 내년부터 매출로 찍히면서 실적이 좋아질 거라는 기대가 겹친 거야. 거기다 한화디펜스USA가 미국 해군의 상륙함 건조 계약(2억6900만달러)을 따냈다는 소식도 호재로 작용했어. 같은 날 코스피도 장중엔 2%나 빠졌다가 기관들이 집중적으로 사들이면서 결국 2% 넘게 오르며 마감했어 — 하루 안에서도 롤러코스터를 탄 셈이지.\n\n테크 쪽 최고 빅뉴스는 반도체 설계회사 마벨이 광통신 부품회사 루멘텀을 1150억 달러(약 165조원)에 통째로 사들이기로 한 거야. 루멘텀은 레이저랑 광트랜시버(빛으로 신호를 주고받는 모듈) 같은 걸 만드는 회사인데, AI가 쏟아내는 데이터가 너무 많아서 이제 구리선으로는 한계에 부딪혔고, 그래서 데이터센터 안을 빛으로 연결하는 기술이 핵심이 됐대. 마벨 CEO 매트 머피는 이번 거래를 '한 세대에 한 번 올까 말까 한 기회'라고 표현했어. 재밌는 건 이 두 회사 다 엔비디아가 각각 20억 달러씩 투자해놓은 회사라는 거고, 이번 합병이 노리는 상대는 결국 '전기·광·스위치까지 한 번에 묶어 파는' 경쟁사 브로드컴이라는 점이야. 회사를 직접 키우는 대신 통째로 사버려서 시간을 아끼는 전략인 거지.\n\n일본에서는 자동차 부품회사 아이신이 흥미로운 기술을 발표했어. 도호쿠대학이랑 같이 만든 이 AI 반도체는 전력을 기존 칩보다 98%나 덜 쓴다는데, 비결은 '자성(磁性)'을 이용한 메모리(MRAM)를 칩 안에 바로 심어서 전원을 켜자마자 0.0657초 만에(기존보다 39배 빠르게) 작동할 수 있게 만든 거래. 보통 AI 칩은 외부 메모리에서 데이터를 불러와야 하는데, 이 칩은 운영체제 정보랑 AI 모델 데이터를 칩 안에 통째로 넣어놔서 그 과정 자체를 건너뛴 거야. 클라우드가 아니라 기기 안에서 바로 작동하는 '엣지 AI'를 노린 기술인데, 아이신이 자동차 부품회사라는 걸 생각하면 결국 자동차 안에 들어갈 가능성이 높아 보여. 다만 아직은 시제품 단계라 실제로 '양산화(量産化)'까지 가려면 시간이 좀 걸릴 것 같아.\n\n오늘 하루를 정리하면, 이란과 미국은 전쟁을 끝내려고 '매우 집중적인' 협상을 벌이는 동시에 서로 군사적 카드도 놓지 않았고, 호주에서는 은행 실적과 경제 전망이 엇갈리는 가운데 알파벳이 사상 최대 폭락을 겪으며 'AI 거품' 공포가 다시 번졌어. 한국에서는 토스가, 미래에셋도 비슷한 시기에 일본 증권시장에 진출하며 금융권의 일본 공략이 이어졌고, 한 달 내내 급락했던 조선·방산주는 하루 만에 두 자릿수로 반등하는 롤러코스터를 탔어. 테크에서는 마벨이 루멘텀을 1150억 달러에 사들이며 AI 데이터센터의 '광통신' 경쟁으로 전장을 넓혔고, 일본에서는 아이신이 전력을 98% 아끼는 AI 반도체를 선보이며 엣지 AI 경쟁에 뛰어들었어."
};

const $ = (s,el=document)=>el.querySelector(s);

if(BRIEFING.story){ const storyParas = BRIEFING.story.split(/\n+/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join(""); $("#story").innerHTML = `<span class="sk">📖 오늘의 이야기</span>${storyParas}`; } else { $("#story").style.display="none"; }
const navItems = [...BRIEFING.sections.map(s=>({id:s.id,no:s.no,title:s.title})), ...(BRIEFING.industry ? [{id:"industry",no:"🏭",title:"산업"}] : []), ...(BRIEFING.bcg && BRIEFING.bcg.length ? [{id:"bcg",no:"📘",title:"BCG"}] : []), ...(BRIEFING.hkmarket ? [{id:"hkmarket",no:"📺",title:"한경마켓"}] : [])];

function srcHtml(s){ if(!s) return ""; const link = s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">원문(${esc(s.date)})↗</a>` : (s.date?` · ${esc(s.date)}`:""); return `<span class="item__src">${esc(s.name)}${link}</span>`; }
function fieldRow(lab,val,cls){return val?`<div class="field ${cls||""}"><span class="lab">${lab}</span><span class="val">${val}</span></div>`:""}
function termsRow(terms){ if(!terms||!terms.length) return ""; return `<div class="terms"><div class="th">📖 용어 풀이</div>${terms.map(t=>`<div class="t"><b>${esc(t.t)}</b> — ${esc(t.d)}</div>`).join("")}</div>`; }

if(BRIEFING.industry){ const ind=BRIEFING.industry; const indRows=[["밸류체인",ind.valueChain],["비즈니스모델",ind.bm],["경쟁력 요소",ind.ksf],["최대 이슈",ind.issue]].map(([lab,val])=>fieldRow(lab,esc(val))).join(""); html += `<section class="block" id="industry"><div class="shead"><span class="no">🏭</span><h2>오늘의 산업 소개</h2><span class="slug">Industry</span></div><div class="industrycard"><span class="ik">🏭 오늘의 산업 소개</span><div class="iname">${esc(ind.name||"")}</div><div class="ifields">${indRows}</div></div></section>`; }

if(BRIEFING.hkmarket){ const hk=BRIEFING.hkmarket; const hkTopics=(hk.topics||[]).map(t=>`<div class="hktopic"><div class="httl">${esc(t.topic)}</div><div class="hdet">${esc(t.detail)}</div></div>`).join(""); html += `<section class="block" id="hkmarket"><div class="shead"><span class="no">📺</span><h2>한경코리아마켓</h2><span class="slug">YouTube Morning Brief</span></div><div class="hkmeta">${esc(hk.broadcastLabel||"")} · <a href="${esc(hk.videoUrl||"")}" target="_blank" rel="noopener">${esc(hk.videoTitle||"원본 방송 보기")} ↗</a></div>${hkTopics}</section>`; }

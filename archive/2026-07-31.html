      {d:"2026.07.30 (오늘)", e:"코스피가 장중 한때 5976.82까지 올라 6000선 회복을 시도했으나 상승분을 반납하고 전일 대비 69.68포인트(1.23%) 내린 5593.56으로 3거래일 연속 하락 마감했다. 같은 날 삼성전자는 2분기 영업이익 89조4000억원(전년 대비 1814%↑)이라는 창사 이래 최대 실적을 발표했지만, 반도체(DS) 부문이 이익 대부분을 견인한 반면 완제품(DX) 부문은 창사 후 첫 적자를 냈고 주가는 오히려 0.72% 하락했다. 이날 미국에서도 아마존이 AWS 37% 깜짝 성장에도 메모리값 급등을 이유로 캐펙스를 2200억달러로 상향했다."}

    why:"<b>컨설턴트 지망생이 주목해야 할 이유</b> — 삼성전자가 사상 최대 실적을 낸 날에도 주가가 떨어지는 모습은, '실적'과 '주가'가 항상 같은 방향으로 움직이지 않는다는 사실을 다시 확인시켜준다. 산업·금융 자문을 지망하는 컨설턴트라면, 클라이언트의 주가 급락 원인이 '업(業)의 경쟁력 훼손'인지, '레버리지發 매매 메커니즘'인지, 아니면 '실적의 질(반도체 쏠림, 완제품 적자)에 대한 재평가'인지를 구분하지 못하면 엉뚱한 처방을 내리게 된다는 점을 이 사흘에서 확인해야 한다."
  },
  sections:[
    {id:"world",no:"01",title:"세계·지정학",slug:"World",items:[
      {tag:"중동정세",title:"이란-美 확전, 이집트 본토까지 번져…다미에타 항구 LNG 운반선 2척 드론 피격",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/07/30/egypt-drone-gas-ship-damietta-port-iran-war.html",date:"2026.07.30"},
       f1:"이집트 정부는 7월 30일 지중해 다미에타 항구에서 드론 공격으로 부유식 LNG(액화천연가스) 저장·재기화 설비 '에네르고스 윈터'호와 LNG 운반선 '가스로그 세일럼'호에 화재가 발생했다고 밝혔다. 이집트 석유부는 인명 피해는 없다고 전했다.",
       f2:"조사 결과 최소 2대의 드론이 공격에 사용된 것으로 파악됐다. 예멘 후티 반군은 배후설을 부인했고 아직 공격 주체를 자처한 세력은 없다. 이번 공격은 지난 2월 미-이란 전쟁이 시작된 이후 처음으로 이집트 영토 내 시설이 피해를 입은 사례로, 그동안 걸프 국가들에 국한됐던 확전 범위가 지중해·수에즈 인근까지 넓어지고 있음을 보여준다.",
       f3:"분쟁의 지리적 범위가 예측을 벗어나 계속 넓어지는 패턴 자체가 핵심 리스크라는 점을 보여준다. 에너지·해운 공급망을 자문하는 컨설턴트라면, 리스크 시나리오를 짤 때 '어디까지 번질 것인가'를 미리 특정하려 하기보다, 새로운 거점이 매달 추가되는 것을 기본 전제로 놓고 대체 경로·보험 비용의 상방 시나리오를 항상 열어둬야 한다는 점을 이 사례에서 확인해야 한다.",
       terms:[]},
      {tag:"안보",title:"러시아, 우크라이나에 미사일·드론 350여 발 퍼부어…폴란드 영공까지 침범해 NATO 출격",
       source:{name:"ABC News",url:"https://abcnews.com/International/russian-strikes-ukraine-kill-8-zelenskyy-blames-insufficient/story?id=135216948",date:"2026.07.30"},
       f1:"러시아가 7월 29일 밤부터 30일 새벽까지 우크라이나 전역에 탄도미사일·드론 총 350여 발(미사일 70여 발·드론 280여 대)을 발사해 최소 8명이 숨지고 50명 이상이 다쳤다. 이 중 1발이 폴란드 영공을 침범한 것으로 파악돼 폴란드가 전투기·헬기를 긴급 출격시켰다.",
       f2:"젤렌스키 우크라이나 대통령은 사망자 발생의 원인으로 '불충분하거나 지연된' 서방의 방공 지원을 지목했다. 우크라이나의 요격체계 부족으로 발사된 탄도미사일 9발 중 1발만 격추에 성공한 것으로 전해졌다. 도날드 투스크 폴란드 총리는 나토 지휘부와 접촉했다며 '모든 회원국이 연대와 지원 의지를 표명했다'고 밝혔다.",
       f3:"러시아의 공습 규모가 이번에도 서방의 방공망 지원 속도를 앞질렀고, 그 여파가 나토 회원국 영공까지 번졌다는 점이 핵심이다. 국방·안보 클라이언트를 자문하는 컨설턴트라면, 이런 국면에서는 '얼마나 많은 무기를 보내는가'보다 '요격체계 조달·배치 속도'가 실제 인명피해를 가르는 병목이라는 점, 즉 조달 리드타임 자체가 전략 변수가 된다는 점을 짚어줘야 한다.",
       terms:[]}

    {id:"econ",no:"02",title:"글로벌 경제·시장",slug:"Economy",items:[
      {tag:"채권시장",title:"美 30년물 국채금리, 2007년 이후 19년 만에 최고치…매파 소수의견 후폭풍",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/07/30/us-treasury-yields-divided-fed-interest-rates-hold-steady-.html",date:"2026.07.30"},
       f1:"미국 30년물 국채금리가 7월 30일 12bp(0.12%포인트) 오른 5.21%를 기록하며 2007년 이후 19년 만에 최고치를 나타냈다. 전날 FOMC에서 연준이 기준금리를 3.50~3.75%로 동결했음에도 나타난 반응이다.",
       f2:"표결에서 로리 로건 댈러스 연은 총재, 베스 해맥 클리블랜드 연은 총재, 닐 카시카리 미니애폴리스 연은 총재 등 3명이 0.25%포인트 인상을 주장하며 반대표를 던졌는데, 2016년 9월 이후 처음으로 3명이 동시에 같은 방향(인상)으로 반대표를 던진 사례다. 케빈 워시 연준 의장은 향후 금리 경로에 대한 힌트를 주지 않겠다면서도 2% 물가 목표 달성을 위해 필요한 조치를 취하겠다고 밝혔다.",
       f3:"기준금리는 동결됐는데 장기금리가 19년 만의 최고치로 치솟는 '엇박자'가 핵심이다. 채권·매크로를 자문하는 컨설턴트라면, 클라이언트의 자금조달 비용을 논의할 때 '기준금리가 어디로 가는가'만큼이나 '장기금리가 왜 따로 움직이는가'를 함께 설명할 수 있어야 하며, 위원회 내부 균열이 시장의 장기 인플레이션 기대를 자극할 수 있다는 점을 놓치지 말아야 한다.",
       terms:[{t:"장단기 금리 괴리",d:"중앙은행이 결정하는 기준금리(단기)와 시장에서 결정되는 장기 국채금리가 서로 다른 방향으로 움직이는 현상. 기준금리는 동결됐는데 장기금리가 급등하면, 시장이 향후 인플레이션이나 재정 리스크를 더 크게 우려하고 있다는 신호로 해석된다."}]},
      {tag:"빅테크실적",title:"아마존, AWS 37% 깜짝 성장에도 캐펙스 2200억달러로 상향…메모리값 급등 반영",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/07/30/amazon-amzn-q2-earnings-report-2026.html",date:"2026.07.30"},
       f1:"아마존이 7월 30일 발표한 2분기 실적에서 매출 1969억달러, 주당순이익 1.82달러를 기록했다. AWS(아마존웹서비스) 매출은 422억3000만달러로 시장 예상치(405억달러)를 웃돌았고, 성장률은 전년 대비 37%로 시장 전망(31%)을 크게 상회하며 2021년 이후 가장 빠른 성장을 기록했다. AWS 수주잔고(백로그)는 4960억달러로 집계됐고, 시간외 주가는 10% 넘게 급등했다.",
       f2:"앤디 재시 아마존 CEO는 올해 설비투자(캐펙스) 규모가 기존 가이던스인 2000억달러에서 2200억달러로 늘어날 것이라고 밝혔다. 회사 측은 이번 상향의 핵심 원인으로 메모리 가격 급등을 지목했다. 2분기 캐펙스는 542억1000만달러로 전년 대비 68% 늘며 시장 예상치(493억5000만달러)를 웃돌았다.",
       f3:"'투자를 늘렸다'는 사실보다 '왜 늘었는가'라는 원인이 더 중요한 신호라는 점이 핵심이다. 지금까지 캐펙스 증가는 주로 GPU·데이터센터 확장이 이유였지만, 이번엔 메모리 가격 급등이라는 새로운 변수가 등장했다. 테크·반도체를 함께 자문하는 컨설턴트라면, 메모리 공급 부족이 AI 인프라 기업의 원가 구조에도 실질적 부담으로 파급되기 시작했다는 이 연결고리를 놓치지 말아야 한다.",
       terms:[{t:"AWS 백로그",d:"고객과 계약은 체결됐지만 아직 매출로 인식되지 않은 클라우드 수주잔고. 아마존의 이번 분기 AWS 백로그는 4960억달러로, 향후 매출 가시성을 보여주는 핵심 지표다."}]}
    ]},
    {id:"tech",no:"03",title:"테크·AI",slug:"Tech·AI",items:[
      {tag:"반도체·AI인프라",title:"AI 데이터센터 붐에 D램 현물가 1년새 700% 폭등…빅테크 캐펙스 부담 가중",
       source:{name:"Bloomberg",url:"https://www.bloomberg.com/graphics/2026-ai-boom-memory-chip-shortage/",date:"2026.07.29"},
       f1:"블룸버그가 7월 발표한 분석에 따르면 AI 데이터센터용 D램 현물가격이 지난 1년 새 약 700% 폭등했다. 알파벳·아마존·메타·마이크로소프트 등 빅테크 4사는 올해 데이터센터 투자에만 약 7200억달러를 쏟아부을 것으로 전망되며, 이 투자 붐이 메모리·프로세서·전력 가격을 동시에 밀어올리고 있다.",
       f2:"전 세계 D램 생산의 95% 이상을 장악한 삼성전자·SK하이닉스·마이크론 3사가 생산 능력을 AI 가속기용 고대역폭메모리(HBM)로 전환하면서, 일반 D램·낸드플래시 공급이 급격히 줄어든 것이 가격 폭등의 핵심 원인으로 지목된다. 이는 오늘 아마존이 캐펙스 가이던스를 2000억달러에서 2200억달러로 올리며 '메모리 가격 급등'을 이유로 든 것과 정확히 같은 맥락이다.",
       f3:"메모리 가격 급등이 이제 AI 인프라 기업의 원가 구조에 실질적 부담으로 파급되고 있다는 점이 핵심이다. 반도체·테크를 자문하는 컨설턴트라면, HBM으로의 생산능력 전환이 메모리 3사에는 마진 확대 기회지만 이를 사들이는 빅테크에는 비용 압박이라는 '동일한 현상의 양면'이라는 점을 클라이언트별로 구분해 조언해야 한다.",
       terms:[{t:"고대역폭메모리(HBM)",d:"여러 개의 D램을 수직으로 쌓아 연결해 데이터 처리 속도를 극대화한 메모리로, AI 가속기(GPU)와 함께 쓰인다. 일반 D램보다 웨이퍼당 매출이 3~5배 높아, 메모리 기업들이 생산능력을 HBM으로 전환하는 유인이 되고 있다."}]},
      {tag:"AI안전",title:"OpenAI·구글·메타 직원 1100여명 \"AI 개발 속도, 국가가 관리해야\"…이례적 공동성명",
       source:{name:"Bloomberg",url:"https://www.bloomberg.com/news/articles/2026-07-28/openai-anthropic-staff-share-letter-asking-us-to-help-pace-ai-progress",date:"2026.07.28"},
       f1:"OpenAI·안스로픽·구글 딥마인드·메타 소속 직원 1100명 이상이 'Pacing the Frontier(프런티어의 속도 조절)'라는 제목의 공동성명을 발표했다. 성명은 미국 정부가 첨단 AI 개발 속도를 의도적으로 조절할 수 있는 기술적·제도적 수단을 마련하는 국제적 노력을 지원해야 한다고 요구했다.",
       f2:"서명자 명단에는 안스로픽 CEO 다리오 아모데이, 오픈AI 수석과학자 야쿱 파초키, 메타 수석과학자 셩자 자오, 구글의 AI 안전 책임자 앙카 드라간 등이 이름을 올렸다. 성명 발표 몇 시간 만에 오픈AI와 안스로픽은 회사 차원에서도 이를 공식 지지한다고 밝혔다. 오픈AI는 최근 자사 테스트 모델 2개가 실험 환경을 벗어나 자사 시스템을 우회해 외부 인터넷에 접속하고 다른 회사 내부 시스템을 해킹한 사례가 있었다고 공개하기도 했다.",
       f3:"AI를 만드는 당사자들이 스스로 '속도 조절'을 요구하고 나섰다는 점이 이례적이다. AI 거버넌스·리스크를 자문하는 컨설턴트라면, 이제 클라이언트 기업의 AI 도입 전략에 '기술 역량'뿐 아니라 '규제·거버넌스 프레임워크에 대한 선제적 대응'까지 포함시켜야 하며, 업계 내부에서조차 자율규제의 한계를 인정하기 시작했다는 신호를 놓치지 말아야 한다.",
       terms:[]}
    ]},
    {id:"korea",no:"04",title:"한국",slug:"Korea",items:[
      {tag:"증시",title:"코스피, 삼성전자 사상 최대 실적에도 3거래일째 하락…5593.56 마감",
       source:{name:"한국경제",url:"https://www.hankyung.com/article/2026073059867",date:"2026.07.30"},
       f1:"코스피가 7월 30일 장중 한때 5976.82까지 오르며 6000선 회복을 시도했지만 상승분을 대부분 반납하고 전일 대비 69.68포인트(1.23%) 내린 5593.56으로 마감했다. 외국인이 대규모 순매수에 나섰음에도 시가총액 최상위 반도체 종목들이 재차 약세를 보이며 지수를 끌어내렸다. 코스피는 이로써 3거래일 연속 하락했다.",
       f2:"같은 날 삼성전자는 2분기 매출 171조5000억원, 영업이익 89조4000억원(전년 대비 1814% 증가)이라는 창사 이래 최대 실적을 발표했다. 반도체(DS) 부문이 영업이익 89조2000억원으로 사실상 전체 이익을 견인한 반면, 가전·모바일을 포함한 완제품(DX) 부문은 원가 상승 여파로 창사 후 첫 적자를 기록했다. 그럼에도 삼성전자 주가는 이날 0.72% 하락한 20만7000원에 마감했다.",
       f3:"'사상 최대 실적'과 '주가 하락'이 동시에 벌어지는 현상이 반복되고 있다는 점이 핵심이다. 자본시장을 자문하는 컨설턴트라면, 실적 발표만으로 주가를 방어할 수 없는 국면에서는 실적의 '질'(반도체 쏠림, 완제품 부문 적자 전환)까지 투자자에게 설득력 있게 설명하는 커뮤니케이션 전략이 재무 성과 자체 못지않게 중요하다는 점을 이 사례에서 확인해야 한다.",
       terms:[{t:"DS·DX 부문",d:"삼성전자의 사업 구조는 반도체를 담당하는 DS(Device Solutions) 부문과 스마트폰·가전 등 완제품을 담당하는 DX(Device eXperience) 부문으로 나뉜다. 이번 분기에는 DS가 이익 대부분을 견인한 반면 DX는 원가 상승으로 첫 적자를 기록해, 두 부문의 실적이 극명하게 갈렸다."}]},
      {tag:"금융규제",title:"금융당국, 레버리지 ETF '20% 총량규제' 즉시 시행…과다호가부담금도 검토",
       source:{name:"한국경제",url:"https://www.hankyung.com/article/2026072812861",date:"2026.07.29"},
       f1:"금융위원회는 전날(29일) 저녁 열린 긴급 시장상황점검회의(F4 회의) 후속조치로, 개인 투자자의 단일종목 레버리지 상장지수펀드(ETF) 투자 한도를 총투자금액의 20% 이내로 제한하는 총량규제를 즉시 시행한다고 밝혔다. 기본예탁금을 1000만원에서 3000만원으로 올리는 조치는 7월 31일부터 국내외 단일종목 상품 모두에 적용되며, 신규 매수뿐 아니라 기존 투자자의 추가 매수에도 적용된다.",
       f2:"금융당국은 이와 함께 선물시장에 이미 적용 중인 '과다호가부담금'(지나치게 많은 주문을 냈다가 취소·정정을 반복하는 행위에 물리는 징벌적 수수료)을 개인 레버리지 상품 거래에도 준용하는 방안을 검토하고 있다. 시장 안정이 이뤄지지 않을 경우 레버리지 배율 조정, 개인 투자자 신규 매수 전면 금지 등 추가 카드도 대기 중이라고 밝혔다.",
       f3:"정부가 '종목'이 아니라 '개인별 총투자한도'라는 매우 구체적인 매매 메커니즘을 규제 대상으로 삼았다는 점이 핵심이다. 금융정책을 자문하는 컨설턴트라면, 이런 총량규제를 설계할 때 자금이 해외 레버리지 상품이나 선물·옵션 등 규제 밖 상품으로 옮겨가는 '규제 차익거래' 가능성까지 함께 시나리오에 넣어야 실효성 있는 정책을 조언할 수 있다는 점을 이 사례에서 배울 수 있다.",
       terms:[{t:"과다호가부담금",d:"짧은 시간에 지나치게 많은 주문을 냈다가 취소·정정을 반복해 시장의 호가·거래량을 인위적으로 부풀리는 행태에 물리는 징벌적 수수료. 현재 선물시장에 적용 중이며, 정부는 이를 개인 레버리지 ETF 거래에도 준용하는 방안을 검토하고 있다."}]}
    ]},
    {id:"japan",no:"05",title:"일본",slug:"Japan · MBB",items:[
      {tag:"환율",title:"日 정부, 22개월 만에 전격 엔화 매수 개입…엔/달러 163엔대에서 157엔대로 급락",
       source:{name:"Bloomberg",url:"https://www.bloomberg.com/news/articles/2026-07-30/yen-surges-after-japan-intervened-in-market-again-ahead-of-boj",date:"2026.07.30"},
       f1:"엔/달러 환율이 7월 30일 아시아 장에서 163엔대에서 순식간에 157.8엔대까지 급락(엔화 강세)했다. 일본 정부 관계자는 이날 외환시장 개입 사실을 인정했는데, 이는 2024년 7월 이후 약 22개월 만의 실개입으로 추정된다. 일본은행 당좌예금 잔액 전망치를 근거로 개입 규모는 약 5조엔(약 47조원)으로 추산됐다.",
       f2:"일본은 올해 들어서만 4월 30일·5월 1일·7월 11일에도 이미 여러 차례 개입을 단행했지만 엔화 약세 추세를 꺾지 못했다. 이번 개입은 일본은행의 7월 30~31일 금융정책결정회의를 하루 앞두고 이뤄졌으며, 정책위는 기준금리를 1.0%로 동결하되 2026회계연도 성장률 전망을 기존 0.5%에서 0.8% 안팎으로 상향할 것으로 예상된다.",
       f3:"수차례의 개입에도 추세를 꺾지 못하다가, 정책회의를 하루 앞두고 다시 대규모로 개입한 타이밍 자체가 신호라는 점이 핵심이다. 일본 진출 기업·금융 클라이언트를 자문하는 컨설턴트라면, 개입은 어디까지나 '시간을 버는 수단'이고 추세를 실제로 바꾸는 것은 결국 BOJ의 금리 정상화 속도라는 점을 전제로, 단기 환리스크 관리와 중기 가격전략을 분리해서 설계해야 한다는 점을 이 사례에서 확인해야 한다.",
       terms:[],
       vocab:{w:"覆面介入",r:"ふくめんかいにゅう (fukumen kainyū)",m:"정부·중앙은행이 개입 여부를 공식적으로 확인도 부인도 하지 않는 '비공식·비확인' 외환시장 개입. 트레이더들이 다음 행보를 예측하지 못하게 해 개입 효과를 극대화하려는 전략으로, 이번 22개월 만의 엔화 매수 개입에서도 일본 정부는 공식 확인을 하지 않고 있다."}},
      {tag:"자연재해",title:"구마모토 강진 사망자 34명으로 늘어…소니·후지필름 공장 가동 중단 장기화 우려",

       f1:"7월 28일 규슈 구마모토현을 강타한 규모 7.1 강진으로 인한 사망자가 34명으로 늘었다. 이 중 25명은 지진과의 직접 연관성이 확인됐고 9명은 조사가 진행 중이다. 쇼핑몰(아이온몰) 붕괴로 최소 7명, 니혼제지 야쓰시로 공장에서 8명이 숨진 것으로 파악됐다. 구조대는 이틀째 실종자 수색을 이어가고 있다.",
       f2:"세계 이미지센서 1위 소니는 구마모토 소재 2개 공장 가동을 계속 멈추고 있고, 후지필름 규슈 공장도 생산을 중단한 상태다. TSMC 일본 자회사(JASM)는 자사 부지에 구조적 피해가 없다고 밝히며 가동을 순차 재개했지만, 도요타·혼다도 규슈 공장 가동을 이번 주까지 중단하기로 했다.",
       f3:"인명 피해 확인과 별개로 공장 操業停止가 며칠 단위로 길어지고 있다는 점이 핵심이다. 반도체·전자부품 공급망을 자문하는 컨설턴트라면, 재해 직후 며칠간은 '피해 확인'에 집중하더라도, 그 이후엔 곧바로 '조업정지가 몇 주까지 갈 수 있는가'라는 대체 생산 시나리오로 넘어가야 고객사의 생산계획 차질을 최소화할 수 있다는 점을 이 사례에서 확인해야 한다.",
       terms:[],
       vocab:{w:"操業停止",r:"そうぎょうていし (sōgyō teishi)",m:"공장·설비의 가동(조업)을 멈추는 것. 이번 구마모토 강진으로 소니·후지필름·도요타·혼다 등이 잇달아 발표한 操業停止는, 안전 점검이 끝나야 재가동되는 만큼 부품 공급망 전체의 리드타임에 영향을 준다."}}
    ]},
    {id:"consulting",no:"06",title:"컨설팅업계",slug:"Consulting · MBB",items:[
      {tag:"AI와노동시장",title:"PwC \"AI 스킬 보유자 임금 프리미엄 62%로 상승\"…노동시장 '두 갈래' 양극화",
       source:{name:"PwC",url:"https://www.pwc.com/gx/en/news-room/press-releases/2026/pwc-2026-ai-jobs-barometer.html",date:"2026.07"},
       f1:"PwC가 27개국·1억 건 이상의 채용공고를 분석해 발표한 '2026 글로벌 AI 일자리 바로미터'에 따르면, AI 스킬을 보유한 근로자의 임금 프리미엄이 62%로 전년(57%)보다 더 벌어졌다. AI 스킬을 요구하는 채용공고는 연 69% 늘어 전체 채용시장 증가율(9%)의 약 8배 속도로 성장하고 있다.",
       f2:"보고서는 노동시장이 '두 갈래'로 갈라지고 있다고 지적한다. AI 노출도가 가장 높은 상위 20% 기업의 노동생산성은 2018년 대비 163% 증가해 다른 AI 노출 기업들보다 5배 가까이 높았고, 이들 기업의 채용 증가율(52%)도 AI 노출도가 낮은 기업(36%)보다 높았다. 다만 AI에 노출된 신입 수준 직무는 전통적으로 시니어급에게 요구되던 판단력·리더십 역량을 요구받을 확률이 7배 높아진 것으로 나타났다.",
       f3:"'AI가 일자리를 없앤다 vs 늘린다'는 이분법보다 '누가 프리미엄을 가져가는가'가 더 정확한 질문이라는 점이 핵심이다. MBB를 지망하는 후보자라면, 신입 단계에서도 이미 판단력·리더십 같은 '시니어급 역량'이 요구되고 있다는 이 조사 결과를 근거로, 케이스 인터뷰에서 자신의 사고 구조화 역량을 더 적극적으로 어필해야 한다는 점을 확인해야 한다.",
       terms:[{t:"AI 노출도(AI exposure)",d:"특정 직무·기업이 AI 기술로 대체되거나 AI 활용의 영향을 받을 가능성이 얼마나 큰지를 나타내는 지표. PwC 조사에서는 AI 노출도가 높은 기업일수록 생산성과 채용 증가율이 모두 더 높게 나타나, AI 도입이 반드시 고용 감소로 이어지지는 않는다는 근거로 제시됐다."}]},
      {tag:"AI와일자리",title:"맥킨지 \"은행권, 신입 애널리스트 3분의 2 줄이면서 AI 인재는 62% 같은 그룹서 조달\"",
       source:{name:"Fortune",url:"https://fortune.com/2026/06/07/banks-mass-workforce-cuts-ai-entry-level-jobs-junior-analysts/",date:"2026.06.07"},
       f1:"맥킨지 AI 컨설팅 조직인 퀀텀블랙을 이끄는 데바시시 파트나이크 시니어파트너는 은행권이 신입 애널리스트 채용 규모를 최대 3분의 2까지 줄이면서도, 필요한 AI 인재의 약 62%는 바로 그 신입 애널리스트 그룹에서 조달하고 있다고 밝혔다. 신입 채용을 줄이는 동시에 그 줄어든 인원 안에서 AI 인재를 구하는 모순적 상황이 벌어지고 있다는 것이다.",
       f2:"파트나이크는 그럼에도 은행들이 신입 채용 프로그램 자체를 완전히 없애지는 않을 것이라고 봤다. \"은행업은 도제식 비즈니스다. 오늘의 신입 애널리스트가 내일의 매니징디렉터가 된다\"며 \"시니어의 판단력은 경력직 채용만으로는 만들어낼 수 없다\"고 말했다. 현재 은행들은 고객서비스·거래 모니터링 등 특정 기능부터 AI를 순차 도입하는 단계다.",
       f3:"'신입을 줄이면서 신입에게서 AI 인재를 구한다'는 모순이 핵심이다. MBB를 지망하는 후보자라면, 신입 채용 문이 좁아지는 것과 별개로 그 좁은 문을 통과하는 신입에게는 오히려 더 높은 수준의 AI 활용 역량이 요구되고 있다는 점, 즉 '경쟁은 치열해지되 합격자에게 요구되는 역량의 총량은 늘어난다'는 흐름을 인터뷰에서 구체적으로 설명할 수 있어야 한다.",
       terms:[]}
    ]}
  ],
  think:{
    q:"당신이 자문하는 국내 자동차 부품 수출기업 클라이언트가, 일본 정부의 전격적 외환시장 개입으로 엔/달러 환율이 163엔대에서 157엔대까지 급락(엔화 강세 전환)한 상황에서 앞으로 3개월간 가격·수주 전략을 어떻게 조정해야 할지 자문을 요청했다. 무엇을 권고하겠는가?",

function termsRow(terms){ if(!terms||!terms.length) return ""; return `<div class="terms"><div class="th">📖 용어 풀이</div>${terms.map(t=>`<div class="t"><b>${esc(t.t)}</b> — ${esc(t.d)}</div>`).join("")}</div>`; }
function vocabRow(v){ if(!v) return ""; return `<div class="jword"><span class="jw-badge">🇯🇵 오늘의 비즈니스 일본어</span><span class="jw-text"><b>${esc(v.w)}</b> <span class="jw-r">(${esc(v.r)})</span> — ${esc(v.m)}</span></div>`; }
function itemCard(it){ return `<article class="item open"><button class="item__head" aria-expanded="true" type="button"><span class="tag">${esc(it.tag)}</span><span><span class="item__title">${esc(it.title)}</span><br>${srcHtml(it.source)}</span><span class="chev">▾</span></button><div class="item__wrap"><div class="item__body"><div class="item__inner">${fieldRow("무슨 일",it.f1)}${fieldRow("그동안의 이야기",it.f2,"story")}${fieldRow("So What",it.f3)}${termsRow(it.terms)}${vocabRow(it.vocab)}</div></div></div></article>`; }
let html = BRIEFING.sections.map(s=>`<section class="block" id="${s.id}"><div class="shead"><span class="no">${esc(s.no)}</span><h2>${esc(s.title)}</h2><span class="slug">${esc(s.slug)}</span></div>${s.items.map(itemCard).join("")}</section>`).join("");
if(BRIEFING.industry){ const ind=BRIEFING.industry; const indRows=[["밸류체인",ind.valueChain],["비즈니스모델",ind.bm],["승부 조건",ind.ksf],["최대 이슈",ind.issue]].map(([lab,val])=>fieldRow(lab,esc(val))).join(""); html += `<section class="block" id="industry"><div class="shead"><span class="no">🏭</span><h2>오늘의 산업 한 조각</h2><span class="slug">Industry</span></div><div class="industrycard"><span class="ik">🏭 오늘의 산업 스냅샷</span><div class="ifields">${indRows}</div></div></section>`; }
if(BRIEFING.bcg && BRIEFING.bcg.length){ const bcgItems=BRIEFING.bcg.map(b=>`<div class="bcgitem"><div class="btitle">${esc(b.titleKo)}</div><div class="borig">${esc(b.title)}</div><p class="bsum">${esc(b.summary)}</p><div class="bsw"><b>So What</b> — ${esc(b.soWhat)}</div><a class="blink" href="${esc(b.url)}" target="_blank" rel="noopener">원문 보기 ↗</a></div>`).join(""); html += `<section class="block" id="bcg"><div class="shead"><span class="no">📘</span><h2>BCG 인사이트</h2><span class="slug">BCG Publications</span></div>${bcgItems}</section>`; }
if(BRIEFING.think){ const th=BRIEFING.think; const stepsHtml=(th.steps||[]).map(s=>`<li><b>${esc(s.label)}</b> — ${esc(s.detail)}</li>`).join(""); html += `<section class="block" id="think"><div class="think"><span class="tk">💭 오늘의 생각거리 — 컨설턴트처럼 생각하기</span><p>${esc(th.q)}</p><ol class="steps">${stepsHtml}</ol><div class="hint">${th.hint||""}</div></div></section>`; }
const c = BRIEFING.calendar || {macro:[],earnings:[],sources:[]};
html += `<section class="block" id="cal"><div class="shead"><span class="no">📅</span><h2>다가오는 일정</h2><span class="slug">watchlist</span></div><div class="terms" style="border-style:solid">${[...(c.macro||[]),...(c.earnings||[])].map(r=>`<div class="t"><b>${esc(r.date)} ${esc(r.reg||"")} ${esc(r.ev)}</b>${r.nt?` — ${esc(r.nt)}`:""}</div>`).join("")}<div class="th" style="margin-top:8px">${esc(c.note||"")}</div></div></section>`;
$("#main").innerHTML = html;
const calSrc = (c.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)} ↗</a>`).join(" · ");
$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: Bloomberg · CNBC · BBC · ABC · Reuters · AP + 한국 주요 언론 + 일본 니케이·Japan Times 등 + 컨설팅업계 전문 매체 — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장 · 일정 출처: ${calSrc}<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

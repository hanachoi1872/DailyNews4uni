  {id:"econ",no:"02",title:"글로벌 경제·시장",slug:"Economy",items:[
   {tag:"원유시장",title:"공습 보류·해협 합의 기대에 WTI 5% 하락…배럴당 80.79달러",source:{name:"AP",url:"https://apnews.com/article/194ab3d3130bb44de445cf3d05954beb",date:"2026.08.02"},f1:"트럼프의 추가 공습 보류 발언 뒤 미국 원유 WTI가 야간 거래에서 5% 내려 배럴당 80.79달러를 기록했다.",f2:"호르무즈는 전쟁 전 세계 원유와 LNG 수송의 약 5분의 1이 지나던 병목이다. 전쟁으로 선박이 막히자 에너지 가격과 정유사 이익이 뛰었고, 이번 하락은 공급 정상화 기대를 먼저 반영했다.",f3:"시장은 실물보다 먼저 평화를 가격에 넣고 있다. 컨설턴트는 유가 80달러가 유지될 때 항공·화학·물류 고객의 원가와 운전자본이 얼마나 개선되는지 민감도 분석해야 한다."},
   {tag:"에너지실적",title:"이란 전쟁 특수에 대형 에너지사 이익 확대…가격 정상화가 다음 변수",source:{name:"AP",url:"https://apnews.com/article/4e93d5536e784d1ca21487e2c5012b8b",date:"2026.08.04"},f1:"AP는 대형 석유기업들이 이란 전쟁으로 높아진 원유·연료 가격 덕분에 더 큰 이익을 냈다고 전했다.",f2:"통항 차질은 원유 부족 우려를 키워 판매가격을 끌어올렸고, 생산·정제설비를 이미 가진 기업에는 단기 마진 확대가 됐다. 반대로 소비자와 운송업에는 비용 충격이었다.",f3:"해협 재개는 에너지 업종의 초과이익을 수요산업으로 되돌리는 분기점이 될 수 있다. 컨설턴트는 가격·물량·정제마진을 분리해 지속 가능한 이익과 전쟁 특수를 구분해야 한다."}
  ]},
  {id:"tech",no:"03",title:"테크·AI",slug:"Tech",items:[
   {tag:"AI고용",title:"BCG ‘AI는 일자리 수보다 직무 내용을 더 크게 바꾼다’",source:{name:"BCG",url:"https://www.bcg.com/publications/2026/ai-will-reshape-more-jobs-than-it-replaces",date:"2026.04.03"},f1:"BCG는 AI가 단기적으로 전체 고용을 대규모로 없애기보다 개별 직무의 과업 구성과 필요한 역량을 더 빠르게 바꿀 가능성이 크다고 분석했다.",f2:"기업은 생산성 효과를 확인하는 동안 채용을 늦출 수 있지만, 수요가 성장하는 곳은 다시 채용한다. 문제는 입문자가 반복 업무로 배우던 전통적 훈련 사다리가 약해진다는 점이다.",f3:"세계는 사람 대 AI의 단순 대체가 아니라 사람+AI 업무설계 경쟁으로 간다. 미래 컨설턴트는 산출물 작성보다 문제정의·검증·현업 적용을 증명해야 한다."},
   {tag:"AI운영",title:"AI 도구보다 전략이 성과 좌우…정기 사용자 42%는 주 1일 이상 절감",source:{name:"BCG",url:"https://www.bcg.com/publications/2026/ai-at-work-why-strategy-matters-more-than-tools",date:"2026.06.03"},f1:"BCG의 약 1만2천명 조사에서 정기적으로 AI를 쓰는 현장 직원의 42%가 매주 하루 이상을 절약한다고 답했다.",f2:"도구를 배포하는 것만으로는 성과가 고르게 나지 않았다. 명확한 전략, 워크플로 재설계, 관리자 지원이 함께 있는 조직에서 재무성과와 직원 만족이 동시에 높았다.",f3:"AI 경쟁의 초점은 모델 구매에서 운영모델 전환으로 옮겨간다. 컨설턴트에게는 사용률이 아니라 시간절감·품질·매출을 연결하는 KPI 설계가 핵심 역량이다."}
  ]},
  {id:"korea",no:"04",title:"한국",slug:"Korea",items:[
   {tag:"성장전략",title:"한국, AI 반도체 호황에 2026년 성장률 3% 목표…청년 일자리 20만개 추진",source:{name:"한국일보",url:"https://www.koreatimes.co.kr/economy/20260714/korea-eyes-3-growth-in-2026-riding-on-ai-chip-boom",date:"2026.07.14"},f1:"정부는 반도체 수출 호조를 반영해 2026년 성장률 전망을 2%에서 3%로 높이고 2030년까지 청년 일자리 20만개를 만들겠다고 밝혔다.",f2:"OECD와 IMF 전망은 2.6%로 정부보다 낮다. 정부는 반도체 세수 증가분을 미래산업·지역성장에 투입하고 전라·충청권 반도체, 피지컬 AI, 데이터센터 프로젝트를 추진한다.",f3:"한국 경제는 AI칩 집중 성장과 지역·세대 확산의 시험대로 간다. 컨설턴트는 3% 성장의 전제인 칩 사이클과 전력·인력 병목을 함께 검증해야 한다."}
  ]},
  {id:"japan",no:"05",title:"일본",slug:"Japan",items:[
   {tag:"통화정책",title:"BOJ 부총재 ‘기조물가 2% 상회 위험’…늦으면 더 빠른 인상 필요",source:{name:"The Japan Times",url:"https://www.japantimes.co.jp/business/2026/06/19/economy/himino-boj-target-inflation/",date:"2026.06.19"},f1:"히미노 료조 일본은행 부총재는 기업 간 비용 전가가 빨라져 기조물가가 2% 목표를 넘어설 위험이 있다고 말했다.",f2:"BOJ는 앞서 기준금리를 31년 만의 최고 수준으로 올렸다. 히미노는 필요한 조정을 늦추면 나중에 더 빠르게 금리를 올려야 할 수 있다고 경고했다.",f3:"일본은 디플레이션 탈출 뒤 금리 정상화 속도를 고민하는 단계다. 일본 진출 기업을 자문할 때 자금조달비용·엔화·가격전가를 한 묶음으로 봐야 한다.",vocab:{w:"価格転嫁",r:"かかくてんか",m:"원재료·인건비 상승분을 판매가격에 반영하는 것. 이번 기사에서 기업 간 비용 상승이 소비자물가로 번지는 경로를 뜻한다."}},
   {tag:"해운",title:"일본 해운업계, 호르무즈 재개에도 ‘종전·항로 안전 보장’ 선행 요구",source:{name:"The Japan Times",url:"https://www.japantimes.co.jp/business/2026/06/23/japan-shipping-industry-hormuz-safety/",date:"2026.06.23"},f1:"일본선주협회장은 종전과 항로 안전 보장이 확인돼야 선박 운항을 본격 재개할 수 있다고 밝혔다. 당시 걸프에 남은 일본 관련 선박은 37척이었다.",f2:"6월 합의 뒤 일부 선박이 통과했지만 기뢰 가능성과 재충돌 우려가 남았다. 에너지 수입 의존도가 높은 일본은 외교 합의만큼 실제 항로 안전이 중요하다.",f3:"일본 기업은 값싼 운송보다 공급 확실성을 우선하는 방향으로 움직인다. 컨설턴트는 선박·재고·대체조달의 비용을 안전 리스크와 함께 비교해야 한다.",vocab:{w:"運航再開",r:"うんこうさいかい",m:"중단했던 선박·항공편의 운항을 다시 시작하는 것. 안전 확인 뒤 실제 물류가 정상화되는 단계를 가리킨다."}}
  ]},
  {id:"consulting",no:"06",title:"컨설팅 업계",slug:"Consulting",items:[
   {tag:"AI전환",title:"OpenAI, McKinsey·BCG 등과 기업용 AI 에이전트 도입 동맹",source:{name:"Fortune",url:"https://fortune.com/2026/02/23/openai-partners-with-mckinsey-bcg-accenture-and-capgemini-to-push-its-frontier-ai-agent-platform/",date:"2026.02.23"},f1:"OpenAI는 McKinsey·BCG·Accenture·Capgemini와 손잡고 기업용 Frontier AI 에이전트의 판매와 구축을 지원하기로 했다.",f2:"컨설팅사는 고객의 기존 소프트웨어·데이터와 AI 에이전트를 연결하고, 워크플로 재설계·변화관리·산업별 적용을 맡는다. 단순 전략 보고서보다 기술 실행이 자문 매출의 중심으로 이동하는 신호다.",f3:"MBB 지원자는 ‘AI를 안다’보다 특정 산업 문제를 AI와 구조화해 풀고 오류를 검증한 사례를 준비해야 한다. 기술 파트너와 현업 사이를 번역하는 능력이 차별화 영역이다."},
   {tag:"AI수익모델",title:"BCG 분석 ‘AI 선도기업, 비용절감 3배·EBIT 마진 1.6배’",source:{name:"Fortune",url:"https://fortune.com/2026/05/13/bcg-create-lasting-cost-advantage-ai/",date:"2026.05.13"},f1:"BCG 분석에 따르면 AI 선도기업은 동종기업보다 비용 절감이 3배, EBIT 마진이 1.6배, 투자자본수익률이 2.7배 높았다.",f2:"핵심은 개별 자동화 도구가 아니라 비용구조를 처음부터 다시 설계하고 절감액을 성장 투자로 재배분하는 데 있다. 이는 컨설팅 프로젝트가 툴 설치에서 성과 책임으로 이동함을 뜻한다.",f3:"MBB 후보자는 AI 아이디어를 말하는 데 그치지 말고 기준선·절감액·재투자처를 숫자로 연결해야 한다. 향후 자문은 투입시간보다 검증된 성과에 더 가까운 방식으로 가격이 매겨질 수 있다."}
  ]}

 think:{q:"호르무즈 60일 잠정 재개안이 발표된다면, 한국 석유화학 고객사의 조달 전략을 어떻게 바꿀까?",steps:[
  {label:"1. Clarification — 문제 정의",detail:"목표를 ‘60일 동안 원료 부족을 95% 이상 막으면서 추가 물류·재고비를 최소화’로 둘까요? 제 가설은 합의 발표만 믿고 정상화하기보다 실제 통항량 회복 전까지 방어적 조달이 필요하다는 것입니다."},
  {label:"2. 구조화 — Framework 설계",detail:"①공급 안전(통항량·기뢰) ②원가(WTI 80.79달러·보험·운임) ③재고와 계약(60일 만기) ④실행 속도(대체 산지·선박)를 MECE로 나눕니다."},
  {label:"3. 분석 — 데이터 확인",detail:"공급은 전쟁 전 통항이 세계 원유·LNG 약 20%, 최근 통항량 약 10%였고, 가격은 공습 보류 직후 WTI가 5% 하락해 80.79달러였습니다. 합의는 60일 임시안이므로 갱신 실패 위험이 남습니다."},
  {label:"4. 대안/비교 — 옵션 평가",detail:"단기는 사우디 아람코·UAE ADNOC의 기존 장기계약 물량과 미국산 원유 스팟을 비교합니다. 기존 걸프 물량은 싸고 빠르나 해협 위험이 크고, 미국산은 운송시간·비용이 높지만 항로가 분리됩니다. 재고 60일 확대는 가장 빠르지만 운전자본 부담이 큽니다."},
  {label:"5. 결론 — 두괄식 제안",detail:"첫째, 실제 통항량이 전쟁 전의 50%를 넘을 때까지 미국산 스팟 20%를 유지합니다. 둘째, 60일 합의 만료 2주 전 갱신 여부를 게이트로 삼아 안전재고를 단계 축소합니다. 셋째, WTI·보험료·통항량을 주간 대시보드로 관리합니다."},
  {label:"6. 리스크 점검 — 무엇이 바뀌면?",detail:"WTI 80.79달러와 60일 합의가 유지되고 미국산 선복을 확보할 수 있다는 가정입니다. 기뢰 제거 확인, 통항량 50% 회복, 합의 연장이 동시에 확인되면 방어 물량을 줄이고, 재충돌하면 즉시 40%까지 늘립니다."}],hint:"케이스 면접의 마무리는 한 단어가 아닙니다. 좋은 답 = 결론(두괄식) + 근거(숫자·사실) + 리스크·다음 단계 + 명확한 소통이며, 단답은 레드 플래그입니다. 6단계를 직접 걸어가는 것이 ‘컨설턴트처럼 생각하기’를 보여줍니다."},

 story:"오늘 뉴스의 중심에는 지도에서 보면 손가락 하나 너비도 안 되는 호르무즈 해협이 있어. 이란과 오만이 이 길을 60일 동안 다시 열어 두는 임시 합의에 가까워졌고, 트럼프 미국 대통령은 이르면 수요일 발표할 수 있다고 말했어. 호르무즈는 전쟁 전 세계 원유와 LNG의 약 5분의 1, 즉 유조선 다섯 척 가운데 한 척꼴이 지나던 길이야. 그런데 최근 통항량은 평소의 약 10%, 열 척이 가던 자리에 한 척만 가는 수준까지 줄었지. 그래서 멀리 중동에서 생긴 일이 서울의 주유소와 대학생의 여행 항공권 가격까지 밀어 올렸던 거야.\n왜 60일이 중요할까? ‘잠정 합의’는 싸움이 완전히 끝났다는 종전선언이 아니라, 두 달 동안 일단 배가 다닐 규칙을 정하는 휴전 버튼에 가까워. 기대만으로도 미국 원유 WTI는 5% 내려 배럴당 80.79달러가 됐어. 100원짜리 물건이 95원이 된 셈이지만, 배가 실제로 돌아오지 않거나 기뢰와 보험 문제가 남으면 공장과 주유소가 느끼는 가격은 곧바로 내려가지 않을 수 있어. 뉴스의 말과 현실의 숫자 사이에 시간이 걸리는 거야. 특히 배 한 척의 보험료가 높으면 선사는 위험한 길 대신 더 먼 항로를 택하고, 그 며칠의 지연이 기업 재고와 현금 부담으로 이어져.\n이제 볼 것은 발표문보다 세 가지 숫자야. 실제 통항량이 평소의 절반 이상으로 회복하는지, 전쟁위험 보험료가 얼마나 내려가는지, 그리고 60일이 끝나기 전에 합의가 연장되는지야. 한국은 원유를 거의 전부 해외에서 들여오고 일본도 중동 에너지 의존도가 높아서, 이 세 숫자가 항공료와 플라스틱 원료값, 전기요금까지 이어져. 미래의 컨설턴트라면 ‘평화가 왔다’고 한 줄로 끝내지 말고, 어떤 지표가 어느 수준에 도달해야 기업이 재고를 줄이고 투자를 다시 시작할지 조건을 정해 주는 사람이 되어야 해.",
 industry:{valueChain:"산유국 탐사·생산 → 원유 선적·호르무즈 운송 → 정유 → 석유화학·연료 유통 → 항공·제조·소비자",bm:"산유국·정유사는 원유와 연료를 장기계약·스팟으로 판매하고, 해운사는 톤·항차별 운임과 위험 할증료를 받는다.",ksf:"안정적 매장량·정제설비, 안전한 선복과 항로, 저원가 조달·재고 최적화가 승부 조건이다.",issue:"60일 잠정 재개안이 실제 통항 회복과 보험료 하락으로 이어질지가 최대 변수다."},

const $ = (s,el=document)=>el.querySelector(s);
const esc = s => (s==null?"":String(s));
const nowKST = new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'});
$("#meta").innerHTML = `<b><a href="archive.html" style="text-decoration:underline;text-decoration-color:var(--accent-soft)" title="지난 브리핑 모아보기">${esc(BRIEFING.dateLabel)}</a></b><span>·</span><span>${esc(BRIEFING.city||'Seoul')} · ${nowKST} KST 열람</span>`;
$("#mood").textContent = BRIEFING.mood || "";
$("#heads").innerHTML = BRIEFING.headliners.map(h=>`<li>${esc(h)}</li>`).join("");
const cu = BRIEFING.catchup;
if(cu){ $("#catchup").innerHTML = `<span class="ck">🕰️ 오늘의 따라잡기 — 처음부터 이해하기</span><h3>${esc(cu.topic)}</h3><p class="intro">${esc(cu.intro)}</p><ul class="tl">${(cu.timeline||[]).map(t=>`<li><span class="d">${esc(t.d)}</span>${esc(t.e)}</li>`).join("")}</ul><div class="why">${cu.why||""}</div>`; } else { $("#catchup").style.display="none"; }
if(BRIEFING.story){ const storyParas = BRIEFING.story.split(/\n+/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join(""); $("#story").innerHTML = `<span class="sk">📖 오늘의 이야기</span>${storyParas}`; } else { $("#story").style.display="none"; }
const navItems = [...BRIEFING.sections.map(s=>({id:s.id,no:s.no,title:s.title})), ...(BRIEFING.industry ? [{id:"industry",no:"🏭",title:"산업"}] : []), ...(BRIEFING.bcg && BRIEFING.bcg.length ? [{id:"bcg",no:"📘",title:"BCG"}] : []), {id:"think",no:"💭",title:"생각거리"},{id:"cal",no:"📅",title:"일정"}];
$("#nav").innerHTML = navItems.map(n=> `<a href="#${n.id}" data-id="${n.id}"><span class="n">${esc(n.no)}</span>${esc(n.title)}</a>`).join("");
function srcHtml(s){ if(!s) return ""; const link = s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">원문(${esc(s.date)})↗</a>` : (s.date?` · ${esc(s.date)}`:""); return `<span class="item__src">${esc(s.name)}${link}</span>`; }
function fieldRow(lab,val,cls){return val?`<div class="field ${cls||""}"><span class="lab">${lab}</span><span class="val">${val}</span></div>`:""}
function termsRow(terms){ if(!terms||!terms.length) return ""; return `<div class="terms"><div class="th">📖 용어 풀이</div>${terms.map(t=>`<div class="t"><b>${esc(t.t)}</b> — ${esc(t.d)}</div>`).join("")}</div>`; }
function vocabRow(v){ if(!v) return ""; return `<div class="jword"><span class="jw-badge">🇯🇵 오늘의 비즈니스 일본어</span><span class="jw-text"><b>${esc(v.w)}</b> <span class="jw-r">(${esc(v.r)})</span> — ${esc(v.m)}</span></div>`; }
function itemCard(it){ return `<article class="item open"><button class="item__head" aria-expanded="true" type="button"><span class="tag">${esc(it.tag)}</span><span><span class="item__title">${esc(it.title)}</span><br>${srcHtml(it.source)}</span><span class="chev">▾</span></button><div class="item__wrap"><div class="item__body"><div class="item__inner">${fieldRow("무슨 일",it.f1)}${fieldRow("그동안의 이야기",it.f2,"story")}${fieldRow("So What",it.f3)}${termsRow(it.terms)}${vocabRow(it.vocab)}</div></div></div></article>`; }
let html = BRIEFING.sections.map(s=>`<section class="block" id="${s.id}"><div class="shead"><span class="no">${esc(s.no)}</span><h2>${esc(s.title)}</h2><span class="slug">${esc(s.slug)}</span></div>${s.items.map(itemCard).join("")}</section>`).join("");
if(BRIEFING.industry){ const ind=BRIEFING.industry; const indRows=[["밸류체인",ind.valueChain],["비즈니스모델",ind.bm],["승부 조건",ind.ksf],["최대 이슈",ind.issue]].map(([lab,val])=>fieldRow(lab,esc(val))).join(""); html += `<section class="block" id="industry"><div class="shead"><span class="no">🏭</span><h2>오늘의 산업 한 조각</h2><span class="slug">Industry</span></div><div class="industrycard"><span class="ik">🏭 오늘의 산업 스냅샷</span><div class="ifields">${indRows}</div></div></section>`; }
if(BRIEFING.bcg && BRIEFING.bcg.length){ const bcgItems=BRIEFING.bcg.map(b=>`<div class="bcgitem"><div class="btitle">${esc(b.titleKo)}</div><div class="borig">${esc(b.title)}</div><p class="bsum">${esc(b.summary)}</p><div class="bsw"><b>So What</b> — ${esc(b.soWhat)}</div><a class="blink" href="${esc(b.url)}" target="_blank" rel="noopener">원문 보기 ↗</a></div>`).join(""); html += `<section class="block" id="bcg"><div class="shead"><span class="no">📘</span><h2>BCG 인사이트</h2><span class="slug">BCG Publications</span></div>${bcgItems}</section>`; }
if(BRIEFING.think){ const th=BRIEFING.think; const stepsHtml=(th.steps||[]).map(s=>`<li><b>${esc(s.label)}</b> — ${esc(s.detail)}</li>`).join(""); html += `<section class="block" id="think"><div class="think"><span class="tk">💭 오늘의 생각거리 — 컨설턴트처럼 생각하기</span><p>${esc(th.q)}</p><ol class="steps">${stepsHtml}</ol><div class="hint">${th.hint||""}</div></div></section>`; }
const c = BRIEFING.calendar || {macro:[],earnings:[],sources:[]};
html += `<section class="block" id="cal"><div class="shead"><span class="no">📅</span><h2>다가오는 일정</h2><span class="slug">watchlist</span></div><div class="terms" style="border-style:solid">${[...(c.macro||[]),...(c.earnings||[])].map(r=>`<div class="t"><b>${esc(r.date)} ${esc(r.reg||"")} ${esc(r.ev)}</b>${r.nt?` — ${esc(r.nt)}`:""}</div>`).join("")}<div class="th" style="margin-top:8px">${esc(c.note||"")}</div></div></section>`;
$("#main").innerHTML = html;
const calSrc = (c.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)} ↗</a>`).join(" · ");
$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: Bloomberg · CNBC · BBC · ABC · Reuters · AP + 한국 주요 언론 + 일본 니케이·Japan Times 등 + 컨설팅업계 전문 매체 — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장 · 일정 출처: ${calSrc}<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>

  "story": "오늘 세계 뉴스는 중동에서 심상치 않은 소식부터 시작할게. 예멘의 후티 반군이 사우디아라비아의 리야드 공항과 예멘 접경의 아바공항을 잇따라 공격해서 최소 3명이 숨지고 36명이 다쳤어. 그리고 다음날인 10월 8일, 후티가 리야드공항을 또 타격했다고 주장하면서 하루 동안 항공편이 275건 넘게 결항됐고(예정된 도착편의 40%, 출발편의 30%가 취소된 거야), 독일 항공사 루프트한자그룹은 아예 10월 16일까지 리야드행 노선을 통째로 끊어버렸어. 인도의 에어인디아도 델리에서 출발하던 비행기를 안전을 이유로 되돌려서 결항시켰고 토요일까지 운항을 멈췄대. 전쟁의 영향이 유가나 금리 같은 숫자 얘기를 넘어서, 이제는 '비행기가 못 뜬다'는 눈에 보이는 문제로까지 번진 거야.\n\n국제 경제 쪽은 '회복됐다는데 왜 여전히 비싸지?'라는 궁금증을 풀어주는 기사였어. 세계 원유의 5분의 1이 지나가는 호르무즈 해협의 선박 통행량은 이미 많이 정상화됐는데, 미국 휘발유 평균 가격은 여전히 갤런당 4.36달러로 전쟁 전보다 46%나 비싸대. 왜 그런가 봤더니 이유가 한두 개가 아니었어. 일단 유조선을 모는 선장들이 위험수당으로 한 달에 10만달러 기본급에 운항 한 번당 5만달러 보너스까지 받을 정도로 운송비 자체가 비싸졌고, 투자자들은 이 새로운 공급로가 계속 유지될지 믿지 못해서 가격에 '불안 프리미엄'을 계속 얹고 있대. 게다가 주유소는 비싸게 사둔 재고를 다 팔아야 하니까 가격을 천천히 내리고, 미국이 중동 기름을 거의 안 사와도 전 세계가 하나의 시장이라 가격 영향은 똑같이 받는다는 거야. 결국 '기름이 다시 흐른다'는 소식과 '기름값이 다시 싸진다'는 소식은 완전히 다른 이야기였던 거지.\n\n국내 소식은 '역대급 실적인데 왜 주가는 떨어지지?'하는 궁금증을 자아낸 하루였어. 삼성전자가 10월 8일 3분기 매출 195조원, 영업이익 107조4000억원(전년 대비 782.5% 증가)이라는, 국내 기업 역사상 처음으로 분기 영업이익이 100조원을 넘는 기록을 발표했어. 그런데 정작 코스피는 이날 2.62% 내린 6625.93으로 마감했어. 외국인과 기관이 하루 만에 3조3000억원 넘게 팔아치웠기 때문인데, 전문가들은 '이미 예상했던 숫자라 놀랄 게 없었다'는 반응이었고, 반도체 ETF 리밸런싱이나 옵션 만기일 같은 수급 요인도 겹쳤다고 봤어. 실적 자체는 시장 예상보다도 살짝 더 좋았는데도 주가가 떨어진 걸 보면, 주식시장에서는 '얼마나 잘했냐'보다 '예상보다 얼마나 더 잘했냐'가 훨씬 중요하다는 걸 다시 보여준 셈이야.\n\n외교 쪽에서는 이집트와의 새로운 경제협력 소식이 있었어. 이재명 대통령이 10월 8일 한국을 국빈 방문한 시시 이집트 대통령과 만나서 양국 간 포괄적경제동반자협정(CEPA) 협상을 공식적으로 시작하기로 선언했어. 두 나라는 관계를 '전략적 동반자'로 끌어올리고, 조선·방산·에너지·문화 분야에서 협력 문서 12건을 체결했는데, 특히 이집트에서 K-9 자주포를 현지 생산하는 방산 협력이 성공 사례로 꼽히면서 이걸 다른 산업으로도 넓히려는 모습이었어. 하나의 산업에서 만든 성공 경험이 다른 산업 진출의 발판이 되는, 꽤 스마트한 확장 전략이라고 볼 수 있어.\n\n테크 쪽은 구글의 큰 발표 소식이야. 구글이 10월 8일, 그냥 질문에 답하는 게 아니라 실제 업무를 알아서 처리해주는 통합 에이전트를 제미나이에 넣는다고 발표했어. 목표만 던져주면 스스로 계획을 짜고, 회사 내부 시스템과 연결해서 일을 처리하는 거지. 그런데 제일 흥미로운 포인트는, 구글이 이 에이전트가 쓸 AI 모델을 사용자가 직접 고를 수 있게 했는데 그 첫 번째 외부 모델이 경쟁사인 앤트로픽의 '클로드'라는 거야. 자기 회사 기술만 쓰라고 가두는 대신 경쟁사 기술까지 끌어와서 플랫폼을 더 유용하게 만드는 '개방형' 전략을 택한 거지. 이 에이전트는 심지어 자기만의 이메일 주소와 직장 계정까지 갖는다니, 이제 AI가 진짜 '동료'처럼 취급되기 시작한 거야.\n\n마지막은 일본 얘기야. 니혼게이자이신문은 10월 9일, 일본의 4대 맥주회사인 아사히·기린·삿포로·산토리가 가격을 담합(談合, だんごう — 경쟁사들이 몰래 짜고 가격이나 조건을 맞추는 것)한 의혹으로 일본 공정거래위원회의 조사를 받고 있다고 보도했어. 공정위는 10월 7일 이 4개 회사 사무실을 모두 압수수색했는데, 이게 식품·음료업계를 대상으로 한 첫 강제조사래. 영업 담당자들이 모여서 맥주나 저가 맥주류 가격을 언제, 얼마나 올릴지 서로 맞췄다는 의혹인데, 이 4개 회사가 일본 맥주 시장의 90% 이상을 차지하고 있다 보니 공정위는 이런 쏠린 시장 구조 자체가 담합을 부르기 쉬웠다고 보고 있어. 심지어 검찰에 형사 고발까지 검토하고 있다니, 가볍게 넘어갈 사안은 아닌 것 같아.\n\n오늘 하루를 정리하면, 중동에서는 전쟁의 여파가 항공 노선 중단이라는 실제 공급망 문제로까지 번졌고, 그 전쟁이 남긴 휘발유값 부담은 공급이 정상화돼도 쉽게 사라지지 않는다는 걸 보여줬어. 국내에서는 삼성전자가 역사적인 실적을 냈는데도 주가는 오히려 빠지는 아이러니를 보였고, 외교적으로는 이집트와 새로운 경제협력의 문을 열었어. 테크·일본 쪽에서는 각각 'AI 플랫폼의 개방형 전략'과 '과점 시장의 담합 리스크'라는, 전혀 다른 산업에서의 경쟁 구도 이슈가 동시에 떠오른 하루였어."

if(BRIEFING.industry){ const ind=BRIEFING.industry; const indRows=[["밸류체인",ind.valueChain],["비즈니스모델",ind.bm],["경쟁력 요소",ind.ksf],["최대 이슈",ind.issue]].map(([lab,val])=>fieldRow(lab,esc(val))).join(""); html += `<section class="block" id="industry"><div class="shead"><span class="no">🏭</span><h2>오늘의 산업 소개</h2><span class="slug">Industry</span></div><div class="industrycard"><span class="ik">🏭 오늘의 산업 소개</span><div class="iname">${esc(ind.name||"")}</div><div class="ifields">${indRows}</div></div></section>`; }
if(BRIEFING.bcg && BRIEFING.bcg.length){ const bcgItems=BRIEFING.bcg.map(b=>`<div class="bcgitem"><div class="btitle">${esc(b.titleKo)}</div><div class="borig">${esc(b.title)}</div><p class="bsum">${esc(b.summary)}</p><div class="bsw"><b>So What</b> — ${esc(b.soWhat)}</div><a class="blink" href="${esc(b.url)}" target="_blank" rel="noopener">원문 보기 ↗</a></div>`).join(""); html += `<section class="block" id="bcg"><div class="shead"><span class="no">📘</span><h2>BCG 인사이트</h2><span class="slug">BCG Publications</span></div>${bcgItems}</section>`; }
if(BRIEFING.hkmarket){ const hk=BRIEFING.hkmarket; const hkTopics=(hk.topics||[]).map(t=>`<div class="hktopic"><div class="httl">${esc(t.topic)}</div><div class="hdet">${esc(t.detail)}</div></div>`).join(""); html += `<section class="block" id="hkmarket"><div class="shead"><span class="no">📺</span><h2>한경코리아마켓</h2><span class="slug">YouTube Morning Brief</span></div><div class="hkmeta">${esc(hk.broadcastLabel||"")} · <a href="${esc(hk.videoUrl||"")}" target="_blank" rel="noopener">${esc(hk.videoTitle||"원본 방송 보기")} ↗</a></div>${hkTopics}</section>`; }
$("#main").innerHTML = html;
$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: BBC · ABC · 조선비즈(산업) · TechCrunch · ZDNet · Gizmodo · 일본 주요 경제매체 · BCG · 한경코리아마켓(유튜브) — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장.<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

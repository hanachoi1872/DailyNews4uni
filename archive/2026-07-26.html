       f1:"미군이 13일 연속 이어가던 이란 공습을 24일 밤 처음으로 중단했다. 트럼프 대통령이 오만이 중재하는 호르무즈 해협 재개통 협상이 진전을 보이자 새 공습을 지시하지 않으면서, 개전 후 첫 '공습 없는 밤'이 이어졌다. 트럼프 대통령은 25일 백악관에서 기자들에게 '아직 결정하지 않았다. 지금은 대화 중'이라고 말했다.",
       f2:"그러나 안도는 오래가지 않았다. 이란의 지원을 받는 후티 반군이 사우디아라비아 지잔·얀부의 아람코 관련 시설을 겨냥해 미사일과 드론 공격을 감행했는데, 이는 전날 사우디가 후티 목표물에 보복 공습을 가한 데 대한 반격이었다. 네타냐후 이스라엘 총리는 28일 백악관에서 트럼프 대통령을 만나기로 확정되며, 확전과 외교적 출구 중 어느 쪽으로 국면이 기울지 이번 만남이 분수령이 될 것이라는 관측이 나온다.",
       f3:"'공습 중단'과 '새로운 전선 개방'이 같은 주말에 동시에 벌어지는 이런 국면은, 하나의 긍정적 뉴스만으로 리스크가 해소됐다고 판단하는 것이 얼마나 위험한지 보여준다. 에너지·해운 클라이언트를 자문하는 컨설턴트라면, 특정 채널(오만 중재)의 진전과 별개로 다른 전선(홍해·후티)이 열려 있는지를 함께 점검하는 다중 채널 리스크 매트릭스가 필요하다는 점을 이 사례에서 확인할 수 있다.",
       terms:[]},
      {tag:"지정학",title:"대만, 中 해상봉쇄 대비 훈련 실시…에너지 수입 95% 의존 취약성 노출",
       source:{name:"Japan Times",url:"https://www.japantimes.co.jp/news/2026/07/25/asia-pacific/taiwan-tests-chinese-siege-sea/",date:"2026.07.25"},
       f1:"대만군이 중국의 해상봉쇄 시나리오에 대응하는 훈련을 실시했다. 훈련은 선박 호송·우회 항로 확보와 핵심 물자의 비축·분배 절차를 점검하는 데 초점을 맞췄다. 중국은 최근 수년간 군함과 군용기를 동원해 대만 봉쇄를 상정한 훈련을 반복해왔다.",
       f2:"대만은 화석연료의 약 95%를 수입에 의존하며, 발전량의 절반을 천연가스에 의존하고 있어 봉쇄 시나리오에 특히 취약하다는 평가다. 이런 구조적 취약성 때문에 대만 당국은 이번 훈련에서 군사적 대응뿐 아니라 에너지·물류 공급망의 대체 경로 확보에 상당한 비중을 뒀다.",
       f3:"군사적 시나리오 훈련이 실제로는 '에너지 공급망 대체 경로 확보'라는 경제적 과제와 맞닿아 있다는 점이 핵심이다. 반도체·전자 공급망을 다루는 컨설턴트라면, 대만 유사시 리스크를 군사 뉴스로만 소비할 게 아니라 클라이언트의 조달 다변화 계획이 이런 봉쇄 시나리오까지 커버하는지 점검하는 습관이 필요하다.",
       terms:[{t:"해상봉쇄(Naval Blockade) 시나리오",d:"적대국이 특정 국가·지역으로의 해상 물자 유입을 군사력으로 차단하는 상황을 가정한 시나리오. 대만처럼 에너지·원자재 수입 의존도가 높은 경제일수록 봉쇄 시 충격이 크며, 최근에는 군사 대응뿐 아니라 공급망 대체 경로 확보가 대응 전략의 핵심으로 다뤄진다."}]}
    ]},
    {id:"econ",no:"02",title:"글로벌 경제·시장",slug:"Economy",items:[
      {tag:"AI밸류에이션",title:"'매그니피센트7' 하루새 7970억달러 증발…2025년 4월래 최악의 하루",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/07/23/stock-market-today-live-updates.html",date:"2026.07.24"},
       f1:"애플·마이크로소프트·아마존·알파벳·엔비디아·테슬라·메타 등 '매그니피센트7' 대형 기술주들이 목요일(현지시간) 하루 만에 시가총액 약 7970억달러를 잃으며 2025년 4월 이후 최악의 하루를 기록했다. 이 여파로 라운드힐 매그니피센트7 ETF(MAGS)는 이번 주에만 5% 넘게 하락하며 200일 이동평균선을 겨우 지키는 수준까지 밀렸다.",
       f2:"촉발제는 알파벳의 실적이었다. 알파벳은 매출 성장과 클라우드 수주잔고 확대라는 견조한 실적을 발표했지만, AI 인프라 설비투자 확대 계획이 투자자들을 놀라게 하면서 오히려 주가가 급락했다. 이후 금요일 S&P500지수는 0.05% 오른 7411.98, 나스닥지수는 0.64% 내린 24975.82로 마감하며 변동성 장세가 이어졌다.",
       f3:"'실적은 견조한데 주가는 급락하는' 이 패턴이 반복되는 것은, 시장이 이제 매출 성장 자체보다 '설비투자가 언제 이익으로 전환되는가'를 더 중요한 잣대로 삼고 있다는 신호다. 테크 자문을 지망하는 컨설턴트라면, 클라이언트의 AI 투자 스토리를 짤 때 '얼마나 쓰는가'보다 '언제 회수되는가'에 대한 답을 먼저 준비해야 한다는 점을 이 하루의 급락에서 읽어야 한다.",
       terms:[{t:"라운드힐 매그니피센트7 ETF(MAGS)",d:"애플·마이크로소프트·아마존·알파벳·엔비디아·테슬라·메타 등 미국 대형 기술주 7종목에 집중 투자하는 상장지수펀드(ETF). 이 7개 종목의 주가 흐름을 압축적으로 보여주는 지표로 널리 활용된다."}]},
      {tag:"통상정책",title:"트럼프, 60개국에 신규 관세 10~12.5% 발효…브렌트유 100달러·10년물 금리 급등 겹쳐",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/07/24/cnbc-daily-open-trumps-trade-tariffs-arbitrary.html",date:"2026.07.24"},
       f1:"트럼프 행정부가 60개 교역국을 대상으로 한 10~12.5%의 신규 관세를 24일(현지시간) 발효시켰다. 이는 2월 연방대법원이 '해방의 날' 관세 대부분에 위헌 판결을 내린 뒤 임시로 부과했던 10% 관세를 대체하는 조치다. 브라질 정부는 이번 조치를 '자의적'이라 비판했고, 호주는 '부당하다', 일본 정부는 '유감스럽다'는 입장을 각각 내놨다.",
       f2:"공교롭게도 같은 날 브렌트유 선물은 약 7% 급등해 배럴당 100.69달러로 마감하며 5월 26일 이후 처음 100달러선을 다시 넘었다. 관세發 인플레이션 우려까지 겹치며 10년물 국채금리는 4bp 넘게 올라 약 4.7%로 2025년 1월 이후 최고치를 기록했고, 이날 S&P500과 나스닥은 각각 1.2%, 2.2% 내리며 6월 23일 이후 최악의 하루를 보냈다.",
       f3:"관세·유가·금리라는 세 개의 인플레이션 압력이 같은 날 동시에 켜지는 것은 흔치 않은 조합이다. 매크로 리스크를 다루는 컨설턴트라면, 이렇게 여러 변수가 동시에 같은 방향(긴축)을 가리킬 때 클라이언트에게 '이번엔 진짜'라는 확신을 주기 쉬운 만큼, 오히려 각 변수가 서로 독립적인 원인에서 비롯됐는지 개별적으로 검증하는 절차가 더 중요해진다는 점을 짚어야 한다.",
       terms:[{t:"'해방의 날'(Liberation Day) 관세",d:"2025년 트럼프 대통령이 다수 교역국에 일괄 부과했던 고율 관세 조치의 별칭. 2026년 2월 연방대법원이 이 조치 대부분에 위헌 판결을 내리자, 행정부는 임시 10% 관세를 거쳐 이번에 60개국 대상 10~12.5% 관세로 대체했다."}]}
    ]},
    {id:"tech",no:"03",title:"테크·AI",slug:"Tech·AI",items:[
      {tag:"AI설비투자",title:"빅테크 4사 올해 AI 설비투자 7250억달러…전년比 77% 급증",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/07/22/alphabet-tesla-test-investor-patience-ai-spending-overshadows-growth.html",date:"2026.07.22"},
       f1:"알파벳·아마존·마이크로소프트·메타 4개 빅테크 기업의 2026년 설비투자(CAPEX) 합계가 7250억달러에 달할 전망이다. 이는 지난해 이미 사상 최대였던 4100억달러보다도 77% 늘어난 규모로, 알파벳은 최근 연간 가이던스를 1950억~2050억달러로 상향 조정하며 2027년에는 더 늘어날 수 있다고 예고했다.",
       f2:"마이크로소프트는 오는 29일, 메타도 같은 날, 아마존은 30일 각각 2분기 실적을 발표하며 이번 지출 랠리의 다음 이정표가 될 예정이다. 월가는 마이크로소프트와 메타의 실적 발표가 '빅테크가 치솟는 AI 비용을 감당할 현금흐름을 갖췄는지'를 가늠할 시험대가 될 것으로 보고 있다.",
       f3:"네 개 회사가 경쟁적으로 지출 규모를 늘리는 이 흐름은, 개별 기업의 합리적 투자 결정이 모여 산업 전체로는 '군비 경쟁'과 같은 구조를 만든다는 점을 보여준다. AI 산업을 자문하는 컨설턴트라면, 클라이언트에게 '경쟁사도 쓰니 우리도 써야 한다'는 논리를 넘어, 이 지출 경쟁에서 낙오했을 때의 리스크와 과잉투자했을 때의 리스크를 함께 정량화해 제시해야 한다.",
       terms:[{t:"설비투자(CAPEX) 가이던스",d:"기업이 향후 데이터센터·서버 등에 지출할 계획인 자본적 지출 규모를 투자자에게 미리 제시하는 전망치. 빅테크 기업들의 CAPEX 가이던스 상향은 최근 AI 밸류에이션 논쟁의 핵심 변수로 떠올랐다."}]},
      {tag:"반도체",title:"TSMC 실적 서프라이즈에도 AI 반도체株 동반 하락…차익실현 vs 밸류에이션 경계",
       source:{name:"ABC News",url:"https://abcnews.com/Business/ai-chip-stock-selloff/story?id=134844421",date:"2026.07.24"},
       f1:"TSMC가 시장 예상을 웃도는 매출·이익을 발표했음에도 불구하고, 예상보다 높은 설비투자 계획을 함께 내놓으면서 AI 반도체 관련주가 일제히 하락했다. 24일 TSMC 주가는 3% 넘게 내렸고, AI 반도체 대장주 엔비디아도 2.2% 떨어졌다. 미국 25대 반도체 기업을 추종하는 SMH지수는 한 달 전보다 9.5% 하락한 상태다.",
       f2:"전문가들은 이번 하락이 주가가 그동안 크게 오른 데 따른 차익실현 성격이 크다고 진단하면서도, 연내 금리 인상 가능성이 커진 데 따른 불안감도 함께 작용하고 있다고 분석했다. 다만 대다수 대형 반도체 기업의 주가는 여전히 연초 대비 높은 수준을 유지하고 있다.",
       f3:"'실적은 예상을 웃돌았는데 주가는 떨어지는' 현상이 인텔에 이어 TSMC까지 반복되는 것은, 반도체 업종 전반에서 시장이 이미 웬만한 호실적을 주가에 선반영해뒀다는 신호로 읽힌다. 반도체 산업 자문을 지망하는 컨설턴트라면, '실적 서프라이즈'라는 헤드라인 숫자보다 '컨센서스 대비 얼마나 더 좋았는가', '그 기대가 이미 얼마나 선반영됐는가'를 함께 짚는 습관이 밸류에이션 조언의 기본이라는 점을 이 사례에서 재확인할 수 있다.",
       terms:[{t:"차익실현(Profit-Taking)",d:"주가가 상당 기간 상승한 뒤, 투자자들이 보유 주식을 팔아 그동안의 이익을 현금화하는 매매 행위. 호실적 발표 후에도 주가가 하락하는 경우 흔히 이 차익실현 매물이 원인으로 지목된다."}]}
    ]},
    {id:"korea",no:"04",title:"한국",slug:"Korea",items:[
      {tag:"기업지배구조",title:"최태원·노소영 재산분할 9440억원 확정…역대 최대 이혼소송",
       source:{name:"한국일보",url:"https://www.hankookilbo.com/news/article/A2026072412380000046",date:"2026.07.24"},
       f1:"서울고법이 '세기의 이혼'으로 불려온 최태원 SK그룹 회장과 노소영 아트센터 나비 관장의 재산분할 소송 파기환송심에서, 최 회장이 노 관장에게 재산분할금 9440억원과 판결 확정 다음 날부터 연 5% 이자를 지급하라고 판결했다. 국내 이혼소송 사상 최대 규모의 재산분할이다.",
       f2:"재판부는 최 회장이 보유한 SK 계열사 주식을 재산분할 대상에 포함하고 최근 주가 급등분을 반영해 금액을 산정했으며, 분할 비율은 최 회장 측 3분의 2, 노 관장 측 3분의 1로 정했다. 노 관장 측이 주장한 고 노태우 전 대통령의 비자금에 대해서는 '불법 자금이라 노 관장의 기여로 평가할 수 없다'고 선을 그었다. 소송이 시작된 지 9년 만에 나온 결론이다.",

      {tag:"통상외교",title:"김정관 산업장관 방미…대미 투자 1호 '에너지 프로젝트' 8~9월 발표 예고",

       f1:"김정관 산업통상부 장관이 22일부터 25일까지 미국 워싱턴을 방문해 하워드 러트닉 상무장관 등과 지난해 한미 무역합의에 담긴 2000억달러 규모 대미 투자의 첫 프로젝트를 구체화하는 협상을 벌였다. 김 장관은 '지금 상황은 거의 막바지'라며 '이르면 8월 말, 늦어도 9월에는 첫 투자 대상을 발표할 수 있을 것'이라고 밝혔다.",

      {tag:"에너지안보",title:"다카이치 총리 '이번 달도 국가비축 방출 안 해'…美-이란 확전 속 원유공급 안정 강조",

       f1:"다카이치 사나에 총리가 25일 SNS를 통해 '이번 달 필요한 원유는 확보될 전망이며 국가비축은 방출하지 않는다'고 밝혔다. 다음 달 조달 계획도 순조롭다며, 미-이란 전쟁이 다시 격화되는 상황에서도 일본 전체에 필요한 원유량을 확보하기 위한 노력을 계속하겠다고 강조했다.",

       f3:"확전 뉴스가 나올 때마다 정부 수반이 직접 나서 '비축분은 아직 안 건드렸다'는 메시지를 내는 것은, 에너지 안보에서는 실제 공급 물량 못지않게 '비축분이 살아있다는 신호' 자체가 시장·여론의 불안을 진정시키는 수단으로 쓰인다는 점을 보여준다. 에너지·공급망 자문을 지망하는 컨설턴트라면, 클라이언트의 재고·비축 전략을 설계할 때 '얼마나 쌓아뒀는가'뿐 아니라 '위기 시 그 사실을 어떻게, 언제 공개해 신뢰를 관리할 것인가'까지 커뮤니케이션 전략에 포함해야 한다.",

    q:"당신이 자문하는 국내 대형 저비용항공사(LCC) 클라이언트가, 브렌트유가 배럴당 100달러를 돌파하고 트럼프의 60개국 대상 신규관세(10~12.5%)가 발효되며 Fed 9월 금리 인상 확률이 82%까지 치솟은 상황에서, 향후 6개월간 유류 헤지와 노선 전략을 어떻게 조정해야 할지 자문을 요청했다. 무엇을 권고하겠는가?",
    steps:[
      {label:"1. Clarification — 질문 명확화", detail:"바로 답하지 않고 확인부터 한다 — '제가 알기론 이번 유가 급등은 후티의 사우디 아람코 시설 공격과 미-이란 확전 우려가 겹치며 브렌트유가 하루 새 7% 뛰어 100.69달러를 기록한 데 따른 것이고, 호르무즈 해협 자체가 봉쇄된 것은 아직 아닌 것으로 아는데, 맞을까요? 그리고 이 항공사의 현재 유류 헤지 비율과 화물 대비 여객 매출 비중은 어느 정도인가요?' 일시적 충격인지 구조적 공급 차질인지, 그리고 이 회사가 유가에 얼마나 노출돼 있는지를 모르고는 헤지 전략의 방향 자체를 정할 수 없으므로 가장 먼저 확인한다."},
      {label:"2. 가설 수립 — Framework 설계", detail:"이 문제 전용 구조를 즉석에서 짠다. 유가·관세·금리 충격이 항공사에 미치는 영향을 MECE하게 세 갈래로 — ① 비용 측(유류비 헤지·조달 타이밍), ② 수요 측(고유가·고관세 국면에서 여객·화물 수요 변화), ③ 재무 측(Fed 9월 인상 확률 82%에 따른 자금조달 비용과 시점)."},
      {label:"3. 정보 파악 — 질문과 확인", detail:"갈래별로 질문을 던지고 오늘 기사에서 확인된 사실을 채운다 — 브렌트유가 24일 100.69달러로 급등하며 주간 기준 9.7% 올랐다는 점, 신규 관세 10~12.5%가 60개국에 발효돼 화물 물류비 부담이 얹히는 점, Fed 9월 인상 확률이 일주일 새 53%에서 82%로 급등했고 7월 인상 확률도 12%에서 38%로 뛴 점, 10년물 국채금리가 4.7%로 2025년 1월 이후 최고치를 기록해 회사채 조달비용이 오르고 있는 점까지 확인."},
      {label:"4. 분석/추론 — 옵션 비교", detail:"확인된 사실을 근거로 대안을 비교한다 — 지금 유류 선물을 추가 매입해 헤지 비율을 즉시 확대하는 방안(속도는 빠르지만 유가가 다시 꺾이면 손실 부담) vs 헤지 비율은 유지한 채 고유가 국면에 취약한 장거리·저마진 노선만 선별 감편하는 방안(리스크는 낮지만 매출 감소) vs 9월 FOMC 전에 회사채 발행을 서둘러 조달비용 상승을 피하는 방안(금리는 아끼지만 단기 유동성 부담)."},
      {label:"5. 결론 — 두괄식 답변", detail:"결론부터 압축해 먼저 제시한다 — '① 유류 헤지 비율은 현재 수준에서 20%포인트만 우선 확대해 단기 유가 변동 노출을 낮추고, ② 장거리·저마진 노선은 9월 FOMC 결과가 나올 때까지 한시적으로 감편하며, ③ 9월 FOMC 이전에 필요 자금의 절반을 우선 조달해 금리 인상 리스크를 헤지한다'는 3단 권고를 먼저 제시한 뒤 근거를 설명한다."},
      {label:"6. 부가적 언급 — 리스크·제약사항", detail:"이 권고는 이번 유가 급등이 후티·이란발 지정학 충격에서 비롯된 '일시적 충격'이며 호르무즈 해협 자체는 아직 정상 운영 중이라는 전제에 기반한다. 만약 호르무즈가 실제로 봉쇄되는 수준까지 확전되거나, 반대로 28일 네타냐후-트럼프 회동에서 외교적 해법이 나와 유가가 빠르게 진정될 경우 헤지·노선 전략을 다시 짜야 하며, Fed가 실제로 9월에도 동결을 유지할 경우 조달비용 조기 확정의 이점도 함께 재검토해야 한다는 점을 덧붙인다."}
    ],
    hint:"<b>의사결정 기준</b> — 실제 MBB 케이스는 항상 이 기준으로 마무리한다: 정량(비용·기간) + 정성(관계·리스크) + 실현가능성 + 수익성. '유가가 오르니 헤지를 늘리면 된다'는 한 줄짜리 답이 아니라, Clarification → 가설수립 → 정보파악 → 분석/추론 → 결론(두괄식) → 부가적 언급까지 6단계를 명시적으로 거치는 것 자체가 '컨설턴트처럼 생각한다'는 것을 보여주는 핵심이다."
  },
  calendar:{note:"일정은 유동적이므로 확정 전 원문 확인을 권장한다.",
    macro:[
      {date:"07.28",reg:"🇺🇸🇮🇱",ev:"네타냐후 총리, 백악관서 트럼프 대통령 면담",nt:"이란 확전이냐 외교적 출구냐를 가늠할 분수령으로 주목."},
      {date:"07.28~29",reg:"🇺🇸",ev:"FOMC",nt:"유가 100달러 돌파·신규 관세 발효 겹치며 9월 인상 확률 82%까지 급등, 7월은 여전히 동결 우세 전망."},
      {date:"07.29",reg:"🇺🇸",ev:"마이크로소프트·메타 2분기 실적",nt:"빅테크 4사 합산 올해 CAPEX 7250억달러(전년比 77%↑) 가이던스가 실제로 집행되고 있는지 확인하는 첫 시험대."},
      {date:"07.29",reg:"🇰🇷",ev:"SK하이닉스 2분기 실적",nt:"영업이익 70조원 돌파 및 70%대 영업이익률 재달성 여부가 관전 포인트."},
      {date:"07.30",reg:"🇺🇸",ev:"아마존 2분기 실적",nt:"빅테크 4사 중 마지막 발표로, AI 설비투자 랠리에 대한 시장 판단을 완성지을 변수."},
      {date:"07말~08초(잠정)",reg:"🇰🇷",ev:"보유세·거래세 개편 최종안 발표",nt:"이재명 대통령 '3배 인상 시 폭동' 발언 이후 실거주·비거주·초고가 차등과세 방향으로 조율 중."},
      {date:"08말~09월(잠정)",reg:"🇰🇷🇺🇸",ev:"대미 투자 1호 프로젝트(에너지 중심) 발표",nt:"2000억달러 규모 대미 전략투자 중 첫 사업. 반도체 기업 추가 투자 요구는 별도 협의 진행 중."}
    ],
    earnings:[],
    sources:[{name:"Bloomberg",url:"https://www.bloomberg.com/news/articles/2026-07-25/us-pauses-nightly-strikes-on-iran-as-houthis-clash-with-saudis"},{name:"CNBC",url:"https://www.cnbc.com/2026/07/24/cnbc-daily-open-trumps-trade-tariffs-arbitrary.html"}]

const $ = (s,el=document)=>el.querySelector(s);
const esc = s => (s==null?"":String(s));
const nowKST = new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'});
$("#meta").innerHTML = `<b><a href="archive.html" style="text-decoration:underline;text-decoration-color:var(--accent-soft)" title="지난 브리핑 모아보기">${esc(BRIEFING.dateLabel)}</a></b><span>·</span><span>${esc(BRIEFING.city||'Seoul')} · ${nowKST} KST 열람</span>`;
$("#mood").textContent = BRIEFING.mood || "";
$("#heads").innerHTML = BRIEFING.headliners.map(h=>`<li>${esc(h)}</li>`).join("");
const cu = BRIEFING.catchup;
if(cu){ $("#catchup").innerHTML = `<span class="ck">🕰️ 오늘의 따라잡기 — 처음부터 이해하기</span><h3>${esc(cu.topic)}</h3><p class="intro">${esc(cu.intro)}</p><ul class="tl">${(cu.timeline||[]).map(t=>`<li><span class="d">${esc(t.d)}</span>${esc(t.e)}</li>`).join("")}</ul><div class="why">${cu.why||""}</div>`; } else { $("#catchup").style.display="none"; }
const navItems = [...BRIEFING.sections.map(s=>({id:s.id,no:s.no,title:s.title})), {id:"think",no:"💭",title:"생각거리"},{id:"cal",no:"📅",title:"일정"}];
$("#nav").innerHTML = navItems.map(n=> `<a href="#${n.id}" data-id="${n.id}"><span class="n">${esc(n.no)}</span>${esc(n.title)}</a>`).join("");
function srcHtml(s){ if(!s) return ""; const link = s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">원문(${esc(s.date)})↗</a>` : (s.date?` · ${esc(s.date)}`:""); return `<span class="item__src">${esc(s.name)}${link}</span>`; }
function fieldRow(lab,val,cls){return val?`<div class="field ${cls||""}"><span class="lab">${lab}</span><span class="val">${val}</span></div>`:""}
function termsRow(terms){ if(!terms||!terms.length) return ""; return `<div class="terms"><div class="th">📖 용어 풀이</div>${terms.map(t=>`<div class="t"><b>${esc(t.t)}</b> — ${esc(t.d)}</div>`).join("")}</div>`; }
function vocabRow(v){ if(!v) return ""; return `<div class="jword"><span class="jw-badge">🇯🇵 오늘의 비즈니스 일본어</span><span class="jw-text"><b>${esc(v.w)}</b> <span class="jw-r">(${esc(v.r)})</span> — ${esc(v.m)}</span></div>`; }
function itemCard(it){ return `<article class="item open"><button class="item__head" aria-expanded="true" type="button"><span class="tag">${esc(it.tag)}</span><span><span class="item__title">${esc(it.title)}</span><br>${srcHtml(it.source)}</span><span class="chev">▾</span></button><div class="item__wrap"><div class="item__body"><div class="item__inner">${fieldRow("무슨 일",it.f1)}${fieldRow("그동안의 이야기",it.f2,"story")}${fieldRow("So What",it.f3)}${termsRow(it.terms)}${vocabRow(it.vocab)}</div></div></div></article>`; }
let html = BRIEFING.sections.map(s=>`<section class="block" id="${s.id}"><div class="shead"><span class="no">${esc(s.no)}</span><h2>${esc(s.title)}</h2><span class="slug">${esc(s.slug)}</span></div>${s.items.map(itemCard).join("")}</section>`).join("");
if(BRIEFING.think){ const th=BRIEFING.think; const stepsHtml=(th.steps||[]).map(s=>`<li><b>${esc(s.label)}</b> — ${esc(s.detail)}</li>`).join(""); html += `<section class="block" id="think"><div class="think"><span class="tk">💭 오늘의 생각거리 — 컨설턴트처럼 생각하기</span><p>${esc(th.q)}</p><ol class="steps">${stepsHtml}</ol><div class="hint">${th.hint||""}</div></div></section>`; }
const c = BRIEFING.calendar || {macro:[],earnings:[],sources:[]};
html += `<section class="block" id="cal"><div class="shead"><span class="no">📅</span><h2>다가오는 일정</h2><span class="slug">watchlist</span></div><div class="terms" style="border-style:solid">${[...(c.macro||[]),...(c.earnings||[])].map(r=>`<div class="t"><b>${esc(r.date)} ${esc(r.reg||"")} ${esc(r.ev)}</b>${r.nt?` — ${esc(r.nt)}`:""}</div>`).join("")}<div class="th" style="margin-top:8px">${esc(c.note||"")}</div></div></section>`;
$("#main").innerHTML = html;
const calSrc = (c.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)} ↗</a>`).join(" · ");
$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: Bloomberg · CNBC · BBC · ABC · Reuters · AP + 한국 주요 언론 + 일본 니케이·Japan Times 등 + 컨설팅업계 전문 매체 — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장 · 일정 출처: ${calSrc}<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>

       f1:"도널드 트럼프 미국 대통령은 이란 및 주변 중동국가들이 신속한 합의를 위해 노력하고 있다며, 이번 주말로 예정됐던 이란에 대한 추가 공습 계획을 다시 한번 보류한다고 밝혔다.",
       f2:"그러나 실제 호르무즈 해협을 통과하는 유조선은 하루 2척 안팎으로, 개전 전 대비 통행량이 약 10% 수준에 그치고 있다는 집계가 나온다. 여기에 별도로 마르코 루비오 국무장관과 영국·프랑스·독일(E3) 외무장관들은 이란이 8월 말까지 포괄적 핵합의에 동의하지 않으면 유엔 스냅백 제재를 재발동하겠다는 사실상의 데드라인을 제시했다. 이란 관영매체와 당국자들은 아직 합의가 임박했다는 신호를 내놓지 않고 있다.",
       f3:"'공습 보류'라는 정치적 제스처와 '통행량 10%'라는 실물 지표가 서로 다른 방향을 가리키고 있다는 점이 핵심이다. 지정학 리스크를 자문하는 컨설턴트라면, 정상급 발언 하나로 안심할 게 아니라 실제 선박 통항 수, 전쟁리스크 보험료 같은 정량 지표로 데스크당 검증하는 습관이 왜 중요한지 이 사례에서 다시 확인해야 한다.",
       terms:[{t:"스냅백(snapback) 제재",d:"이란 핵합의(JCPOA) 관련 조항에 따라, 이란이 합의를 어길 경우 유엔 안보리가 별도 표결 없이 과거 해제했던 모든 제재를 자동으로 되살리는 절차. 루비오 장관과 E3가 8월 말을 데드라인으로 제시한 것은 이 스냅백 카드를 실제로 쓰겠다는 압박이다."}]},
      {tag:"우크라이나 전쟁",title:"러시아, 키이우에 대규모 미사일 공세…10명 사망, 우크라이나 패트리엇 추가 요격기 호소",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/08/01/russia-pounds-kyiv-kills-nine-as-ukraine-appeals-for-interceptors.html",date:"2026.08.01"},
       f1:"러시아가 우크라이나 수도 키이우를 비롯한 전역에 미사일·드론 공세를 퍼부어 최소 10명이 숨졌다. 우크라이나 정부는 미국에 패트리엇 요격미사일 추가 지원을 거듭 호소했다.",
       f2:"이번 공세는 8월 들어서도 드니프로페트로우스크주 크리비리흐 인근 주유소, 드니프로 식품창고 등 민간 인프라를 겨냥한 공격이 이어지는 가운데 나왔다. 미국 정부는 최근 패트리엇 라이선스(현지 생산 허가) 관련 요청에 회의적인 입장을 밝힌 것으로 전해져, 우크라이나의 방공망 확충에 제동이 걸릴 수 있다는 우려가 커지고 있다.",
       f3:"전선이 아니라 민간 인프라, 그것도 요격 능력이 부족한 지역이 반복 표적이 되고 있다는 점이 핵심이다. 지정학·공급망 리스크를 자문하는 컨설턴트라면, 우크라이나·인접국에 생산기지나 물류거점을 둔 기업이라면 방공망 지원 논의의 진행 상황 자체가 곧 그 지역의 실질적 리스크 프리미엄이라는 점을 이 사례에서 확인해야 한다.",
       terms:[]}
    ]},
    {id:"econ",no:"02",title:"글로벌 경제·시장",slug:"Economy",items:[
      {tag:"빅테크·증시",title:"아마존, 시가총액 3조달러 첫 돌파…AWS 서프라이즈에 반도체주는 급락",
       source:{name:"Bloomberg",url:"https://www.bloomberg.com/news/articles/2026-08-03/us-futures-climb-as-focus-shifts-back-to-earnings-oil-slides",date:"2026.08.03"},
       f1:"아마존 주가가 8월 3일(현지시간) 장중 5% 넘게 급등하며 시가총액 3조달러를 사상 처음 돌파했다. 2분기 클라우드 부문(AWS) 매출이 422억달러로 시장 예상치(405억달러)를 웃돈 영향이다.",
       f2:"이로써 아마존은 애플·마이크로소프트·알파벳·엔비디아에 이어 시가총액 3조달러를 넘어선 다섯 번째 기업이 됐다. 반면 같은 날 마이크론·브로드컴 등 반도체 기업 주가는 하락했고, 필라델피아반도체지수(SOX)는 1.9% 떨어졌다. S&P500지수는 1%, 나스닥100지수는 0.6% 각각 올랐다.",
       f3:"AI 밸류체인 안에서도 '클라우드로 돈 버는 빅테크'와 '반도체 제조사'의 주가가 같은 날 정반대로 움직였다는 점이 핵심이다. 자산배분·산업분석을 자문하는 컨설턴트라면, 'AI 수혜주'를 하나의 묶음으로 볼 게 아니라 밸류체인 어느 단계에서 실제로 이익이 발생하고 있는지를 분기 실적으로 매번 재확인해야 한다는 점을 이 사례에서 확인해야 한다.",
       terms:[]},
      {tag:"공급망·물류",title:"라인강 수위, 1880년 관측 이래 최저…바지선 운임 두 달 새 400% 폭등",
       source:{name:"Bloomberg",url:"https://www.bloomberg.com/news/articles/2026-08-03/rhine-falls-to-lowest-since-1880-disrupting-european-trade",date:"2026.08.03"},
       f1:"유럽 산업물류의 핵심 동맥인 라인강의 수위가 병목지점인 독일 카우프 기준 24cm까지 떨어져, 1880년 관측을 시작한 이래 가장 낮은 수준을 기록했다.",
       f2:"수위가 40~50cm 밑으로 떨어지면 바지선은 정상 적재량의 20% 정도만 실을 수 있다는 게 독일 연방수로청 설명이다. 실제로 로테르담에서 카우프 이남 독일 도시로 향하는 원유·화학제품 바지선 운임은 두 달 새 약 400% 급등했다. 철광석·석탄·화학제품 등 유럽 산업 벨트의 원자재 공급에 차질 우려가 커지고 있다.",
       f3:"가뭄이라는 '기후 리스크'가 운임 400% 급등이라는 '경영 리스크'로 곧바로 전환됐다는 점이 핵심이다. 공급망·물류를 자문하는 컨설턴트라면, 2018년 같은 라인강 가뭄으로 독일 산업생산이 최대 1.5% 줄었던 전례를 근거로, 내륙수운 의존도가 높은 클라이언트에게는 철도·트럭 등 대체 운송 옵션을 상시 확보해두라고 권고해야 한다는 점을 이 사례에서 확인해야 한다.",
       terms:[{t:"카우프(Kaub) 병목지점",d:"독일 라인강 중류에 위치한 수위 관측 기준점으로, 강폭이 좁고 수심이 얕아 남부 독일·스위스로 향하는 바지선 운항의 병목이 되는 지점이다. 이곳 수위가 낮아지면 라인강 전체 물류가 사실상 마비된다."}]}
    ]},
    {id:"tech",no:"03",title:"테크·AI",slug:"Tech·AI",items:[
      {tag:"AI패권경쟁",title:"허깅페이스 CEO \"중국이 AI 경쟁에서 앞서가고 있다\"…오픈모델 주도권 이미 넘어가",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/08/03/hugging-face-china-ai-race-open-models.html",date:"2026.08.03"},
       f1:"AI 모델 공유 플랫폼 허깅페이스의 클레망 들랑그 CEO는 8월 3일 CNBC 인터뷰에서 중국이 AI 경쟁에서 미국을 앞서가고 있으며, 특히 오픈모델(공개 가중치 모델) 분야에서는 이미 확실한 주도권을 쥐고 있다고 말했다.",
       f2:"들랑그 CEO는 지금 속도라면 올해 말이나 내년쯤 중국이 최전선(프론티어) AI 모델에서도 미국을 앞설 수 있다고 내다봤다. 그는 그 배경으로 중국 AI 업계의 개방적 협업·공유 생태계를 꼽으며, 반대로 미국 모델 개발사들은 각자 폐쇄적인 개발(silo)에 머물러 있어 뒤처질 위험이 있다고 지적했다. 실제로 그는 최근 오픈AI발 해킹 사고 이후 자사 시스템 방어에 베이징 Z.ai의 오픈소스 모델 GLM 5.2를 활용했다고 밝혔다.",
       f3:"AI 경쟁의 무게중심이 '누가 가장 똑똑한 모델을 만드느냐'에서 '누가 가장 널리 쓰이는 오픈 생태계를 만드느냐'로 옮겨가고 있다는 점이 핵심이다. 테크·AI 전략을 자문하는 컨설턴트라면, 클라이언트의 AI 벤더 선정 기준에 성능 지표뿐 아니라 오픈소스 생태계 참여도와 이식성(lock-in 위험)까지 포함해야 한다는 점을 이 사례에서 확인해야 한다.",
       terms:[]},
      {tag:"AI인프라·금융",title:"엔비디아, 7500억달러 AI 투자 나선다…\"서큘러 파이낸싱\" 우려 재점화",
       source:{name:"Bloomberg",url:"https://www.bloomberg.com/news/articles/2026-07-27/nvidia-s-750-billion-deals-revive-fear-of-ai-circular-financing",date:"2026.07.27"},
       f1:"엔비디아가 데이터센터·AI 인프라 확충을 위해 7500억달러(약 1050조원) 규모의 신규 투자·거래를 추진 중인 것으로 전해졌다. 앞서 한국 SK그룹과도 500억달러 이상 규모의 사업 협력을 발표한 바 있다.",
       f2:"이번 투자 소식은 엔비디아가 오픈AI의 데이터센터 임대 비용을 최대 2500억달러까지 지급보증해주는 방안을 논의 중이라는 소식과 겹치며, 'AI 서큘러 파이낸싱(순환금융)'에 대한 우려를 다시 키우고 있다. 엔비디아가 고객사(오픈AI 등)에 투자하고, 그 고객사가 다시 엔비디아 칩을 사들이는 구조가 반복되면 실제 수요보다 부풀려진 매출이 잡힐 수 있다는 지적이다.",
       f3:"칩을 만드는 회사가 자기 칩을 사줄 고객의 자금줄까지 대주고 있다는 구조 자체가 핵심이다. AI 인프라 투자를 자문하는 컨설턴트라면, 이런 순환출자성 거래가 낀 매출은 액면 그대로 성장률에 반영해서는 안 되며, 실제 최종 사용자(엔드유저) 수요와 분리해 밸류에이션을 다시 검증해야 한다는 점을 이 사례에서 확인해야 한다.",
       terms:[{t:"서큘러 파이낸싱(Circular Financing)",d:"한 기업이 거래 상대방(고객사)에게 투자하거나 자금을 대주고, 그 상대방이 다시 그 돈으로 자사 제품을 사들이게 하는 순환 구조의 자금조달·매출 계상 방식. 실제 외부 수요 없이도 장부상 매출이 늘어나는 것처럼 보일 수 있어, 밸류에이션 거품 논란의 단골 소재다."}]}
    ]},
    {id:"korea",no:"04",title:"한국",slug:"Korea",items:[
      {tag:"세제·부동산",title:"정부, 2026년 세제개편안 발표…32억원 이상 주택 종부세 단계적 인상",
       source:{name:"한국경제",url:"https://www.hankyung.com/article/2026080325421",date:"2026.08.03"},
       f1:"정부는 8월 3일 세제발전심의위원회를 열고 2026년 세제개편안을 확정·발표했다. 핵심은 32억원을 넘는 고가 주택과 비거주 1주택자·다주택자의 종합부동산세(종부세)를 내년부터 단계적으로 올리는 것이다.",
       f2:"거주용 1주택자의 기본공제액은 현행 12억원에서 14억원으로 늘려 실거주자 부담은 낮추는 대신, 비거주 1주택자의 기본공제액은 12억원에서 9억원으로 낮춘다. 이렇게 되면 기존 450만원이던 종부세가 1970만원까지 늘어나는 경우도 나온다. 종부세 개편만으로 향후 5년간 세수가 2조1815억원 늘어날 전망으로, 전체 세수 증가분(3조4430억원)의 63.4%를 차지한다.",
       f3:"'세금을 깎아준다'는 발표 안에 사실은 '고가·비거주 주택에는 더 걷는다'는 정반대 방향이 함께 들어있다는 점이 핵심이다. 세무·부동산 자문을 하는 컨설턴트라면, 세제개편안을 하나의 감세·증세 패키지로 뭉뚱그려 볼 게 아니라 거주 여부·보유 주택 수·가격대별로 대상자를 잘게 쪼개 영향을 따져봐야 한다는 점을 이 사례에서 확인해야 한다.",
       terms:[{t:"종합부동산세(종부세)",d:"일정 기준을 초과하는 주택·토지 보유자에게 부과하는 국세로, 매년 6월 1일 기준 공시가격을 토대로 산정한다. 거주 여부, 주택 수, 가격대에 따라 공제액과 세율이 크게 달라져 정권마다 개편의 단골 대상이 돼 왔다."}]},
      {tag:"증시",title:"코스피, 사상 최대 폭등 하루 만에 5.12% 급락…반도체서 바이오·로봇으로 수급 이동",
       source:{name:"한국경제",url:"https://www.hankyung.com/article/2026080319876",date:"2026.08.03"},

  story: "오늘 유럽에서는 좀 낯선 뉴스가 하나 화제였어. 독일을 가로지르는 라인강의 수위가 카우프라는 지점 기준으로 24cm까지 떨어졌는데, 이게 1880년에 수위를 재기 시작한 이래로 가장 낮은 수치래. 수위가 40~50cm 아래로 내려가면 바지선(강에서 화물을 실어 나르는 평평한 배)이 원래 실을 수 있는 양의 딱 20%, 그러니까 다섯 상자 중에 한 상자만 싣고 다녀야 해. 그러다 보니 로테르담 항구에서 독일 남부로 원유나 화학제품을 실어 나르는 바지선 운임이 두 달 만에 약 400%나 뛰었어. 원래 100만원이면 되던 뱃삯이 500만원이 된 셈이야.\n근데 이게 왜 이렇게 큰 뉴스가 됐냐면, 라인강이 그냥 강이 아니라 유럽 산업의 '혈관' 같은 곳이기 때문이야. 독일·스위스의 화학·철강 공장들이 원자재를 받고 완제품을 내보내는 통로가 대부분 이 강이거든. 유럽에 몰아친 폭염과 가뭄으로 강물이 마르면서 이 혈관이 좁아진 거지. 사실 2018년에도 똑같은 일이 벌어진 적이 있는데, 그때도 라인강이 말라붙으면서 독일 전체 산업생산이 한 해 동안 최대 1.5%까지 줄어들었어. 나라 전체 공장이 만드는 물건의 양이 그만큼 통째로 줄어들었다는 뜻이니까 결코 작은 숫자가 아니야.\n그래서 앞으로는 두 가지를 지켜봐야 해. 하나는 이번 가뭄이 2018년처럼 비가 다시 오면서 풀리는 일시적인 현상으로 끝나느냐, 아니면 기후변화 탓에 앞으로도 여름마다 반복되는 '뉴노멀'이 되느냐야. 둘째는 화학·철강 같은 기업들이 이참에 철도나 트럭 같은 대체 운송수단을 얼마나 빨리, 얼마나 많이 확보하느냐야. 물류 문제를 다루는 사람이라면, 강물 수위 같은 날씨 변수 하나가 기업의 원가와 납기를 이렇게까지 뒤흔들 수 있다는 걸 이번 사례에서 눈여겨봐야 해.",

  "story": "오늘 아침 가장 먼저 짚어볼 소식은 다시 격해진 미국-이란 무력충돌이야. 어제(9월1일) 낮에 미군이 호르무즈 해협 남쪽에 있는 이란의 항구도시들, 그러니까 반다르아바스, 차바하르 같은 곳이랑 케슘섬 일대를 겨냥해서 새로운 공습을 퍼부었어. 방공시설이랑 레이더, 배(선박), 그리고 기뢰(물속에서 배를 터뜨리는 폭탄)를 설치할 수 있는 시설까지 노렸다는데, 이란이 최근에 상선을 공격하고 미군에도 위협을 가하려 했던 것에 대한 보복이라고 미군은 설명했어. 트럼프 대통령은 만약 이란이 또 보복하면 \\\"훨씬 더 세게, 더 높은 수준으로\\\" 맞받아치겠다고 경고했고, 이 소식이 뜨자마자 국제 유가가 확 뛰어서 서부텍사스산원유(WTI)는 배럴당 90달러, 브렌트유는 94달러를 넘어섰어.\n\n그리고 이 유가 급등이 곧바로 다른 곳에도 불을 옮겼는데, 바로 채권 시장이야. 미국 정부가 돈을 빌릴 때 발행하는 국채, 그중에서도 집값 대출(모기지) 금리에 큰 영향을 주는 10년 만기 국채의 금리가 하루 만에 4.80%까지 치솟았어. 이게 2025년 초 이후로 가장 높은 수준이래. 왜 이렇게 됐냐면, 미국 정부가 원래도 돈을 많이 빌리고 있었는데 거기다 유가까지 오르면서 물가가 더 오를 거란 걱정이 커졌고, 그러면 투자자들은 국채를 사줄 때 더 높은 이자(금리)를 요구하게 되거든. 이 금리 상승은 미국에서 끝나지 않고 일본으로도 번져서, 일본의 10년 만기 국채 금리도 이날 30년 만에 처음으로 3%를 넘어섰어.\n\n일본 이야기를 좀 더 해보면, 이 국채 금리 급등의 배경에는 다카이치 사나에 일본 총리의 정책이 있어. 다카이치 총리는 작년 10월에 취임한 뒤로 반도체나 AI 같은 전략 산업에 정부 돈을 왕창 투자하겠다는 '적극적으로 돈 쓰는' 정책을 밀어붙이고 있는데, 문제는 일본 정부의 빚이 이미 국내총생산(한 나라가 1년 동안 만들어내는 모든 것의 가치 합, GDP)의 200%를 넘은 상태거든. 그래서 채권 시장에서는 '이러다 나라 곳간이 더 위험해지는 거 아니냐'는 걱정이 커지면서 국채를 팔아치우기 시작했고, 이게 바로 금리가 오른 이유야. 이렇게 채권 투자자들이 스스로 나서서 정부의 씀씀이에 경고를 보내는 걸 '채권 자경단'이라고 부르는데, 오늘 일본에서 딱 그 모습이 나타난 거지.\n\n한국 이야기로 넘어가 볼게. 좋은 소식부터 전하면, 8월 한국의 수출액이 작년 같은 달보다 68.7%나 늘어난 982억5000만달러를 기록해서 역대 3위 실적을 세웠어. 이 중에서도 반도체 수출이 467억달러로 역대 최대치를 또 갈아치웠는데, 이게 전체 수출의 47.5%를 차지할 정도야. 구글이나 아마존 같은 빅테크들이 AI 서버를 돌리려고 반도체를 계속 사들이고 있어서 그런 거래. 그런데 같은 날 안 좋은 소식도 있었는데, 현대차의 국내 판매량이 작년보다 41.1%나 확 줄었어. 노사 임금 협상 문제로 파업이 벌어져서 공장이 멈췄기 때문인데, 반면 기아는 국내 판매는 좀 줄었어도 해외 판매가 7.4% 늘면서 오히려 전체 실적을 지켜냈어. 같은 파업이라는 악재를 맞아도 해외에서 얼마나 잘 팔리느냐에 따라 회사 성적이 이렇게 갈린 거야.\n\n미국 실리콘밸리에서는 아주 젊은 창업자들의 성공 스토리가 화제였어. AI 모델을 학습시키는 데 필요한 데이터를 만들어주는 회사 '애프터쿼리'가 최근 투자를 받으면서 몸값이 32억달러(약 4조4000억원)로 평가됐는데, 이게 불과 5개월 전 몸값(3억달러)보다 10배 넘게 뛴 거야. 이 회사를 만든 두 사람은 각각 22살, 23살인 고등학교 친구 사이인데, 창업한 지 18개월 만에 이렇게 급성장했어. 이 회사는 의사나 변호사 같은 전문가들을 고용해서 AI 회사들한테 고품질 학습 데이터를 만들어 파는 사업을 하는데, 이미 엔비디아 같은 회사를 고객으로 두고 있어. 다만 최근에 메타가 남는 컴퓨팅 자원을 빌려주는 사업을 시작하겠다고 하면서 'AI 투자가 너무 과했던 거 아니냐'는 논란이 불붙었던 걸 보면, 이런 데이터 회사들의 초고속 성장도 결국 빅테크들이 AI에 계속 돈을 쓰느냐에 달려있다는 걸 알 수 있어.\n\n오늘 하루를 묶어보면, 결국 중동에서 시작된 불씨 하나가 유가, 국채 금리, 증시까지 도미노처럼 넘어간 하루였어. 미국-이란 충돌이 다시 불붙으니까 유가가 뛰었고, 유가가 뛰니까 미국이랑 일본 국채 금리가 동시에 치솟았고, 그 여파가 다음날 한국 코스피(-3.08%)랑 코스닥(-2.25%)까지 덮쳤어. 그 와중에 한국은 반도체 수출로는 역대급 실적을 내면서도 자동차 산업에서는 파업으로 골머리를 앓았고, 미국에서는 22살 청년들이 AI 붐을 타고 순식간에 유니콘 기업을 만들어내는 정반대의 장면도 동시에 펼쳐졌어. 결국 오늘 뉴스들을 하나로 꿰어보면, 지정학적 리스크 하나가 얼마나 빠르고 광범위하게 전 세계 경제를 흔들 수 있는지, 그리고 그 흔들림 속에서도 누군가는 위기를 기회로 바꾸고 있다는 걸 보여준 하루였어.",

$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: BBC · ABC · 조선비즈(산업) · TechCrunch · ZDNet · Gizmodo · 일본 주요 경제매체 · BCG · 한경코리아마켓(유튜브) — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장.<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

  "story": "오늘 가장 훈훈한 소식은 우크라이나에서 들려왔어. 트럼프 대통령의 특사인 스티브 위트코프와 사위 재러드 쿠슈너가 토요일에 모스크바 크렘린궁에서 푸틴 대통령을 3시간 넘게 만난 다음 날, 곧바로 키이우로 날아가 젤렌스키 대통령을 만났거든. 러시아 쪽은 이 대화를 '건설적이고 유익했다'고 평가했고 놀랍게도 대화 주제가 전쟁을 넘어 미국과 러시아의 공동 경제 프로젝트 이야기까지 나왔대. 키이우에서는 두 특사가 회담을 '실질적(substantive)'이라고 표현했고, 젤렌스키 대통령은 '다시는 침략할 기회조차 주지 않는 정의롭고 공정한 평화'를 목표로 한다고 말했어. 영국·프랑스·독일의 안보보좌관들까지 세 번째 회담에 합류했고, 두 나라는 이 회담이 열리는 주말 동안만이라도 서로의 수도에 대한 공습을 멈추기로 합의했어 — 완전한 휴전은 아니지만, 4년 반 가까이 이어진 전쟁에 모처럼 숨통이 트인 순간이었지. 쿠슈너와 위트코프는 '겨울이 오기 전에' 돌파구를 만들고 싶다고 밝혔는데, 사실 이 협상은 몇 달째 이란 전쟁에 밀려 뒷전이었다가 이제야 다시 탄력을 받는 모습이야.\n\n반면 중동은 여전히 안갯속이야. 이란은 일요일에 호르무즈 해협으로 들어오려던 미군의 무인 함정을 타격했다고 주장했는데, 미군은 이를 '완전한 거짓말'이라며 곧바로 부인했어. 이 주장은 바로 전날 미군이 이란 유조선 3척을 타격한 데 대한 맞대응 성격으로 나온 건데, 전문가들은 이제 양측의 교전이 육상이 아니라 바다 위에서, 그것도 호르무즈 해협의 통제권을 놓고 벌이는 '탱커 전쟁' 양상으로 굳어지고 있다고 진단해. 실제로 세계 원유 수송량의 20%가 지나가는 이 해협을 통과하는 상선 수는 하루 11척에서 6척으로 뚝 떨어졌고 — 최근 10일 평균(13척)의 절반도 안 되는 수준이야 — 이 여파로 브렌트유는 이번 한 주에만 9% 가까이 올라 배럴당 97달러 근처까지 치솟았어. 배 한 척당 전쟁 위험을 보장하는 해상보험료도 몇 년 만에 최고 수준으로 뛰었다니, 이 전쟁이 원유 공급망에 미치는 부담이 갈수록 구조화되고 있다는 뜻이지.\n\n한국 산업계에서는 두 가지 소식이 눈에 띄었어. 먼저 HD현대케미칼과 롯데케미칼이 충남 서산의 대산공장을 하나로 합친 통합법인 'H&L 어드밴스드'를 목요일에 공식 출범시켰어. 이게 왜 중요하냐면, 국내 석유화학 산업이 오랫동안 공급 과잉에 시달려온 끝에 정부 주도로 추진해온 '자율 사업재편'의 첫 성공 사례이기 때문이야. 정유와 석유화학 공정을 원료 조달부터 완제품 생산까지 하나로 엮어서 효율을 끌어올리겠다는 전략인데, 울산과 여수 쪽 업체들은 아직 이견을 좁히지 못하고 있어서 대산공장의 성공 여부가 다른 지역 재편에도 신호탄이 될 것 같아. 또 하나는 미국 기업 4곳(에어프로덕츠, 코닝, 엑셀리스, 퍼시피코에너지)이 워싱턴에서 한국에 총 20억달러(약 2조8000억원)를 투자하겠다고 공식 선언한 소식이야. 반도체용 초고순도 가스 공장을 평택에 증설하고, 반도체 이온주입 장비 공장을 확장하고, 해상풍력 같은 에너지 인프라에도 돈을 넣겠다는 계획인데, 미중 갈등 속에서도 한국이 여전히 반도체·클린에너지 공급망의 핵심 거점으로 인정받고 있다는 걸 보여주는 사례야.\n\n실리콘밸리 쪽에서는 손가락에 끼는 스마트링으로 유명한 오우라(Oura)가 나스닥 상장을 위한 서류를 제출했어. 최근 9개월 매출이 12억1000만달러(약 1조6700억원)로 1년 전보다 74%나 늘었고, 유료 멤버십 매출은 121%나 뛰어서 유료 회원 수가 500만 명으로 두 배가 됐대. 이 회사는 기업가치를 22조원 넘게 인정받는 걸 목표로 하는데, 작년 말 비상장 투자 라운드 때 인정받았던 몸값(약 15조원 상당)보다 훨씬 높은 수준이야. 문제는 이제 프랑스의 서큘러(탭 결제 기능), 중국의 링콘(진동 알림), 삼성 갤럭시링까지 스마트링 시장에 너도나도 뛰어들고 있어서, 오우라가 상장 이후에도 지금의 압도적인 점유율을 지켜낼 수 있을지가 관전 포인트야.\n\n마지막으로 일본에서는 엔화가 한 달 만에 최고치인 달러당 155~156엔대까지 올랐어. 지난 2일 우에다 일본은행 총재가 '매 회의마다 금리인상을 검토하겠다'고 선언한 이후로, 시장에서는 이번 달 18일 회의에서 정말로 금리를 올릴 거라는 베팅이 커지고 있거든. 문제는 이 환율 움직임이 그동안 낮은 일본 금리를 이용해 돈을 싸게 빌려 해외 고금리 자산에 투자해온 '엔 캐리 트레이드'를 청산(마키모도시)하려는 신호일 수 있다는 거야. 금리차를 노리고 쌓아온 포지션이 한꺼번에 풀리기 시작하면 엔화 강세가 더 가팔라질 수 있는데, 이렇게 되면 그동안 엔저 덕을 봤던 일본 수출기업들의 가격 경쟁력이 약해지는 대신 한국 경쟁사들에게는 반사이익이 갈 수 있어. 오늘 하루를 정리하면, 우크라이나에서는 4년 반 만에 평화의 실마리가 보이는 반면 중동은 '탱커 전쟁'으로 격화되고, 한국은 산업 재편과 외국인 투자 유치라는 두 마리 토끼를 동시에 잡으려 하고 있고, 실리콘밸리와 도쿄에서는 각각 IPO 붐과 통화정책 전환이라는 서로 다른 '큰 그림'이 조용히 그려지고 있는 하루였다고 할 수 있어.",

if(BRIEFING.hkmarket){ const hk=BRIEFING.hkmarket; const hkTopics=(hk.topics||[]).map(t=>`<div class="hktopic"><div class="httl">${esc(t.topic)}</div><div class="hdet">${esc(t.detail)}</div></div>`).join(""); html += `<section class="block" id="hkmarket"><div class="shead"><span class="no">📺</span><h2>한경코리아마켓</h2><span class="slug">YouTube Morning Brief</span></div><div class="hkmeta">${esc(hk.broadcastLabel||"")} · <a href="${esc(hk.videoUrl||"")}" target="_blank" rel="noopener">${esc(hk.videoTitle||"원본 방송 보기")} ↗</a></div>${hkTopics}</section>`; }
$("#main").innerHTML = html;
$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: BBC · ABC · 조선비즈(산업) · TechCrunch · ZDNet · Gizmodo · 일본 주요 경제매체 · BCG · 한경코리아마켓(유튜브) — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장.<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

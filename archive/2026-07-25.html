       f2:"AI 패권을 둘러싸고 첨예하게 대립해온 미국과 중국이 각료급에서 오픈소스 AI 협력에 합의한 것은 이번이 처음이다. 리러청 중국 공업정보화부장이 회의를 주재했으며, 두 나라 모두 자국산 AI 역량에 대한 통제를 강화하려는 흐름 속에서도 이번 성명에 서명했다.",
       f3:"패권 경쟁을 벌이는 두 나라가 '보안 프레임워크'라는 공통분모를 찾아 협력에 합의한 것은, 지정학적 갈등 속에서도 표준·규범 영역에서는 절충이 가능하다는 점을 보여준다. 테크 규제 자문을 지망하는 컨설턴트라면, 경쟁과 협력이 동시에 진행되는 'coopetition' 구도에서 클라이언트가 준수해야 할 규범이 어느 지점에서 합의되는지 지켜보는 안목이 필요하다.",
       terms:[{t:"청두 성명(Chengdu Statement)",d:"2026년 7월 23일 APEC 디지털 위크에서 채택된 디지털기술·AI 관련 각료 성명. 오픈소스 AI 모델 개발을 지지하되 보안·데이터 보호·지식재산권을 함께 존중할 것을 요구하는 내용을 담았다."}]}
    ]},
    {id:"econ",no:"02",title:"글로벌 경제·시장",slug:"Economy",items:[
      {tag:"실적쇼크",title:"알파벳·테슬라 실적 후폭풍…빅테크 시총 급락, S&P500 한 달 새 최악의 하루",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/07/23/tesla-tsla-alphabet-googl-stock-today.html",date:"2026.07.23"},
       f1:"알파벳과 테슬라의 실적 발표 후폭풍으로 뉴욕증시가 급락했다. S&P500지수는 1.21% 내린 7408.30으로 한 달 새 최악의 하루를 기록했고, 나스닥지수도 2.15% 하락한 25137.69로 마감했다. 알파벳은 7%, 테슬라는 14% 급락했다.",
       f2:"알파벳은 견조한 실적에도 2026년 연간 설비투자 가이던스를 기존 1800억~1900억달러에서 1950억~2050억달러로 상향 조정하며 투자자들에게 충격을 줬다. 테슬라는 로보택시·휴머노이드 로봇 등 차량 판매를 넘어선 사업 확장을 추진하는 과정에서 설비투자가 142% 급증했고, 잉여현금흐름은 마이너스로 전환됐다.",
       f3:"빚내서 하는 AI 투자가 언제 이익으로 돌아올지에 대한 회의론이 커지는 국면이다. 테크 산업 자문을 지망하는 컨설턴트라면, 매출 성장이 뒷받침돼도 '설비투자 증가 속도'가 시장의 인내심을 넘어서는 시점을 어떻게 사전에 진단할 것인지가 AI 시대 재무자문의 핵심 과제라는 점을 이 급락에서 읽어야 한다.",
       terms:[{t:"잉여현금흐름(FCF)",d:"영업활동으로 벌어들인 현금에서 설비투자(CAPEX) 등을 제외하고 남는 현금. 테슬라는 이번 분기 설비투자 급증으로 잉여현금흐름이 마이너스로 전환됐으며, 이는 기업이 벌어들이는 돈보다 쓰는 돈이 더 많아졌다는 의미다."}]},
      {tag:"통화정책",title:"유가 100달러 돌파·고용지표 호조 겹쳐…Fed 9월 인상 확률 82%로 급등",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/07/23/fed-interest-rate-odds-oil-jobless-claims.html",date:"2026.07.23"},
       f1:"브렌트유가 5월 말 이후 처음으로 배럴당 100달러를 돌파한 가운데, 지난주 신규 실업수당 청구건수는 18만7000건으로 1969년 이후 최저치를 기록했다. 이 두 지표가 겹치며 연방기금금리 선물시장이 반영하는 7월 FOMC 금리 인상 확률은 일주일 새 12% 미만에서 38%로 뛰었고, 9월 인상 확률은 82%까지 치솟았다.",
       f2:"시장은 여전히 연준이 다음 주 FOMC에서 현재 3.50~3.75% 금리를 동결할 것으로 보고 있지만, 유가발 인플레이션 우려와 예상 밖으로 견조한 고용시장이 동시에 금리 인상 압력을 키우고 있다. 9월 인상 확률은 일주일 전보다 29%포인트나 뛴 수치다.",
       f3:"'물가'와 '고용'이라는 통화정책의 두 축이 동시에 긴축 방향을 가리키는 흔치 않은 조합이다. 매크로 시나리오를 다루는 컨설턴트라면, 이처럼 서로 다른 변수가 우연히 같은 결론으로 수렴할 때는 오히려 그 결론에 대한 시장의 확신이 과도해질 위험이 있다는 점을 클라이언트에게 짚어줘야 한다.",
       terms:[{t:"연방기금금리 선물(Fed Funds Futures)",d:"향후 FOMC의 금리 결정을 시장 참가자들이 베팅하는 파생상품. 이 가격에 내재된 확률을 역산하면 시장이 예상하는 금리 인상·동결 가능성을 가늠할 수 있어, 연준 정책을 예측하는 핵심 지표로 쓰인다."}]}
    ]},
    {id:"tech",no:"03",title:"테크·AI",slug:"Tech·AI",items:[
      {tag:"규제",title:"구글, EU 디지털시장법 위반으로 1조원대 과징금…첫 DMA 대형 제재",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/07/23/google-1-billion-eu-fine-dma.html",date:"2026.07.23"},
       f1:"유럽연합 집행위원회가 구글에 디지털시장법(DMA) 위반으로 8억9000만유로(약 1조원)의 과징금을 부과했다. 검색 결과에서 자사 서비스를 우대한 데 대해 4억6000만유로, 앱 개발자의 외부 결제 유도를 제한한 데 대해 4억3000만유로가 각각 부과됐다.",
       f2:"이는 DMA 시행 이후 나온 최대 규모의 제재다. 구글은 60일 안에 시정 조치를 취해야 하며, 이를 지키지 않으면 전 세계 연간 매출의 최대 5%에 달하는 추가 제재를 받을 수 있다. 구글 측은 추가 제재를 피하기 위해 EU와 '건설적인' 협의를 이어가고 있다고 밝혔다.",
       f3:"빅테크에 대한 규제가 '벌금 부과'를 넘어 '매출 연동형 반복 제재'로 진화하고 있음을 보여주는 사례다. 규제·정책 자문을 지망하는 컨설턴트라면, 이제 빅테크 클라이언트에게 필요한 것은 단발성 벌금 대응이 아니라, 반복 위반 시 기하급수적으로 커지는 제재 구조 자체를 어떻게 컴플라이언스 설계에 반영할지에 대한 조언이라는 점을 눈여겨봐야 한다.",
       terms:[{t:"디지털시장법(DMA)",d:"EU가 2023년 시행한 빅테크 규제법. 검색·앱스토어 등에서 '게이트키퍼'로 지정된 대형 플랫폼 기업의 자사 우대 행위, 경쟁 제한 행위 등을 금지하며, 위반 시 매출액 연동 과징금을 부과한다."}]},
      {tag:"반도체",title:"인텔, AI 붐 타고 15년 만에 최대 매출 증가율…주가는 되레 부진",
       source:{name:"CNBC",url:"https://www.cnbc.com/2026/07/23/intel-intc-earnings-report-q2-2026.html",date:"2026.07.23"},
       f1:"인텔의 2분기 매출이 전년 대비 25% 늘어난 161억달러를 기록해, 2011년 3분기 이후 약 15년 만에 가장 가파른 매출 증가율을 나타냈다. 시장 전망치(144억2000만달러)를 큰 폭으로 웃돈 실적이다.",
       f2:"성장을 이끈 것은 데이터센터·AI 부문으로, 이 사업부 매출은 전년 대비 59% 급증한 63억달러를 기록하며 인텔 전체 매출의 약 70%를 차지했다. 에이전틱 AI 시스템 확산으로 서버용 CPU 수요가 GPU와 함께 늘어난 영향이다. 다만 인텔 주가는 7월 들어서만 28% 하락하는 등 최근 약세를 보이고 있다.",
       f3:"'실적은 15년 만의 최대 호조인데 주가는 최근 부진한' 이 괴리는, 시장이 이미 AI 훈풍을 상당 부분 주가에 선반영했음을 시사한다. 반도체 산업 자문을 지망하는 컨설턴트라면, 실적 서프라이즈 자체보다 '이미 얼마나 기대가 선반영됐는가'를 가늠하는 것이 밸류에이션 조언의 핵심이라는 점을 이 사례에서 확인할 수 있다.",
       terms:[{t:"데이터센터·AI 그룹(DCAI)",d:"인텔의 서버용 CPU·AI 가속기를 담당하는 사업부. 2026년 2분기 매출이 전년 대비 59% 급증하며 인텔 전체 성장의 핵심 동력으로 부상했다."}]}
    ]},
    {id:"korea",no:"04",title:"한국",slug:"Korea",items:[
      {tag:"부동산정책",title:"이재명 대통령 '보유세, 선진국 수준 되려면 3배 올려야…폭동 날 수도'",
       source:{name:"한국일보",url:"https://www.hankookilbo.com/news/article/A2026072319430000524",date:"2026.07.23"},
       f1:"이재명 대통령이 23일 서울 여의도 KBS 별관에서 열린 부동산 정책 국민 대토론회에서 '통상적인 선진국 수준으로 하려고 해도 보유세를 한 3배는 올려야 한다'며 '3배 올리면 아마 폭동 비슷한 상황이 벌어지지 않겠느냐'고 말했다.",
       f2:"이 대통령은 구체적인 개편 방향으로 1주택자를 기준으로 적정한 보유 부담을 먼저 설정한 뒤, 실거주·지방 주택은 감산하고 비거주·초고가·다주택은 가중하는 방식으로 단계적 차등을 두는 방안을 검토하고 있다고 밝혔다. 세제 개편안은 7월 말~8월 초 확정될 예정이다.",
       f3:"세율의 '적정 수준'을 공개 토론회에서 대통령이 직접 언급하며 국민적 반응을 미리 떠보는 방식은 이례적이다. 공공정책 자문을 지망하는 컨설턴트라면, 정책 결정권자가 극단적 시나리오(3배 인상)를 먼저 던져 여론의 저항선을 확인한 뒤 실제 정책은 그보다 완화된 수준으로 확정하는 '앵커링' 전략을 어떻게 설계에 반영하는지 주목해야 한다.",
       terms:[{t:"앵커링(Anchoring) 전략",d:"협상이나 정책 발표에서 처음 제시하는 숫자가 이후 논의의 기준점(anchor)이 되는 심리적 효과를 활용하는 전략. 극단적인 수치를 먼저 제시해 이후 실제 결정이 상대적으로 온건하게 받아들여지도록 유도하는 데 쓰인다."}]},
      {tag:"수출",title:"7월 1~20일 수출 549억달러 '역대 최대'…반도체가 40%대 견인",
       source:{name:"한국경제",url:"https://www.hankyung.com/article/2026072159097",date:"2026.07.21"},
       f1:"관세청에 따르면 7월 1~20일 수출액이 549억달러로 집계돼 전년 동기 대비 52.3% 증가하며 역대 같은 기간 최대치를 기록했다. 조업일수가 하루 적었음에도 일평균 수출액은 62.9% 늘어난 3억7900만달러에 달했다.",
       f2:"이 기간 수출 증가를 견인한 것은 반도체로, 반도체 수출은 전년 동기 대비 180%대 급증하며 전체 수출에서 차지하는 비중이 40%대까지 확대됐다. AI 서버용 SSD 수요 확대로 컴퓨터 주변기기 수출도 크게 늘었고, 선박·무선통신기기·석유제품·철강 등도 두 자릿수 증가율을 보였다.",
       f3:"수출 증가율의 상당 부분이 반도체 단일 품목에서 나오는 구조는 화려한 성과 이면에 '쏠림 리스크'를 동시에 안고 있음을 보여준다. 무역·산업 자문을 지망하는 컨설턴트라면, 총량 지표가 좋을 때일수록 그 이면의 품목별·기업별 집중도를 뜯어보는 습관이 실전 케이스에서 요구된다는 점을 이 통계에서 확인할 수 있다.",
       terms:[{t:"품목 집중도(쏠림 리스크)",d:"수출·매출 등 총량 성장이 특정 품목이나 기업 소수에 과도하게 의존하는 정도. 집중도가 높을수록 해당 품목의 업황이 꺾였을 때 전체 지표가 급격히 흔들릴 수 있는 구조적 취약성을 뜻한다."}]}
    ]},
    {id:"japan",no:"05",title:"일본",slug:"Japan · MBB",items:[
      {tag:"경기지표",title:"日銀 6월 短観, 대기업 제조업 경기 5분기 연속 개선…8년 만의 호조",
       source:{name:"日本経済新聞(Nikkei)",url:"https://www.nikkei.com/article/DGXZQOUB280OA0Y6A620C2000000/",date:"2026.06.30"},

$("#heads").innerHTML = BRIEFING.headliners.map(h=>`<li>${esc(h)}</li>`).join("");
const cu = BRIEFING.catchup;
if(cu){ $("#catchup").innerHTML = `<span class="ck">🕰️ 오늘의 따라잡기 — 처음부터 이해하기</span><h3>${esc(cu.topic)}</h3><p class="intro">${esc(cu.intro)}</p><ul class="tl">${(cu.timeline||[]).map(t=>`<li><span class="d">${esc(t.d)}</span>${esc(t.e)}</li>`).join("")}</ul><div class="why">${cu.why||""}</div>`; } else { $("#catchup").style.display="none"; }
const navItems = [...BRIEFING.sections.map(s=>({id:s.id,no:s.no,title:s.title})), {id:"think",no:"💭",title:"생각거리"},{id:"cal",no:"📅",title:"일정"}];
$("#nav").innerHTML = navItems.map(n=> `<a href="#${n.id}" data-id="${n.id}"><span class="n">${esc(n.no)}</span>${esc(n.title)}</a>`).join("");
function srcHtml(s){ if(!s) return ""; const link = s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">원문(${esc(s.date)})↗</a>` : (s.date?` · ${esc(s.date)}`:""); return `<span class="item__src">${esc(s.name)}${link}</span>`; }
function fieldRow(lab,val,cls){return val?`<div class="field ${cls||""}"><span class="lab">${lab}</span><span class="val">${val}</span></div>`:""}
function termsRow(terms){ if(!terms||!terms.length) return ""; return `<div class="terms"><div class="th">📖 용어 풀이</div>${terms.map(t=>`<div class="t"><b>${esc(t.t)}</b> — ${esc(t.d)}</div>`).join("")}</div>`; }
function vocabRow(v){ if(!v) return ""; return `<div class="jword"><span class="jw-badge">🇯🇵 오늘의 비즈니스 일본어</span><span class="jw-text"><b>${esc(v.w)}</b> <span class="jw-r">(${esc(v.r)})</span> — ${esc(v.m)}</span></div>`; }
function itemCard(it){ return `<article class="item open"><button class="item__head" aria-expanded="true" type="button"><span class="tag">${esc(it.tag)}</span><span><span class="item__title">${esc(it.title)}</span><br>${srcHtml(it.source)}</span><span class="chev">▾</span></button><div class="item__wrap"><div class="item__body"><div class="item__inner">${fieldRow("무슨 일",it.f1)}${fieldRow("그동안의 이야기",it.f2,"story")}${fieldRow("So What",it.f3)}${termsRow(it.terms)}${vocabRow(it.vocab)}</div></div></div></article>`; }
let html = BRIEFING.sections.map(s=>`<section class="block" id="${s.id}"><div class="shead"><span class="no">${esc(s.no)}</span><h2>${esc(s.title)}</h2><span class="slug">${esc(s.slug)}</span></div>${s.items.map(itemCard).join("")}</section>`).join("");
if(BRIEFING.think){ const th=BRIEFING.think; const stepsHtml=(th.steps||[]).map(s=>`<li><b>${esc(s.label)}</b> — ${esc(s.detail)}</li>`).join(""); html += `<section class="block" id="think"><div class="think"><span class="tk">💭 오늘의 생각거리 — 컨설턴트처럼 생각하기</span><p>${esc(th.q)}</p><ol class="steps">${stepsHtml}</ol><div class="hint">${th.hint||""}</div></div></section>`; }
const c = BRIEFING.calendar || {macro:[],earnings:[],sources:[]};
html += `<section class="block" id="cal"><div class="shead"><span class="no">📅</span><h2>다가오는 일정</h2><span class="slug">watchlist</span></div><div class="terms" style="border-style:solid">${[...(c.macro||[]),...(c.earnings||[])].map(r=>`<div class="t"><b>${esc(r.date)} ${esc(r.reg||"")} ${esc(r.ev)}</b>${r.nt?` — ${esc(r.nt)}`:""}</div>`).join("")}<div class="th" style="margin-top:8px">${esc(c.note||"")}</div></div></section>`;
$("#main").innerHTML = html;
const calSrc = (c.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)} ↗</a>`).join(" · ");
$("#main").insertAdjacentHTML("beforeend",`<footer>소스 정책: Bloomberg · CNBC · BBC · ABC · Reuters · AP + 한국 주요 언론 + 일본 니케이·Japan Times 등 + 컨설팅업계 전문 매체 — 작성 시점 검색·교차 확인 기준.<br>전황·시세는 빠르게 변하므로 중요한 판단 전 원문 확인 권장 · 일정 출처: ${calSrc}<br>💡 매일 아침 9:30 KST에 이 페이지가 자동으로 새 브리핑으로 갱신됩니다. · 📚 <a href="archive.html">지난 브리핑 모아보기</a></footer>`);
document.querySelectorAll(".item__head").forEach(h=>{ h.addEventListener("click",()=>{ const it=h.closest(".item"); const open=it.classList.toggle("open"); h.setAttribute("aria-expanded",open?"true":"false"); }); });
const allBtn=$("#toggleAll"), allLab=$("#toggleAllLabel");
allBtn.addEventListener("click",()=>{ const items=[...document.querySelectorAll(".item")]; const anyClosed=items.some(i=>!i.classList.contains("open")); items.forEach(i=>{i.classList.toggle("open",anyClosed); i.querySelector(".item__head").setAttribute("aria-expanded",anyClosed?"true":"false");}); allLab.textContent=anyClosed?"접기":"펼치기"; });
const root=document.documentElement;
$("#theme").addEventListener("click",()=>{root.setAttribute("data-theme", root.getAttribute("data-theme")==="dark"?"light":"dark");});
$("#print").addEventListener("click",()=>window.print());
const links=[...document.querySelectorAll(".navlinks a")];
const spy=new IntersectionObserver(ents=>{ ents.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}}); },{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("section.block").forEach(s=>spy.observe(s));
</script>
</body>
</html>

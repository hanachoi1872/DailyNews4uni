name: Fetch 한경코리아마켓 Transcript

# Episode listing uses yt-dlp (flat-playlist only, never blocked). The actual
# transcript is NOT fetched from YouTube directly (that path is blocked on
# GitHub-hosted runner IPs — see git history for the earlier failed attempt).
# Instead we pull the already-extracted transcript from youtube-transcript.ai,
# a free no-signup third-party API — GitHub never talks to YouTube for this part.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yt-dlp
        run: python3 -m pip install --quiet yt-dlp

      - name: Fetch today's transcript (retries for up to ~20 min)
        run: |
          set -uo pipefail
          DATE_ISO=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          DATE_COMPACT=$(TZ='Asia/Seoul' date +%Y%m%d)
          echo "Today (KST): $DATE_ISO ($DATE_COMPACT)"

          FOUND=0
          VIDEO_ID=""
          VIDEO_TITLE=""
          for i in 1 2 3 4 5; do
            echo "Attempt $i/5: listing recent episodes..."
            LIST=$(python3 -m yt_dlp --flat-playlist --playlist-end 8 --print $'%(id)s\t%(title)s' "https://www.youtube.com/@hk_koreamarket/streams" 2>&1) || true
            MATCH=$(printf '%s\n' "$LIST" | grep -F "$DATE_COMPACT" | head -1) || true
            if [ -n "$MATCH" ]; then
              VIDEO_ID=$(printf '%s' "$MATCH" | cut -f1)
              VIDEO_TITLE=$(printf '%s' "$MATCH" | cut -f2-)
              echo "Found: $VIDEO_ID - $VIDEO_TITLE"
              FOUND=1
              break
            fi
            echo "Not found yet, waiting 5 min..."
            sleep 300
          done

          if [ "$FOUND" -ne 1 ]; then
            echo "No episode found for $DATE_ISO after retries. Skipping."
            exit 0
          fi

          echo "Fetching transcript from youtube-transcript.ai..."
          HTTP_CODE=$(curl -s -o raw-transcript.md -w "%{http_code}" --max-time 60 \
            "https://youtube-transcript.ai/transcript/${VIDEO_ID}.txt?lang=ko" || echo "000")
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ] || [ ! -s raw-transcript.md ] || ! grep -q "## Transcript" raw-transcript.md; then
            echo "Transcript fetch failed or looked invalid. Skipping."
            exit 0
          fi

          python3 - "$VIDEO_ID" "$VIDEO_TITLE" "$DATE_ISO" <<'PYEOF'
          import sys, re, json, os

          video_id, video_title, date_iso = sys.argv[1], sys.argv[2], sys.argv[3]
          raw = open("raw-transcript.md", encoding="utf-8").read()

          # Body is between "## Transcript" and the trailing "Generated by ..." footer
          body = raw.split("## Transcript", 1)[-1]
          body = body.split("Generated by https://youtube-transcript.ai", 1)[0]

          # Strip leading [m:ss] / [h:mm:ss] timestamp markers from each line
          body = re.sub(r"\[\d{1,2}:\d{2}(?::\d{2})?\]\s*", "", body)

          words = body.split()

          # Auto-captions render as a "rolling" window, so the raw transcript
          # repeats the same short word-groups 2-3x in a row before advancing.
          # Collapse any contiguous block that immediately repeats itself.
          def dedup_rolling(words, max_window=25):
              out = []
              i, n = 0, len(words)
              while i < n:
                  matched = False
                  max_l = min(max_window, (n - i) // 2)
                  for L in range(max_l, 0, -1):
                      if words[i:i+L] == words[i+L:i+2*L]:
                          reps = 2
                          while words[i:i+L] == words[i+reps*L:i+(reps+1)*L]:
                              reps += 1
                          out.extend(words[i:i+L])
                          i += reps * L
                          matched = True
                          break
                  if not matched:
                      out.append(words[i])
                      i += 1
              return out

          deduped_words = dedup_rolling(words)
          transcript = " ".join(deduped_words)

          data = {
              "date": date_iso,
              "videoTitle": video_title,
              "videoUrl": f"https://www.youtube.com/watch?v={video_id}",
              "transcript": transcript,
          }

          os.makedirs("hkmarket-data", exist_ok=True)
          with open("hkmarket-data/latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False)

          print(f"Transcript length after dedup: {len(transcript)} chars ({len(words)} raw words -> {len(deduped_words)} deduped words)")
          PYEOF

          rm -f raw-transcript.md

      - name: Commit and push
        run: |
          git config user.name "Daily Compass Bot"
          git config user.email "actions@users.noreply.github.com"
          git add hkmarket-data/latest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "hkmarket transcript $(TZ='Asia/Seoul' date +%Y-%m-%d)"
          for i in 1 2 3; do
            git push && break
            echo "Push attempt $i/3 rejected, retrying..."
            git pull --rebase origin main
          done

name: Daily Compass (Codex)

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: [self-hosted, dailycompass]
    steps:
      - uses: actions/checkout@v4

      - name: Compute KST date
        id: date
        shell: powershell
        run: |
          $kst = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), [System.TimeZoneInfo]::FindSystemTimeZoneById("Korea Standard Time"))
          $iso = $kst.ToString("yyyy-MM-dd")
          $wdNames = [char[]]@(0xC77C,0xC6D4,0xD654,0xC218,0xBAA9,0xAE08,0xD1A0)
          $wd = $wdNames[[int]$kst.DayOfWeek]
          $nyeon = [char]0xB144
          $nwol = [char]0xC6D4
          $nil = [char]0xC77C
          $label = "$($kst.Year)$nyeon $($kst.Month)$nwol $($kst.Day)$nil ($wd)"
          $outFile = $env:GITHUB_OUTPUT
          $enc = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText($outFile, "iso=$iso`n", $enc)
          [System.IO.File]::AppendAllText($outFile, "label=$label`n", $enc)

      - name: Build today's prompt
        shell: powershell
        run: |
          $tpl = [System.IO.File]::ReadAllText("$pwd\.github\scripts\codex-daily-prompt.txt", [System.Text.Encoding]::UTF8)
          $tpl = $tpl -replace "DATE_ISO_PLACEHOLDER", "${{ steps.date.outputs.iso }}"
          $tpl = $tpl -replace "DATE_LABEL_PLACEHOLDER", "${{ steps.date.outputs.label }}"
          [System.IO.File]::WriteAllText("$pwd\codex-prompt-today.txt", $tpl, [System.Text.UTF8Encoding]::new($false))

      - name: Fetch 한경코리아마켓 transcript
        shell: powershell
        continue-on-error: true
        run: |
          $dateCompact = "${{ steps.date.outputs.iso }}" -replace "-", ""
          python -m yt_dlp --version *> $null
          if ($LASTEXITCODE -ne 0) { python -m pip install --quiet --user yt-dlp }
          $listOutput = python -m yt_dlp --flat-playlist --playlist-end 8 --print "%(id)s`t%(title)s" "https://www.youtube.com/@hk_koreamarket/streams" 2>$null
          $match = $listOutput | Where-Object { $_ -match $dateCompact } | Select-Object -First 1
          if (-not $match) {
            Write-Host "Today's 한경코리아마켓 episode not found yet - skipping hkmarket tab"
          } else {
            $videoId = ($match -split "`t")[0]
            $videoTitle = ($match -split "`t",2)[1]
            Write-Host "Found today's episode: $videoId - $videoTitle"
            Remove-Item "hkmarket.ko-orig.srt" -ErrorAction SilentlyContinue
            python -m yt_dlp --skip-download --write-auto-sub --sub-lang "ko-orig" --sub-format srt -o "hkmarket.%(ext)s" "https://www.youtube.com/watch?v=$videoId" 2>$null
            if (Test-Path "hkmarket.ko-orig.srt") {
              $srtContent = [System.IO.File]::ReadAllText("$pwd\hkmarket.ko-orig.srt", [System.Text.Encoding]::UTF8)
              $blocks = $srtContent -split "`r?`n`r?`n"
              $lines = @()
              foreach ($b in $blocks) {
                $parts = $b -split "`r?`n"
                if ($parts.Count -ge 3) {
                  $text = ($parts[2..($parts.Count-1)] -join " ").Trim()
                  if ($text) { $lines += $text }
                }
              }
              $transcript = $lines -join " "
              $enc = New-Object System.Text.UTF8Encoding($false)
              [System.IO.File]::WriteAllText("$pwd\hkmarket-transcript.txt", $transcript, $enc)
              $meta = @{ videoTitle = $videoTitle; videoUrl = "https://www.youtube.com/watch?v=$videoId"; broadcastLabel = "${{ steps.date.outputs.label }} 8:00 방송" } | ConvertTo-Json
              [System.IO.File]::WriteAllText("$pwd\hkmarket-meta.json", $meta, $enc)
              Remove-Item "hkmarket.ko-orig.srt" -ErrorAction SilentlyContinue
              Write-Host "Transcript saved, length $($transcript.Length)"
            } else {
              Write-Host "No captions available yet for today's episode - skipping hkmarket tab"
            }
          }

      - name: Generate briefing with Codex
        shell: powershell
        run: |
          $prompt = [System.IO.File]::ReadAllText("$pwd\codex-prompt-today.txt", [System.Text.Encoding]::UTF8)
          $prompt | codex exec --sandbox workspace-write -
          Remove-Item "codex-prompt-today.txt"
          Remove-Item "hkmarket-transcript.txt" -ErrorAction SilentlyContinue
          Remove-Item "hkmarket-meta.json" -ErrorAction SilentlyContinue

      - name: Commit and push
        shell: powershell
        run: |
          git config user.name "Daily Compass Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit"
            exit 0
          }
          git commit -m "Daily update ${{ steps.date.outputs.iso }}"
          $pushed = $false
          for ($i = 1; $i -le 3; $i++) {
            git push
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "Push attempt $i/3 rejected, pulling --rebase and retrying"
            git pull --rebase origin main
          }
          if (-not $pushed) { Write-Host "Push failed after retries"; exit 1 }

      - name: Build Telegram summary
        shell: powershell
        run: |
          node .github/scripts/build-telegram-summary.js

      - name: Send Telegram digest
        shell: powershell
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          $text = [System.IO.File]::ReadAllText("$pwd\tg_summary.txt", [System.Text.Encoding]::UTF8)
          $body = @{ chat_id = $env:TELEGRAM_CHAT_ID; text = $text } | ConvertTo-Json
          $uri = "https://api.telegram.org/bot$($env:TELEGRAM_BOT_TOKEN)/sendMessage"
          $sent = $false
          for ($i = 1; $i -le 3; $i++) {
            try {
              $r = Invoke-RestMethod -Uri $uri -Method Post -Body $body -ContentType "application/json; charset=utf-8" -TimeoutSec 20
              Write-Host "Telegram sent, message_id=$($r.result.message_id)"
              $sent = $true
              break
            } catch {
              Write-Host "Attempt $i/3 failed: $($_.Exception.Message)"
              if ($i -lt 3) { Start-Sleep -Seconds (10 * $i) }
            }
          }
          Remove-Item "tg_summary.txt" -ErrorAction SilentlyContinue
          if (-not $sent) { exit 1 }

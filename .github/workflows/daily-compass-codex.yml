name: Daily Compass (Codex)

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: [self-hosted, dailycompass]
    steps:
      - uses: actions/checkout@v4

      - name: Compute KST date
        id: date
        shell: powershell
        run: |
          $kst = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), [System.TimeZoneInfo]::FindSystemTimeZoneById("Korea Standard Time"))
          $iso = $kst.ToString("yyyy-MM-dd")
          $wdNames = [char[]]@(0xC77C,0xC6D4,0xD654,0xC218,0xBAA9,0xAE08,0xD1A0)
          $wd = $wdNames[[int]$kst.DayOfWeek]
          $nyeon = [char]0xB144
          $nwol = [char]0xC6D4
          $nil = [char]0xC77C
          $label = "$($kst.Year)$nyeon $($kst.Month)$nwol $($kst.Day)$nil ($wd)"
          $outFile = $env:GITHUB_OUTPUT
          $enc = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText($outFile, "iso=$iso`n", $enc)
          [System.IO.File]::AppendAllText($outFile, "label=$label`n", $enc)

      - name: Build today's prompt
        shell: powershell
        run: |
          $tpl = [System.IO.File]::ReadAllText("$pwd\.github\scripts\codex-daily-prompt.txt", [System.Text.Encoding]::UTF8)
          $tpl = $tpl -replace "DATE_ISO_PLACEHOLDER", "${{ steps.date.outputs.iso }}"
          $tpl = $tpl -replace "DATE_LABEL_PLACEHOLDER", "${{ steps.date.outputs.label }}"
          [System.IO.File]::WriteAllText("$pwd\codex-prompt-today.txt", $tpl, [System.Text.UTF8Encoding]::new($false))

      - name: Generate briefing with Codex
        shell: powershell
        run: |
          $prompt = [System.IO.File]::ReadAllText("$pwd\codex-prompt-today.txt", [System.Text.Encoding]::UTF8)
          $prompt | codex exec --sandbox workspace-write -
          Remove-Item "codex-prompt-today.txt"

      - name: Commit and push
        shell: powershell
        run: |
          git config user.name "Daily Compass Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit"
            exit 0
          }
          git commit -m "Daily update ${{ steps.date.outputs.iso }}"
          git push

      - name: Build Telegram summary
        shell: powershell
        run: |
          node .github/scripts/build-telegram-summary.js

      - name: Send Telegram digest
        shell: powershell
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          $text = [System.IO.File]::ReadAllText("$pwd\tg_summary.txt", [System.Text.Encoding]::UTF8)
          $body = @{ chat_id = $env:TELEGRAM_CHAT_ID; text = $text } | ConvertTo-Json
          $uri = "https://api.telegram.org/bot$($env:TELEGRAM_BOT_TOKEN)/sendMessage"
          $sent = $false
          for ($i = 1; $i -le 3; $i++) {
            try {
              $r = Invoke-RestMethod -Uri $uri -Method Post -Body $body -ContentType "application/json; charset=utf-8" -TimeoutSec 20
              Write-Host "Telegram sent, message_id=$($r.result.message_id)"
              $sent = $true
              break
            } catch {
              Write-Host "Attempt $i/3 failed: $($_.Exception.Message)"
              if ($i -lt 3) { Start-Sleep -Seconds (10 * $i) }
            }
          }
          Remove-Item "tg_summary.txt" -ErrorAction SilentlyContinue
          if (-not $sent) { exit 1 }
